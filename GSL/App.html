<script>
/* Cliente do GSL Bartofil.
   Leitura: carregarTela(filial, id, params) · Escrita: executarAcao(filial, nome, params) */

/*
 * REGRA DO HTMLSERVICE (4.2.2) — NUNCA escreva barra-barra nem barra-asterisco
 * dentro de texto, template (crase) ou regex neste arquivo e no Paineis.
 * Ao servir a pagina, o Google apaga o que PARECE comentario sem entender
 * crase: um accept="image/(asterisco)" num template engolia o codigo ate
 * o proximo fim de comentario e a tela travava na entrada com
 * "SyntaxError: Unexpected token 'class'". Escreva https:\/\/... e image/\*
 * (a barra invertida some no navegador). O teste testes/checar-htmlservice.js
 * confere isso antes de publicar.
 */

let SESSAO = null, paginaAtual = 'inicio', paramsAtual = {}, DADOS = null, TEMA = 'claro';
let paginaAnterior = null;   // qual tela ja estava desenhada — ver pintar()

/*
 * SEM LOGIN.
 *
 * O Google Workspace ja fez a entrada antes da pagina abrir (implantacao
 * "Qualquer pessoa da Bartofil"). O servidor sabe quem e a pessoa pela
 * sessao Google; o navegador nao guarda e nao manda e-mail, token nem
 * senha. O que o cliente informa em cada chamada e so a FILIAL em que a
 * pessoa esta — e o servidor confere se ela pode estar ali.
 */
let FILIAL = '';           // codigo da filial em uso (FSA, SSA...)
let URL_APP = '';          // endereco do /exec — para a navegacao de reserva

const CHAVE_FILIAL = 'gsl_ultima_filial';
function lerLocal(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function gravarLocal(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

/*
 * SESSAO (4.2). Quem entra digita e-mail e PIN; o servidor devolve um
 * codigo de sessao. Ele fica so nesta ABA (sessionStorage): fechou a aba,
 * acabou — o proximo que usar o computador digita o proprio e-mail.
 */
let TOKEN = '';
const CHAVE_SESSAO = 'gsl_sessao';
/*
 * 4.2.2 — o navegador DEVOLVE o sessionStorage quando a aba fechada e
 * reaberta (Ctrl+Shift+T, "continuar de onde parou"): o proximo a usar o
 * computador entrava como a pessoa anterior, sem PIN. Agora a aba anota a
 * hora em que a pagina saiu, e o codigo so vale se ela voltou em ate 15 s
 * — um F5. Aba restaurada depois disso pede e-mail e PIN.
 */
const CHAVE_SAIDA = 'gsl_saida';
function lerSessao() {
  try {
    const t = sessionStorage.getItem(CHAVE_SESSAO) || '';
    const saiu = Number(sessionStorage.getItem(CHAVE_SAIDA) || 0);
    sessionStorage.removeItem(CHAVE_SAIDA);
    if (!t || Date.now() - saiu > 15000) { sessionStorage.removeItem(CHAVE_SESSAO); return ''; }
    return t;
  } catch (e) { return ''; }
}
function gravarSessao(t) { try { if (t) sessionStorage.setItem(CHAVE_SESSAO, t); else sessionStorage.removeItem(CHAVE_SESSAO); } catch (e) {} }
window.addEventListener('pagehide', function () {
  try { if (TOKEN) sessionStorage.setItem(CHAVE_SAIDA, String(Date.now())); } catch (e) {}
});

/*
 * CANAL BARRADO. Em computador com varias contas Google (ou cookie de
 * terceiros bloqueado) o google.script.run falha — HTTP 403 ou o
 * PERMISSION_DENIED "reading from storage". Detectado uma vez, a entrada e
 * a saida passam a ir direto por POST (ver navegarPelaPagina).
 */
let CANAL_BARRADO = false;
const ctx = () => ({ t: TOKEN, f: FILIAL });

const chamar = (f, ...a) => new Promise((ok, erro) => {
  google.script.run.withSuccessHandler(ok).withFailureHandler((e) => {
    // Sessao vencida (sem uso) ou apagada: volta para a entrada.
    if (/\[SESSAO\]/.test(String((e && e.message) || e || ''))) sessaoTerminou();
    if (canalBloqueado(e)) CANAL_BARRADO = true;
    erro(e);
  })[f](...a);
});
const chamarJSON = async (f, ...a) => {
  const bruto = await chamar(f, ...a);
  if (!bruto) throw new Error('O servidor não respondeu. Recarregue a página.');
  return typeof bruto === 'string' ? JSON.parse(bruto) : bruto;
};

const carregarTelaSrv = (id, params) => chamarJSON('carregarTela', ctx(), id, params || {});
const executarAcaoSrv = (nome, params) => chamarJSON('executarAcao', ctx(), nome, params || {});
const esc = (t) => String(t == null ? '' : t)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
/*
 * ARGUMENTO DE onclick. Dentro de onclick="fn('...')" o navegador DECODIFICA
 * o HTML antes de rodar o JS — entao esc() sozinho nao protege: uma aspa
 * simples num codigo, e-mail ou link fechava a string e virava codigo
 * rodando no navegador de quem abrisse a tela. jsArg(v) devolve o literal
 * JS pronto (aspas e barras escapadas pelo JSON) e so depois escapa o HTML.
 * Uso: onclick="abrirItem(${jsArg(i.codigo)})" — sem aspas em volta.
 */
const jsArg = (v) => esc(JSON.stringify(v == null ? '' : String(v)));
const el = (id) => document.getElementById(id);
const val = (id) => (el(id) ? el(id).value : '');
const marcado = (id) => (el(id) ? el(id).checked : false);

/* ------------------------------------------------------------------ */
/* FLUIDEZ                                                             */
/*                                                                     */
/* Reclamacao real de quem usa no CD: "as telas abrem rapido, mas as    */
/* animacoes dao uma sensacao de lentidao". Nao da para saber daqui que */
/* maquina a pessoa tem — entao o app mede e, se preciso, liga o MODO   */
/* LEVE (ceu parado, sem desfoque). A decisao fica neste navegador.     */
/* ------------------------------------------------------------------ */

const CHAVE_LEVE = 'gsl_modo_leve';

function lerModoLeve() { return lerLocal(CHAVE_LEVE); }
function aplicarModoLeve(ligado) {
  document.documentElement.classList.toggle('modo-leve', !!ligado);
  const b = el('modo-leve-alternar');
  if (b) b.title = ligado
    ? 'Modo leve LIGADO — fundo animado desligado. Clique para voltar as animacoes.'
    : 'Modo leve desligado. Clique para desligar o fundo animado e ganhar fluidez.';
  gravarLocal(CHAVE_LEVE, ligado ? '1' : '0');
}
function alternarModoLeve() {
  const agora = !document.documentElement.classList.contains('modo-leve');
  aplicarModoLeve(agora);
  avisar(agora ? 'Modo leve ligado — animacoes desligadas.'
               : 'Modo leve desligado — animacoes de volta.');
  if (paginaAtual === 'config') abrir('config', paramsAtual);
}

function medirFluidez() {
  const salvo = lerModoLeve();
  if (salvo !== null) { aplicarModoLeve(salvo === '1'); return; }
  try {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      return aplicarModoLeve(true);
    }
    const nucleos = navigator.hardwareConcurrency || 8;
    const memoria = navigator.deviceMemory || 8;
    if (nucleos <= 2 || memoria <= 2) return aplicarModoLeve(true);
  } catch (e) { /* navegador sem essas informacoes: mede na marra */ }

  setTimeout(function () {
    let quadros = 0;
    const inicio = performance.now();
    const contar = function () {
      quadros++;
      const decorrido = performance.now() - inicio;
      if (decorrido < 1000) return requestAnimationFrame(contar);
      aplicarModoLeve(quadros / (decorrido / 1000) < 45);
    };
    requestAnimationFrame(contar);
  }, 400);
}

/* Aba em segundo plano: congela o ceu. */
function vigiarVisibilidade() {
  const ajustar = function () {
    document.documentElement.classList.toggle('aba-oculta', document.hidden);
  };
  document.addEventListener('visibilitychange', ajustar);
  ajustar();
}

/*
 * TEMA — guardado NESTE navegador.
 * Antes ia para as propriedades de usuario do servidor. Com "Executar
 * como: eu", essas propriedades sao as do dono do script — iguais para
 * todo mundo: um trocava o tema e mudava o de todos.
 */
const CHAVE_TEMA = 'gsl_tema';
function aplicarTema(tema) {
  TEMA = (tema === 'escuro') ? 'escuro' : 'claro';
  document.documentElement.setAttribute('data-tema', TEMA);
  const b = el('tema-alternar');
  if (b) b.textContent = TEMA === 'escuro' ? '\u2600' : '\u263E';
}
function alternarTema() {
  aplicarTema(TEMA === 'escuro' ? 'claro' : 'escuro');
  gravarLocal(CHAVE_TEMA, TEMA);
}

/*
 * Comeca no DOMContentLoaded, nao no load (4.2.2): o load espera TODOS os
 * recursos da pagina — inclusive a folha das fontes do Google. Com
 * fonts.googleapis.com lento ou bloqueado, a entrada so aparecia quando a
 * fonte desistia.
 */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', iniciar);
else setTimeout(iniciar, 0);

/*
 * ABERTURA — tudo o que a primeira tela precisa ja veio dentro do HTML
 * (CARGA_INICIAL). Nenhuma chamada ao servidor para abrir.
 */
async function iniciar() {
  try {
    aplicarTema(lerLocal(CHAVE_TEMA) || 'claro');
    medirFluidez();
    vigiarVisibilidade();
    const inicio = (typeof CARGA_INICIAL !== 'undefined' && CARGA_INICIAL) ? CARGA_INICIAL : { ok: true };
    URL_APP = inicio.urlApp || '';
    if (inicio.viaPost) CANAL_BARRADO = true;       // esta pagina ja veio pela reserva
    if (!inicio.ok) return mostrarFalha(inicio.erro);

    if (inicio.entrada === 'INSTALAR' || inicio.instalado === false) {
      soMostrar('instalacao');
      el('instalacao-conta').textContent = inicio.conta
        ? 'Você (' + inicio.conta + ') será cadastrado como administrador.'
        : 'Você será cadastrado como administrador.';
      if (inicio.conta) el('instalacao-email').value = inicio.conta;
      return;
    }
    if (inicio.entrada === 'ENTRAR') return retomarOuPedirEntrada(inicio);
    return tratarEntrada(inicio);
  } catch (e) { mostrarFalha(e.message || e); }
}

/* ------------------------------------------------------------------ */
/* ENTRADA — e-mail e PIN (4.2)                                        */
/* ------------------------------------------------------------------ */

/* Resposta do servidor (doGet, doPost, entrar, retomarSessao) -> tela certa. */
function tratarEntrada(r) {
  if (!r) return mostrarEntrada({ erroEntrada: 'O servidor não respondeu. Tente de novo.' });
  if (r.ok === false && !r.entrada) return mostrarEntrada({ erroEntrada: r.erro });
  if (r.entrada === 'SEM_SESSAO') return sessaoTerminou();
  if (r.entrada === 'APP' || r.entrada === 'ESCOLHER_FILIAL') {
    if (r.token) { TOKEN = r.token; gravarSessao(TOKEN); }
    if (r.entrada === 'APP') return montarSessao(r);
    return mostrarEscolhaFilial(r.filiais, r.usuario);
  }
  // Entrou, mas nao tem para onde ir (sem filial, desativado, sem nivel):
  // a sessao nao fica guardada — senao F5 e "tentar de novo" voltavam para
  // esta mesma tela, sem caminho para digitar outro e-mail.
  if (r.token) { try { google.script.run.withFailureHandler(function () {}).sairDoSistema({ t: r.token }); } catch (e) {} }
  TOKEN = ''; gravarSessao('');
  if (r.entrada === 'ENTRAR') return mostrarEntrada(r);
  return mostrarSemAcesso(r);
}

/* A aba recarregou: se ainda tem sessao, entra sem pedir o PIN de novo. */
async function retomarOuPedirEntrada(inicio) {
  if (inicio.sessaoInvalida) gravarSessao('');
  const salvo = lerSessao();
  if (!salvo || inicio.erroEntrada) return mostrarEntrada(inicio);
  TOKEN = salvo;
  soMostrar('carregando');
  try {
    tratarEntrada(await chamarJSON('retomarSessao', { t: TOKEN, f: lerLocal(CHAVE_FILIAL) || '' }));
  } catch (e) {
    // Canal barrado (403): sem um clique o navegador nao deixa a moldura
    // navegar a pagina, entao a pessoa entra de novo — o formulario de
    // entrada tem a sua propria reserva (POST no /exec).
    TOKEN = ''; gravarSessao('');
    if (canalBloqueado(e)) {
      return mostrarEntrada({ erroEntrada: 'Este computador bloqueia a conversa direta com o Google. ' +
        'Entre de novo com o seu e-mail e PIN.' });
    }
    mostrarEntrada({ erroEntrada: explicarErro(e) });
  }
}

function mostrarEntrada(info) {
  info = info || {};
  soMostrar('entrar');
  const form = el('form-entrar');
  if (form && URL_APP) form.action = URL_APP;
  el('entrar-bilhete').value = bilheteDaPagina();
  if (info.emailDigitado) el('entrar-email').value = info.emailDigitado;
  el('entrar-pin').value = '';
  el('entrar-pin2').value = '';
  el('entrar-codigo').value = '';
  el('entrar-confirma').classList.toggle('oculto', !info.criarPin);
  el('entrar-codigo-caixa').classList.toggle('oculto', !info.pedirCodigo);
  const msg = el('entrar-msg');
  msg.textContent = info.erroEntrada || info.recado || '';
  msg.className = 'entrar-msg' + (info.erroEntrada ? ' erro' : (info.recado ? ' ok' : ''));
  setTimeout(() => { const alvo = el('entrar-email').value ? el(info.criarPin ? 'entrar-pin' : 'entrar-pin') : el('entrar-email'); if (alvo) alvo.focus(); }, 60);
}

/*
 * O formulario de entrada ja foi como POST: nenhum segundo envio. O servidor
 * queima o bilhete quando a entrada da certo, e um segundo POST com ele
 * (clique repetido enquanto a pagina nova nao chega) caia em "Por seguranca".
 */
let ENTRADA_ENVIADA = false;
function enviarFormEntrada() {
  if (ENTRADA_ENVIADA) return;
  ENTRADA_ENVIADA = true;
  const b = el('entrar-botao');
  b.disabled = true; b.textContent = 'Entrando…';
  el('form-entrar').submit();
  // Navegacao barrada (clique vencido): libera o botao para o proximo clique.
  setTimeout(() => {
    if (SAINDO_DA_PAGINA) return;
    liberarBotaoEntrar();
  }, 6000);
}
function liberarBotaoEntrar() {
  ENTRADA_ENVIADA = false;
  const b = el('entrar-botao');
  if (b) { b.disabled = false; b.textContent = 'Entrar'; }
}
// Voltar do navegador com a pagina guardada (bfcache): o botao nao fica preso em "Entrando…".
window.addEventListener('pageshow', function (ev) {
  if (ev.persisted) { SAINDO_DA_PAGINA = false; liberarBotaoEntrar(); }
});

/* Trocou o e-mail: o codigo e a repeticao do PIN eram do primeiro acesso de OUTRO e-mail. */
function esquecerPrimeiroAcesso() {
  if (el('entrar-confirma').classList.contains('oculto') &&
      el('entrar-codigo-caixa').classList.contains('oculto')) return;
  el('entrar-confirma').classList.add('oculto');
  el('entrar-codigo-caixa').classList.add('oculto');
  el('entrar-codigo').value = ''; el('entrar-pin2').value = '';
  const msg = el('entrar-msg'); msg.textContent = ''; msg.className = 'entrar-msg';
}

async function entrarNoSistema(ev) {
  if (ev) ev.preventDefault();
  if (ENTRADA_ENVIADA) return false;
  const email = val('entrar-email').trim().toLowerCase();
  const pin = val('entrar-pin').trim();
  const criando = !el('entrar-confirma').classList.contains('oculto');
  const conf = criando ? val('entrar-pin2').trim() : '';
  const pedindoCodigo = criando && !el('entrar-codigo-caixa').classList.contains('oculto');
  const codigo = pedindoCodigo ? val('entrar-codigo').replace(/\D/g, '') : '';
  const msg = el('entrar-msg');
  const falar = (t, tipo) => { msg.textContent = t; msg.className = 'entrar-msg ' + (tipo || 'erro'); };
  if (!email || email.indexOf('@') === -1) { falar('Digite o seu e-mail.'); return false; }
  if (!/^\d{4,6}$/.test(pin)) { falar('O PIN tem de 4 a 6 números.'); return false; }
  if (pedindoCodigo && !/^\d{6}$/.test(codigo)) { falar('Digite o código de 6 números que chegou no seu e-mail.'); return false; }
  if (criando && !conf) { falar('Repita o PIN no segundo campo.'); return false; }
  el('entrar-pin2').name = criando ? 'confirmacao' : '';
  el('entrar-codigo').name = pedindoCodigo ? 'codigo' : '';
  // A filial da ultima pessoa neste computador NAO vai junto: quem tem mais
  // de uma escolhe (antes caia direto na filial de quem usou antes).
  el('entrar-filial').value = '';
  el('entrar-bilhete').value = bilheteDaPagina();
  // Canal ja sabidamente barrado: vai por POST ja, dentro do clique.
  if (CANAL_BARRADO && URL_APP) { enviarFormEntrada(); return false; }
  const clique = Date.now();
  const b = el('entrar-botao');
  b.disabled = true; b.textContent = 'Entrando…'; falar('', '');
  try {
    const r = await chamarJSON('entrar', email, pin, conf, '', codigo);
    if (r && r.criarPin) {
      el('entrar-confirma').classList.remove('oculto');
      el('entrar-codigo-caixa').classList.toggle('oculto', !r.pedirCodigo);
      falar(r.erro || r.recado || 'Primeiro acesso: repita o PIN para confirmar.', r.erro ? 'erro' : 'ok');
      el('entrar-pin2').value = '';
      (r.pedirCodigo && !val('entrar-codigo') ? el('entrar-codigo') : el('entrar-pin2')).focus();
      return false;
    }
    if (r && r.ok === false) {
      falar(r.erro || 'Não consegui entrar.');
      el('entrar-pin').value = '';
      el('entrar-pin').focus();
      return false;
    }
    tratarEntrada(r);
  } catch (e) {
    /*
     * O entrar() do servidor nunca falha (devolve JSON ate no erro): cair
     * aqui e o CANAL que falhou — 403, PERMISSION_DENIED de varias contas
     * Google, rede. O formulario vai como pagina (POST no /exec), que passa
     * onde a chamada nao passa. Mas a janela de cima so navega ate ~5 s
     * depois do clique: se a falha demorou mais, o proximo clique envia.
     */
    if (URL_APP) {
      CANAL_BARRADO = true;
      if (Date.now() - clique < 4500) { enviarFormEntrada(); return false; }
      falar('A conexão com o Google falhou. Clique em Entrar de novo para continuar.', 'ok');
      return false;
    }
    falar(explicarErro(e));
  } finally {
    if (!ENTRADA_ENVIADA) { b.disabled = false; b.textContent = 'Entrar'; }
  }
  return false;
}

/* Sessao vencida no meio do uso. */
function sessaoTerminou() {
  if (!TOKEN && el('entrar') && !el('entrar').classList.contains('oculto')) return;
  TOKEN = ''; gravarSessao(''); SESSAO = null;
  try { fecharJanela(); } catch (e) {}
  mostrarEntrada({ erroEntrada: 'Sua sessão terminou. Entre de novo com o seu e-mail e PIN.' });
}

/* A propria pessoa troca o PIN (o "senha" do GSL). */
function formTrocarPin() {
  abrirJanela('Trocar meu PIN', `
    <div class="campo"><label>PIN atual</label><input id="tp-atual" type="text" class="pin-mascara" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    <div class="campo-duplo">
      <div class="campo"><label>PIN novo (4 a 6 números)</label><input id="tp-novo" type="text" class="pin-mascara" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      <div class="campo"><label>Repita o PIN novo</label><input id="tp-conf" type="text" class="pin-mascara" inputmode="numeric" maxlength="6" autocomplete="off"></div>
    </div>
    <p class="dica">Esqueceu o PIN atual? Peça ao administrador: Pessoas e acessos › Zerar PIN.</p>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('trocarMeuPin',{atual:val('tp-atual'),novo:val('tp-novo'),confirmacao:val('tp-conf')}).catch(()=>{})">Trocar PIN</button>`);
  setTimeout(() => { const c = el('tp-atual'); if (c) c.focus(); }, 60);
}

function confirmarZerarPin(nome) {
  return window.confirm('Zerar o PIN de ' + nome + '? Na próxima entrada a pessoa cria um PIN novo.');
}

/*
 * Codigo de primeiro acesso gerado pelo administrador (Zerar PIN ou, para
 * quem ainda nao tem PIN, Codigo de acesso). Aparece numa janela — num
 * aviso que some em 7 s ninguem conseguiria anotar.
 */
async function gerarCodigoAcesso(id, nome, temPin) {
  if (temPin && !confirmarZerarPin(nome)) return;
  try {
    const r = await executarAcaoSrv('zerarPin', { id: id });
    esquecerTela(paginaAtual);
    abrirJanela('Código de primeiro acesso', `
      <p style="margin-top:0;line-height:1.7">Entregue este código para <b>${esc(r.nome)}</b> (${esc(r.email)}):</p>
      <p style="font-size:30px;font-weight:800;letter-spacing:8px;margin:6px 0 14px">${esc(r.codigo)}</p>
      <p class="dica">Vale 6 horas. Na entrada, a pessoa digita o e-mail e um PIN novo; o sistema pede este
        código e a repetição do PIN. Ela também pode receber um código no próprio e-mail, direto pela tela.</p>`,
      `<button class="botao" onclick="fecharJanela(); abrir(paginaAtual, paramsAtual)">Fechar</button>`);
  } catch (e) { avisar(e.message || e, true); }
}

/* Esconde todas as telas de entrada de uma vez. */
const TELAS_ENTRADA = ['carregando', 'falha', 'instalacao', 'entrar', 'sem-acesso', 'escolher-filial', 'aplicacao'];
function soMostrar(id) {
  TELAS_ENTRADA.forEach((t) => { const e = el(t); if (e) e.classList.add('oculto'); });
  const alvo = el(id); if (alvo) alvo.classList.remove('oculto');
}

/* ------------------------------------------------------------------ */
/* QUEM NAO ENTRA — e por que                                          */
/* ------------------------------------------------------------------ */

const TITULOS_SEM_ACESSO = {
  SEM_CONTA: 'Não reconheci a sua conta',
  SEM_CADASTRO: 'Acesso ainda não liberado',
  DESATIVADO: 'Acesso desativado',
  SEM_NIVEL: 'Falta definir o seu nível',
  SEM_FILIAL: 'Nenhuma filial liberada'
};

function mostrarSemAcesso(r) {
  soMostrar('sem-acesso');
  el('sem-acesso-titulo').textContent = TITULOS_SEM_ACESSO[r.entrada] || 'Acesso não liberado';
  el('sem-acesso-texto').textContent = r.motivo || 'Fale com o administrador do GSL.';
  const cartao = el('sem-acesso-cartao');
  cartao.classList.toggle('oculto', !r.conta);
  el('sem-acesso-conta').textContent = r.conta || '';
}

/*
 * Trocar de conta Google. Quem manda na conta conectada e o navegador,
 * nao o GSL — a tela explica o caminho.
 */
function trocarContaGoogle() {
  abrirJanela('Entrar com outra conta', `
    <ol style="line-height:1.9;padding-left:20px;color:var(--tinta-media);margin:0">

}

/* ------------------------------------------------------------------ */
/* ESCOLHA DA FILIAL                                                   */
/* ------------------------------------------------------------------ */

let FILIAIS_DISPONIVEIS = [];

function mostrarEscolhaFilial(filiais, usuario) {
  FILIAIS_DISPONIVEIS = filiais || FILIAIS_DISPONIVEIS;
  soMostrar('escolher-filial');
  const ultima = lerLocal(CHAVE_FILIAL);
  const quem = usuario || (SESSAO && SESSAO.usuario) || {};
  el('escolher-filial-ola').textContent = quem.nome ? 'Olá, ' + quem.nome.split(' ')[0] + '.' : '';
  el('grade-filiais').innerHTML = FILIAIS_DISPONIVEIS.map((f) => `
    <a class="holocard azul cartao-filial ${f.codigo === ultima ? 'ultima' : ''}"
       href="#" onclick="return escolherFilial(${jsArg(f.codigo)})">
      <div class="holo-icone">\u{1F3E2}</div>
      <div class="holo-titulo">${esc(f.nome)}</div>
      <div class="holo-frase">${esc(f.cidade || '')}${f.cidade ? ' · ' : ''}${(f.paineis || []).length} painel(is)</div>
      <div class="holo-frase pequena">${esc((f.paineis || []).join(' · '))}</div>
      <div class="holo-rodape">
        <span class="holo-acao">${f.codigo === ultima ? 'Continuar aqui' : 'Entrar'}</span>
        <span class="holo-seta">\u2192</span>
      </div>
      <span class="holo-marca">${esc(f.codigo)}</span>
    </a>`).join('');
}

/*
 * Entrar numa filial: primeiro pelo canal normal (rapido, sem recarregar).
 * Se ele falhar — o HTTP 403 de maquina com cookie bloqueado —, vai por
 * navegacao de pagina (POST, ver navegarPelaPagina), que passa onde a
 * chamada nao passa, e o servidor ja devolve a filial montada no HTML.
 */
function escolherFilial(codigo) {
  gravarLocal(CHAVE_FILIAL, codigo);
  if (typeof google === 'undefined' || !google.script) { irParaFilial(codigo); return false; }
  soMostrar('carregando');
  let respondeu = false;
  // Sem resposta em 12 s: volta aos cartoes. A navegacao de reserva precisa
  // de um clique recente, e o clique desta escolha ja "venceu".
  const reserva = setTimeout(() => {
    if (respondeu) return;
    respondeu = true;
    mostrarEscolhaFilial(FILIAIS_DISPONIVEIS);
    avisar('O servidor demorou para responder. Clique na filial de novo.', true);
  }, 12000);
  // Resposta (ou falha) que chega depois dos 12 s e de outra escolha: ignora
  // — senao abriria a filial que a pessoa ja abandonou.
  chamarJSON('abrirFilial', { t: TOKEN, f: codigo }).then((r) => {
    if (respondeu) return;
    respondeu = true; clearTimeout(reserva);
    if (r && (r.entrada === 'SEM_SESSAO' || /\[SESSAO\]/.test(r.erro || ''))) return sessaoTerminou();
    if (r && r.ok && r.entrada === 'APP') return montarSessao(r);
    if (r && r.entrada && r.entrada !== 'APP') return mostrarSemAcesso(r);
    mostrarFalha((r && r.erro) || 'Não consegui abrir a filial.');
  }).catch(() => { if (respondeu) return; respondeu = true; clearTimeout(reserva); irParaFilial(codigo); });
  return false;
}

function irParaFilial(codigo) {
  if (!navegarPelaPagina({ t: TOKEN, filial: codigo })) {
    mostrarFalha('Não consegui abrir a filial e não sei o endereço do sistema para recarregar.');
  }
}

function trocarFilial() {
  if (!SESSAO || !(SESSAO.filiais || []).length) return;
  esquecerTelas();
  mostrarEscolhaFilial(SESSAO.filiais, SESSAO.usuario);
}

/* ------------------------------------------------------------------ */
/* SESSAO                                                              */
/* ------------------------------------------------------------------ */

function montarSessao(r) {
  if (!r || !r.usuario || !r.telas) {
    return mostrarFalha('O servidor não devolveu a sua sessão (usuário, telas e permissões). ' +
      'Recarregue a página; se continuar, use o botão Reportar erro.');
  }
  SESSAO = r;
  if (r.token) { TOKEN = r.token; gravarSessao(TOKEN); }
  FILIAL = (r.filial && r.filial.codigo) || '';
  if (FILIAL) gravarLocal(CHAVE_FILIAL, FILIAL);
  esquecerTelas();
  moduloAtual = null;
  filtroAtivo = null; filtroTurno = null;   // filtro do calendario era da filial/pessoa anterior
  montarMenu(r.telas);

  const u = r.usuario;
  el('usuario-nome').textContent = u.nome || u.papel || u.email;
  el('usuario-papel').textContent = [u.papel, u.perfil, u.turno ? 'turno ' + u.turno : '']
    .filter(Boolean).join(' · ');
  el('usuario-papel').title = u.email;
  el('usuario-conta').innerHTML = `<span class="selo-verificado">&#128274; ${esc(u.email)}</span>`;

  const caixaFilial = el('filial-atual');
  if (caixaFilial) {
    const varias = (r.filiais || []).length > 1;
    caixaFilial.innerHTML = r.filial ? `
      <span class="filial-rotulo">Filial</span>
      <strong>${esc(r.filial.nome)}</strong>
      ${varias ? '<button class="botao-texto" onclick="trocarFilial()">Trocar filial</button>' : ''}` : '';
  }

  const av = el('aviso-simulacao'); if (av) av.classList.toggle('oculto', !r.simulacao);
  soMostrar('aplicacao');
  // Tela que ja veio pronta no HTML (navegacao de reserva): abre direto.
  if (r.telaEmbutida && r.telaEmbutida.resposta) {
    const p = r.telaEmbutida.params || {};
    CACHE_TELAS[chaveTela(r.telaEmbutida.id, p)] = { resposta: r.telaEmbutida.resposta, quando: Date.now() };
    return abrir(r.telaEmbutida.id, p);
  }
  abrirModulos();
  if (r.avisoTela) avisar(r.avisoTela, true);
}

/*
 * RESERVA DE LEITURA. Se o canal google.script.run for barrado nesta
 * maquina (HTTP 403), a tela pedida e aberta por navegacao de pagina:
 * o servidor devolve o HTML ja com ela montada. Gravar continua exigindo
 * o canal — a tela avisa quando for o caso.
 */
function canalBloqueado(e) {
  // "reading from storage ... PERMISSION_DENIED" e o erro do google.script.run
  // quando ha mais de uma conta Google aberta no navegador — o caso do
  // computador compartilhado. Antes so o 403 ativava a reserva.
  return /\b40[13]\b|NetworkError|Falha na conex|PERMISSION_DENIED|reading from storage|armazenamento/i
    .test(String((e && e.message) || e || ''));
}

/* Bilhete de uso unico que o servidor pos nesta pagina (ver doPost). */
let BILHETE_RENOVADO = '', BILHETE_DESDE = Date.now();
function bilheteDaPagina() {
  return BILHETE_RENOVADO ||
    (typeof CARGA_INICIAL !== 'undefined' && CARGA_INICIAL && CARGA_INICIAL.bilhete) || '';
}
/*
 * O bilhete vive 6 h no servidor. Pagina aberta o dia inteiro: enquanto o
 * canal funciona, pede um novo a cada 4 h — para a reserva por POST (se o
 * canal cair no meio do turno) nao sair com um bilhete vencido.
 */
function renovarBilheteSeVelho() {
  if (CANAL_BARRADO || Date.now() - BILHETE_DESDE < 4 * 3600 * 1000) return;
  if (typeof google === 'undefined' || !google.script) return;
  BILHETE_DESDE = Date.now();
  chamar('renovarBilhete', ctx()).then((b) => {
    if (typeof b !== 'string' || !/^[0-9a-f-]{36}$/i.test(b)) return;
    BILHETE_RENOVADO = b;
    const campo = el('entrar-bilhete'); if (campo) campo.value = b;
  }).catch(() => {});
}
setInterval(renovarBilheteSeVelho, 15 * 60 * 1000);
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') renovarBilheteSeVelho();
});
function abrirPorNavegacao(idTela, params) {
  if (!URL_APP || !FILIAL) return false;
  el('pagina').innerHTML = '<div class="vazio">Abrindo pela navegação…</div>';
  const temParams = params && Object.keys(params).length;
  return navegarPelaPagina({ t: TOKEN, filial: FILIAL, tela: idTela,
    p: temParams ? JSON.stringify(params) : '' });
}

/*
 * NAVEGACAO DE RESERVA (4.2.2) — sempre por POST no /exec.
 *
 * Antes ia como link /exec?t=<sessao>: o codigo ficava na barra de endereco
 * e no historico, e no computador compartilhado o proximo a usar voltava
 * pelo historico e entrava como a pessoa anterior, sem PIN. No POST o
 * codigo vai no corpo do pedido e nao fica em lugar nenhum. A janela de
 * cima so navega em resposta a um clique — por isso isto so e chamado
 * logo depois de um clique (abrir tela, escolher filial).
 */
let NAVEGACAO_PENDENTE = null;
let SAINDO_DA_PAGINA = false;        // a janela de cima ja comecou a navegar
window.addEventListener('beforeunload', function () { SAINDO_DA_PAGINA = true; });
function navegarPelaPagina(campos) {
  if (!URL_APP) return false;
  campos = Object.assign({ bilhete: bilheteDaPagina() }, campos);
  NAVEGACAO_PENDENTE = campos;
  const f = document.createElement('form');
  f.method = 'post'; f.action = URL_APP; f.target = '_top'; f.style.display = 'none';
  Object.keys(campos).forEach((k) => {
    if (campos[k] === undefined || campos[k] === null || campos[k] === '') return;
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = k; i.value = String(campos[k]);
    f.appendChild(i);
  });
  document.body.appendChild(f);
  f.submit();
  // Ainda aqui depois de 4 s: o navegador barrou a navegacao (o clique ja
  // tinha "vencido"). Um botao da ao navegador o clique que ele exige.
  setTimeout(() => {
    // Navegacao em andamento (servidor lento) nao e bloqueio: nada a fazer.
    if (NAVEGACAO_PENDENTE !== campos || SAINDO_DA_PAGINA) return;
    abrirJanela('Continuar', `
      <p style="margin-top:0;line-height:1.7">Este computador bloqueia a conversa direta com o Google,
        então o sistema continua recarregando a página. Clique em <b>Continuar</b>.</p>`, `
      <button class="botao" onclick="fecharJanela(); navegarPelaPagina(NAVEGACAO_PENDENTE)">Continuar</button>`);
  }, 6000);
  return true;
}

async function pararSimulacao() {
  // Sem recarregar a pagina (na moldura do Google ela voltaria em branco):
  // pede a sessao de novo, ja com o perfil verdadeiro.
  try { await chamar('encerrarSimulacao', ctx()); tratarEntrada(await chamarJSON('retomarSessao', ctx())); }
  catch (e) { avisar(e.message || e, true); }
}

/*
 * SAIR. Quem controla a entrada e a conta Google do navegador — o GSL
 * nao tem sessao propria para encerrar. A tela diz a verdade.
 */
function sair() {
  const t = TOKEN;
  TOKEN = ''; gravarSessao(''); SESSAO = null; esquecerTelas();
  // Canal barrado: o sairDoSistema pelo google.script.run tambem seria
  // barrado e a sessao continuaria valida no servidor. Sair e um clique,
  // entao a pagina pode navegar: a saida vai por POST.
  if (t && CANAL_BARRADO && navegarPelaPagina({ sair: t })) return;
  if (t) { try { google.script.run.withFailureHandler(function () {}).sairDoSistema({ t: t }); } catch (e) {} }
  if (el('entrar')) { el('entrar-email').value = ''; return mostrarEntrada({ recado: 'Você saiu do GSL.' }); }
  abrirJanela('Sair do sistema', `
    <p style="line-height:1.7;margin-top:0">
      Você entrou pela sua conta Google (<b>${esc(SESSAO && SESSAO.usuario ? SESSAO.usuario.email : '')}</b>).
      Quem controla essa entrada é o navegador.
    </p>
    <p style="line-height:1.7">Se este é o seu computador, basta fechar a aba. Se for um computador
      compartilhado, saia também da conta Google para ninguém entrar como você.</p>`, `
    <button class="botao secundario" onclick="fecharJanela()">Fechar</button>
    <button class="botao" onclick="window.open('https:\/\/accounts.google.com/Logout','_blank')">Sair da conta Google</button>`);
}

async function instalarSistema() {
  const email = String(el('instalacao-email').value || '').trim().toLowerCase();
  if (!email || email.indexOf('@') === -1) { avisar('Informe seu e-mail de administrador.', true); return; }
  const b = el('botao-instalar');
  b.disabled = true; b.textContent = 'Criando…';
  try {
    await chamar('instalar', email);
    // Instalado: o proximo passo e entrar com e-mail e PIN. Sem recarregar
    // (na moldura do Google a pagina recarregada volta em branco).
    mostrarEntrada({ emailDigitado: email,
      recado: 'Sistema instalado. Digite um PIN de 4 a 6 números — ele passa a ser o seu.' });
  } catch (e) { b.disabled = false; b.textContent = 'Criar banco de dados'; avisar(e.message || e, true); }
}

/*
 * HTTP 403 no console nao e culpa do GSL: a pagina abriu (o doGet rodou),
 * o que foi barrado foi a conversa do google.script.run com o Google.
 */
function explicarErro(t) {
  const m = String((t && t.message) || t || '');
  if (/PERMISSION_DENIED|reading from storage|armazenamento/i.test(m)) {
    return 'O Google recusou a conversa com o servidor porque há mais de uma conta Google aberta neste ' +
           'navegador. Use uma janela só com a conta @bartofil.com.br (ou uma janela anônima). ' +
           'Detalhe técnico: ' + m;
  }
  if (/\b403\b|NetworkError|Falha na conex/i.test(m)) {
    return 'Este computador abriu o sistema, mas o Google bloqueou (HTTP 403) a conversa '
         + 'com o servidor. Verifique: 1) a conta @bartofil.com.br é a PRIMEIRA conta logada no '
         + 'navegador (ou use uma janela só com ela); 2) cookies de terceiros liberados para '
         + 'script.google.com e *.googleusercontent.com; 3) data e hora do computador corretas. '
         + 'Detalhe técnico: ' + m;
  }
  return m || 'Erro desconhecido.';
}

function mostrarFalha(t) {
  soMostrar('falha');
  el('falha-texto').textContent = explicarErro(t);
}

/* Rede de seguranca: nada pode terminar na tela do logo girando para sempre. */
function travouCarregando() {
  const c = el('carregando');
  return c && !c.classList.contains('oculto');
}
window.addEventListener('unhandledrejection', function (ev) {
  if (travouCarregando()) mostrarFalha(ev.reason);
});
window.addEventListener('error', function (ev) {
  if (travouCarregando()) mostrarFalha(ev.message);
});
setTimeout(function () {
  if (travouCarregando()) mostrarFalha('O servidor nao respondeu em 25 segundos.');
}, 25000);

/*
 * MODULOS.
 *
 * O sistema abre no menu de modulos. A barra lateral so lista as telas do
 * modulo em que a pessoa esta — antes ela despejava as seis telas de uma
 * vez, misturando calendario com acessos.
 */
let moduloAtual = null;

const ICONES = {
  calendario: '\u{1F4C5}', pessoas: '\u{1F465}', tela: '\u{1F4FD}', engrenagem: '\u2699',
  bateria: '\u{1F50B}', limpeza: '\u{1F9F9}', grafico: '\u{1F4CA}', computador: '\u{1F5A5}'
};

function montarMenu(telas) {
  const dentro = moduloAtual
    ? telas.filter((t) => t.modulo === moduloAtual)
    : [];
  el('menu').innerHTML =
    (moduloAtual ? `<button class="voltar-modulos" onclick="abrirModulos()">Voltar aos modulos</button>` : '') +
    dentro.map((t) => `
    <button class="item-menu" data-pagina="${t.id}" onclick="abrir(${jsArg(t.id)})">
      <span class="tag-cor ${t.cor}"></span>${esc(t.nome)}
    </button>`).join('');
}

/** Tela inicial: os holocards. Nao chama o servidor. */
function abrirModulos() {
  if (!SESSAO || !SESSAO.usuario) {
    return mostrarFalha('Tentei abrir o menu sem uma sessão carregada. Recarregue a página.');
  }
  moduloAtual = null;
  paginaAtual = 'modulos'; paramsAtual = {};
  montarMenu(SESSAO.telas || []);

  el('titulo-pagina').textContent = 'Sistema de Gestão Operacional';
  el('subtitulo-pagina').textContent = ((SESSAO.filial && SESSAO.filial.nome) || 'GSL') + ' \u00b7 ' + SESSAO.usuario.nome;
  el('acoes-topo').innerHTML = '';
  el('pagina').classList.remove('sem-entrada');
  paginaAnterior = 'modulos';

  const mods = SESSAO.modulos || [];
  el('pagina').innerHTML = `
    <div class="tela-modulos">
      <div class="modulos-titulo">Selecione um modulo para continuar</div>
      <div class="grade-modulos">
        ${mods.map((m) => `
          <button class="holocard ${m.cor}${m.oculto ? ' painel-oculto' : ''}" onclick="entrarModulo(${jsArg(m.id)})">
            ${m.oculto ? '<span class="selo-oculto" title="Oculto: só o administrador vê este painel nesta filial">oculto</span>' : ''}
            <div class="holo-icone">${ICONES[m.icone] || '\u25C6'}</div>
            <div class="holo-titulo">${esc(m.nome)}</div>
            <div class="holo-frase">${esc(m.frase)}</div>
            <div class="holo-rodape">
              <span class="holo-acao">${esc(m.acao)}</span>
              <span class="holo-seta">\u2192</span>
            </div>
            <span class="holo-marca">${ICONES[m.icone] || ''}</span>
          </button>`).join('') ||
          '<div class="vazio">Nenhum modulo liberado para o seu perfil.</div>'}
      </div>
    </div>`;
}

function entrarModulo(id) {
  const m = (SESSAO.modulos || []).find((x) => x.id === id);
  if (!m || !m.telas.length) return;
  moduloAtual = id;
  montarMenu(SESSAO.telas || []);
  abrir(m.telas[0]);
  // As demais telas DESTE modulo vao chegando por tras, sem atrapalhar.
  setTimeout(() => prebuscarModulo(id), 2500);
}

/*
 * CACHE DE TELAS.
 *
 * Cada chamada ao servidor do Apps Script custa de 1 a 3 segundos, e isso
 * NAO depende do tamanho da resposta: e o custo de acordar o ambiente.
 * Sem cache, voltar para uma tela ja vista pagava esse preco de novo — era
 * a lentidao que se sentia no menu.
 *
 * Estrategia: mostra o que ja tem na hora e revalida por tras. A tela
 * aparece instantanea; se o servidor devolver algo diferente, ela se
 * corrige sozinha em silencio. Qualquer gravacao limpa o cache inteiro.
 */
const CACHE_TELAS = {};
const chaveTela = (id, params) => FILIAL + '|' + id + '|' + JSON.stringify(params || {});
function esquecerTelas() { Object.keys(CACHE_TELAS).forEach((k) => delete CACHE_TELAS[k]); }

/*
 * ENVELHECER em vez de APAGAR.
 *
 * Depois de uma gravacao, as outras telas podem ter mudado — mas apagar o
 * cache delas obrigava o app a buscar TODAS de novo na hora (era o que a
 * prebusca fazia depois de cada clique: 6 chamadas por botao apertado).
 * Envelhecendo, a tela guardada continua servindo para pintar na hora e
 * so revalida quando a pessoa realmente abre. Zero chamada extra agora,
 * dado fresco quando importa.
 */
function envelhecerTelas() {
  Object.keys(CACHE_TELAS).forEach((k) => { CACHE_TELAS[k].quando = 0; });
}

/*
 * FILA DO USUARIO.
 *
 * O Apps Script serializa as chamadas de uma mesma pessoa: se a prebusca
 * disparou seis, o clique dela entra atras das seis. Este contador marca
 * quando existe pedido do usuario em voo — a prebusca so anda com a fila
 * vazia, entao ela nunca mais atrasa um clique.
 */
let pedidosDoUsuario = 0;
const esperar = (ms) => new Promise((ok) => setTimeout(ok, ms));
async function filaLivre(limite) {
  for (let i = 0; i < (limite || 40) && pedidosDoUsuario > 0; i++) await esperar(300);
  return pedidosDoUsuario === 0;
}

async function abrir(idTela, params) {
  /*
   * 'modulos' e a tela inicial DO NAVEGADOR (os cartoes), nao uma tela do
   * servidor. Depois de uma acao feita ali (Reportar erro, Atualizar dados)
   * o agir() reabria a pagina atual e pedia ao servidor a tela "modulos":
   * caia num erro com a lateral vazia e sem botao de voltar.
   */
  if (!SESSAO) return;
  if (idTela === 'modulos') return abrirModulos();
  if (!(SESSAO.telas || []).some((t) => t.id === idTela)) {
    abrirModulos();
    return avisar('O seu nível de acesso não abre esta tela.', true);
  }
  paginaAtual = idTela; paramsAtual = params || {};

  // Entrar por atalho (um botao da Central, por exemplo) tem que acender o
  // modulo certo na lateral, senao a pessoa fica sem saber onde esta.
  const dona = (SESSAO.telas || []).find((t) => t.id === idTela);
  if (dona && dona.modulo !== moduloAtual) { moduloAtual = dona.modulo; montarMenu(SESSAO.telas || []); }

  document.querySelectorAll('.item-menu').forEach((b) => b.classList.toggle('ativo', b.dataset.pagina === idTela));

  // O titulo muda ANTES da chamada. Se a tela falhar, o cabecalho tem que
  // mostrar onde voce esta, nao onde estava.
  const menu = (SESSAO.telas || []).find((t) => t.id === idTela);
  el('titulo-pagina').textContent = menu ? menu.nome : idTela;
  el('subtitulo-pagina').textContent = '';
  el('acoes-topo').innerHTML = '';

  const chave = chaveTela(idTela, paramsAtual);
  const guardado = CACHE_TELAS[chave];

  if (guardado) {
    // Vindo do cache do navegador: entra deslizando so quando a tela
    // MUDA de verdade; voltar para a mesma tela nao reanima nada.
    pintar(idTela, guardado.resposta, paginaAnterior === idTela);
    paginaAnterior = idTela;
    if (Date.now() - guardado.quando < 20000) return;  // fresco: nem revalida
    revalidar(idTela, paramsAtual, chave);      // por tras, sem "Carregando"
    return;
  }

  el('pagina').innerHTML = '<div class="vazio">Carregando…</div>';
  pedidosDoUsuario++;
  try {
    const filialPedida = FILIAL;
    const r = await carregarTelaSrv(idTela, paramsAtual);
    if (FILIAL !== filialPedida) return;                 // trocou de filial no meio
    CACHE_TELAS[chave] = { resposta: r, quando: Date.now() };
    // Clique rapido no menu: a resposta que chegou atrasada nao pinta por
    // cima da tela que a pessoa ja abriu.
    if (paginaAtual !== idTela || chaveTela(paginaAtual, paramsAtual) !== chave) return;
    pintar(idTela, r, paginaAnterior === idTela);
    paginaAnterior = idTela;
  } catch (e) {
    if (canalBloqueado(e) && abrirPorNavegacao(idTela, paramsAtual)) return;
    el('pagina').innerHTML = `<div class="erro-caixa">${esc(explicarErro(e))}</div>`;
  } finally {
    pedidosDoUsuario--;
  }
}

/*
 * PREBUSCA — reescrita.
 *
 * Como era: logo depois do login, e de novo depois de CADA acao, o app
 * pedia TODAS as telas ao servidor, uma a uma. Sete telas = sete idas de
 * 1 a 3 s cada. E como o Apps Script atende uma chamada por vez para o
 * mesmo usuario, o clique da pessoa ficava atras dessa fila: o app abria
 * rapido e travava logo em seguida. Era a lentidao principal.
 *
 * Como ficou:
 *   - so as telas do MODULO em que a pessoa entrou (as outras ela pode
 *     nem abrir na sessao inteira);
 *   - so depois de a tela pedida ja estar na frente dela;
 *   - so com a fila do usuario vazia, e cedendo a vez a cada item;
 *   - para na hora se a pessoa trocar de modulo.
 */
async function prebuscarModulo(idModulo) {
  const alvo = (SESSAO && SESSAO.telas || []).filter((t) => t.modulo === idModulo);
  for (const t of alvo) {
    if (moduloAtual !== idModulo) return;            // a pessoa saiu do modulo
    const chave = chaveTela(t.id, {});
    if (CACHE_TELAS[chave]) continue;
    if (!(await filaLivre())) return;                // usuario ocupado: desiste
    try {
      CACHE_TELAS[chave] = { resposta: await carregarTelaSrv(t.id, {}), quando: Date.now() };
    } catch (e) { /* tela sem permissao ou com erro: fica para o clique */ }
    await esperar(400);                              // deixa a fila respirar
  }
}

/** Busca de novo em segundo plano e so repinta se mudou de verdade. */
async function revalidar(idTela, params, chave) {
  try {
    const r = await carregarTelaSrv(idTela, params);
    const antes = CACHE_TELAS[chave];
    CACHE_TELAS[chave] = { resposta: r, quando: Date.now() };
    // Se o usuario ja saiu desta tela, atualiza so o cache.
    if (paginaAtual !== idTela || chaveTela(paginaAtual, paramsAtual) !== chave) return;
    if (!antes || JSON.stringify(antes.resposta) !== JSON.stringify(r)) pintar(idTela, r, true);
  } catch (e) { /* revalidacao e silenciosa: a tela em uso continua valida */ }
}

/* Resolvido na hora do uso, nao na leitura do arquivo. Uma tela sem pintor
   vira uma mensagem na tela — nao a pagina inteira em branco. */
const TELAS_PINTA = {
  inicio: 'pintarCentral', calendario: 'pintarCalendario', assiduidade: 'pintarAssiduidade',
  config: 'pintarConfig', acessos: 'pintarPessoas',
  apresentacao: 'pintarApresentacao',
  acoes: 'pintarAcoes', relatos: 'pintarRelatos',
  nobreaks: 'pintarNobreaks', limpeza: 'pintarLimpeza', quadro: 'pintarQuadro', filiais: 'pintarFiliais',
  estoque: 'pintarEstoque'
};

/*
 * `silencioso` = esta e a repintura de fundo da revalidacao, nao uma
 * troca de tela. Sem esta distincao, o conteudo entrava deslizando UMA
 * VEZ ao abrir e DE NOVO meio segundo depois, quando o servidor
 * confirmava os dados — que e a "sensacao de lentidao" relatada: nao era
 * demora, era a animacao de entrada rodando duas vezes.
 */
function pintar(idTela, r, silencioso) {
  DADOS = r.dados;
  paginaAtual = idTela;
  document.querySelectorAll('.item-menu').forEach((b) => b.classList.toggle('ativo', b.dataset.pagina === idTela));
  el('titulo-pagina').textContent = r.titulo;

  const pagina = el('pagina');
  pagina.classList.toggle('sem-entrada', !!silencioso);

  // O "modo filtrando" e so do calendario: nao pode vazar para outra tela.
  if (idTela !== 'calendario') pagina.classList.remove('filtrando');
  const pintor = window[TELAS_PINTA[idTela]];
  if (typeof pintor !== 'function') {
    pagina.innerHTML = `<div class="erro-caixa">A tela "${esc(idTela)}" ainda nao tem visual montado.</div>`;
    return;
  }
  /*
   * Cerca de protecao por tela. Antes, um erro no meio da montagem
   * deixava a area de conteudo VAZIA e sem mensagem — a "tela branca".
   * Agora o erro fica dentro da tela que o causou; o menu, a barra
   * lateral e o resto do sistema continuam de pe.
   */
  try {
    pintor(r);
  } catch (e) {
    pagina.innerHTML = `<div class="erro-caixa">
      <strong>Não consegui montar a tela "${esc(r.titulo || idTela)}".</strong>
      <div style="margin-top:8px">${esc(e.message || e)}</div>
      <div style="margin-top:12px">
        <button class="botao secundario" onclick="recarregarDados()">Tentar de novo</button>
        <button class="botao-texto" onclick="formFeedback()">Reportar este erro</button>
      </div></div>`;
  }
}

/*
 * Uma acao custava TRES viagens ao servidor: a acao, a remontagem da tela
 * e a prebusca de TODAS as outras telas. No Apps Script cada viagem custa
 * segundos — por isso o botao parecia travar.
 *
 * Agora:
 *   - so a tela ATUAL e invalidada (as outras revalidam sozinhas ao abrir);
 *   - a prebusca sai do caminho critico (roda depois, sem segurar ninguem);
 *   - o botao clicado mostra que esta trabalhando, entao a espera nao
 *     parece travamento.
 */
async function agir(acao, params, recado) {
  const botao = (typeof event !== 'undefined' && event && event.target)
    ? event.target.closest('button') : null;
  // Guarda o innerHTML, nao o texto: varios botoes tem icone dentro e
  // voltavam sem ele depois da acao.
  const rotulo = botao ? botao.innerHTML : '';
  if (botao) { botao.disabled = true; botao.textContent = 'Aguarde…'; }

  pedidosDoUsuario++;
  try {
    const r = await executarAcaoSrv(acao, params);

    /*
     * Invalida a tela atual (essa tem que voltar do servidor) e apenas
     * ENVELHECE as outras. Antes daqui saia um `esquecerTelas()` seguido
     * de uma prebusca de todas as telas: aprovar uma atividade custava
     * oito idas ao servidor e ~15 s de fila. Agora custa duas.
     */
    // Acoes globais (parametros, perfis) mudam TODAS as telas: nesses
    // casos o cache inteiro cai, senao outra tela mostra dado velho.
    if (r && r.invalidarTudo) esquecerTelas();
    else { esquecerTela(paginaAtual); envelhecerTelas(); }
    fecharJanela();

    /*
     * Se o servidor devolveu um aviso (tipico: a operacao gravou mas o
     * e-mail nao saiu), ele TEM que aparecer. Antes a falha de e-mail era
     * engolida e a tela dizia so "Atividade criada" — por isso ninguem
     * percebia que o coordenador nunca foi avisado.
     */
    if (r && r.avisoEmail) avisar(r.avisoEmail, true);
    // O servidor pode devolver um recado mais preciso que o do botao
    // (por exemplo: para QUAIS enderecos o aviso saiu). Ele tem prioridade.
    else if (r && r.recado) avisar(r.recado);
    else if (recado) avisar(recado);
    await abrir(paginaAtual, paramsAtual);
    return r;
  } catch (e) {
    const msg = e.message || String(e);
    // Erro de permissao de e-mail nao vira um aviso que some em 7s: vira uma
    // janela com o passo a passo e o botao que leva direto para autorizar.
    // O canal barrado (varias contas Google: "PERMISSION_DENIED") vem antes:
    // ele tambem diz "permission", mas nao tem nada a ver com o e-mail.
    // ("permiss" saiu da lista pelo mesmo motivo — e pegava ate o nosso
    // "Sem permissao para ..." das telas.)
    if (canalBloqueado(e)) avisar(explicarErro(e), true);
    else if (/MailApp|send_mail|autoriz/i.test(msg)) janelaAutorizarEmail(msg);
    else avisar(msg, true);
    throw e;
  } finally {
    pedidosDoUsuario--;
    if (botao) { botao.disabled = false; botao.innerHTML = rotulo; }
  }
}

/* Apaga do cache do cliente so as entradas de uma tela. */
function esquecerTela(idTela) {
  Object.keys(CACHE_TELAS).forEach(function (k) {
    if (k.indexOf(FILIAL + '|' + idTela + '|') === 0) delete CACHE_TELAS[k];
  });
}
const recarregarDados = () => agir('atualizarDados', {}, 'Dados atualizados');

/*
 * Guia de autorizacao de e-mail. Aparece quando um envio falha por falta de
 * permissao. O botao abre a pagina de permissoes da conta Google: la a
 * pessoa remove o acesso antigo e, ao voltar, o sistema pede a permissao
 * nova (incluindo o Gmail) automaticamente.
 */
function gerarProximoMes() {
  const hoje = new Date();
  const meses = ['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
  // proximos 6 meses como opcoes
  const opcoes = [];
  for (let i = 0; i <= 6; i++) {
    const d = new Date(hoje.getFullYear(), hoje.getMonth() + i, 1);
    opcoes.push(meses[d.getMonth()] + ' ' + d.getFullYear());
  }
  // O recado vem do servidor ("N criadas" ou "nada a gerar"): antes a
  // tela dizia "Mes gerado" mesmo quando nada tinha sido gerado.
  abrirJanela('Gerar um mês', `
    <p style="margin:0 0 14px;line-height:1.7;color:var(--tinta-media)">
      Cria as atividades do mês escolhido a partir das rotinas, sem esperar a geração automática do dia 20.
      Se o mês já existe, só cria o que estiver faltando — nada é duplicado.
    </p>
    <div class="campo"><label>Mes</label>
      <select id="gm-comp">${opcoes.map((c) => `<option>${c}</option>`).join('')}</select></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('gerarMes',{competencia:val('gm-comp')},'Pronto')">Gerar mês</button>`);
}

      o <b>Coordenador</b> volta a so entregar — sem validar, sem ver assiduidade nem configuracao.
      As pessoas continuam nos seus niveis; so a definicao de cada nivel volta ao certo.

}

      '<button class="botao" onclick="fecharJanela()">Fechar</button>');

function janelaAutorizarEmail(msg) {
  abrirJanela('Falta autorizar o envio de e-mail', `
    ${msg ? `<div class="erro-caixa" style="margin:0 0 14px">${esc(msg)}</div>` : ''}
    <p style="margin:0 0 14px;line-height:1.7;color:var(--tinta-media)">

    <button class="botao" onclick="window.open('https:\/\/myaccount.google.com/permissions','_blank')">Abrir página de autorização</button>`);
}

function avisar(texto, erro) {
  const r = el('recado');
  r.textContent = texto;
  r.className = 'recado' + (erro ? ' erro' : '');
  r.classList.remove('oculto');
  setTimeout(() => r.classList.add('oculto'), erro ? 7000 : 2600);
}

function abrirJanela(titulo, corpo, rodape) {

function pintarCalendario(r) {
  const d = r.dados, p = d.permissoes;
  el('subtitulo-pagina').textContent = d.competencia + ' · ' + r.escopo;

  // O seletor de mes saiu do cabecalho. Agora e uma tira de cartoes de mes
  // logo acima do calendario — da para ver todos os meses e trocar num toque.
  el('acoes-topo').innerHTML = '';

  const meses = d.competenciasDisponiveis.length ? d.competenciasDisponiveis : [d.competencia];

  /*
   * A tira de meses agora carrega TAMBEM os meses ja encerrados. Eles
   * ficam a esquerda, apagados e com um cadeado, separados por um traco
   * do mes atual em diante — da para consultar agosto sem confundi-lo
   * com um mes que ainda esta correndo.
   */
  const encerrados = d.competenciasEncerradas || [];
  const chip = (c) => {
    const fechado = encerrados.indexOf(c) !== -1;
    return `<button class="chip-mes ${c === d.competencia ? 'ativo' : ''}${fechado ? ' encerrado' : ''}"

  };
  const emCurso = meses.filter((c) => encerrados.indexOf(c) === -1);

  el('pagina').innerHTML = `
    <div class="tira-meses">
      ${encerrados.map(chip).join('')}
      ${encerrados.length && emCurso.length ? '<span class="divisor-meses" aria-hidden="true"></span>' : ''}

    </div>

    <div class="cartao" style="margin-bottom:14px">
      <div class="cartao-titulo">Calendário operacional</div>
      <div class="grade-mes">
        ${['DOM','SEG','TER','QUA','QUI','SEX','SAB'].map((n) => `<div class="dia-cabecalho">${n}</div>`).join('')}
        ${d.grade.map((semana) => semana.map((dia) => `
          <div class="dia${dia.doMes ? '' : ' fora'}${dia.hoje ? ' hoje' : ''}${
                dia.temAtraso ? ' com-atraso' : (dia.temPrazo ? ' com-prazo' : '')}${

            <div class="dia-numero">${dia.dia}</div>

              <button class="pilula ${classeStatus(i.status)}${i.entregue ? ' tem-anexo' : ''}" title="${esc(i.atividade)}${i.entregue ? ' — ENTREGUE (' + (i.qtdAnexos || 0) + ' arquivo)' : ''}"
                      data-turno="${esc(i.turno)}"
                      onclick="abrirAtividade(${jsArg(i.id)})">${esc(i.tipo)}${i.turno !== 'Todos' ? ' ' + esc(i.turno) : ''}</button>`).join('')}
          </div>`).join('')).join('')}
      </div>
      <div class="legenda-mes">
        <span><i class="amostra hoje"></i>hoje</span>
        <span><i class="amostra prazo"></i>dia com prazo</span>
        <span><i class="amostra atraso"></i>dia com atraso</span>
        <span><i class="amostra reuniao"></i>reunião com a gerência — o marco da semana</span>
      </div>
    </div>

    <div class="cartao" style="margin-bottom:14px">
      <div class="cartao-titulo linha-titulo">
        <span>Gestao de atividades — ${d.atividades.length} no mes</span>
        <span style="display:flex;gap:8px">
          ${d.mesPassado && p.validar ? `<button class="botao secundario" onclick="encerrarMes(${jsArg(d.competencia)})">Encerrar mês passado</button>` : ''}
          ${p.programar && !d.mesPassado ? `<button class="botao" onclick="formNovaAtividade(${jsArg(d.competencia)})">+ Nova atividade</button>` : ''}
        </span>
      </div>
      ${d.mesPassado ? '<p class="dica" style="margin:-4px 0 12px">Mês encerrado — esta é a foto final. Se ficou algo pendente e você quer tirá-lo das contagens, use <b>Encerrar mês passado</b>.</p>' : ''}
      ${tiraDeTurnos(d.atividades)}
      <p class="dica" style="margin:-4px 0 12px">Clique em <b>Abrir</b> na atividade para anexar entrega, remarcar, dar feedback, aprovar, reprovar ou cancelar.</p>
      <div style="overflow-x:auto">
        <table class="tabela-gestao"><thead><tr>
          <th></th><th>ID</th><th>Sem.</th><th>Prazo</th><th>Atividade</th><th>Turno</th>
          <th>Coordenador</th><th>Setor</th><th>Entrega</th><th>Entregue em</th>
          <th>Validação</th><th>Motivo reprov./cancel.</th><th>Status</th>
        </tr></thead><tbody>
          ${d.atividades.map((a) => `
            <tr class="linha-status ${classeStatus(a.status)}" data-turno="${esc(a.turno)}">
              <td><button class="botao-abrir" onclick="abrirAtividade(${jsArg(a.id)})">Abrir</button></td>
              <td class="mono">${esc(a.id)}</td>
              <td>${esc(a.semana)}</td>
              <td>${esc(a.prazo)}</td>
              <td>${esc(a.atividade)}</td>
              <td>${esc(a.turno)}</td>
              <td>${esc(a.coordenador || '—')}</td>
              <td>${esc(a.setor || '—')}</td>
              <td>${a.entregue
                    ? `<span class="selo-entrega">\u{1F4CE} ${a.qtdAnexos || 0} arquivo(s)</span>`
                    : '<span class="pendente-entrega">aguardando</span>'}</td>
              <td>${esc(a.entregueEm || '—')}</td>
              <td>${esc(a.validacao || '—')}</td>
              <td class="motivo">${esc(a.motivo || '')}</td>
              <td>${etiqueta(a.status)}${a.diasAtraso ? `<div class="meta-atividade">${a.diasAtraso} dia(s)</div>` : ''}</td>
            </tr>`).join('') || '<tr><td colspan="13" class="vazio">Nenhuma atividade neste mês.</td></tr>'}
        </tbody></table>
      </div>
    </div>

    ${vagasDoMes(d).length ? `
    <div class="cartao bloco-treinamento">
      <div class="cartao-titulo">Treinamentos e vagas programados pelo gerente</div>
      <div class="dica" style="margin-bottom:10px">
        Vaga que o gerente marca — preencha o tema, o turno e a data. O coordenador e avisado por e-mail na hora.
      </div>
      ${vagasDoMes(d).map((a) => `
        <div class="linha-atividade">
          <div class="data-atividade">
            <div class="data-dia">${a.prazo ? esc(a.prazo.slice(0, 5)) : '--'}</div>
            <div class="data-semana">${a.prazo ? esc(a.diaSemana) : 'sem data'}</div>
          </div>
          <div class="texto-atividade">
            <div class="nome-atividade">${esc(a.atividade)}</div>
            <div class="meta-atividade mono">${esc(a.id)}${a.turno ? ' \u00b7 turno ' + esc(a.turno) : ''}</div>
          </div>
          ${a.prazo ? etiqueta(a.status) : '<span class="etiqueta iniciar">Não agendado</span>'}
          ${p.programar ? `<button class="icone-botao" onclick="formTreinamento(${jsArg(a.id)})">${a.prazo ? 'Alterar' : 'Agendar'}</button>` : ''}
          ${a.prazo ? `<button class="icone-botao" onclick="abrirAtividade(${jsArg(a.id)})">Abrir</button>` : ''}
        </div>`).join('')}
    </div>` : ''}

    ${(d.canceladas || []).length ? `
    <div class="cartao bloco-arquivo" style="margin-top:14px">
      <div class="cartao-titulo">Arquivo — atividades canceladas (${d.canceladas.length})</div>
      <p class="dica" style="margin:-4px 0 12px">Ficam fora do calendário e das contagens. Reative se precisar de volta.</p>
      ${d.canceladas.map((a) => `
        <div class="linha-atividade">
          <div class="texto-atividade">
            <div class="nome-atividade" style="text-decoration:line-through;opacity:.7">${esc(a.atividade)}</div>
            <div class="meta-atividade mono">${esc(a.id)} \u00b7 ${esc(a.prazo || 'sem data')} \u00b7 ${esc(a.motivo || '')}</div>
          </div>
          ${p.validar ? `<button class="icone-botao" onclick="agir('reativarAtividade',{id:${jsArg(a.id)}},'Atividade reativada')">Reativar</button>` : ''}
        </div>`).join('')}
    </div>` : ''}`;
  // Filtro de status/turno sobrevive a repintura (acao ou revalidacao de
  // fundo): antes a pilula continuava acesa, mas nada mais era filtrado.
  // Mas o turno so vale se a pastilha dele ainda existe (outro mes pode nao
  // ter aquele turno, ou nem ter a tira): senao o mes inteiro ficava apagado
  // sem nenhum botao para desfazer.
  const pastilhas = Array.from(el('pagina').querySelectorAll('.pastilha-turno'));
  if (filtroTurno && !pastilhas.some((b) => b.dataset.turnoFiltro === filtroTurno)) {
    filtroTurno = null;
    pastilhas.forEach((b) => b.classList.toggle('ativa', !b.dataset.turnoFiltro));
  }
  aplicarFiltro();
}

function encerrarMes(competencia) {
  abrirJanela('Encerrar ' + competencia, `
    <p style="margin:0 0 14px;line-height:1.7;color:var(--tinta-media)">
      Cancela as atividades de <b>${esc(competencia)}</b> que ficaram <b>pendentes ou atrasadas</b>
      (e as vagas de treinamento nunca agendadas).
      Elas somem do calendário e das contagens, mas ficam no arquivo — da para reativar depois.
    </p>
    <p class="dica" style="margin:0 0 14px">Entregas <b>aguardando validação</b> ou <b>reprovadas</b> não são
      canceladas: o coordenador já entregou — valide-as no calendário do mês.</p>
    <div class="campo"><label>Motivo</label>
      <textarea id="em-motivo" placeholder="Ex.: mês encerrado, não será mais cobrado">Mês encerrado pela gestão.</textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Voltar</button>
    <button class="botao perigo" onclick="agir('cancelarCompetencia',{competencia:${jsArg(competencia)},motivo:val('em-motivo')},'Mes encerrado')">Encerrar mês</button>`);
}

function todasAtividades() {
  return [].concat(DADOS.atividades || [], DADOS.treinamentos || [], DADOS.naoAgendadas || []);
}

/*
 * A MESMA regra do servidor (podeGravarNaAtividade_): entrega quem tem
 * ENTREGAR ou ANEXAR e, se for coordenador, so no proprio turno ou em
 * atividade "Todos". Sem ela a tela mostrava o envio em qualquer
 * atividade e o coordenador subia todas as fotos para so no fim ouvir
 * "nao pode".
 */
function podeEntregarNa_(a, p) {
  if (!a || !p || !p.entregar) return false;
  const t = String(a.turno || '').toUpperCase();
  return !p.turnoEntrega || t === '' || t === 'TODOS' || t === p.turnoEntrega;
}

/* Remover anexo: quem entrega ali, e de atividade aprovada so quem valida. */
function podeRemoverAnexo_(a, p) {
  return podeEntregarNa_(a, p) && (a.status !== 'Aprovada' || !!p.validar);
}

function abrirAtividade(id) {
  const d = DADOS, p = d.permissoes;
  const a = todasAtividades().find((x) => x.id === id);
  if (!a) return;

  // A entrega aparece na hora que a atividade abre — nada de "carregando",
  // nada de procurar. Se ha PDF entregue, um botao grande abre ele direto.
  const anexos = (a.entregue && a.anexoUrl)
    ? `<a class="anexo-entregue" href="${esc(a.anexoUrl)}" target="_blank">
         <span class="anexo-icone">\u{1F4C4}</span>
         <span class="anexo-texto">
           <span class="anexo-titulo">Entrega recebida</span>
           <span class="anexo-sub">Entregue em ${esc(a.entregueEm || '—')} \u00b7 toque para abrir o PDF</span>
         </span>
         <span class="anexo-seta">\u2192</span>
       </a>`
    : '<div class="dica">Nenhum arquivo entregue ainda.</div>';

  const setor = p.programar && a.tipo === 'VIS' ? `
    <div class="campo">
      <label>Setor da vistoria</label>
      <select id="a-setor" onchange="agir('definirSetor',{id:${jsArg(a.id)},setor:this.value},'Setor definido — coordenador avisado')">
        <option value="">Escolher…</option>
        ${d.setores.map((s) => `<option ${a.setor === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}
      </select>
      <p class="dica">Ao definir, o coordenador do turno recebe o aviso na hora.</p>
    </div>` : (a.setor ? `<div class="campo"><label>Setor</label><input value="${esc(a.setor)}" readonly></div>` : '');

  // Ja decidida (aprovada, reprovada ou cancelada): mostra o veredito, nao os
  // botoes de decidir de novo. So oferece "Reabrir" para desfazer.
  const jaDecidida = a.validacao === 'Aprovado' || a.validacao === 'Reprovado' || a.validacao === 'Cancelada';

  // A caixa de feedback comeca VAZIA. Vinha preenchida com o MOTIVO da linha
  // — a nota de remarcacao ou o motivo da reprovacao anterior — e aprovar
  // mandava esse texto como "feedback" no e-mail. O historico fica acima dela.
  const validacao = p.validar ? (jaDecidida ? `
    <div class="campo" style="border-top:1px solid var(--linha);padding-top:16px">
      <label>Validação do gerente</label>
      <div class="veredito ${classeStatus(a.status)}">
        <span>${esc(a.validacao)}</span>
        ${a.motivo ? `<div class="veredito-motivo">${esc(a.motivo)}</div>` : ''}
      </div>
      <button class="icone-botao" style="margin-top:10px" onclick="reabrirAtividade(${jsArg(a.id)})">Reabrir para nova validação</button>
    </div>` : `
    <div class="campo" style="border-top:1px solid var(--linha);padding-top:16px">
      <label>Validação do gerente</label>
      ${a.motivo ? `<p class="dica" style="margin:0 0 8px">Histórico: ${esc(a.motivo)}</p>` : ''}
      <textarea id="a-motivo" placeholder="Feedback ou motivo (obrigatório para reprovar)"></textarea>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="botao" style="background:var(--verde)" onclick="validar(${jsArg(a.id)},'Aprovado')">Aprovar</button>
        <button class="botao perigo" onclick="validar(${jsArg(a.id)},'Reprovado')">Reprovar</button>
        <button class="botao secundario" onclick="cancelarAtividade(${jsArg(a.id)})">Cancelar atividade</button>
      </div>
    </div>`) : (a.motivo ? `<div class="campo"><label>Retorno da gerência</label>
      <div class="erro-caixa" style="background:var(--azul-tenue);border-color:var(--linha);color:var(--tinta)">${esc(a.motivo)}</div></div>` : '');

  abrirJanela(a.atividade, `
    <div class="campo-duplo">
      <div class="campo"><label>ID</label><input value="${esc(a.id)}" readonly></div>
      <div class="campo"><label>Prazo</label><input value="${esc(a.prazo || 'nao agendado')}" readonly></div>
    </div>
    <div class="campo-duplo">
      <div class="campo"><label>Turno</label><input value="${esc(a.turno)}" readonly></div>
      <div class="campo"><label>Responsavel</label><input value="${esc(a.coordenador || coordenadorDoTurno(a.turno) || 'a definir')}" readonly></div>
    </div>
    ${setor}
    <div class="campo">
      <label>Status</label>
      <div>${etiqueta(a.status)} ${a.entregueEm ? `<span class="meta-atividade">entregue em ${esc(a.entregueEm)}</span>` : ''}</div>
    </div>
    <div class="campo">
      <label>Entrega</label>
      ${anexos}
      <div id="lista-anexos" class="vazio">${a.qtdAnexos ? 'Carregando anexos…' : 'Nenhum arquivo ainda.'}</div>
      ${p.entregar && !podeEntregarNa_(a, p) ? `
        <p class="dica" style="margin-top:10px">Esta atividade é do turno ${esc(a.turno)}: quem entrega é o
          coordenador desse turno ou a gerência.</p>` : ''}
      ${podeEntregarNa_(a, p) ? `
        <div class="area-envio" style="margin-top:10px">
          <input type="file" id="a-arquivos" multiple
                 accept="image/\*,.heic,.heif,.hif,.tif,.tiff,.avif,.dng,.pdf,.docx,.doc,.odt,.rtf,.txt"
                 onchange="listarEscolhidos()" style="display:none">
          <button class="botao secundario" type="button" onclick="el('a-arquivos').click()">Escolher fotos ou arquivos</button>
          <div id="a-lista" class="lista-envio"></div>
          <button class="botao" id="a-enviar" type="button" style="margin-top:10px;display:none"
                  onclick="enviarEntrega(${jsArg(a.id)})">Gerar PDF e enviar entrega</button>
          <p class="dica">Varias fotos viram um PDF único, uma por página. Aceita JPG, PNG, HEIC, PDF e documentos.
             Ao enviar, a gestão e avisada e o status vira "Aguard. valid.".
             <b>Pode entregar mais de uma vez</b> na mesma atividade: cada envio vira um
             arquivo novo e os anteriores continuam lá.</p>
        </div>` : ''}
    </div>
    ${validacao}`, `
    ${p.programar && a.prazo ? `<button class="botao secundario" onclick="formRemarcar(${jsArg(a.id)})">\u{1F4C5} Remarcar data</button>` : ''}
    <button class="botao secundario" onclick="fecharJanela()">Fechar</button>`);

  /*
   * carregarDetalhes() (antes carregarAnexos) existia e NUNCA era chamada — e o elemento que ela
   * procurava (#lista-anexos) tinha saido da janela. Com isso as acoes
   * `detalhesAtividade`, `removerAnexo` e a funcao `baixar()` ficaram
   * inalcancaveis: quem anexou arquivo avulso nao conseguia mais ver nem
   * remover. A chamada e feita depois de a janela existir, e so quando ha
   * anexo — nenhuma ida ao Drive a mais nos outros casos. (Na 4.2 ela
   * passou a ir sempre, porque trazia a conversa; o chat saiu, a regra volta.)
   */
  if (a.qtdAnexos) carregarDetalhes(a.id, podeRemoverAnexo_(a, p));
}

/* Nome e tamanho de arquivo custam uma chamada ao Drive cada. Buscar isso
   para o mes inteiro travava a tela; aqui vem so da atividade aberta. */
async function carregarDetalhes(id, podeRemover) {
  try {
    const r = await executarAcaoSrv('detalhesAtividade', { id: id });

    const alvo = el('lista-anexos');
    if (alvo) {
      alvo.className = '';
      alvo.innerHTML = (r.anexos || []).map((f) => `
        <div class="anexo">
          <span class="anexo-nome">${esc(f.nome)}</span>
          <span class="anexo-tamanho">${esc(f.tamanho)}</span>
          <button class="icone-botao" onclick="baixar(${jsArg(f.id)})">Baixar</button>
          ${f.url ? `<a class="icone-botao" href="${esc(f.url)}" target="_blank">Abrir</a>` : ''}
          ${podeRemover ? `<button class="icone-botao perigo" onclick="agir('removerAnexo',{id:${jsArg(id)},idArquivo:${jsArg(f.id)}},'Anexo removido')">Remover</button>` : ''}
        </div>`).join('') || '<span class="vazio">Nenhum arquivo.</span>';
    }

  } catch (e) {
    const alvo = el('lista-anexos');
    if (alvo) alvo.textContent = 'Não consegui listar os anexos: ' + (e.message || e);
  }
}

// Coordenador do turno, vindo da EQUIPE cadastrada — a "teia": turno -> pessoa.
function coordenadorDoTurno(turno) {
  if (!turno || turno === 'Todos') return '';
  const eq = (SESSAO && SESSAO.equipe) || (DADOS && DADOS.equipe) || [];
  const p = eq.find((x) => String(x.turno).toUpperCase() === String(turno).toUpperCase());
  return p ? p.nome : '';
}

function reabrirAtividade(id) {
  agir('validar', { id: id, validacao: '', motivo: '' }, 'Atividade reaberta para nova validacao');
}

function validar(id, decisao) {
  agir('validar', { id: id, validacao: decisao, motivo: val('a-motivo') },
       decisao === 'Aprovado' ? 'Aprovada — coordenador avisado' : 'Registrado — coordenador avisado');
}

function cancelarAtividade(id) {
  const a = todasAtividades().find((x) => x.id === id);
  abrirJanela('Cancelar atividade', `
    <p style="margin:0 0 14px;color:var(--tinta-media);line-height:1.7">
      Cancelar <b>${esc(a.atividade)}</b> (${esc(a.semana)} \u00b7 Turno ${esc(a.turno)})?
      Ela sai do calendario e das contagens de atraso. O coordenador do turno e avisado.
    </p>
    <div class="campo"><label>Motivo do cancelamento</label>
      <textarea id="c-motivo" placeholder="Por que a atividade não precisa mais ser entregue"></textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Voltar</button>
    <button class="botao perigo" onclick="agir('cancelarAtividade',{id:${jsArg(id)},motivo:val('c-motivo')},'Atividade cancelada — coordenador avisado')">Confirmar cancelamento</button>`);
}

      Atividade avulsa, fora das rotinas do mês. Ao salvar, o coordenador do turno recebe o aviso.
    </p>

      <input id="n-atividade" placeholder="Ex.: Conferencia extra de inventario"></div>

      <div class="campo"><label>Data</label><input type="date" id="n-data"></div>
      <div class="campo"><label>Turno</label>
        <select id="n-turno">
          ${['Todos', 'A', 'B', 'C'].map((x) => `<option>${x}</option>`).join('')}
        </select></div>
    </div>
    <div class="campo"><label>Setor (opcional)</label>
      <select id="n-setor"><option value="">—</option>
        ${(d.setores || []).map((s) => `<option>${esc(s)}</option>`).join('')}</select></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('criarAtividade',{atividade:val('n-atividade'),prazo:val('n-data'),turno:val('n-turno'),setor:val('n-setor')},'Atividade criada — coordenador avisado')">Criar atividade</button>`);

function formRemarcar(id) {
  const a = todasAtividades().find((x) => x.id === id);
  abrirJanela('Remarcar ' + a.id, `
    <div class="campo"><label>Prazo atual</label><input value="${esc(a.prazo)}" readonly></div>
    <div class="campo"><label>Novo prazo</label><input type="date" id="r-data" value="${esc(a.prazoISO)}"></div>
    <div class="campo"><label>Motivo (obrigatorio)</label>
      <textarea id="r-motivo" placeholder="Por que o prazo mudou"></textarea></div>
    <label class="marcador"><input type="checkbox" id="r-avisar" checked> Avisar coordenador e gestão</label>`, `
    <button class="botao secundario" onclick="abrirAtividade(${jsArg(id)})">Voltar</button>
    <button class="botao" onclick="agir('remarcar',{id:${jsArg(id)},prazo:val('r-data'),motivo:val('r-motivo'),avisar:marcado('r-avisar')},'Prazo remarcado')">Remarcar</button>`);
}

/*
 * Vagas do mes: os treinamentos (TRE) e tambem as vagas de outras rotinas
 * AVULSAS ainda sem data. Estas eram geradas, contavam como pendentes e
 * nunca apareciam — nao havia onde agenda-las.
 */
function vagasDoMes(d) { return [].concat(d.treinamentos || [], d.naoAgendadas || []); }

function formTreinamento(id) {
  const a = todasAtividades().find((x) => x.id === id);
  // A lista "Treinamentos e vagas" tem tambem vagas avulsas de outros tipos.
  const tre = String(a.tipo || '').toUpperCase() === 'TRE';
  abrirJanela(tre ? 'Agendar treinamento' : 'Agendar atividade', `
    <div class="campo"><label>${tre ? 'Tema' : 'Atividade'}</label>
      <input id="t-atividade" value="${esc(a.atividade)}"></div>
    <div class="campo"><label>Data</label>
      <input type="date" id="t-data" value="${esc(a.prazoISO || '')}"></div>
    <div class="campo"><label>Turno</label>
      <select id="t-turno">
        ${['Todos', 'A', 'B', 'C'].map((x) => `<option ${x === (a.turno || 'Todos') ? 'selected' : ''}>${x}</option>`).join('')}
      </select></div>
    <p class="dica">Ao salvar, ${tre ? 'os três coordenadores' : 'o coordenador do turno'} e a gestão recebem o aviso.</p>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('agendarTreinamento',{id:${jsArg(id)},prazo:val('t-data'),atividade:val('t-atividade'),turno:val('t-turno')},${jsArg(tre ? 'Treinamento agendado' : 'Atividade agendada')})">Agendar</button>`);
}

/*
 * ENTREGA EM PDF — varias fotos/arquivos viram um PDF unico.
 *
 * Passo a passo, para nao estourar o limite de tamanho de uma chamada:
 *   1. o servidor cria uma pasta temporaria (iniciarEntrega)
 *   2. cada arquivo sobe sozinho (receberParte)
 *   3. o servidor junta tudo num PDF, arquiva e avisa (finalizarEntrega)
 */
function listarEscolhidos() {
  const fs = el('a-arquivos').files;
  const lista = el('a-lista'), botao = el('a-enviar');
  if (!fs.length) { lista.innerHTML = ''; botao.style.display = 'none'; return; }
  let html = '';
  for (let i = 0; i < fs.length; i++) {
    const mb = (fs[i].size / 1048576).toFixed(1);
    html += `<div class="item-envio"><span>${esc(fs[i].name)}</span><span class="item-mb">${mb} MB</span></div>`;
  }
  lista.innerHTML = html;
  botao.style.display = '';
  botao.textContent = fs.length > 1 ? `Gerar PDF com ${fs.length} arquivos e enviar` : 'Gerar PDF e enviar entrega';
}

const lerBase64 = (arquivo) => new Promise((ok, erro) => {
  const r = new FileReader();
  r.onload = () => ok(r.result.split(',')[1]);
  r.onerror = () => erro(new Error('Não consegui ler ' + arquivo.name));
  r.readAsDataURL(arquivo);
});

async function enviarEntrega(id) {
  const fs = el('a-arquivos').files;
  if (!fs.length) return;
  const botao = el('a-enviar');
  botao.disabled = true;
  try {
    avisar('Preparando envio…');
    const inicio = await executarAcaoSrv('iniciarEntrega', { id: id });
    const pasta = inicio.pasta;

    for (let i = 0; i < fs.length; i++) {
      botao.textContent = `Enviando ${i + 1} de ${fs.length}…`;
      const b64 = await lerBase64(fs[i]);
      await executarAcaoSrv('receberParte', { pasta: pasta, indice: i, nome: fs[i].name, mime: fs[i].type, b64: b64 });
    }

    botao.textContent = 'Montando o PDF — aguarde…';
    /*
     * O BUG DA ENTREGA DO COORDENADOR — "r is not defined".
     *
     * Esta linha foi copiada do agir(), onde `r` e a resposta do
     * servidor. Aqui `r` nunca existiu: a chamada acima jogava a
     * resposta fora. Resultado: a entrega ia ao Drive, o PDF era
     * montado, o status virava "Aguard. valid." — e SO ENTAO o
     * ReferenceError estourava, caia no catch e o coordenador via um
     * erro tecnico numa entrega que tinha dado certo. Muita gente
     * enviou duas e tres vezes por causa disto.
     */
    const feito = await executarAcaoSrv('finalizarEntrega', { id: id, pasta: pasta });

    // Acoes globais (parametros, perfis) mudam TODAS as telas: nesses
    // casos o cache inteiro cai, senao outra tela mostra dado velho.
    if (feito && feito.invalidarTudo) esquecerTelas();
    else { esquecerTela(paginaAtual); envelhecerTelas(); }
    fecharJanela();
    if (feito && feito.avisoEmail) avisar(feito.avisoEmail, true);
    else avisar(feito && feito.arquivos
      ? `Entrega enviada (${feito.arquivos} arquivo(s)) — gestão avisada`
      : 'Entrega enviada em PDF — gestão avisada');
    await abrir(paginaAtual, paramsAtual);
  } catch (e) {
    botao.disabled = false;
    listarEscolhidos();
    avisar(e.message || e, true);
  }
}

async function baixar(idArquivo) {
  avisar('Preparando download…');
  try {
    const f = await chamar('obterAnexo', ctx(), idArquivo);
    const link = document.createElement('a');
    link.href = 'data:' + f.tipo + ';base64,' + f.dados;
    link.download = f.nome; link.click();
  } catch (e) { avisar(e.message || e, true); }
}

/* ================= ASSIDUIDADE =================
   Três abas, e só três:
     PAINEL        — os números da competência escolhida + a tendência
                     contínua, que atravessa todas as competências
     COLABORADORES — a lista individual e os quadros que a tela de
                     Ranking mostrava (ela deixou de existir: era a
                     mesma informação em dois lugares)
     PERÍODO       — consulta por intervalo de datas, contínua, sem
                     quebra na virada de uma competência para a outra

   A aba ANÁLISE saiu. O único quadro dela que dizia algo — a tendência
   mês a mês — virou o gráfico contínuo do Painel.
   ============================================== */
let ABA_RH = 'painel';          // painel | colaboradores | periodo
let COLAB_CACHE = null;         // resposta da aba Colaboradores

function pintarAssiduidade(r) {

    // pessoa nesta tela sem caminho de volta para o mes anterior.
    el('acoes-topo').innerHTML = (d.competencias || []).length > 1 ? `
      <select onchange="abrir('assiduidade',{competencia:this.value})" title="Competência do painel">

    el('pagina').innerHTML = `

            : (d.erroImport
                ? 'Tentei importar a competencia <strong>' + esc(d.competencia) + '</strong> automaticamente, mas deu erro:<br><span style="color:var(--alerta)">' + esc(d.erroImport) + '</span><br><br>Confira em Configuracao se o link e a aba da folha estao certos (a aba costuma ser <b>FOLHA DE PONTO</b>).'
                : 'A competencia <strong>' + esc(d.competencia) + '</strong> está cadastrada, mas a folha ainda nao foi lida.')}
        </p>
        ${d.podeGerir ? (d.semRH
          ? `<button class="botao" onclick="abrir('config')">Ir para Configuração</button>`
          : `<button class="botao" onclick="importar(${jsArg(d.arquivo.id)})">Importar agora</button>
             <button class="botao secundario" onclick="previa(${jsArg(d.arquivo.id)})">Pré-visualizar</button>`)
