let filtroAtivo = null;
let filtroTurno = null;     // 'A' | 'B' | 'C' | ... | null = todos

/*
 * FILTRO POR TURNO — pedido de reuniao.
 *
 * Roda INTEIRO no navegador: os turnos ja vieram junto com as
 * atividades, entao filtrar nao custa nenhuma ida ao servidor (que
 * custa de 1 a 3 segundos por chamada). Trocar de turno e instantaneo.
 *
 * Pastilha com fundo e contagem, nao link discreto: "olhou, viu".
 */
function tiraDeTurnos(atividades) {
  const lista = atividades || [];
  if (!lista.length) return '';

  const contagem = {};
  lista.forEach((a) => {
    const t = String(a.turno || 'Todos');
    contagem[t] = (contagem[t] || 0) + 1;
  });

  const turnos = Object.keys(contagem).sort();
  if (turnos.length < 2) return '';   // um turno so: a tira nao serve para nada

  const pastilha = (chave, rotulo, n) => `
    <button class="pastilha-turno ${filtroTurno === chave ? 'ativa' : ''}"
            data-turno-filtro="${esc(chave)}" onclick="alternarTurno(${chave === null ? 'null' : jsArg(chave)})">
      ${esc(rotulo)}<span class="pastilha-conta">${n}</span></button>`;

  return `
    <div class="tira-turnos">
      <span class="tira-rotulo">Turno</span>
      ${pastilha(null, 'Todos', lista.length)}
      ${turnos.map((t) => pastilha(t, t === 'Todos' ? 'Geral' : 'Turno ' + t, contagem[t])).join('')}
    </div>`;
}

function alternarTurno(turno) {
  filtroTurno = (filtroTurno === turno) ? null : turno;
  document.querySelectorAll('.pastilha-turno').forEach((b) => {
    const meu = b.dataset.turnoFiltro || '';
    b.classList.toggle('ativa', (filtroTurno === null && meu === '') || meu === filtroTurno);
  });
  aplicarFiltro();
}

// KPI clicavel: ao tocar, ilumina as atividades daquele status no calendario
// e na tabela; tocar de novo desliga. E o filtro pedido.
const kpiFiltro = (valor, rotulo, cor, chave) => `<div class="cartao kpi ${cor} kpi-clicavel"
  data-filtro="${chave}" onclick="alternarFiltro(${jsArg(chave)})">
  <div class="kpi-valor">${esc(valor)}</div><div class="kpi-rotulo">${esc(rotulo)}</div></div>`;

function alternarFiltro(chave) {
  filtroAtivo = (filtroAtivo === chave || chave === 'todas') ? null : chave;
  aplicarFiltro();
}

/*
 * Os DOIS filtros valem ao mesmo tempo: "atrasadas do turno B" e uma
 * pergunta que a gestao faz toda semana. Antes o filtro de status
 * mandava sozinho; agora quem nao passa nos dois fica de fora.
 */
function aplicarFiltro() {
  const pagina = el('pagina');
  document.querySelectorAll('.kpi-clicavel').forEach((k) =>
    k.classList.toggle('kpi-ativo', k.dataset.filtro === filtroAtivo));

  const casaTurno = (elemento) => {
    if (!filtroTurno) return true;
    return String(elemento.dataset.turno || '') === filtroTurno;
  };

  if (!filtroAtivo && !filtroTurno) {
    pagina.classList.remove('filtrando');
    document.querySelectorAll('.pilula.destacada').forEach((p) => p.classList.remove('destacada'));
    document.querySelectorAll('.dia.tem-destaque').forEach((d) => d.classList.remove('tem-destaque'));
    document.querySelectorAll('.tabela-gestao tr.apagada').forEach((r) => r.classList.remove('apagada'));
    return;
  }
  pagina.classList.add('filtrando');

  document.querySelectorAll('.dia.tem-destaque').forEach((d) => d.classList.remove('tem-destaque'));

  // calendario: destaca a pilula que passa nos dois filtros
  document.querySelectorAll('.grade-mes .pilula').forEach((p) => {
    const bate = (!filtroAtivo || p.classList.contains(filtroAtivo)) && casaTurno(p);
    p.classList.toggle('destacada', bate);
    if (bate) { const dia = p.closest('.dia'); if (dia) dia.classList.add('tem-destaque'); }
  });

  // tabela: apaga as linhas que nao batem
  document.querySelectorAll('.tabela-gestao tbody tr').forEach((r) => {
    const et = r.querySelector('.etiqueta');
    const statusOk = !filtroAtivo || (et && et.classList.contains(filtroAtivo));
    r.classList.toggle('apagada', !(statusOk && casaTurno(r)));
  });
}

const kpi = (valor, rotulo, cor) => `<div class="cartao kpi ${cor}">
  <div class="kpi-valor">${esc(valor)}</div><div class="kpi-rotulo">${esc(rotulo)}</div></div>`;

function barra(rotulo, texto, maximo, numero, cor) {
  const n = (numero === undefined) ? Number(texto) : Number(numero);
  const larg = maximo ? Math.max(1, Math.round(n / maximo * 100)) : 0;
  return `<div class="barra-linha">
    <div class="barra-rotulo">${esc(rotulo)}</div>
    <div class="barra-trilho"><div class="barra-preenchida ${cor || ''}" style="width:${larg}%"></div></div>
    <div class="barra-valor">${esc(texto)}</div></div>`;
}

/* ================= PLANO DE AÇÃO =================
   As ações que saem da reunião de turno. O papel do gerente virou tela:

     Ação: Iluminação do Flow — Verificar e acompanhar a iluminação para
     garantir que todas as lâmpadas foram trocadas
     Responsável Hércules — Entregar até dia 25/09

   Quem cria é o gerente. O coordenador vê as do turno dele e conclui as
   que são dele — não há validação, foi o combinado: concluiu, acabou.
   ================================================= */

function pintarAcoes(r) {
  const d = r.dados, p = d.permissoes, f = d.filtro;
  const c = d.contagens;

  el('subtitulo-pagina').textContent =
    `${c.abertas} em aberto · ${c.atrasadas} atrasada(s) · ${c.minhas} sua(s)`;
  el('acoes-topo').innerHTML = p.gerir
    ? `<button class="botao" onclick="formAcao()">+ Nova ação</button>` : '';

  const situacoes = [['ABERTAS', 'Em aberto'], ['ATRASADAS', 'Atrasadas'],
                     ['CONCLUIDAS', 'Concluídas'], ['TODAS', 'Todas']];

  el('pagina').innerHTML = `
    <div class="grade grade-kpi" style="margin-bottom:16px">
      ${kpi(c.abertas, 'Em aberto', 'azul')}
      ${kpi(c.atrasadas, 'Atrasadas', 'vermelho')}
      ${kpi(c.minhas, 'Sob sua responsabilidade', 'amarelo')}
      ${kpi(c.concluidas, 'Concluídas', 'verde')}
    </div>

    <div class="cartao" style="margin-bottom:14px">
      <div class="filtros-acao">
        <div class="tira-turnos" style="margin:0">
          <span class="tira-rotulo">Situação</span>
          ${situacoes.map(([id, nome]) => `
            <button class="pastilha-turno ${f.situacao === id ? 'ativa' : ''}"
                    onclick="filtrarAcoes({situacao:${jsArg(id)}})">${nome}</button>`).join('')}
        </div>
        <div class="tira-turnos" style="margin:0">
          <span class="tira-rotulo">Turno</span>
          ${[''].concat(d.turnos).map((t) => `
            <button class="pastilha-turno ${String(f.turno || '').toUpperCase() === String(t).toUpperCase() ? 'ativa' : ''}"
                    onclick="filtrarAcoes({turno:${jsArg(t)}})">${t === '' ? 'Todos' : t === 'Todos' ? 'Geral (CD)' : esc(t)}</button>`).join('')}
        </div>
        <div class="busca-caixa">
          <span class="busca-lupa" aria-hidden="true">&#128269;</span>
          <input id="busca-acao" placeholder="Buscar ação, responsável ou origem"
                 value="${esc(f.busca)}"
                 onkeydown="if(event.key==='Enter')filtrarAcoes({busca:this.value})">
        </div>
      </div>
    </div>

    <div class="cartao" style="margin-bottom:14px">
      <div class="cartao-titulo">${d.lista.length} ação(ões)</div>
      ${d.lista.length ? d.lista.map((a) => cartaoAcao(a, p)).join('')
        : '<div class="vazio">Nenhuma ação com estes filtros.</div>'}
    </div>

    ${d.ranking.length ? `
    <div class="cartao">
      <div class="cartao-titulo">Ranking de ações por turno — para as auditorias</div>
      <p class="dica" style="margin:-4px 0 12px">Quantas ações cada turno recebeu e quantas
         fechou. O percentual é de <b>conclusão</b>: propor muito e concluir pouco não é
         desempenho, é fila. Ações canceladas ficam fora da conta.</p>
      <div style="overflow-x:auto">
        <table><thead><tr>
          <th>Turno</th><th class="numero">Propostas</th><th class="numero">Concluídas</th>
          <th class="numero">Em aberto</th><th class="numero">Atrasadas</th><th class="numero">%</th>
        </tr></thead><tbody>
          ${d.ranking.map((l) => `
            <tr>
              <td><strong>${esc(l.turno)}</strong></td>
              <td class="numero">${l.total}</td>
              <td class="numero">${l.concluidas}</td>
              <td class="numero">${l.pendentes}</td>
              <td class="numero">${l.atrasadas ? `<span style="color:var(--alerta)">${l.atrasadas}</span>` : '0'}</td>
              <td class="numero"><strong>${l.percentual}%</strong></td>
            </tr>`).join('')}
        </tbody></table>
      </div>
    </div>` : ''}`;
}

/* Uma ação. O prazo vem antes da descrição: é o que decide a urgência. */
function cartaoAcao(a, p) {
  const minha = a.responsavelEmail === p.email;
  const podeConcluir = a.situacao === 'PENDENTE' && (minha || p.gerir);

  let aviso = '';
  if (a.situacao === 'PENDENTE' && a.dias !== null) {
    if (a.dias < 0) aviso = `<span class="prazo-aviso atraso">${Math.abs(a.dias)} dia(s) em atraso</span>`;
    else if (a.dias === 0) aviso = `<span class="prazo-aviso hoje">vence hoje</span>`;
    else if (a.dias <= 3) aviso = `<span class="prazo-aviso perto">vence em ${a.dias} dia(s)</span>`;
  }

  return `
    <div class="cartao-acao ${classeStatus(a.status)}">
      <div class="acao-topo">
        <div class="acao-titulo">${esc(a.acao)}</div>
        ${etiqueta(a.status)}
      </div>
      ${a.descricao ? `<div class="acao-descricao">${esc(a.descricao)}</div>` : ''}
      <div class="acao-meta">
        <span><b>Responsável:</b> ${esc(a.responsavel || '—')}${minha ? ' <span class="marca-voce">você</span>' : ''}</span>
        <span><b>Entregar até:</b> ${esc(a.prazo || '—')}</span>
        ${a.turno ? `<span><b>Turno:</b> ${esc(a.turno)}</span>` : ''}
        ${aviso}
      </div>
      ${a.origem ? `<div class="acao-origem">Origem: ${esc(a.origem)}</div>` : ''}
      ${a.situacao === 'CONCLUIDA' ? `
        <div class="acao-conclusao">
          Concluída em ${esc((a.concluidoEm || '').slice(0, 16).replace('T', ' '))}
          ${a.observacao ? ` — ${esc(a.observacao)}` : ''}
        </div>` : ''}
      <div class="acao-botoes">
        ${podeConcluir ? `<button class="botao" onclick="formConcluirAcao(${jsArg(a.id)})">Marcar como concluída</button>` : ''}
        ${p.gerir && a.situacao === 'CONCLUIDA' ? `<button class="botao secundario" onclick="agir('reabrirAcao',{id:${jsArg(a.id)}},'Ação reaberta')">Reabrir</button>` : ''}
        ${p.gerir ? `<button class="botao-texto" onclick="formAcao(${jsArg(a.id)})">Editar</button>` : ''}
        ${p.gerir && a.situacao !== 'CANCELADA' ? `<button class="botao-texto" onclick="formCancelarAcao(${jsArg(a.id)})">Cancelar</button>` : ''}
      </div>
    </div>`;
}

function filtrarAcoes(mudanca) {
  const f = (DADOS && DADOS.filtro) || {};
  abrir('acoes', {
    turno: mudanca.turno !== undefined ? mudanca.turno : f.turno,
    situacao: mudanca.situacao !== undefined ? mudanca.situacao : f.situacao,
    busca: mudanca.busca !== undefined ? mudanca.busca : f.busca
  });
}

/* Cadastro. Os campos estão na ordem em que o gerente fala na reunião. */
function formAcao(id) {
  const d = DADOS;
  const a = id ? (d.lista || []).find((x) => x.id === id) : null;

  abrirJanela(a ? 'Editar ação' : 'Nova ação', `
    <p style="margin:0 0 14px;color:var(--tinta-media);line-height:1.7">
      O responsável recebe um e-mail com a ação e o prazo assim que você salvar.
    </p>
    <div class="campo"><label>Ação</label>
      <input id="ac-acao" value="${a ? esc(a.acao) : ''}" placeholder="Ex.: Iluminação do Flow"></div>
    <div class="campo"><label>O que precisa ser feito</label>
      <textarea id="ac-descricao" rows="3"
        placeholder="Ex.: Verificar e acompanhar a iluminação para garantir que todas as lâmpadas foram trocadas">${a ? esc(a.descricao) : ''}</textarea></div>
    <div class="campo"><label>Responsável</label>
      <select id="ac-responsavel">
        <option value="">— escolha —</option>
        ${(d.pessoas || []).map((pe) => `
          <option value="${esc(pe.email)}" ${a && a.responsavelEmail === pe.email ? 'selected' : ''}>
            ${esc(pe.nome)}${pe.turno ? ' · turno ' + esc(pe.turno) : ''}</option>`).join('')}
      </select></div>
    <div class="campo-duplo">
      <div class="campo"><label>Entregar até</label>
        <input type="date" id="ac-prazo" value="${a ? esc(a.prazoISO) : ''}"></div>
      <div class="campo"><label>Turno</label>
        <select id="ac-turno">
          ${(d.turnos || []).map((t) => `<option ${a && a.turno === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
        </select></div>
    </div>
    <div class="campo"><label>Origem (opcional)</label>
      <input id="ac-origem" value="${a ? esc(a.origem) : ''}"
             placeholder="Ex.: Reunião turno A — 05/09"></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    ${a ? `<button class="botao-texto perigo" onclick="excluirAcao(${jsArg(a.id)})">Excluir</button>` : ''}
    <button class="botao" onclick="salvarAcao(${a ? jsArg(a.id) : 'null'})">${a ? 'Salvar' : 'Criar ação'}</button>`);
}

function salvarAcao(id) {
  const params = {
    acao: val('ac-acao'),
    descricao: val('ac-descricao'),
    responsavelEmail: val('ac-responsavel'),
    prazo: val('ac-prazo'),
    turno: val('ac-turno'),
    origem: val('ac-origem')
  };
  if (id) params.id = id;
  agir('salvarAcao', params, id ? 'Ação atualizada' : 'Ação criada — responsável avisado');
}

function excluirAcao(id) {
  abrirJanela('Excluir ação', `
    <p style="line-height:1.7">Isso apaga a ação do plano. Se ela apenas deixou de fazer
       sentido, prefira <b>Cancelar</b> — assim ela some das contagens mas fica no histórico.</p>`, `
    <button class="botao secundario" onclick="formAcao(${jsArg(id)})">Voltar</button>
    <button class="botao perigo" onclick="agir('excluirAcao',{id:${jsArg(id)}},'Ação excluída')">Excluir mesmo assim</button>`);
}

function formConcluirAcao(id) {
  const a = (DADOS.lista || []).find((x) => x.id === id) || {};
  abrirJanela('Concluir ação', `
    <div class="campo"><label>Ação</label><input value="${esc(a.acao || '')}" readonly></div>
    <div class="campo"><label>O que foi feito (opcional)</label>
      <textarea id="cc-obs" rows="3" placeholder="Ex.: 14 lâmpadas trocadas, conferido com o Márcio em 24/09"></textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('concluirAcao',{id:${jsArg(id)},observacao:val('cc-obs')},'Ação concluída')">Concluir</button>`);
}

function formCancelarAcao(id) {
  abrirJanela('Cancelar ação', `
    <div class="campo"><label>Motivo</label>
      <textarea id="ca-motivo" rows="3" placeholder="Por que esta ação não vai mais acontecer"></textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Voltar</button>
    <button class="botao" onclick="agir('cancelarAcao',{id:${jsArg(id)},motivo:val('ca-motivo')},'Ação cancelada')">Cancelar ação</button>`);
}

/* ================= RELATOS DE ERRO =================
   Conversas saiu na 4.2 (projeto para depois). Os relatos de erro, que
   ficavam numa aba da tela Conversas, ganharam tela propria em
   Configuracao › Relatos de erro.
   =================================================== */

function pintarRelatos(r) {
  el('pagina').innerHTML = `<div class="cartao">${blocoFeedback(r.dados || {})}</div>`;
}

/* --- Relatos de erro da plataforma --- */

function blocoFeedback(d) {
  const lista = d.feedbacks || [];
  return `
    <div class="cartao">
      <div class="cartao-titulo">${lista.length} relato(s)</div>
      <p class="dica" style="margin:-4px 0 12px">Chega pelo botão flutuante do canto da tela.
         Cada relato guarda quem reportou, em que tela estava e o navegador — o que faltava
         toda vez que alguém dizia "deu erro" sem dizer onde.</p>
      ${lista.length ? lista.map((f) => `
        <div class="cartao-acao ${f.situacao === 'ABERTO' ? 'atrasada' : 'concluido'}">
          <div class="acao-topo">
            <div class="acao-titulo">${esc(f.tipo)} — ${esc(f.tela || 'tela não informada')}</div>
            <span class="etiqueta ${f.situacao === 'ABERTO' ? 'aguardando' : 'concluido'}">
              ${f.situacao === 'ABERTO' ? 'aberto' : 'resolvido'}</span>
          </div>
          <div class="acao-descricao">${esc(f.texto)}</div>
          <div class="acao-meta">
            <span><b>Quem:</b> ${esc(f.autorNome)}</span>
            <span><b>Quando:</b> ${esc((f.quando || '').slice(0, 16).replace('T', ' '))}</span>
          </div>
          ${f.resposta ? `<div class="acao-conclusao">Resposta: ${esc(f.resposta)}</div>` : ''}
          ${f.situacao === 'ABERTO' ? `
            <div class="acao-botoes">
              <button class="botao" onclick="formResolverFeedback(${jsArg(f.id)})">Marcar como resolvido</button>
            </div>` : ''}
        </div>`).join('') : '<div class="vazio">Nenhum relato. Bom sinal.</div>'}
    </div>`;
}

function formResolverFeedback(id) {
  abrirJanela('Resolver relato', `
    <div class="campo"><label>O que foi feito</label>
      <textarea id="fb-resposta" rows="3" placeholder="Quem reportou recebe esta resposta por e-mail"></textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('resolverFeedback',{id:${jsArg(id)},resposta:val('fb-resposta')},'Relato resolvido')">Resolver</button>`);
}

/* --- O botão de reportar erro, disponível em qualquer tela --- */

function formFeedback() {
  abrirJanela('Reportar um problema', `
    <p style="margin:0 0 14px;color:var(--tinta-media);line-height:1.7">
      Conte o que aconteceu. O administrador recebe na hora, junto com a tela em que você
      está e os dados do navegador — você não precisa explicar nada disso.
    </p>
    <div class="campo"><label>Tipo</label>
      <select id="fb-tipo">
        <option value="ERRO">Erro — alguma coisa não funcionou</option>
        <option value="SUGESTAO">Sugestão — poderia ser melhor assim</option>
        <option value="DUVIDA">Dúvida — não sei como fazer</option>
      </select></div>
    <div class="campo"><label>O que aconteceu</label>
      <textarea id="fb-texto" rows="4"
        placeholder="Ex.: cliquei em Enviar entrega e apareceu uma mensagem vermelha escrita 'r is not defined'"></textarea></div>`, `
    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="enviarFeedback()">Enviar</button>`);
}

function enviarFeedback() {
  agir('enviarFeedback', {
    tipo: val('fb-tipo'),
    texto: val('fb-texto'),
    tela: paginaAtual,
    navegador: navigator.userAgent
  }, 'Recebi. Obrigado por avisar.');
}

function classeStatus(s) {
  if (s === 'Aprovada') return 'aprovada';
  if (s === 'Aguard. valid.') return 'aguardando';
  if (s === 'Atrasada') return 'atrasada';
  if (s === 'Reprovada') return 'reprovada';
  if (s === 'Cancelada') return 'cancelada';
  // Plano de acao: a acao nao passa por validacao, entao ela conclui.
  if (s === 'Concluída' || s === 'Concluida') return 'concluido';
  return 'pendente';
}
const etiqueta = (s) => `<span class="etiqueta ${classeStatus(s)}">${esc(s)}</span>`;
</script>
