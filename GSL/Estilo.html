.data-atividade { width: 78px; flex-shrink: 0; }
.data-dia { font-family: var(--fonte-titulo); font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.data-semana { font-size: 11px; color: var(--tinta-fraca); text-transform: uppercase; letter-spacing: .05em; }
.texto-atividade { flex: 1; min-width: 0; }
.nome-atividade { font-weight: 500; }
.meta-atividade { font-size: 12px; color: var(--tinta-media); margin-top: 3px; }

.vazio { color: var(--tinta-fraca); font-size: 13px; padding: 24px 12px; text-align: center; }
div.vazio { border: 1px dashed var(--linha-forte); border-radius: 12px; background: var(--superficie-2); line-height: 1.6; }
.cartao div.vazio, .janela div.vazio { background: transparent; }
.erro-caixa {
  background: var(--vermelho-tenue); border: 1px solid rgba(198, 40, 40, .3); border-left: 4px solid var(--alerta); color: #8e1b1b;
  padding: 14px 17px; border-radius: var(--raio); font-size: 13px; line-height: 1.65;
}

/* =========================================================
   JANELA
   ========================================================= */
.fundo-janela {
  position: fixed; inset: 0; z-index: 50; padding: 18px;
  background: rgba(7, 11, 40, .55);
  display: flex; align-items: center; justify-content: center;
  animation: surgir .18s ease;
}
@keyframes surgir { from { opacity: 0; } }
.janela {
  position: relative; overflow: hidden;
  background: var(--superficie);
  border: 1px solid var(--vidro-borda); border-radius: 16px; width: 100%; max-width: 580px;
  max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--sombra-alta);
  animation: subir .22s var(--elastico);
}
/* Filete azul da marca no alto da janela. */
.janela::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--degrade); }
@keyframes subir { from { transform: translateY(12px); opacity: 0; } }
.janela-topo { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 22px 15px; border-bottom: 1px solid var(--linha); }
.janela-topo h2 { color: var(--titulo); font-size: 17px; }
.janela-corpo { padding: 20px 22px; overflow-y: auto; }
.janela-rodape {
  padding: 13px 22px; border-top: 1px solid var(--linha); background: var(--superficie-2);
  display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px;
}
.fechar {
  background: none; border: 1px solid transparent; border-radius: 8px; width: 34px; height: 34px; flex-shrink: 0;
  font-size: 24px; line-height: 1; color: var(--tinta-fraca); cursor: pointer; padding: 0;
}
.fechar:hover { color: var(--tinta); background: var(--superficie-2); border-color: var(--linha); }

/* FORMULARIOS — rotulo em cima (frase, nao caixa alta), campo, ajuda embaixo. */
.campo { margin-bottom: 16px; }
.campo label { display: block; font-size: 12.5px; font-weight: 600; color: var(--tinta); margin-bottom: 6px; }
.campo input, .campo select, .campo textarea { width: 100%; }
.campo textarea { resize: vertical; min-height: 76px; }
.campo-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.marcador { font-size: 13px; display: flex; gap: 9px; align-items: center; color: var(--tinta); }
.marcador input { width: auto; }
.dica { font-size: 12px; color: var(--tinta-fraca); margin: 6px 0 0; line-height: 1.6; }

.anexo { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); font-size: 13px; }
.anexo:last-of-type { border-bottom: 0; }
.anexo-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anexo-tamanho { color: var(--tinta-fraca); font-size: 12px; font-variant-numeric: tabular-nums; }
.selo-anexo {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
  color: var(--azul-vivo); background: var(--azul-tenue); padding: 2px 8px; border-radius: 20px;
}
.area-envio { border: 1px dashed var(--linha-forte); border-radius: var(--raio); padding: 16px; text-align: center; }

/* O recado e so texto: o toque passa para o que esta embaixo (o Cancelar da janela, no celular). */
.recado {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60; pointer-events: none;
  max-width: calc(100vw - 32px);
  background: #141a4f; color: #fff; border-left: 4px solid var(--amarelo);
  padding: 12px 20px 12px 16px; border-radius: 10px; font-size: 13.5px; font-weight: 500; line-height: 1.45;
  box-shadow: 0 16px 40px rgba(7, 11, 40, .35); animation: recado-subir .22s ease;
}
.recado.erro { background: #7f1d1d; border-left-color: #ff8a80; }
@keyframes recado-subir { from { opacity: 0; margin-bottom: -8px; } }

/* =========================================================
   ACESSIBILIDADE E TELAS PEQUENAS
   ========================================================= */
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

@media (max-width: 760px) {
  #aplicacao { flex-direction: column; }
  .lateral { width: 100%; flex-direction: row; align-items: center; padding: 12px 14px; gap: 14px; overflow-x: auto; }
  .marca { padding: 0; }
  .marca-espectro { display: none; }
  .marca-nome { display: none; }
  .menu { flex-direction: row; flex: 1; }
  .item-menu { white-space: nowrap; }
  .rodape-lateral { border-top: 0; padding-top: 0; }
  .usuario-papel { margin-bottom: 0; }
  .usuario-nome, .usuario-papel, .rodape-lateral .botao-texto { display: none; }
  .conteudo { padding: 0 16px 64px; }
  .topo { margin: 0 -16px 16px; padding: 12px 16px 14px; min-height: 0; }
  .topo::after { left: 16px; }
  .topo h1 { font-size: 18px; }
  .menu-secao { margin: 0 4px; padding: 0 8px; border-top: 0; border-left: 1px solid var(--lateral-linha); white-space: nowrap; align-self: center; }
  .voltar-modulos { width: auto; margin: 0; white-space: nowrap; }
  .item-menu { min-height: 36px; padding: 7px 12px; }
  .campo-duplo { grid-template-columns: 1fr; }
  .janela { max-height: 94vh; }
  .grade-modulos { grid-template-columns: 1fr; gap: 10px; }
  /* No celular o cartao do modulo vira uma linha: icone a esquerda, nome e frase a direita. */
  .holocard { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 14px; row-gap: 3px; align-items: start; min-height: 0; padding: 15px 16px; }
  .holo-icone { grid-row: 1 / span 2; width: 44px; height: 44px; margin: 0; border-radius: 12px; }
  .holo-icone svg { width: 22px; height: 22px; }
  .holo-titulo, .holo-frase { grid-column: 2; margin: 0; }
  .holo-titulo { font-size: 16px; }
  .holo-frase { font-size: 12.5px; line-height: 1.5; }
  .holo-pendencia { display: contents; }
  .holo-rodape { display: none; }
  .holo-bolinha { top: 6px; left: 44px; }
  .cartao { padding: 16px; }
  .cartao-titulo { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; }
  .abas { display: flex; flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .aba { flex: 0 0 auto; }
  .espera-cartao { padding: 26px 20px 22px; }
  .barra-linha { grid-template-columns: 68px 1fr 46px; }
  .grade-mes { gap: 3px; }
  .dia { min-height: 62px; padding: 4px; }
  .pilula { font-size: 9px; padding: 2px 4px; }
}

/* =========================================================
   PLANO DE ACAO · CONVERSA · FILTROS
   Tudo aqui segue o principio que o usuario pediu: "olhou, viu".
   Nada de controle discreto — pastilha com fundo, busca com lupa e
   caixa de verdade, botao que parece botao.
   ========================================================= */

/* --- Tira de pastilhas (turno, situacao) --- */
.tira-turnos {
  display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
  margin: 0 0 14px;
}
.tira-rotulo {
  font-size: 11px; font-weight: 700; letter-spacing: .08em;
  text-transform: uppercase; color: var(--tinta-fraca); margin-right: 2px;
}
.pastilha-turno {
  display: inline-flex; align-items: center; gap: 7px; font-family: var(--fonte-titulo);
  border: 1px solid var(--linha-forte); background: var(--superficie);
  color: var(--tinta-media); border-radius: 999px;
  padding: 7px 14px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all .15s ease;
}
.pastilha-turno:hover { border-color: var(--azul-vivo); color: var(--tinta); }
.pastilha-turno.ativa {
  background: var(--azul); border-color: var(--azul); color: #fff;
  box-shadow: 0 2px 8px rgba(17, 23, 133, .2);
}
.pastilha-conta {
  background: rgba(102, 107, 128, .14);
  border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 700;
}
.pastilha-turno.ativa .pastilha-conta { background: rgba(255,255,255,.28); }

/* --- Busca: lupa e caixa de verdade --- */
.busca-caixa { position: relative; display: flex; align-items: center; min-width: 240px; flex: 1; }
.busca-lupa {
  position: absolute; left: 12px; font-size: 14px; opacity: .55; pointer-events: none;
}
.busca-caixa input {
  width: 100%; padding: 10px 12px 10px 36px;
  border: 1px solid var(--linha-forte); border-radius: 10px;
  background: var(--campo); color: var(--tinta); font-size: 14px;
}

.filtros-acao { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }

/* --- Cartao de acao --- */
.cartao-acao {
  border: 1px solid var(--linha); border-left: 4px solid var(--linha);
  border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
  background: var(--superficie);
}
.cartao-acao.atrasada  { border-left-color: var(--alerta); }
.cartao-acao.aguardando{ border-left-color: var(--laranja); }
.cartao-acao.concluido { border-left-color: var(--verde-texto); opacity: .78; }
.cartao-acao.cancelada { border-left-color: var(--tinta-fraca); opacity: .55; }
.cartao-acao.pendente  { border-left-color: var(--azul-vivo); }

/* Com o selo de comentario (e o "@ voce") o topo nao cabe numa linha no celular: os selos descem para
   baixo do titulo em vez de espremer o titulo numa coluna e vazar do cartao (19/10). */
.acao-topo { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 8px 12px; }
.acao-titulo { flex: 1 1 220px; min-width: 0; font-size: 15px; font-weight: 700; color: var(--tinta); line-height: 1.4; }
.acao-descricao { margin-top: 6px; color: var(--tinta-media); line-height: 1.65; font-size: 13.5px; }
.acao-meta {
  display: flex; flex-wrap: wrap; gap: 6px 18px;
  margin-top: 10px; font-size: 12.5px; color: var(--tinta-media);
}
.acao-meta b { color: var(--tinta-fraca); font-weight: 600; }
.acao-origem { margin-top: 6px; font-size: 11.5px; color: var(--tinta-fraca); font-style: italic; }
.acao-conclusao {
  margin-top: 10px; padding: 8px 12px; border-radius: 8px;
  background: var(--verde-tenue); color: var(--verde-texto); font-size: 12.5px; line-height: 1.6;
}
.acao-botoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.marca-voce {
  background: var(--azul-tenue); color: var(--azul-vivo);
  border-radius: 999px; padding: 1px 8px; font-size: 10.5px; font-weight: 700;
}
.prazo-aviso { font-weight: 700; }
.prazo-aviso.atraso { color: var(--alerta); }
.prazo-aviso.hoje   { color: var(--laranja); }
.prazo-aviso.perto  { color: var(--tinta-media); }

/* --- Conversa --- */
.grade-conversa { display: grid; grid-template-columns: 280px 1fr; gap: 14px; align-items: start; }
.painel-conversa { max-height: 620px; overflow-y: auto; }
.painel-fio { display: flex; flex-direction: column; min-height: 420px; }

.linha-pessoa {
  display: block; width: 100%; text-align: left; cursor: pointer;
  border: 1px solid transparent; border-radius: 10px;
  background: transparent; padding: 9px 11px; margin-bottom: 4px;
}
.linha-pessoa:hover { background: var(--superficie-hover); }
.linha-pessoa.ativa {
  background: var(--azul-tenue); border-color: var(--azul-vivo);
}
.pessoa-nome {
  display: flex; align-items: center; gap: 7px;
  font-weight: 600; font-size: 13.5px; color: var(--tinta);
}
.pessoa-ultima {
  font-size: 11.5px; color: var(--tinta-fraca); margin-top: 2px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.bolha-nao-lida {
  background: var(--alerta); color: #fff; border-radius: 999px;
  padding: 0 7px; font-size: 10.5px; font-weight: 700; line-height: 17px;
}

.conversa-fio {
  flex: 1; overflow-y: auto; max-height: 380px;
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px; border: 1px solid var(--linha); border-radius: 10px;
  background: var(--superficie-2);
}
.balao {
  max-width: 82%; align-self: flex-start;
  background: var(--fundo-cartao, rgba(255,255,255,.9));
  border: 1px solid var(--linha); border-radius: 12px 12px 12px 3px;
  padding: 8px 12px;
}
.balao.minha {
  align-self: flex-end; border-radius: 12px 12px 3px 12px;
  background: var(--azul-tenue); border-color: rgba(30, 39, 168, .25);
}
.balao-autor { font-size: 11px; font-weight: 700; color: var(--azul-vivo); margin-bottom: 3px; }
.balao-texto { font-size: 13.5px; line-height: 1.6; color: var(--tinta); white-space: pre-wrap; }
.balao-link { display: block; margin-top: 5px; font-size: 12.5px; color: var(--azul-vivo); word-break: break-all; }
.balao-anexo {
  display: inline-flex; align-items: center; gap: 6px; margin-top: 6px;
  font-size: 12.5px; color: var(--azul-vivo); text-decoration: none;
  border: 1px solid var(--linha); border-radius: 8px; padding: 4px 9px;
}
.balao-hora { font-size: 10.5px; color: var(--tinta-fraca); margin-top: 4px; text-align: right; }

.conversa-form { margin-top: 10px; }
.conversa-form textarea {
  width: 100%; border: 1px solid var(--linha); border-radius: 10px;
  padding: 10px 12px; font-size: 14px; font-family: inherit;
  background: var(--fundo-campo, rgba(255,255,255,.8)); color: var(--tinta); resize: vertical;
}
.conversa-extras { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.conversa-extras input {
  flex: 1; min-width: 180px; padding: 9px 12px;
  border: 1px solid var(--linha); border-radius: 10px;
  background: var(--fundo-campo, rgba(255,255,255,.8)); color: var(--tinta); font-size: 13px;
}

/* --- Botao de reportar erro, flutuante --- */
.botao-feedback {
  position: fixed; right: 18px; bottom: 18px; z-index: 40;
  display: inline-flex; align-items: center; gap: 7px;
  border: 1px solid var(--linha-forte); border-radius: 10px;
  background: var(--superficie); color: var(--tinta-media);
  padding: 8px 14px; font-family: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer; box-shadow: 0 6px 18px rgba(14, 20, 51, .12);
  transition: color .15s ease, border-color .15s ease;
}
.botao-feedback:hover { color: #a52019; border-color: var(--alerta); }
[data-tema="escuro"] .botao-feedback:hover { color: #ff9a90; }

.botao.perigo { background: #b3261e; border-color: #b3261e; color: #fff; }
.botao.perigo:hover { background: #8e1b1b; border-color: #8e1b1b; }
.botao-texto.perigo { color: var(--alerta); }

@media (max-width: 860px) {
  .grade-conversa { grid-template-columns: 1fr; }
  .painel-conversa { max-height: 260px; }
  .balao { max-width: 92%; }
  .botao-feedback { right: 12px; bottom: 12px; padding: 8px 13px; font-size: 11.5px; }
}

/* =========================================================
   IDENTIDADE — o novo login
   A tela precisa responder tres perguntas sem que ninguem pergunte:
   quem eu sou, se o sistema tem certeza disso, e o que fazer se nao.
   ========================================================= */

.cartao-conta {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border: 1px solid var(--linha); border-radius: 12px;
  padding: 14px 18px; margin: 4px auto 18px; max-width: 380px;
  background: var(--superficie-2);
}
.conta-rotulo {
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--tinta-fraca);
}
.cartao-conta strong {
  font-size: 15px; color: var(--tinta); word-break: break-all; text-align: center;
}

.selo-verificado {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; color: var(--verde-texto);
}
.selo-nao-verificado {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 600; color: var(--laranja);
}

.usuario-conta { margin-top: 6px; word-break: break-all; line-height: 1.5; }

.aviso-identidade {
  border-left: 4px solid var(--laranja); background: var(--laranja-tenue);
  border-radius: 0 10px 10px 0; padding: 12px 16px; margin: 0 auto 18px;
  max-width: 460px; text-align: left; line-height: 1.65; font-size: 13px;
  color: var(--tinta-media);
}
.aviso-identidade strong { display: block; margin-bottom: 5px; color: var(--laranja-escuro); }

/* Campo que virou informacao: nao parece editavel, porque nao e. A --tinta a 6%,
   em rgba: o Chrome 109 do CD nao tem color-mix e jogava fora a regra inteira. */
input.travado {
  background: rgba(15, 23, 42, .06) !important;
  color: var(--tinta-media) !important; cursor: default;
}
[data-tema="escuro"] input.travado { background: rgba(248, 250, 252, .06) !important; }

/* --- O botao de entrar com o Google ---
   Segue a especificacao visual do Google: fundo branco, texto escuro,
   a marca a esquerda. Nao inventar aqui e o que faz a pessoa reconhecer
   o botao antes de ler. */
.botao-google {
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; padding: 13px 20px;
  background: #fff; color: #3c4043;
  border: 1px solid #dadce0; border-radius: 10px;
  font-size: 15px; font-weight: 600; font-family: inherit;
  cursor: pointer; transition: box-shadow .15s ease, background .15s ease;
}
.botao-google:hover { background: #f8f9fa; box-shadow: 0 1px 6px rgba(60,64,67,.28); }
.botao-google:active { background: #f1f3f4; }
.botao-google .g-marca { display: inline-flex; align-items: center; }

[data-tema="escuro"] .botao-google {
  background: #1f2233; color: #e8eaed; border-color: #3c4152;
}
[data-tema="escuro"] .botao-google:hover { background: #262a3d; }
.ac-pessoas { max-height: 220px; overflow-y: auto; border: 1px solid var(--linha); border-radius: 10px; padding: 8px 10px; margin-top: 6px; }
.ac-pessoas .marcador { display: flex; margin: 4px 0; }
.ficha-periodo { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: flex-end; margin: 4px 0 6px; }
.ficha-periodo .campo { margin: 0; } .ficha-periodo input[type=date] { width: auto; }
.ficha-atalhos { display: flex; gap: 6px; flex-wrap: wrap; }
.ficha-tiles-tipos { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.ficha-ausencias td, .ficha-ausencias th { padding: 6px 8px; }
.ficha-ausencias .ponto { display: inline-block; width: 8px; height: 8px; border-radius: 50%; vertical-align: middle; }
.menu-secao { margin: 18px 4px 6px; padding: 14px 8px 0; font-family: var(--fonte-titulo); font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .55); border-top: 1px solid var(--lateral-linha); }
.acao-andamento { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 8px; font-size: 13px; }
