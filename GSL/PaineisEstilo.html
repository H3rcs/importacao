<style>
/* =========================================================
   PAINEIS NOVOS — filiais, nobreaks, limpeza e quadro do CD.
   Usa as mesmas variaveis do Estilo (claro e escuro).
   ========================================================= */
:root { --gsl-paineis-estilo: '2026.10.14b'; }   /* carimbo da entrega (conferirVersao no App.html) */

/* ---- barra lateral: filial em uso ---- */
.filial-atual {
  margin: 0 0 14px; padding: 10px 12px; border-radius: 12px;
  background: var(--lateral-realce); color: #fff; font-size: 13px;
  display: flex; flex-direction: column; gap: 2px;
}
.filial-atual:empty { display: none; }
.filial-atual .filial-rotulo {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--lateral-tinta);
}
.filial-atual .botao-texto { color: #fff; text-align: left; padding: 4px 0 0; font-size: 12px; text-decoration: underline; }

/* ---- celular: a barra lateral vira faixa no topo ----
   Ela tinha altura de tela inteira tambem no celular e cobria o conteudo. */
@media (max-width: 760px) {
  .lateral { height: auto; z-index: 30; flex-wrap: nowrap; }
  .filial-atual { margin: 0; flex-shrink: 0; padding: 6px 10px; }
  .filial-atual strong { white-space: nowrap; }
  .usuario-conta { display: none; }
  .nb-medidas b { font-size: 13.5px; }
  .pn-grade.duas, .pn-grade.tres { grid-template-columns: 1fr; }
}

/* ---- escolha de filial ---- */
.grade-filiais { max-width: 900px; margin-top: 18px; }
.cartao-filial { text-decoration: none; min-height: 210px; }
.cartao-filial.ultima { border-color: var(--cor); box-shadow: var(--sombra-alta), 0 0 50px -24px var(--cor); }
.holo-frase.pequena { font-size: 11.5px; margin-top: 6px; opacity: .85; }

/* ---- holocards novos e painel oculto ---- */
.holocard.ciano { --cor: #06B6D4; --par: #22D3EE; }
.holocard.painel-oculto { border-style: dashed; }
.selo-oculto {
  position: absolute; top: 14px; right: 14px; z-index: 2;
  font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 10px; border-radius: 999px; background: var(--amarelo-tenue); color: var(--laranja-escuro);
  border: 1px dashed var(--laranja);
}
.grade-modulos > .holocard:nth-child(5) { animation-delay: .28s; }
.grade-modulos > .holocard:nth-child(6) { animation-delay: .35s; }
.grade-modulos > .holocard:nth-child(7) { animation-delay: .42s; }

.lista-marcadores label.marcador { text-transform: none; letter-spacing: 0; font-size: 13px; font-weight: 500;
  color: var(--tinta); margin: 0; display: flex; }
.lista-marcadores { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
  border: 1px solid var(--linha); border-radius: 10px; background: var(--vidro-alto); }

/* ---- pecas comuns ---- */
.pn-barras-largas .barra-linha { grid-template-columns: minmax(150px, 38%) 1fr 70px; }
.pn-barras-largas .barra-rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kpi.compacto .kpi-valor { font-size: 28px; letter-spacing: -.02em; white-space: nowrap; }
.kpi .kpi-sub { font-size: 12px; color: var(--tinta-fraca); margin-top: 6px; }
tr.lp-atrasada td:first-child { padding-left: 10px; }
.barra-preenchida.amarela { background: linear-gradient(90deg, var(--neon-ambar), var(--neon-rosa)); }
.barra-preenchida.azul { background: linear-gradient(90deg, var(--neon-ciano), var(--azul-vivo)); }
.pn-grade { display: grid; gap: 14px; }
.pn-grade.duas { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
.pn-grade.tres { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
/* Quatro itens (o "Como funciona" de Filiais e paineis): 4 lado a lado, 2 e 2 ou um embaixo do outro — nunca 3 e 1 sobrando. */
.pn-grade.quatro { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1280px) { .pn-grade.quatro { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) { .pn-grade.quatro { grid-template-columns: 1fr; } }
.pn-linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.pn-linha .campo { margin-bottom: 0; }
.pn-chip {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700;
  padding: 3px 10px; border-radius: 999px; white-space: nowrap;
}
.pn-chip::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pn-chip.ok      { background: var(--verde-tenue); color: var(--verde); }
.pn-chip.alerta  { background: var(--alerta-tenue); color: var(--alerta); }
.pn-chip.atencao { background: var(--laranja-tenue); color: var(--laranja-escuro); }
.pn-chip.neutro  { background: var(--linha); color: var(--tinta-media); }
[data-tema="escuro"] .pn-chip.ok { color: #4ADE80; }
[data-tema="escuro"] .pn-chip.atencao { color: var(--laranja); }
.pn-mini { font-size: 12px; color: var(--tinta-fraca); }
.pn-num { font-variant-numeric: tabular-nums; }
.pn-tabela-rolagem { overflow-x: auto; }
.pn-tabela-rolagem table { min-width: 640px; }
.pn-legenda { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--tinta-media); margin: 4px 0 8px; }
.pn-legenda i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.pn-legenda i.tracejada { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }
.pn-vazio-grande { text-align: center; padding: 36px 16px; color: var(--tinta-media); line-height: 1.7; }
.pn-vazio-grande strong { display: block; font-size: 16px; color: var(--tinta); margin-bottom: 6px; }

/* ---- nobreaks ---- */
.nb-cartao { position: relative; }
.nb-topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 12px; }
.nb-codigo { font-family: 'Archivo', sans-serif; font-size: 20px; font-weight: 800; letter-spacing: .02em; }
.nb-carga { display: flex; align-items: baseline; gap: 8px; margin: 4px 0 8px; }
.nb-carga b { font-family: 'Archivo', sans-serif; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.nb-trilho { height: 10px; border-radius: 999px; background: var(--linha); overflow: hidden; margin-bottom: 14px; position: relative; }
.nb-trilho span { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--neon-verde), var(--neon-ciano)); }
.nb-trilho span.alto { background: linear-gradient(90deg, var(--neon-ambar), var(--alerta)); }
.nb-trilho i { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--alerta); opacity: .7; }
.nb-medidas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; border-radius: 10px; overflow: hidden;
  background: var(--linha); border: 1px solid var(--linha); }
.nb-medidas div { background: var(--vidro-alto); padding: 8px 10px; }
.nb-medidas span { display: block; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-fraca); }
.nb-medidas b { font-size: 15px; font-variant-numeric: tabular-nums; }
.nb-medidas .entrada span { color: #2563EB; }
.nb-medidas .saida span { color: var(--verde); }
[data-tema="escuro"] .nb-medidas .entrada span { color: #7C8BFF; }
[data-tema="escuro"] .nb-medidas .saida span { color: #4ADE80; }
.nb-medidas b.fora { color: var(--alerta); }
.nb-motivos { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--alerta); line-height: 1.6; }

/* grade de lancamento: a folha de papel na tela */
.nb-folha { border-collapse: separate; border-spacing: 0; min-width: 980px; font-size: 13px; }
.nb-folha th { position: sticky; top: 0; z-index: 1; background: var(--fundo); text-align: center; padding: 8px 4px; }
.nb-folha th.entrada { color: #2563EB; border-bottom: 3px solid #3B82F6; }
.nb-folha th.saida { color: var(--verde); border-bottom: 3px solid var(--verde); }
.nb-folha td { padding: 3px 3px; border-bottom: 1px solid var(--linha); vertical-align: middle; text-align: center; }
.nb-folha tr.novo-dia td { border-top: 2px solid var(--linha-forte); }
.nb-folha td.nb-dia { text-align: left; font-weight: 700; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--tinta-media); white-space: nowrap; padding-right: 8px; }
.nb-folha td.nb-dia small { display: block; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--tinta-fraca); }
.nb-folha input { width: 76px; padding: 7px 6px; text-align: right; font-variant-numeric: tabular-nums; }
.nb-folha input.hora { width: 72px; text-align: center; }
.nb-folha input.oc { width: 170px; text-align: left; }
.nb-folha input.alterado { border-color: var(--azul-vivo); background: var(--azul-tenue); }
.nb-folha td.carga { font-weight: 700; font-variant-numeric: tabular-nums; min-width: 58px; }
.nb-folha td.carga.alta { color: var(--alerta); }
.nb-folha tr.hoje td.nb-dia { color: var(--azul-vivo); }
.nb-folha input.hora.invalida { border-color: var(--alerta); background: rgba(198, 40, 40, .08); }
.nb-historico td { padding: 7px 8px; }
.nb-historico td.numero { text-align: right; font-variant-numeric: tabular-nums; }
.nb-historico td.nb-fora { color: var(--alerta); font-weight: 700; }
.nb-historico td.nb-oc { text-align: left; max-width: 260px; white-space: normal; color: var(--tinta-media); }
.nb-historico .nb-cod { display: block; color: var(--tinta); font-size: 13px; letter-spacing: 0; }

/* ---- limpeza ---- */
.ll-tabela { width: 100%; margin: 6px 0 8px; } .ll-tabela td { padding: 3px 4px; } .ll-tabela th { font-size: 11px; text-align: left; }
.ll-tabela .ll-prod { width: 100%; min-width: 180px; }
/* Estoque de TI: alerta de estoque minimo, busca grande e botoes de entrada/saida. */
.est-alerta { background: rgba(214, 69, 65, .10); border: 1.5px solid var(--alerta, #d64541); color: var(--tinta, inherit);
  border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; line-height: 1.6; cursor: pointer; }
.est-busca-grande { display: block; margin-bottom: 12px; }
.est-busca-grande input { width: 100%; font-size: 16px; padding: 12px 14px; }
.est-linha-alerta td:first-child { box-shadow: inset 4px 0 0 var(--alerta, #d64541); }
.botao.est-mais, .botao.est-menos { padding: 6px 12px; font-size: 13px; min-height: 0; }
.lp-filtros { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.lp-filtro { border: 1.5px solid var(--linha-forte); background: var(--vidro-alto); color: var(--tinta-media);
  border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
.lp-filtro.ativo { background: var(--azul); border-color: var(--azul); color: #fff; }
.lp-filtro b { font-variant-numeric: tabular-nums; margin-left: 4px; }
.lp-crit { font-weight: 700; font-size: 12px; }
.lp-crit.Alta { color: var(--alerta); }
.lp-crit.Média { color: var(--laranja-escuro); }
[data-tema="escuro"] .lp-crit.Média { color: var(--laranja); }
.lp-crit.Baixa { color: var(--tinta-media); }
tr.lp-atrasada td:first-child { box-shadow: inset 3px 0 0 var(--alerta); }
.lp-problema { font-weight: 600; }
.lp-sub { font-size: 12px; color: var(--tinta-fraca); margin-top: 2px; }

/* =========================================================
   QUADRO DO CD — o BI de funcoes, com o visual original.
   Tudo com prefixo bq- para nao brigar com as classes do GSL.
   ========================================================= */
.bi-quadro {
  --bq-surface: var(--vidro-alto); --bq-surface-2: rgba(99, 102, 241, .07);
  --bq-linha: var(--linha-forte); --bq-ink: var(--tinta); --bq-ink-2: var(--tinta-media); --bq-ink-3: var(--tinta-fraca);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --tarja-amarela: #f5b301;
  --bom: #0ca30c; --atencao: #fab219; --grave: #d03b3b;
  --seq-1: #e7f0fc; --seq-2: #c9defa; --seq-3: #9ec5f4; --seq-4: #6da7ec; --seq-5: #256abf; --seq-ink: #0d366b; --seq-ink-5: #ffffff;
  --bq-r: 12px;
  font-size: 14px;
}
[data-tema="escuro"] .bi-quadro {
  --bq-surface-2: rgba(255, 255, 255, .06);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --seq-1: #16233a; --seq-2: #1b3357; --seq-3: #204478; --seq-4: #25599f; --seq-5: #5598e7; --seq-ink: #cde2fb; --seq-ink-5: #0b1220;
}
.bi-quadro .bq-num { font-variant-numeric: tabular-nums; }
.bi-quadro .bq-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 14px; background: var(--bq-surface);
  border: 1px solid var(--bq-linha); border-radius: var(--bq-r); padding: 14px 16px; margin: 4px 0 18px; box-shadow: var(--sombra); }
.bi-quadro .bq-campo { display: flex; flex-direction: column; gap: 6px; }
.bi-quadro .bq-rot { font-family: 'Archivo', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .11em;
  text-transform: uppercase; color: var(--bq-ink-2); }
.bi-quadro .bq-pills { display: flex; gap: 6px; flex-wrap: wrap; }
.bi-quadro .bq-pill { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13px; padding: 8px 15px; border-radius: 8px;
  border: 1.5px solid var(--bq-linha); background: var(--bq-surface-2); color: var(--bq-ink-2); cursor: pointer; }
.bi-quadro .bq-pill[aria-pressed="true"] { background: var(--bq-ink); border-color: var(--bq-ink); color: var(--vidro-alto); }
.bi-quadro select { min-width: 230px; }
.bi-quadro .bq-busca input { width: 250px; }
.bi-quadro .bq-limpar { margin-left: auto; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13px; color: var(--s1);
  background: none; border: none; cursor: pointer; padding: 9px 4px; text-decoration: underline; }
.bi-quadro .bq-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
.bi-quadro .bq-kpi { background: var(--bq-surface); border: 1px solid var(--bq-linha); border-radius: var(--bq-r); padding: 14px 16px;
  box-shadow: var(--sombra); border-top: 3px solid var(--s1); }
.bi-quadro .bq-kpi:nth-child(2) { border-top-color: var(--s3); }
.bi-quadro .bq-kpi:nth-child(3) { border-top-color: var(--tarja-amarela); }
.bi-quadro .bq-kpi:nth-child(4) { border-top-color: var(--bq-ink-2); }
.bi-quadro #bqMov .bq-kpi:nth-child(2) { border-top-color: var(--s2); }
.bi-quadro .bq-kpi .bq-rot { display: block; margin-bottom: 4px; }
.bi-quadro .bq-kpi b { display: block; font-family: 'Archivo', sans-serif; font-size: 33px; font-weight: 700; line-height: 1.05;
  font-variant-numeric: tabular-nums; }
.bi-quadro .bq-kpi small { display: block; color: var(--bq-ink-2); font-size: 12px; margin-top: 3px; }
.bi-quadro .bq-grade { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; align-items: stretch; }
.bi-quadro .bq-grade > * { min-width: 0; }
.bi-quadro .bq-card { background: var(--bq-surface); border: 1px solid var(--bq-linha); border-radius: var(--bq-r);
  padding: 16px 18px 18px; box-shadow: var(--sombra); }
.bi-quadro .bq-card h2 { font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 600; margin: 0; }
.bi-quadro .bq-card .bq-sub { color: var(--bq-ink-2); font-size: 12px; margin: 2px 0 14px; }
.bi-quadro .bq-barra { display: grid; grid-template-columns: 190px 1fr 46px; align-items: center; gap: 10px; padding: 5px 0; }
.bi-quadro .bq-barra.clicavel { cursor: pointer; }
.bi-quadro .bq-barra.clicavel:hover .bq-nm { text-decoration: underline; }
.bi-quadro .bq-barra.escolhida .bq-nm { font-weight: 700; color: var(--s2); }
.bi-quadro .bq-nm { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bi-quadro .bq-trilho { display: block; height: 16px; background: var(--bq-surface-2); border-radius: 4px; overflow: hidden; }
.bi-quadro .bq-fill { display: block; height: 100%; background: var(--s1); border-radius: 4px; }
.bi-quadro .bq-vl { text-align: right; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.bi-quadro .bq-stack { display: flex; gap: 2px; height: 38px; border-radius: 6px; overflow: hidden; margin: 6px 0 12px; }
.bi-quadro .bq-stack div { display: flex; align-items: center; justify-content: center; color: #fff;
  font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13px; }
.bi-quadro .bq-leg { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--bq-ink-2); }
.bi-quadro .bq-leg span { display: flex; align-items: center; gap: 6px; }
.bi-quadro .bq-leg i { width: 11px; height: 11px; border-radius: 3px; display: block; }
.bi-quadro .bq-rolagem { overflow-x: auto; }
.bi-quadro table { border-collapse: collapse; width: 100%; font-size: 13px; }
.bi-quadro th, .bi-quadro td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--bq-linha); white-space: nowrap; }
.bi-quadro th { font-family: 'Archivo', sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
  color: var(--bq-ink-2); background: var(--bq-surface-2); position: sticky; top: 0; cursor: pointer; user-select: none; }
.bi-quadro th.n, .bi-quadro td.n { text-align: right; font-variant-numeric: tabular-nums; }
.bi-quadro td.motivo { white-space: normal; min-width: 220px; }
.bi-quadro tbody tr:hover { background: var(--bq-surface-2); }
.bi-quadro .bq-chip { display: inline-block; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 11.5px;
  padding: 2px 9px; border-radius: 5px; color: #fff; }
.bi-quadro .bq-mtz td.c { text-align: center; font-family: 'Archivo', sans-serif; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--seq-ink); }
.bi-quadro .bq-escala { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--bq-ink-2); margin-top: 10px; }
.bi-quadro .bq-escala i { width: 26px; height: 11px; display: block; border-radius: 2px; }
.bi-quadro .bq-meses { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 10px; align-items: end; height: 190px;
  padding-top: 18px; border-bottom: 1px solid var(--bq-linha); }
.bi-quadro .bq-mes { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 4px; }
.bi-quadro .bq-duplas { display: flex; gap: 2px; align-items: flex-end; height: 100%; }
.bi-quadro .bq-duplas span { flex: 1; border-radius: 4px 4px 0 0; min-height: 2px; position: relative; }
.bi-quadro .bq-duplas span b { position: absolute; top: -17px; left: 0; right: 0; text-align: center; font-family: 'Archivo', sans-serif;
  font-size: 11px; font-weight: 600; color: var(--bq-ink-2); }
.bi-quadro .bq-rotmes { text-align: center; font-size: 11px; color: var(--bq-ink-2); text-transform: uppercase; letter-spacing: .05em; padding-top: 6px; }
.bi-quadro .bq-vazio { padding: 34px 10px; text-align: center; color: var(--bq-ink-2); font-size: 13.5px; }
.bi-quadro .bq-rodape { margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--bq-linha); color: var(--bq-ink-2); font-size: 12px; }
.bi-quadro [hidden] { display: none !important; }
.bi-quadro .bq-aviso { background: var(--amarelo-tenue); border-left: 4px solid var(--tarja-amarela); padding: 10px 14px;
  border-radius: 8px; font-size: 13px; margin-bottom: 14px; color: var(--tinta); }
.bi-quadro .bq-grade.desligados { grid-template-columns: minmax(300px, 1fr) 2fr; }
.bi-quadro .bq-compacto .bq-barra { grid-template-columns: minmax(0, 1.3fr) minmax(60px, 1fr) 30px; }
@media (max-width: 900px) {
  .bi-quadro .bq-grade.desligados { grid-template-columns: 1fr; }
  .bi-quadro .bq-kpis { grid-template-columns: repeat(2, 1fr); }
  .bi-quadro .bq-grade { grid-template-columns: 1fr; }
  .bi-quadro .bq-barra { grid-template-columns: 140px 1fr 40px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bi-quadro .bq-fill, .bi-quadro .bq-duplas span { transition: width .25s ease, height .25s ease; }
}

/* ENTRADA (4.2) — e-mail e PIN */
.entrar-caixa { gap: 8px; text-align: left; }
.entrar-rotulo { font-size: 13px; font-weight: 700; color: var(--tinta-media); margin-top: 4px; }
.entrar-confirma { display: flex; flex-direction: column; gap: 8px; }
.entrar-confirma.oculto { display: none; }
.pin-mascara { -webkit-text-security: disc; letter-spacing: .35em; font-size: 18px; }
.pin-mascara::placeholder { letter-spacing: normal; font-size: 14px; }
.entrar-msg { min-height: 1.3em; margin: 2px 0 0; font-weight: 600; line-height: 1.4; }
.entrar-msg.erro { color: var(--vermelho, #C62828); }
.entrar-msg.ok { color: var(--verde, #01973A); }
.entrar-dica { font-size: 12.5px; margin-top: 6px; }

/* =========================================================
   QUADRO DO CD (13/10) — prefixo qd-. Cor = equipe (1° --s1 azul,
   2° --s2 laranja, 3° --s3 verde-agua, ADM --s4 amarelo, CD inteiro
   --qd-cd ardosia, sem turno cinza), so em marcas e sempre ao lado do
   nome escrito — nunca em texto. Estado (--grave, --atencao, --bom) com
   hex fixos nos dois temas, so em icone, borda, fundo leve e contador.
   Sem color-mix nem CSS aninhado (Chrome 109 dos micros com Windows 7).
   A ficha abre na janela do GSL (fora do .bi-quadro), por isso as
   variaveis valem para ela tambem.
   ========================================================= */
.bi-quadro, .qd-ficha {
  --s4: #eda100; --qd-cd: #475569;
  --s1t: rgba(42, 120, 214, .18); --s2t: rgba(235, 104, 52, .18); --s3t: rgba(27, 175, 122, .18); --s4t: rgba(237, 161, 0, .20);
  --qd-grave-fundo: rgba(208, 59, 59, .10); --qd-atencao-fundo: rgba(250, 178, 25, .16);
}
.qd-ficha { --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --grave: #d03b3b; --atencao: #fab219; --bom: #0ca30c;
  --bq-surface-2: rgba(99, 102, 241, .07); --bq-linha: var(--linha-forte); --bq-ink-2: var(--tinta-media); --bq-ink-3: var(--tinta-fraca); }
[data-tema="escuro"] .bi-quadro, [data-tema="escuro"] .qd-ficha {
  --s4: #c98500; --qd-cd: #94a3b8;
  --s1t: rgba(57, 135, 229, .24); --s2t: rgba(217, 89, 38, .24); --s3t: rgba(25, 158, 112, .24); --s4t: rgba(201, 133, 0, .26);
  --qd-grave-fundo: rgba(208, 59, 59, .20); --qd-atencao-fundo: rgba(250, 178, 25, .14);
}
[data-tema="escuro"] .qd-ficha { --s1: #3987e5; --s2: #d95926; --s3: #199e70; --bq-surface-2: rgba(255, 255, 255, .06); }

:where(.qd) button { font: inherit; color: inherit; }   /* :where = sem peso: .aba, .botao e .qd-pill mantem a fonte delas */
.qd-link { background: none; border: none; padding: 0; color: inherit; cursor: pointer; font: inherit; text-align: left;
  text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--tinta-fraca); }
.qd-link:hover { text-decoration-color: currentColor; }
.qd-fraca { color: var(--tinta-media); }
.bi-quadro.qd-relendo { opacity: .6; pointer-events: none; transition: opacity .15s; }
.qd-ico { flex: none; display: inline-block; vertical-align: -2px; }

/* etiqueta de equipe, selos e etiquetas neutras */
.qd-eq { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 7px; border-radius: 6px; white-space: nowrap;
  background: var(--bq-surface-2); border: 1px solid var(--bq-linha); color: var(--tinta);
  font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 11.5px; line-height: 1.5; }
.qd-eq i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.qd-eq.sem i { background: transparent !important; border: 1.5px solid var(--bq-ink-3); }
.qd-eq em { font-style: italic; font-weight: 500; }
.qd-selo { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px 1px 6px; border-radius: 6px; white-space: nowrap;
  font-size: 11.5px; font-weight: 600; color: var(--tinta); border: 1px solid transparent; line-height: 1.6; }
.qd-selo.grave { background: var(--qd-grave-fundo); border-color: rgba(208, 59, 59, .35); }
.qd-selo.atencao { background: var(--qd-atencao-fundo); border-color: rgba(250, 178, 25, .45); }
.qd-tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap;
  background: var(--bq-surface-2); border: 1px solid var(--bq-linha); color: var(--tinta-media); }

/* contador da aba Conferencia: graves em #d03b3b com o numero em branco (4,8:1); atencao em #fab219 com tinta */
.qd .aba .qd-contador { display: inline-block; margin-left: 4px; padding: 0 7px; border-radius: 99px; font-size: 11.5px; line-height: 1.6;
  font-weight: 700; background: var(--bq-surface-2); color: var(--tinta); }
.qd .aba .qd-contador.grave { background: #d03b3b; color: #fff; }
.qd .aba .qd-contador.atencao { background: #fab219; color: #14152b; }
.qd .aba .qd-contador.ok { background: transparent; color: var(--tinta-fraca); }
.qd .aba.ativa .qd-contador.ok { color: inherit; opacity: .8; }

/* faixa: o quadro esta errado por causa da planilha (ou, informativa, o formato antigo) */
.qd-faixa { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; margin: 0 0 14px;
  padding: 12px 16px; border-radius: var(--bq-r); background: rgba(208, 59, 59, .09); border: 1px solid rgba(208, 59, 59, .30);
  border-left: 4px solid #d03b3b; color: var(--tinta); }
[data-tema="escuro"] .qd-faixa { background: rgba(208, 59, 59, .18); }
.qd-faixa.info, [data-tema="escuro"] .qd-faixa.info { background: var(--bq-surface-2); border-color: var(--bq-linha); border-left-color: var(--bq-linha); }
.qd-faixa-ico { display: flex; align-self: start; padding-top: 2px; color: var(--tinta-media); }
.qd-faixa-ico .qd-ico { width: 18px; height: 18px; }
.qd-faixa-txt { display: flex; flex-wrap: wrap; gap: 2px 8px; line-height: 1.55; font-size: 13px; }
.qd-faixa-txt b { font-family: 'Archivo', sans-serif; font-size: 14px; width: 100%; }
.qd-faixa-txt span + b { margin-top: 6px; }

/* linha de filtros */
.qd-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 16px; margin: 0 0 16px; padding: 12px 14px;
  background: var(--bq-surface); border: 1px solid var(--bq-linha); border-radius: var(--bq-r); box-shadow: var(--sombra); }
.qd-seg { display: flex; flex-wrap: wrap; gap: 6px; }
.qd-pill { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 9px; cursor: pointer;
  border: 1.5px solid var(--bq-linha); background: var(--bq-surface-2); color: var(--tinta); font-family: 'Archivo', sans-serif;
  font-weight: 600; font-size: 13px; }
.qd-pill i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.qd-pill i.sem { background: transparent !important; border: 1.5px solid var(--bq-ink-3); }
.qd-pill .qd-pill-curto { display: none; }
.qd-pill[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--vidro-alto); }
.qd-pill[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--vidro-alto); }
.qd-seg.pequeno .qd-pill { min-height: 32px; padding: 4px 11px; font-size: 12.5px; }
.qd-funcao { display: flex; flex-direction: column; gap: 5px; }
.qd-funcao select { min-width: 240px; max-width: 100%; }
.qd-filtros .bq-limpar { margin-left: auto; }

/* sub-filtros de cada aba */
.qd-sub-filtros { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; margin: -4px 0 16px; }
.qd-busca { display: flex; flex-direction: column; gap: 5px; flex: 1 1 260px; max-width: 340px; }
.qd-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.qd-chip { min-height: 32px; padding: 4px 11px; border-radius: 99px; cursor: pointer; border: 1.5px solid var(--bq-linha);
  background: var(--bq-surface); font-size: 12.5px; font-weight: 600; color: var(--tinta-media); }
.qd-chip b { color: var(--tinta-media); font-weight: 600; margin-left: 2px; }
.qd-chip[aria-pressed="true"] { background: var(--tinta); border-color: var(--tinta); color: var(--vidro-alto); }
.qd-chip[aria-pressed="true"] b { color: inherit; opacity: .75; }
.qd-exportar { display: flex; gap: 8px; margin-left: auto; }

/* regua de cartoes: o CD (heroi) e os quatro turnos */
.qd-regua { display: grid; grid-template-columns: minmax(0, 1.35fr) repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.qd-cartao { display: flex; flex-direction: column; gap: 5px; text-align: left; cursor: pointer; min-width: 0;
  background: var(--bq-surface); border: 1px solid var(--bq-linha); border-radius: var(--bq-r); padding: 14px 16px 15px;
  box-shadow: var(--sombra); border-top: 3px solid var(--qd-cor, var(--qd-cd)); transition: opacity .15s; }
.qd-cartao.cd { --qd-cor: var(--qd-cd); }
.qd-cartao:hover { border-color: var(--tinta-fraca); border-top-color: var(--qd-cor, var(--qd-cd)); }
.qd-cartao.apagado { opacity: .5; }
.qd-cartao.escolhido { box-shadow: var(--sombra), 0 0 0 2px var(--tinta); }
.qd-cartao.turno { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 5px; align-content: start; }
.qd-cartao.turno > * { grid-column: 1 / -1; }
.qd-cartao.turno > .qd-medidor { grid-column: 1; align-self: center; }
.qd-cartao.turno > .qd-cartao-pct { grid-column: 2; align-self: center; }
.qd-cartao-topo { display: flex; align-items: center; gap: 8px; }
.qd-cartao-pct { font-size: 12px; color: var(--tinta-media); white-space: nowrap; }
.qd-heroi { font-family: 'Archivo', sans-serif; font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -.02em; margin-top: 4px; }
.qd-heroi-leg { font-size: 13px; color: var(--tinta-media); margin-top: -2px; }
.qd-cartao-n { font-family: 'Archivo', sans-serif; font-size: 34px; font-weight: 800; line-height: 1.05; margin-top: 2px; }
.qd-cartao-n small { font-family: inherit; font-size: 13px; font-weight: 500; color: var(--tinta-media); letter-spacing: 0; }
.qd-cartao-linha { font-size: 12.5px; color: var(--tinta-media); line-height: 1.45; }
.qd-cartao-linha b { color: var(--tinta); font-weight: 700; }
.qd-cartao-selos { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.qd-medidor { display: block; position: relative; height: 6px; border-radius: 99px; overflow: hidden; margin: 4px 0; background: var(--qd-trilho, var(--bq-surface-2)); }
.qd-medidor i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--qd-cor); border-radius: 0 99px 99px 0; }

/* visao geral: mapa + coluna do lado */
.qd-geral { display: grid; grid-template-columns: minmax(0, 1.62fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.bi-quadro .bq-card, .qd-cartao { min-width: 0; }
.qd-nota { font-size: 12px; color: var(--tinta-media); margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.qd-nota.destaque { font-weight: 600; color: var(--tinta); }
.qd-geral-lado { display: grid; gap: 14px; }

/* mapa de calor (mosaico com vao de 2px; tinta escura nos degraus 1 a 4, clara so no 5) */
.qd-mapa { font-size: 13px; border-collapse: separate; border-spacing: 2px; }
.qd-mapa th, .qd-mapa td { border: none; }
.qd-mapa th:first-child, .qd-mapa td:first-child { position: sticky; left: 0; background: var(--bq-surface); z-index: 1; }
.qd-mapa thead th { cursor: default; }
.qd-mapa thead th .qd-link { text-decoration: none; }
.qd-mapa thead th.escolhida .qd-eq { box-shadow: 0 0 0 2px var(--tinta); }
.qd-mapa thead th.n { text-align: center; padding-left: 4px; padding-right: 4px; }
.qd-mapa tbody th { font-family: inherit; font-size: 12.5px; letter-spacing: 0; text-transform: none; font-weight: 500;
  color: var(--tinta); background: var(--bq-surface); cursor: default; }
.qd-mapa-funcao { color: var(--tinta); text-decoration: none; }
.qd-mapa-funcao:hover { text-decoration: underline; }
.qd-mapa tr.escolhida th, .qd-mapa tr.escolhida .qd-mapa-funcao { font-weight: 700; }
.qd-mapa tr.apagada > * { opacity: .35; }
.qd-mapa td.c { text-align: center; padding: 0; min-width: 54px; vertical-align: middle; border-radius: 4px; }
.qd-mapa td.c button { width: 100%; min-height: 34px; border: none; background: transparent; cursor: pointer; border-radius: 4px;
  font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; color: var(--seq-ink); }
.qd-mapa td.c button:hover, .qd-mapa td.c button:focus-visible { outline: 2px solid var(--tinta); outline-offset: -2px; }
.qd-mapa td.q1 { background: var(--seq-1); } .qd-mapa td.q2 { background: var(--seq-2); } .qd-mapa td.q3 { background: var(--seq-3); }
.qd-mapa td.q4 { background: var(--seq-4); } .qd-mapa td.q5 { background: var(--seq-5); }
.qd-mapa td.q5 button { color: var(--seq-ink-5); }
.qd-mapa td.vazio, .qd-mapa td.soma { color: var(--tinta-media); height: 34px; }
.qd-mapa td.soma { color: var(--tinta); font-weight: 700; font-variant-numeric: tabular-nums; }
.qd-mapa td.apagada, .qd-mapa th.apagada { opacity: .35; }
.qd-mapa td.t { white-space: nowrap; text-align: right; padding-left: 10px; vertical-align: middle; }
.qd-mapa-tot { display: inline-block; width: 48px; height: 6px; border-radius: 99px; background: var(--bq-surface-2); vertical-align: middle;
  margin-right: 8px; overflow: hidden; }
.qd-mapa-tot i { display: block; height: 100%; background: var(--qd-cd); border-radius: 0 99px 99px 0; }
.qd-mapa tfoot th, .qd-mapa tfoot td { font-family: 'Archivo', sans-serif; font-weight: 800; border-top: 2px solid var(--bq-linha);
  text-align: center; font-variant-numeric: tabular-nums; background: var(--bq-surface); color: var(--tinta); font-size: 13px;
  letter-spacing: 0; text-transform: none; cursor: default; vertical-align: middle; height: 38px; }
.qd-mapa tfoot th { text-align: left; }
.qd-mapa tfoot td.t { text-align: right; }
.qd-mapa-sep th { background: transparent !important; font-family: 'Archivo', sans-serif; font-size: 10.5px !important; font-weight: 600 !important;
  letter-spacing: .1em !important; text-transform: uppercase !important; color: var(--tinta-media) !important; padding-top: 12px !important;
  border-bottom: 1px solid var(--bq-linha) !important; }
.qd-mapa-recolhido th { font-weight: 600; }
.qd-mapa-recolhido th .qd-link { text-decoration: none; color: var(--tinta); }
.bi-quadro .bq-escala i.q1 { background: var(--seq-1); } .bi-quadro .bq-escala i.q2 { background: var(--seq-2); }
.bi-quadro .bq-escala i.q3 { background: var(--seq-3); } .bi-quadro .bq-escala i.q4 { background: var(--seq-4); }
.bi-quadro .bq-escala i.q5 { background: var(--seq-5); }

/* desfalques de hoje: lista curta, sem caixa por item */
.qd-desf { list-style: none; margin: 0; padding: 0; }
.qd-desf li + li { border-top: 1px solid var(--bq-linha); }
.qd-desf-item { width: 100%; min-height: 44px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  text-align: left; cursor: pointer; padding: 8px 4px; border: none; background: transparent; border-radius: 8px; }
.qd-desf-item:hover { background: var(--bq-surface-2); }
.qd-desf-quem { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.qd-desf-funcao { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 12.5px; }
.qd-desf-n { font-size: 12px; color: var(--tinta-media); white-space: nowrap; }
.qd-desf-nomes { grid-column: 1 / -1; font-size: 11.5px; color: var(--tinta-media); line-height: 1.45; }
.qd-desf-resumo { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--bq-linha); font-size: 12.5px; color: var(--tinta-media); }
.qd-desf-vazio { font-size: 13px; color: var(--tinta-media); margin: 4px 0 0; }

/* movimentacao (mini e completa) */
.qd-mini-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 8px; }
.qd-mini-kpis div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.qd-mini-kpis b { font-family: 'Archivo', sans-serif; font-size: 28px; font-weight: 700; line-height: 1.05; }
.qd-mini-kpis small { font-size: 11.5px; color: var(--tinta-media); line-height: 1.4; }
.qd-delta { font-size: 11.5px; font-weight: 600; color: var(--tinta-media); line-height: 1.4; }
.qd-delta-ico { font-size: 10px; }
.qd-delta-ico.pior { color: #d03b3b; }
.qd-delta-ico.melhor { color: #0ca30c; }
.qd-mov90-txt { font-size: 12.5px; color: var(--tinta-media); margin: 4px 0 10px; line-height: 1.5; }
.qd-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.qd-kpi { display: flex; flex-direction: column; gap: 3px; background: var(--bq-surface); border: 1px solid var(--bq-linha);
  border-radius: var(--bq-r); padding: 14px 16px; box-shadow: var(--sombra); min-width: 0; }
.qd-kpi b { font-family: 'Archivo', sans-serif; font-size: 32px; font-weight: 700; line-height: 1.05; }
.qd-kpi-un { font-size: 14px; font-weight: 600; color: var(--tinta-media); }
.qd-kpi small { font-size: 12px; color: var(--tinta-media); line-height: 1.45; }
.qd-grade2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.qd-grade2 > *, .qd-geral > *, .qd-geral-lado > *, .qd-onde-grade > * { min-width: 0; }
.qd-card-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.qd-alternar { font-size: 12.5px; }
.qd-espelho { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(30px, 1fr); gap: 4px; margin: 8px 0 10px; --qd-cor: var(--qd-cd); }
.qd-grade2 .qd-espelho { overflow-x: auto; padding-top: 16px; position: relative; }      /* 12 ou 24 meses: o grafico rola dentro do cartao */
.qd-esp-mes { display: grid; grid-template-rows: 92px 92px auto; cursor: pointer; border: none; background: transparent; padding: 0 2px;
  border-radius: 8px; min-width: 24px; }
.qd-espelho.mini .qd-esp-mes { grid-template-rows: 30px 30px auto; }
.qd-esp-mes:hover { background: var(--bq-surface-2); }
.qd-esp-mes.escolhido { background: var(--bq-surface-2); box-shadow: inset 0 0 0 1.5px var(--tinta); }
.qd-esp-mes.fora { opacity: .35; }
.qd-esp-cima, .qd-esp-baixo { display: flex; flex-direction: column; align-items: center; position: relative; }
.qd-esp-cima { justify-content: flex-end; border-bottom: 1px solid var(--bq-linha); }
.qd-esp-baixo { justify-content: flex-start; }
.qd-esp-cima i, .qd-esp-baixo i { display: block; width: min(20px, 70%); background: var(--qd-cor); }
.qd-espelho.mini .qd-esp-cima i, .qd-espelho.mini .qd-esp-baixo i { width: min(14px, 70%); }
.qd-esp-cima i { border-radius: 4px 4px 0 0; opacity: .4; }
.qd-esp-baixo i { border-radius: 0 0 4px 4px; }
.qd-esp-cima em, .qd-esp-baixo em { font-style: normal; font-size: 10.5px; font-weight: 600; color: var(--tinta-media);
  font-variant-numeric: tabular-nums; }
.qd-esp-cima em { order: -1; margin-bottom: 1px; }
.qd-esp-baixo em { margin-top: 1px; }
.qd-esp-rot { font-size: 10.5px; color: var(--tinta-media); text-align: center; padding-top: 3px; text-transform: lowercase; }
.qd-leg-ent, .qd-leg-sai { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--qd-cd); }
.qd-leg-ent { opacity: .4; }
.qd-tabela-mes td.n, .qd-tabela-mes th.n { text-align: right; font-variant-numeric: tabular-nums; }
.qd-barras { display: grid; gap: 2px; --qd-cor: var(--qd-cd); }
.qd-barras-grupo { font-family: 'Archivo', sans-serif; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  color: var(--tinta-media); margin: 10px 0 2px; }
.qd-barras-grupo:first-child { margin-top: 0; }
.qd-barra { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%;

/* =========================================================
   FÉRIAS (14/10, refeita) — a aba do Quadro do CD (prefixo qd-fe-).
   Um cartão só: a lista do que fazer (cada pessoa uma vez, um verbo e
   uma data numa folhinha) e, no mesmo cartão, o calendário do mês a um
   toque (Lista | Calendário). Estado sempre com forma + palavra:
   quadrado vermelho = precisam sair de férias, triângulo âmbar = avisar,
   relógio azul = programar, círculo cinza = em dia, círculo tracejado =
   sem dados. O calendário copia o desenho da tela Calendário em classes
   próprias (as de lá usam color-mix e o hover 3D). Sem color-mix, :has
   nem CSS aninhado (Chrome 109). Nada de opacidade em texto.
   ========================================================= */
.qd-fe, .qd-ficha, .qd-fe-geral {
  --st-sair: #d03b3b; --st-sair-tinta: #ffffff; --st-avisar: #fab219; --st-avisar-tinta: #14152b; --st-avisar-borda: #b07400;
  --st-prog: #2563eb; --st-prog-tinta: #ffffff; --st-prog-fundo: rgba(37, 99, 235, .10); --st-dia: #64748b; }
[data-tema="escuro"] .qd-fe, [data-tema="escuro"] .qd-ficha, [data-tema="escuro"] .qd-fe-geral {
  --st-avisar-borda: #fab219; --st-prog: #6ea8ff; --st-prog-tinta: #0b1220; --st-prog-fundo: rgba(110, 168, 255, .16); --st-dia: #94a3b8; }
.qd-fe-ico { flex: none; display: inline-block; vertical-align: -2px; }
.qd-fe-ico.prog { color: var(--st-prog); }
.qd-fe-ico.emdia { color: var(--tinta-media); }
.qd-fe-curto, .qd-fe-so-estreito { display: none; }

.qd-fe-card-cab { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* o cabeçalho do cartão: o título, a regra do aviso e o Lista | Calendário */

  border-bottom: 1px solid var(--bq-linha); }

/* os grupos: Precisam sair de férias, Avisar, Programar */

.qd-fe-grupo + .qd-fe-grupo, .qd-fe-ninguem + .qd-fe-grupo { margin-top: 8px; border-top: 1px solid var(--bq-linha); }
.qd-fe-grupo-cab { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 0 0 4px; min-height: 30px; }
.bi-quadro .qd-fe-grupo-cab h3 { display: inline-flex; align-items: center; gap: 7px; margin: 0; font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 700; }
.qd-fe-n { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 12.5px; line-height: 1.6; padding: 0 8px; border-radius: 99px;
  background: var(--bq-surface-2); border: 1px solid var(--bq-linha); }
.qd-fe-grupo-frase { font-size: 12.5px; color: var(--tinta-media); }
.qd-fe-grupo-bt { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--tinta); }
.qd-fe-itens { list-style: none; margin: 0; padding: 0; }

/* uma pessoa: a folhinha, o nome (turno, função, etiquetas) e embaixo o verbo e quanto falta. A linha inteira abre a ficha. */
.qd-fe-item { width: 100%; display: grid; grid-template-columns: 40px minmax(0, 1fr) 14px; grid-template-areas: 'folha quem abrir' 'folha quando abrir';
  column-gap: 12px; row-gap: 3px; align-items: center; padding: 7px 8px 7px 6px; min-height: 52px; border: 0; border-radius: 10px;
  background: transparent; cursor: pointer; text-align: left; color: var(--tinta); font: inherit; }
