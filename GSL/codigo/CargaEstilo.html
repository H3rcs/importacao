.cg-auto > span:nth-child(2) { flex: 1 1 260px; line-height: 1.45; }
.cg-auto small { color: var(--cg-tinta-3); }
.cg-auto-ico { font-size: 18px; color: var(--cg-navy); }
[data-tema="escuro"] .cg-auto-ico { color: var(--cg-azul-claro); }
.cg-auto.desfeita { background: var(--cg-cartao-2); border-left-color: var(--cg-linha); color: var(--cg-tinta-2); }
.cg-escala-topo .cg-autos { margin-bottom: 12px; }

/* subturno: botoes segmentados */
.cg-seg { display: inline-flex; border: 1px solid var(--cg-linha); border-radius: 9px; overflow: hidden; flex-shrink: 0; }
.cg-seg-btn { border: 0; background: var(--cg-cartao); color: var(--cg-tinta-2); font: 700 12px 'Inter', sans-serif; padding: 6px 11px; min-width: 40px; min-height: 32px; cursor: pointer; }
.cg-seg-btn + .cg-seg-btn { border-left: 1px solid var(--cg-linha); }
.cg-seg-btn.ativo { background: var(--cg-navy); color: #fff; }
[data-tema="escuro"] .cg-seg-btn.ativo { background: var(--cg-azul); }
.cg-seg-btn:disabled { cursor: default; }
.cg-seg-btn:focus-visible { outline: 3px solid var(--cg-amarelo); outline-offset: -3px; }
.cg-mover-escala { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 0 0 10px; font-size: 13px; color: var(--tinta-media, #4b5677); }
.cg-lista-simples { margin: 8px 0; padding-left: 20px; line-height: 1.7; }

/* aba Escala 5x2 */
.cg-esc-regras { display: flex; flex-wrap: wrap; gap: 6px 8px; margin: 0 0 14px; font-size: 12px; color: var(--cg-tinta-2); }
.cg-esc-regras span { background: var(--cg-cartao-2); border: 1px solid var(--cg-linha); border-radius: 999px; padding: 3px 10px; }

.cg-esc-tab { border-collapse: collapse; width: 100%; font-size: 13px; }

.cg-esc-tab td small { display: block; font-size: 11px; }

.cg-esc-tab tr.sep th { border-left: 3px solid var(--cg-navy); }
.cg-esc-tab .hoje { background: var(--cg-amarelo-tenue); }
.cg-esc-tab tr.falta td, .cg-esc-tab tr.falta th { background: var(--cg-vermelho-tenue); }
.cg-esc-folga { color: var(--cg-tinta-3); font-style: italic; }
.cg-esc-ok { color: var(--cg-verde); font-weight: 600; }
.cg-esc-abc { display: inline-flex; gap: 8px; }
.cg-esc-abc span { display: inline-flex; align-items: baseline; gap: 3px; }
.cg-esc-abc i { font: 700 10px 'Inter', sans-serif; font-style: normal; color: var(--cg-tinta-3); }
.cg-esc-check-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
.cg-esc-check-dep h4 { margin: 0 0 8px; font: 600 14px 'Poppins', 'Inter', sans-serif; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }

/* subturnos */
.cg-sub-barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 12px 0; }

.cg-sub-lista li { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 10px; border: 1px solid transparent; min-width: 0; }

.cg-sub-lista input[type="checkbox"] { width: 18px; height: 18px; flex-shrink: 0; }
.cg-sub-lista label { flex: 1; min-width: 0; display: flex; flex-direction: column; font-size: 13px; cursor: pointer; }
.cg-sub-lista label b, .cg-sub-lista label small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg-sub-lista label small { color: var(--cg-tinta-3); font-size: 11px; }
.cg-sub-txt { font-size: 11px; color: var(--cg-tinta-3); width: 92px; flex-shrink: 0; }

/* boxes: resumo, vistas */
.cg-box-resumo .cg-seq-kpis { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.cg-box-tipos { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 12px 0 0; font-size: 12px; color: var(--cg-tinta-3); }
.cg-box-tipo { background: var(--cg-cartao-2); border: 1px solid var(--cg-linha); border-radius: 999px; padding: 3px 10px; color: var(--cg-tinta-2); }
.cg-box-tipo b { color: var(--cg-tinta); }
.cg-mapa-botoes { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.cg-box-nav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.cg-box-nav .cg-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cg-box-nav-dir { display: flex; gap: 8px; flex-wrap: wrap; }

/* Controle: a grade */
.cg-ctl-barra { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.cg-ctl-check { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--cg-tinta-2); }
.cg-ctl-rolo { overflow: auto; max-height: 70vh; border: 1px solid var(--cg-linha); border-radius: 12px; -webkit-overflow-scrolling: touch; }
.cg-ctl { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 13px; }

.cg-ctl-ord { width: 100%; text-align: left; border: 0; background: none; color: inherit; font: 700 11px 'Inter', sans-serif; letter-spacing: .04em; padding: 9px 8px; cursor: pointer; }
.cg-ctl-ord:focus-visible { outline: 3px solid var(--cg-amarelo); outline-offset: -3px; }
.cg-ctl td { border-bottom: 1px solid var(--cg-linha); border-right: 1px solid var(--cg-linha); padding: 0; height: 34px; color: var(--cg-tinta); }
.cg-ctl td:last-child { border-right: 0; }
.cg-ctl tbody tr:nth-child(even) td { background: var(--cg-cartao-2); }
.cg-ctl tr.carregada td { color: var(--cg-tinta-3); }
.cg-ctl-cel { width: 100%; height: 34px; border: 0; background: transparent; color: inherit; font: 500 13px 'Inter', sans-serif; padding: 0 8px; border-radius: 0; min-width: 0; }
.cg-ctl-cel:focus { outline: 2px solid var(--cg-azul); outline-offset: -2px; background: var(--cg-cartao); }
select.cg-ctl-cel { cursor: pointer; font-weight: 700; }
select.cg-ctl-cel.sel-sim { color: var(--cg-verde); }
select.cg-ctl-cel.sel-nao { color: var(--cg-tinta-2); }
.cg-ctl-cel::placeholder { color: var(--cg-tinta-3); font-style: italic; }
.cg-ctl tr.cg-ctl-nova td { background: var(--cg-amarelo-tenue); }
.cg-ctl-sn { font-weight: 700; padding: 0 8px; }
.cg-ctl-sn.sim { color: var(--cg-verde); }
.cg-ctl-sn.sim::before { content: '✓ '; }
.cg-ctl-pdf { color: var(--cg-tinta-3); font-style: italic; }
.cg-ctl tbody td { white-space: nowrap; }
[data-tema="escuro"] .cg-ctl thead th { background: #1e27a8; }

/* =====================================================================
   SITUACAO DOS BOXs — a aba da planilha do carregamento, que e a planta das docas.
   Cores da planilha (sinalizacao, iguais no claro e no escuro): patio #999 com as
   faixas amarelas entre as docas, numero no amarelo #FFCE00 com borda #071277,
   Livre #274E13 sobre #ACEBCD, Ocupado #660000 sobre #EA9999; faixa do veiculo
   pela formatacao condicional (T azul #1C4E9D, LEVE #9FC5E8, 3/4 #377AEE,
   F petroleo #0C343D, outro roxo #351C75). A situacao e escrita, nunca so a cor.
   ===================================================================== */
.cg-sb { padding: 16px 16px 12px; min-width: 0; }
.cg-sb-topo { display: flex; justify-content: space-between; align-items: center; gap: 10px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.cg-sb-cab { display: flex; align-items: center; gap: 14px; min-width: 0; }
.cg-sb-logo { position: relative; display: inline-flex; align-items: flex-start; flex-shrink: 0; }
.cg-sb-logo-bau { display: block; width: 112px; height: 50px; background-color: #1a1e82; background-size: 82% auto; border-radius: 2px; }
.cg-sb-logo-cab { display: block; width: 40px; height: 60px; margin-left: 1px; overflow: visible; }
.cg-sb-logo-roda { position: absolute; left: 18px; bottom: 2px; width: 16px; height: 16px; }
.cg-sb-titulo { font: 800 clamp(17px, 2.1vw, 34px)/1.1 'Poppins', 'Inter', sans-serif !important; color: #1a1f8c !important; letter-spacing: .005em; text-transform: uppercase; }
[data-tema="escuro"] .cg-sb-titulo { color: #c3c9ff !important; }
.cg-sb-rolo { overflow-x: auto; overflow-y: hidden; max-width: 100%; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
.cg-sb-fila { display: grid; grid-template-columns: repeat(var(--cg-sb-n, 26), minmax(36px, 1fr)); min-width: min-content; border-left: 1px solid #000; }
@media (max-width: 1700px) {
  .cg-sb-num { font-size: 21px !important; }
  .cg-sb-c b { font-size: 12px; }
  .cg-sb-st .cg-sb-vert { font-size: 15px; }
  .cg-sb-faixa .cg-sb-vert { font-size: 11.5px; }
}
.cg-sb-legenda .cg-sb-dica::before { display: none; }
.cg-sb-doca { position: relative; min-width: 0; border-right: 1px solid #000; }
.cg-sb-alvo { display: flex; flex-direction: column; height: 100%; cursor: pointer; }
.cg-sb-alvo:focus-visible { outline: 3px solid var(--cg-amarelo); outline-offset: -3px; position: relative; z-index: 2; }
.cg-sb-alvo:hover .cg-sb-num { filter: brightness(1.06); }
.cg-sb-patio { position: relative; height: 236px; background: #999; display: flex; flex-direction: column; }
.cg-sb-alto { height: 84px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; padding: 4px 3px 6px; }
.cg-sb-svg { display: block; width: 100%; max-width: 72px; }
.cg-sb-svg .cg-veic { width: 100% !important; }
.cg-sb-placa { font: 700 10px 'Inter', sans-serif; color: #111; background: rgba(255, 255, 255, .82); border-radius: 3px; padding: 1px 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cg-sb-bloq { font-size: 20px; margin-bottom: 8px; }
.cg-sb-faixa { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-left: 2px solid #ffce00; padding: 6px 0; }
.cg-sb-doca:first-child .cg-sb-faixa { border-left-color: transparent; }
.cg-sb-vert { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: 100%; font: 500 13px/1.1 'Inter', sans-serif; letter-spacing: .03em; }
.cg-sb-faixa .cg-sb-vert { font-size: 12.5px; letter-spacing: .06em; }
.cg-sb-faixa.v-t { background: #1c4e9d; color: #fff; }
.cg-sb-faixa.v-leve { background: #9fc5e8; color: #0b1a33; }
.cg-sb-faixa.v-3 { background: #377aee; color: #fff; }
.cg-sb-faixa.v-f { background: #0c343d; color: #fff; }

.cg-sb-faixa.v-outro { background: #351c75; color: #fff; }
.cg-sb-faixa.previsto { background-image: repeating-linear-gradient(-45deg, rgba(255, 255, 255, .28) 0 6px, transparent 6px 12px); }
.cg-sb-reserva { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1.15 'Inter', sans-serif; color: #111; text-align: center; max-height: 100%; overflow: hidden; }
.cg-sb-reserva b { display: block; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 10px; }
.cg-sb-st .cg-sb-reserva { color: inherit; font-size: 10px; opacity: .85; }
.cg-sb-num { height: 54px; display: flex; align-items: center; justify-content: center; background: #ffce00; color: #000; border: 2px solid #071277; margin: 0 -1px; position: relative; z-index: 1;
  font: 800 25px/1 'Poppins', 'Inter', sans-serif !important; letter-spacing: -.02em; }
.cg-sb-st { height: 156px; display: flex; align-items: center; justify-content: center; gap: 2px; overflow: hidden; }
.cg-sb-st .cg-sb-vert { font-size: 16px; }
.cg-sb-est-livre { background: #acebcd; color: #274e13; }
.cg-sb-est-ocupado { background: #ea9999; color: #660000; }
.cg-sb-est-carregando { background: #ea9999 repeating-linear-gradient(-45deg, rgba(255, 255, 255, .25) 0 8px, transparent 8px 16px); color: #660000; }
.cg-sb-est-carregando .cg-sb-vert { font-weight: 700; }
.cg-sb-est-reservado { background: #ffe599; color: #5c4600; }

.cg-sb-cargas { flex: 1; min-height: 150px; background: #d9d9d9; border-top: 1px solid #000; padding: 7px 3px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.cg-sb-c { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 100%; max-width: 46px; }

.cg-sb-c b { font: 600 13.5px/1.05 'Poppins', 'Inter', sans-serif; color: #2b2b2b; }
.cg-sb-c.loja b { color: #1a1f8c; }

.cg-sb-c.h24::before { content: '24h'; font: 800 8px/1 'Inter', sans-serif; color: #a3141b; letter-spacing: .02em; }
.cg-sb-mini { display: block; width: 100%; height: 3px; background: rgba(0, 0, 0, .13); border-radius: 2px; overflow: hidden; }
.cg-sb-mini i { display: block; height: 100%; }
.cg-sb-mini i.s { background: #3949d6; }
.cg-sb-mini i.c { background: #0f86c2; }
.cg-sb-mais { font: 700 11px 'Inter', sans-serif; color: #222; background: #fff; border-radius: 8px; padding: 1px 6px; }
.cg-sb-aviso { position: absolute; top: 5px; left: 50%; transform: translateX(-50%); z-index: 1; display: inline-flex; gap: 2px; align-items: center; white-space: nowrap;
  font: 800 10px/1 'Inter', sans-serif; padding: 3px 5px; border-radius: 8px; background: #fff4d6; color: #6b4300; border: 1px solid #d08b00; }
.cg-sb-aviso.g-alerta { background: #b42318; color: #fff; border-color: #7a1010; }

html.cg-arrastando-carreg .cg-sb-doca:not(.est-bloqueado) .cg-sb-num { outline: 2px dashed #3949d6; outline-offset: -5px; }
.cg-sb-doca.sobre .cg-sb-alvo { box-shadow: inset 0 0 0 4px #fbb917; }
.cg-sb-doca.sobre .cg-sb-num { background: #fff0a8; }
/* a fila compacta (em cima da grade Controle: para soltar as cargas) */
.cg-sb-mini-cartao { padding: 12px 14px; }
.cg-sb-mini-cartao .cg-cartao-cab { margin-bottom: 8px; flex-wrap: wrap; gap: 4px 12px; }
.cg-sb-doca.compacta .cg-sb-alvo { position: relative; }
.cg-sb-doca.compacta .cg-sb-num { height: 38px; font-size: 18px !important; }
.cg-sb-doca.compacta .cg-sb-st { height: 22px; font: 700 9.5px 'Inter', sans-serif; text-transform: uppercase; letter-spacing: .02em; border-top: 1px solid #000; }
.cg-sb-qtd { height: 20px; display: flex; align-items: center; justify-content: center; background: #d9d9d9; border-top: 1px solid #000; font: 600 10px 'Inter', sans-serif; color: #222; white-space: nowrap; overflow: hidden; }
.cg-sb-doca.compacta .cg-sb-aviso { top: -2px; }
.cg-sb-legenda .cg-sb-l::before { border-radius: 2px; border: 1px solid rgba(0, 0, 0, .35); }

.cg-sb-legenda .cg-sb-l.oc::before { background: #ea9999; }

.cg-sb-legenda .cg-sb-l.rs::before { background: #ffe599; border-style: solid; }
.cg-sb-legenda .cg-sb-l.bl::before { background: #cccccc; }
.cg-sb-legenda .cg-sb-l.vt::before { background: #1c4e9d; }
.cg-sb-legenda .cg-sb-l.v3::before { background: #377aee; }
.cg-sb-legenda .cg-sb-l.vl::before { background: #9fc5e8; }
.cg-sb-legenda .cg-sb-l.vo::before { background: #351c75; }
