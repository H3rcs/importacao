<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4EA2">
<title>Escala de Limpeza – Loja Bartofil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0B4EA2; --blue-deep:#06356F; --blue-tint:#E4EDF9; --blue-line:#B9CDEB;
  --green:#169C46; --green-deep:#0C6A2F; --green-tint:#E1F3E7;
  --yellow:#FFC72C; --yellow-deep:#8A6200; --yellow-tint:#FFF4D2;
  --ink:#14243D; --muted:#5A6A80; --soft:#8796AA; --line:#D6DEE9; --line-2:#E6ECF3;
  --bg:#EEF2F7; --surface:#FFFFFF;
  --warn:#C25A0E; --warn-tint:#FDEEE1;
  --r-lg:16px; --r-md:10px; --r-sm:6px;
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --tabbar:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- topo ---------- */
.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:10px 24px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;flex:none}
.brand img,.brand svg.logo{height:38px;width:auto;display:block;border-radius:4px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid rgba(255,255,255,.28);padding-left:14px}
.brand-t strong{font-stretch:112%;font-weight:750;font-size:16px;letter-spacing:-.005em}
.brand-t span{font-size:12.5px;opacity:.78}
.tabs{display:flex;gap:4px;margin-left:auto}
.tabs a{color:#fff;text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:550;font-size:14.5px;opacity:.86;transition:background .15s,opacity .15s}
.tabs a:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs a[aria-current="page"]{background:#fff;color:var(--blue);opacity:1}
.stripe{display:grid;grid-template-rows:5px 5px}
.stripe i:first-child{background:var(--green)} .stripe i:last-child{background:var(--yellow)}
.tabbar{display:none}

main{max-width:1280px;margin:0 auto;padding:28px 24px calc(64px + var(--tabbar))}
main:focus{outline:none}

/* ---------- tipografia ---------- */
h1,h2,h3{margin:0;font-stretch:112%;letter-spacing:-.012em;line-height:1.12}
h1{font-size:clamp(28px,3.4vw,40px);font-weight:780}
h2{font-size:22px;font-weight:720}
h3{font-size:17px;font-weight:680}
p{margin:0}
.lead{color:var(--muted);font-size:16px;max-width:68ch;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--blue-line);background:#FAFCFF}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(11,78,162,.07)}
.btn.danger{color:var(--warn);border-color:#F1C7A6}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--blue-line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- cabeçalho de página ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph .t{flex:1;min-width:260px}
.datenav{display:flex;align-items:center;gap:10px}
.datenav h1{min-width:0}
.kicker{font-size:14px;color:var(--blue);font-weight:650;margin-bottom:6px}

/* ---------- linha do tempo (o coração) ---------- */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tl-scroll{overflow-x:auto;scrollbar-width:thin}
.tl-in{min-width:980px;padding:6px 18px 14px 0}
.tl-ruler{position:relative;height:34px;margin-left:168px}
.tick{position:absolute;bottom:6px;transform:translateX(-50%);font-size:12px;color:var(--soft);font-weight:550}
.tick::after{content:"";position:absolute;left:50%;top:100%;height:6px;width:1px;background:var(--line)}
.rpk{position:absolute;bottom:0;height:4px;background:var(--blue);border-radius:2px;opacity:.85}
.lane{display:flex;align-items:stretch;border-top:1px solid var(--line-2)}
.lane:first-of-type{border-top:0}
.lane-lbl{width:168px;flex:none;padding:12px 14px 12px 18px;position:sticky;left:0;z-index:6;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px}
.lane-lbl::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--pc)}
.lane-lbl b{font-size:15.5px;font-weight:700;font-stretch:108%}
.lane-lbl span{font-size:12.5px;color:var(--muted);line-height:1.3}
.lane-track{position:relative;flex:1;margin:8px 0;border-radius:var(--r-md);background:#fff;transition:background .15s, box-shadow .15s}
.lane-track.drop{background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue-line)}
.lane-track .off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#F1F4F8 0 6px,#E9EEF4 6px 7px)}
.lane-track .off.l{border-radius:var(--r-md) 0 0 var(--r-md)} .lane-track .off.r{border-radius:0 var(--r-md) var(--r-md) 0}
.lane-track .lunch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#FBF6E6 0 6px,#F5ECCC 6px 7px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.lane-track .lunch em{font-style:normal;font-size:10.5px;color:var(--yellow-deep);font-weight:600}
.lane-track .peak{position:absolute;top:0;bottom:0;background:rgba(11,78,162,.055);border-left:1px dashed rgba(11,78,162,.22)}
.nowline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--blue-deep);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-1px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--blue-deep);transform:translate(-50%,-50%)}
.blk{position:absolute;height:28px;border:0;border-radius:7px;padding:0 8px;background:var(--pc);color:var(--pc-ink);font-size:12.5px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;z-index:2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:filter .12s, opacity .2s}
.blk span{overflow:hidden;text-overflow:ellipsis}
.blk:hover{filter:brightness(1.06)}
.blk.is-done{opacity:.38}
.blk.is-done span{text-decoration:line-through}
.blk.is-warn{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--warn)}
.blk.tiny span{display:none}
.tl[data-mode="edit"] .blk{cursor:grab;touch-action:none}
.blk.dragging{cursor:grabbing;z-index:10;box-shadow:0 10px 24px rgba(20,36,61,.28),0 0 0 2px #fff;transition:none;filter:none}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;font-weight:650;padding:5px 9px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
.tl-legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px 12px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.sw.pk{background:rgba(11,78,162,.12);border-left:1px dashed rgba(11,78,162,.4)}
.sw.lu{background:repeating-linear-gradient(135deg,#FBF6E6 0 3px,#F0E3B5 3px 4px)}
.sw.of{background:repeating-linear-gradient(135deg,#F1F4F8 0 3px,#DDE4EC 3px 4px)}
.sw.wn{background:#fff;box-shadow:0 0 0 2px var(--warn)}

/* pessoas */
.pc0{--pc:var(--green);--pc-ink:#fff;--pc-tint:var(--green-tint);--pc-deep:var(--green-deep)}
.pc1{--pc:var(--yellow);--pc-ink:#3B2A00;--pc-tint:var(--yellow-tint);--pc-deep:var(--yellow-deep)}

/* ---------- Hoje: checklists ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pcard>header{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-2);background:linear-gradient(var(--pc-tint),var(--pc-tint)) left/6px 100% no-repeat}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pc);color:var(--pc-ink);display:grid;place-items:center;font-weight:750;font-size:17px;font-stretch:110%;flex:none}
.pcard header .who{flex:1;min-width:0}
.pcard header .who b{display:block;font-size:18px;font-stretch:110%;font-weight:720}
.pcard header .who span{font-size:13px;color:var(--muted)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--pc-deep);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.pc1 .ring .fg{stroke:#E0A800}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.list{list-style:none;margin:0;padding:6px 0}
.it{display:flex;gap:14px;padding:11px 18px;cursor:pointer;position:relative;align-items:flex-start;transition:background .12s}
.it:hover{background:#F7F9FC}
.it input{position:absolute;opacity:0;pointer-events:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #B7C3D3;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease .05s}
.it input:checked+.box{background:var(--pc-deep);border-color:var(--pc-deep)}
.pc1 .it input:checked+.box{background:#D9A100;border-color:#D9A100}
.it input:checked+.box svg{stroke-dashoffset:0}
.it input:focus-visible+.box{outline:3px solid var(--blue);outline-offset:2px}
.it-b{flex:1;min-width:0}
.it-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.it-h time{font-weight:650;font-size:13.5px;color:var(--muted);min-width:92px}
.it-h b{font-weight:620;font-size:15px}
.it p{font-size:13px;color:var(--muted);margin-top:1px}
.it.done .it-h b{text-decoration:line-through;text-decoration-color:rgba(20,36,61,.35);color:var(--muted)}
.it.now{background:var(--blue-tint)}
.it.now::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:620;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--muted);line-height:1.5}
.tag.b{background:var(--blue-tint);color:var(--blue)}
.tag.w{background:var(--warn-tint);color:var(--warn)}
.tag.g{background:var(--green-tint);color:var(--green-deep)}
.tag.y{background:var(--yellow-tint);color:var(--yellow-deep)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel+.panel{margin-top:16px}
.sec{margin-top:28px}
.sec>h2{margin-bottom:12px}
.dem{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.dem:first-child{border-top:0;padding-top:0}
.dem .t{flex:1}
.closed{background:var(--surface);border:1px dashed var(--blue-line);border-radius:var(--r-lg);padding:40px 24px;text-align:center}
.closed h2{margin-bottom:8px}

/* ---------- Semana ---------- */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:20px}
.wk>header{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.wk-scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;min-width:720px}
.grid th,.grid td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:center;font-size:13.5px}
.grid thead th{font-weight:650;color:var(--muted);font-size:12.5px;background:#FAFBFD;position:sticky;top:0}
.grid thead th b{display:block;color:var(--ink);font-size:14px}
.grid thead th.today{color:var(--blue)} .grid thead th.today b{color:var(--blue)}
.grid th.task{text-align:left;font-weight:500;width:42%}
.grid th.task b{font-weight:620;font-size:14px}
.grid th.task span{color:var(--muted);font-size:12.5px;margin-right:8px;font-weight:600}
.grid td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,#F1F4F8 6px 7px)}
.grid td.today{background:rgba(11,78,162,.04)}
.cell{display:inline-grid;place-items:center;cursor:pointer;position:relative}
.cell input{position:absolute;opacity:0;pointer-events:none}
.cell .box{width:22px;height:22px}
.pct{font-size:11.5px;font-weight:650;color:var(--soft);display:block;margin-top:2px}

/* ---------- Distribuição ---------- */
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.4;cursor:not-allowed}
.loads{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.load{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px}
.load .row b{font-size:15px}
.bar{height:10px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--pc-deep);transition:width .4s cubic-bezier(.2,.8,.2,1)}
.pc1 .bar i{background:#E0A800}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--blue-tint);color:var(--blue-deep);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:0 0 16px}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:flex-start;font-size:14px}
.att li:first-child{border-top:0}
.att .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.att button{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.amb{margin-top:18px}
.amb h3{margin:0 0 8px;color:var(--muted);font-size:14px;font-weight:650;font-stretch:100%}
.trow{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(150px,1fr) 2fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.trow:hover{border-color:var(--blue-line)}
.trow.off{opacity:.55}
.trow .n b{display:block;font-weight:650}
.trow .n span{font-size:12.5px;color:var(--muted)}
.trow .f{font-size:13.5px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:620;padding:3px 9px 3px 4px;border-radius:999px;background:var(--line-2)}
.slot i{width:18px;height:18px;border-radius:50%;background:var(--pc);color:var(--pc-ink);font-style:normal;font-size:10.5px;display:grid;place-items:center;font-weight:750}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#C9D3E0;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Escala ---------- */
.now-shift{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.shiftcard{border-radius:var(--r-lg);padding:20px;background:var(--pc);color:var(--pc-ink);position:relative;overflow:hidden}
.shiftcard small{font-size:13.5px;opacity:.85;font-weight:600}
.shiftcard b{display:block;font-size:30px;font-stretch:118%;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.shiftcard span{font-size:15px;font-weight:550}
.weeks{width:100%;border-collapse:collapse}
.weeks td{padding:10px 8px;border-top:1px solid var(--line-2);font-size:14px;vertical-align:middle}
.weeks tr:first-child td{border-top:0}
.weeks tr.cur td{background:var(--blue-tint)}
.weeks tr.cur td:first-child{border-radius:8px 0 0 8px} .weeks tr.cur td:last-child{border-radius:0 8px 8px 0}
.who-chip{display:inline-flex;align-items:center;gap:7px;font-weight:620}
.who-chip i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.swapped{font-size:12px;color:var(--warn);font-weight:620;margin-left:6px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.settings .panel+.panel{margin-top:0}
.settings h3{margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f>span{font-size:13px;font-weight:620;color:var(--muted)}
.f input[type=text],.f input[type=time],.f input[type=date],.f input[type=number],.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(11,78,162,.15)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{position:relative}
.checks input{position:absolute;opacity:0}
.checks span{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;background:#fff}
.checks input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.checks input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
.person-set{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2)}
.person-set:first-of-type{border-top:0;padding-top:0}
.person-set .avatar{width:36px;height:36px;font-size:15px;margin-top:22px}
.person-set .grow{flex:1;min-width:0}
.inline-check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.inline-check input{width:18px;height:18px;accent-color:var(--green)}
.logo-prev{background:var(--blue);border-radius:10px;padding:14px;display:flex;justify-content:center;margin-bottom:12px}
.logo-prev img,.logo-prev svg{height:46px;width:auto}

/* ---------- Plano de ação ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.stat:hover{border-color:var(--blue-line)}
.stat[aria-pressed="true"]{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

.stat span{font-size:13.5px;color:var(--muted);font-weight:600}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:auto 1fr 180px 120px 140px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px}
.act .t{cursor:pointer;min-width:0}
.act .t b{display:block;font-weight:650;font-size:15px}
.act .t p{font-size:13.5px;color:var(--muted)}
.act .m{font-size:13.5px}
.act .m span{display:block;color:var(--muted);font-size:12.5px}
.act.late .m b{color:var(--warn)}
.act.done .t b{text-decoration:line-through;color:var(--muted)}
.st{border:0;border-radius:999px;padding:6px 12px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-self:start}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.afazer{background:var(--line-2);color:var(--muted)}
.st.andamento{background:var(--yellow-tint);color:var(--yellow-deep)}
.st.feito{background:var(--green-tint);color:var(--green-deep)}
.act .ck{width:28px;height:28px;border-radius:50%;border:2px solid #B7C3D3;background:#fff;display:grid;place-items:center;padding:0}
.act.done .ck{background:var(--green);border-color:var(--green)}
.act .ck svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none}

/* ---------- gaveta ---------- */
.scrim{position:fixed;inset:0;background:rgba(10,22,40,.38);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(10,22,40,.18)}
.drawer{visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer>header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.drawer>header h2{flex:1;font-size:20px}
.drawer .body{flex:1;overflow:auto;padding:20px}
.drawer>footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);background:#FAFBFD}
.slot-ed{display:grid;grid-template-columns:100px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.slot-ed input,.slot-ed select{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;min-width:0;width:100%}
.legend-sm{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--tabbar));transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px 12px 18px;display:flex;gap:16px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(10,22,40,.3);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);font-size:14px}
.toast{visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.toast button{background:transparent;border:0;color:var(--yellow);font-weight:700;padding:4px 6px}

#print-root{display:none}

/* ---------- responsivo ---------- */
@media (max-width:980px){
  .act{grid-template-columns:auto 1fr;}
  .act .m,.act .st{grid-column:2}
  .trow{grid-template-columns:1fr auto}
  .trow .f,.trow .slots{grid-column:1}
}
@media (max-width:760px){
  :root{--tabbar:64px}

  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(64px + env(safe-area-inset-bottom))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none}

  main{padding:20px 14px calc(40px + var(--tabbar))}
  .cols,.loads,.now-shift{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr);gap:8px}
  .stat b{font-size:22px}
  .lane-lbl{width:104px;padding:8px 10px 8px 14px}
  .lane-lbl span .hr{display:none}
  .tl-ruler{margin-left:104px}
  .tl-in{min-width:860px}
  .drawer{top:auto;height:92vh;width:100%;border-radius:18px 18px 0 0;transform:translateY(102%)}
  .f3{grid-template-columns:1fr 1fr}
  .slot-ed{grid-template-columns:88px 1fr 40px}
  .distnav{flex-wrap:nowrap}

  .slot-ed select.pp{grid-row:2}
  .brand-t span{display:none}
}

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');
const toMin = s => { const [h,m] = String(s||'0:0').split(':').map(Number); return (h||0)*60 + (m||0); };
const toHM = m => pad(Math.floor(m/60)) + ':' + pad(m%60);
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const dateOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mod = (n,m) => ((n % m) + m) % m;
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const DIAS_T = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DIAS_C = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_C = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const today = () => dateOnly(new Date());
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const fmtLong = d => `${DIAS_T[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
const fmtShort = d => `${d.getDate()} de ${MESES[d.getMonth()]}`;
const fmtBR = d => `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;
const durTxt = m => { const h = Math.floor(m/60), r = m%60; return h ? (r ? `${h}h${pad(r)}` : `${h}h`) : `${r} min`; };
const ORD = ['','1ª','2ª','3ª','4ª','última'];

const ICON = {
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M18 6L6 18M6 6l12 12"/>',
  print:'<path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  today:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/><circle cx="12" cy="15" r="2"/>',
  week:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 13h2M14 13h2M8 17h2M14 17h2"/>',
  split:'<path d="M4 6h16M4 12h10M4 18h13"/><circle cx="18" cy="12" r="2"/>',
  swap:'<path d="M7 4L3 8l4 4"/><path d="M3 8h14"/><path d="M17 20l4-4-4-4"/><path d="M21 16H7"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  down:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>', up:'<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/>',
  ladder:'<path d="M7 3l-2 18M17 3l2 18M6.5 8h11M6 13h12M5.5 18h13"/>'
};
const ic = (n, cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;

/* Logo Bartofil desenhada (nome em branco sobre azul, tarjas verde e amarela).
   Para usar o arquivo oficial: Escala > Logo > Trocar logo. */
function logoSVG(cls='logo'){
  return `<svg class="${cls}" viewBox="0 0 220 56" role="img" aria-label="Bartofil">
    <rect width="220" height="56" rx="6" fill="#0B4EA2"/>
    <text x="16" y="36" fill="#fff" font-family="Archivo, Arial Black, Arial, sans-serif" font-weight="800" font-size="30" font-stretch="118%" letter-spacing="-.5">Bartofil</text>
    <path d="M16 43h120l-4 5H16z" fill="#169C46"/><path d="M140 43h64l-4 5h-64z" fill="#FFC72C"/>
  </svg>`;
}
const logoHTML = (cls) => S.logo ? `<img src="${S.logo}" alt="Bartofil" class="${cls||''}">` : logoSVG(cls);

/* =========================================================
   Estado padrão (montado a partir do documento da loja)
   ========================================================= */
function T(nome, ambiente, obs, freq, dur, slots, extra={}){
  return { id:uid(), nome, ambiente, obs, freq, dur, ativo:true, altura:false,
    slots: slots.map(([hora, posto, pessoa=null]) => ({ id:uid(), hora, posto, pessoa })),
    historico:[], ...extra };
}
const DIARIA = {tipo:'diaria'};
const SEM = (...dias) => ({tipo:'semanal', dias});

function estadoPadrao(){
  const seg = dkey(mondayOf(today()));
  const prazo = n => dkey(addDays(today(), n));
  return {
    versao: 1,
    logo: null,
    equipe: [
      { id:'lu', nome:'Lu', altura:{ ok:false, data:'' } },
      { id:'agnaldo', nome:'Agnaldo', altura:{ ok:false, data:'' } }
    ],
    turnos: {
      T1: { nome:'Turno 1', ini:'07:00', fim:'16:00', almIni:'12:00', almFim:'13:00' },
      T2: { nome:'Turno 2', ini:'08:30', fim:'18:30', almIni:'14:00', almFim:'15:00' }
    },
    loja: { abre:'07:00', fecha:'18:30', picos:['09:00','10:00','11:00','13:00'], dias:[1,2,3,4,5] },
    rodizio: { ciclo:'semana', inicio: seg, primeiroT1:'lu', trocas:{} },
    tarefas: [
      // Loja
      T('Piso da loja: varrição','Loja','Manter corredores livres para a máquina', DIARIA, 40, [['08:10','T1']]),
      T('Piso da loja: lavagem com máquina','Loja','Manter corredores livres para a máquina', SEM(2,5), 60, [['16:30','T2']]),
      T('Prateleiras e armazenagem','Loja','Limpeza contínua das prateleiras e organização dos itens armazenados', DIARIA, 60, [['09:10','T1'],['15:00','T2']]),
      T('Frente de caixa','Loja','Feita antes dos picos das 09:00 e das 13:00', DIARIA, 20, [['08:35','T2'],['12:30','T2']]),
      T('Carrinhos','Loja','Recolher e remover os carrinhos espalhados', DIARIA, 20, [['10:30','T1'],['13:30','T2'],['17:30','T2']]),
      // Banheiros
      T('Banheiros gerais: limpeza do dia','Banheiros','Limpeza completa antes do movimento', DIARIA, 40, [['07:00','T1']]),
      T('Banheiros gerais: ronda','Banheiros','Manutenção ao longo do expediente: papel, sabonete, lixo e piso', DIARIA, 15, [['10:10','T1'],['11:30','T2'],['15:00','T1'],['17:50','T2']]),
      T('Banheiro de funcionários: reposição','Banheiros','Reposição contínua de insumos', DIARIA, 20, [['09:00','T2'],['13:00','T2']]),
      T('Banheiro de funcionários: lavagem completa','Banheiros','Lavagem completa do ambiente', SEM(5), 45, [['10:00','T2']]),
      // Áreas externas
      T('Estacionamento','Áreas externas','Varrição com vassourão', DIARIA, 30, [['07:40','T1']]),
      T('Fachada: vidros externos','Áreas externas','Limpeza geral dos vidros externos', {tipo:'mensal', ordem:1, dia:1}, 90, [['13:30','T1']], {altura:true}),
      T('Placas e sinalizações','Áreas externas','Verificar necessidade de escada ou plataforma', {tipo:'trimestral', ordem:2, dia:2, mesInicial:10}, 60, [['13:30','T1']], {altura:true}),
      T('Lonas da loja','Áreas externas','Vistoriar o estado de conservação e limpar quando precisar', {tipo:'demanda'}, 45, [['13:30','T1']], {altura:true}),
      // Logística
      T('Área de devolução: varrição','Devolução e retirada','Manter o espaço de fluxo desobstruído', DIARIA, 15, [['13:00','T1']]),
      T('Área de devolução: lavagem','Devolução e retirada','Manter o espaço de fluxo desobstruído', SEM(3), 30, [['10:00','T2']]),
      T('Área de retirada: varrição','Devolução e retirada','Alinhada com o setor de devolução', DIARIA, 15, [['13:15','T1']]),
      T('Área de retirada: lavagem','Devolução e retirada','Alinhada com o setor de devolução', SEM(3), 30, [['10:30','T2']]),
      T('Depósito: lavagem','Devolução e retirada','Execução a cargo do pessoal local', SEM(1), 60, [['10:00','T2']]),
      // Administrativo
      T('Escadas','Administrativo','Degraus e corrimãos', DIARIA, 20, [['11:00','T1']]),
      T('Salas administrativas','Administrativo','Limpeza e recolhimento das lixeiras', DIARIA, 30, [['11:20','T1']]),
      T('Sala de reunião','Administrativo','Organizar cadeiras e mesas depois da higienização', SEM(1,4), 30, [['09:25','T2']]),
      T('Sala 06','Administrativo','Ambiente de baixa circulação e uso reduzido', {tipo:'quinzenal', dia:3, paridade:0}, 40, [['13:30','T1']]),
      // Funcionários
      T('Copa: café','Funcionários','Pegar e levar o café', DIARIA, 15, [['08:50','T1'],['15:20','T1']]),
      T('Refeitório','Funcionários','Mesas, bancadas e pias', DIARIA, 25, [['11:00','T2'],['16:00','T2']]),
      T('Sala 07 (descanso)','Funcionários','Manter organização e ambiente limpo', DIARIA, 15, [['18:05','T2']])
    ],
    acoes: [
      { id:uid(), oque:'Curso de trabalho em altura (NR-35) para Lu e Agnaldo', porque:'Obrigatório antes da fachada, das placas e das lonas', quem:'Gestão da loja e RH', prazo:prazo(30), status:'afazer' },
      { id:uid(), oque:'Providenciar escada ou plataforma para placas e sinalizações', porque:'A limpeza trimestral das placas depende do equipamento', quem:'Manutenção', prazo:prazo(20), status:'afazer' },
      { id:uid(), oque:'Garantir vassourão para o estacionamento e máquina para o piso', porque:'Varrição diária do estacionamento e lavagem do piso 2x por semana', quem:'Compras', prazo:prazo(10), status:'andamento' },
      { id:uid(), oque:'Afixar o checklist impresso em cada setor', porque:'Execução visível e fácil de conferir pela gestão', quem:'Administração', prazo:prazo(5), status:'afazer' },
      { id:uid(), oque:'Confirmar quem executa a lavagem do depósito', porque:'O cronograma indica execução a cargo do pessoal local', quem:'Gestão da loja', prazo:prazo(7), status:'afazer' },
      { id:uid(), oque:'Primeira vistoria das lonas da loja', porque:'A limpeza das lonas é feita conforme o estado de conservação', quem:'Lu e Agnaldo', prazo:prazo(15), status:'afazer' },
      { id:uid(), oque:'Revisar a escala com Lu e Agnaldo depois do primeiro ciclo', porque:'Ajustar horários e carga antes de fixar o padrão', quem:'Gestão da loja', prazo:prazo(14), status:'afazer' }
    ],
    feitos: {}
  };
}

/* =========================================================
   Persistência
   ========================================================= */
const KEY = 'bartofil-escala-limpeza:v1';
let S;
function carregar(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (d && Array.isArray(d.tarefas)) return d; } } catch(e){}
  return estadoPadrao();
}
function salvar(){
  // Mantém só os últimos 180 dias de registros de execução
  const lim = dkey(addDays(today(), -180));
  for (const k of Object.keys(S.feitos)) if (k < lim) delete S.feitos[k];
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Não foi possível salvar neste navegador. Exporte um backup em Escala.'); }
}
S = carregar();

/* =========================================================
   Regras: recorrência, rodízio, ocorrências, conflitos
   ========================================================= */
const lojaAbre = d => S.loja.dias.includes(d.getDay());
function semanasEntre(a, b){ return Math.round((mondayOf(b) - mondayOf(a)) / (7*864e5)); }
function bateOrdem(date, ordem){
  if (ordem >= 5) return addDays(date, 7).getMonth() !== date.getMonth();
  return Math.ceil(date.getDate()/7) === ordem;
}
function ocorre(t, date){
  if (!t.ativo || !lojaAbre(date)) return false;
  const f = t.freq, wd = date.getDay();
  switch (f.tipo){
    case 'diaria': return true;
    case 'semanal': return (f.dias||[]).includes(wd);
    case 'quinzenal': return wd === f.dia && mod(semanasEntre(parseKey(S.rodizio.inicio), date), 2) === (f.paridade||0);
    case 'mensal': return wd === f.dia && bateOrdem(date, f.ordem);
    case 'trimestral': return wd === f.dia && bateOrdem(date, f.ordem) && mod(date.getMonth() - (f.mesInicial||0), 3) === 0;
    default: return false;
  }
}
function freqTxt(t){
  const f = t.freq, n = t.slots.length, vezes = n > 1 ? `${n}x ` : '';
  switch (f.tipo){
    case 'diaria': return n > 1 ? `${n}x ao dia` : 'Todos os dias';
    case 'semanal': {
      const ds = (f.dias||[]).slice().sort().map(d => DIAS_C[d]);
      const lista = ds.length > 1 ? ds.slice(0,-1).join(', ') + ' e ' + ds.at(-1) : (ds[0]||'nenhum dia');
      return `${(f.dias||[]).length}x por semana: ${lista}`;
    }
    case 'quinzenal': return `A cada 15 dias, ${DIAS[f.dia]}`;
    case 'mensal': return `1x por mês, ${ORD[f.ordem]} ${DIAS[f.dia]}`;
    case 'trimestral': {
      const ms = [0,1,2,3].map(i => MESES_C[mod((f.mesInicial||0)+i*3,12)]).join(', ');
      return `A cada 3 meses, ${ORD[f.ordem]} ${DIAS[f.dia]} (${ms})`;
    }
    default: return 'Conforme necessidade';
  }
}
const freqTag = t => ({semanal:'Semanal', quinzenal:'Quinzenal', mensal:'Mensal', trimestral:'Trimestral', demanda:'Sob demanda'})[t.freq.tipo];

function periodo(date){
  const r = S.rodizio, ini = parseKey(r.inicio);
  if (r.ciclo === 'mes') return (date.getFullYear()-ini.getFullYear())*12 + date.getMonth() - ini.getMonth();
  const w = semanasEntre(ini, date);
  return Math.floor(w / (r.ciclo === 'quinzena' ? 2 : 1));
}
function donoT1(date){
  const p = periodo(date);
  let troca = mod(p, 2) === 1;
  if (S.rodizio.trocas[p]) troca = !troca;
  const a = S.rodizio.primeiroT1, b = S.equipe.find(e => e.id !== a).id;
  return troca ? b : a;
}
const outra = id => S.equipe.find(e => e.id !== id).id;
const dono = (posto, date) => posto === 'T1' ? donoT1(date) : outra(donoT1(date));
const turnoDe = (pid, date) => donoT1(date) === pid ? 'T1' : 'T2';
const pessoa = id => S.equipe.find(e => e.id === id);
const pIdx = id => S.equipe.findIndex(e => e.id === id);
const executor = (slot, date) => slot.pessoa && pessoa(slot.pessoa) ? slot.pessoa : dono(slot.posto, date);

function ocorrencias(date){
  const out = [];
  for (const t of S.tarefas){
    if (!ocorre(t, date)) continue;
    for (const s of t.slots){
      const ini = toMin(s.hora);
      out.push({ t, s, ini, fim: ini + Number(t.dur||0), pessoa: executor(s, date), key: t.id + ':' + s.id });
    }
  }
  return out.sort((a,b) => a.ini - b.ini || a.fim - b.fim);
}
function conflitos(date, occ){
  const m = {}; const add = (k, msg) => (m[k] = m[k] || []).push(msg);
  S.equipe.forEach(p => {
    const tc = S.turnos[turnoDe(p.id, date)];
    const ti = toMin(tc.ini), tf = toMin(tc.fim), li = toMin(tc.almIni), lf = toMin(tc.almFim);
    const mine = occ.filter(o => o.pessoa === p.id);
    mine.forEach((o, i) => {
      if (o.ini < ti || o.fim > tf) add(o.key, `Fora do horário de ${p.nome} (${tc.ini} às ${tc.fim})`);
      if (o.ini < lf && o.fim > li) add(o.key, `Cai no almoço de ${p.nome}`);
      if (o.t.altura && !p.altura.ok) add(o.key, `${p.nome} ainda não tem o curso de trabalho em altura`);
      for (let j = i+1; j < mine.length; j++){
        const q = mine[j];
        if (q.ini < o.fim){ add(o.key, `Sobrepõe ${q.t.nome} (${toHM(q.ini)})`); add(q.key, `Sobrepõe ${o.t.nome} (${toHM(o.ini)})`); }
      }
    });
  });
  return m;
}
const emPico = o => S.loja.picos.some(p => { const a = toMin(p); return o.ini < a+60 && o.fim > a; });
const proxAberto = d => { let x = d; for (let i=0;i<14;i++){ if (lojaAbre(x)) return x; x = addDays(x,1);} return d; };

/* =========================================================
   Estado da interface
   ========================================================= */
const ui = {
  dia: today(),
  semana: mondayOf(today()),
  dist: proxAberto(today()),
  filtro: 'todos'
};
const ROWH = 34;

/* =========================================================
   Linha do tempo
   ========================================================= */
function timeline(date, mode){
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = Math.max(60, b - a);
  const pct = m => ((Math.min(Math.max(m,a),b) - a) / tot * 100).toFixed(3) + '%';
  const wpct = m => (m / tot * 100).toFixed(3) + '%';
  const occ = ocorrencias(date), conf = conflitos(date, occ);
  const feitos = S.feitos[dkey(date)] || {};
  const isHoje = dkey(date) === dkey(today()), agora = nowMin();

  let ruler = '';
  for (let h = Math.ceil(a/60); h*60 <= b; h++) ruler += `<span class="tick" style="left:${pct(h*60)}">${h}h</span>`;
  ruler += S.loja.picos.map(p => `<span class="rpk" style="left:${pct(toMin(p))};width:${wpct(60)}" title="Pico das ${p}"></span>`).join('');

  const peaks = S.loja.picos.map(p => `<i class="peak" style="left:${pct(toMin(p))};width:${wpct(60)}"></i>`).join('');
  const nowLine = (isHoje && agora >= a && agora <= b) ? `<i class="nowline" style="left:${pct(agora)}"></i>` : '';

  const lanes = S.equipe.map((p, i) => {
    const tn = turnoDe(p.id, date), tc = S.turnos[tn];
    const mine = occ.filter(o => o.pessoa === p.id);
    const ends = [];
    mine.forEach(o => { let r = ends.findIndex(e => e <= o.ini); if (r < 0){ r = ends.length; ends.push(0); } ends[r] = o.fim; o.row = r; });
    const rows = Math.max(1, ends.length);
    const blocks = mine.map(o => {
      const done = !!feitos[o.key], w = conf[o.key];
      const tiny = o.t.dur < 18 ? ' tiny' : '';
      const tip = `${toHM(o.ini)} às ${toHM(o.fim)}: ${o.t.nome}${w ? '. Atenção: ' + w.join('; ') : ''}`;
      return `<button type="button" class="blk pc${i}${done?' is-done':''}${w?' is-warn':''}${tiny}" style="left:${pct(o.ini)};width:${wpct(o.t.dur)};top:${6 + o.row*ROWH}px"
        data-key="${o.key}" data-t="${o.t.id}" data-s="${o.s.id}" data-ini="${o.ini}" data-p="${p.id}" ${mode==='edit'?'data-drag':''}
        title="${esc(tip)}" aria-label="${esc(tip)}${mode==='edit'?'. Use as setas para mover.':''}">${o.t.altura?ic('ladder','i'):''}<span>${esc(o.t.nome)}</span></button>`;
    }).join('');
    return `<div class="lane">
      <div class="lane-lbl pc${i}"><b>${esc(p.nome)}</b><span>${esc(tc.nome)}<span class="hr"><br>${tc.ini} às ${tc.fim}</span></span></div>
      <div class="lane-track" data-pessoa="${p.id}" style="height:${12 + rows*ROWH}px">
        <i class="off l" style="left:0;width:${wpct(Math.max(0,toMin(tc.ini)-a))}"></i>
        <i class="off r" style="left:${pct(toMin(tc.fim))};right:0"></i>
        <i class="lunch" style="left:${pct(toMin(tc.almIni))};width:${wpct(toMin(tc.almFim)-toMin(tc.almIni))}" title="Almoço"><em>almoço</em></i>
        ${peaks}${nowLine}${blocks}
      </div></div>`;
  }).join('');

  return `<div class="tl" data-mode="${mode}">
    <div class="tl-scroll"><div class="tl-in">
      <div class="tl-ruler" aria-hidden="true">${ruler}</div>
      ${lanes}
    </div></div>
    <div class="tl-legend">
      <span><i class="sw pk"></i>Horário de pico</span>
      <span><i class="sw lu"></i>Almoço</span>
      <span><i class="sw of"></i>Fora do turno</span>
      <span><i class="sw wn"></i>Precisa de atenção</span>
      ${mode==='exec' ? '<span>Toque num bloco para marcar como feito</span>' : '<span>Arraste para mudar horário ou pessoa</span>'}
    </div>
  </div>`;
}

/* =========================================================
   Telas
   ========================================================= */
const ROTAS = [
  ['hoje','Hoje','today'], ['semana','Semana','week'], ['distribuicao','Distribuição','split'],
  ['escala','Escala','swap'], ['plano','Plano de ação','flag']
];
function rota(){ const h = location.hash.slice(1); return ROTAS.some(r => r[0] === h) ? h : 'hoje'; }

function ring(done, total, i){
  const r = 21, c = 2*Math.PI*r, f = total ? done/total : 0;
  return `<div class="ring pc${i}" role="img" aria-label="${done} de ${total} feitas"><svg viewBox="0 0 52 52"><circle class="bg" cx="26" cy="26" r="${r}"/><circle class="fg" cx="26" cy="26" r="${r}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-f)).toFixed(2)}"/></svg><b>${done}/${total}</b></div>`;
}
const checkSVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

function vHoje(){
  const d = ui.dia, k = dkey(d), isHoje = k === dkey(today());

  const head = `<div class="ph">
    <div class="t">
      <div class="kicker">${isHoje ? 'Hoje' : (d < today() ? 'Dia anterior' : 'Próximos dias')}</div>
      <div class="datenav">
        <button class="icon-btn" data-act="dia-prev" aria-label="Dia anterior">${ic('left')}</button>
        <h1>${fmtLong(d)}</h1>
        <button class="icon-btn" data-act="dia-next" aria-label="Próximo dia">${ic('right')}</button>
      </div>
      ${lojaAbre(d) ? `<p class="lead">${esc(t1.nome)} no ${esc(S.turnos.T1.nome)}, das ${S.turnos.T1.ini} às ${S.turnos.T1.fim}. ${esc(t2.nome)} no ${esc(S.turnos.T2.nome)}, das ${S.turnos.T2.ini} às ${S.turnos.T2.fim}.</p>` : ''}

    <div class="row">
      ${isHoje ? '' : `<button class="btn" data-act="dia-hoje">${ic('today')}Voltar para hoje</button>`}

    </div>
  </div>`;

  if (!lojaAbre(d)) return head + `<div class="closed"><h2>Sem rotina de limpeza neste dia</h2><p class="muted">A loja não tem expediente cadastrado para ${DIAS[d.getDay()]}. Os dias de funcionamento ficam em Escala.</p><p style="margin-top:16px"><button class="btn primary" data-act="dia-next">Ir para o próximo dia</button></p></div>`;

  const occ = ocorrencias(d), conf = conflitos(d, occ), feitos = S.feitos[k] || {}, agora = nowMin();
  const cards = S.equipe.map((p, i) => {
    const tn = turnoDe(p.id, d), tc = S.turnos[tn];
    const mine = occ.filter(o => o.pessoa === p.id);
    const nDone = mine.filter(o => feitos[o.key]).length;
    const items = mine.map(o => {
      const done = !!feitos[o.key];
      const st = isHoje && !done ? (agora >= o.ini && agora < o.fim ? 'now' : (agora >= o.fim ? 'late' : '')) : '';
      const tags = [];
      if (st === 'now') tags.push('<span class="tag b">Agora</span>');
      if (st === 'late') tags.push('<span class="tag w">Atrasada</span>');
      if (freqTag(o.t)) tags.push(`<span class="tag y">${freqTag(o.t)}</span>`);
      if (o.s.pessoa) tags.push(`<span class="tag">Fixa com ${esc(p.nome)}</span>`);
      (conf[o.key]||[]).forEach(w => tags.push(`<span class="tag w">${esc(w)}</span>`));
      return `<li><label class="it ${done?'done':''} ${st==='now'?'now':''}">
        <input type="checkbox" data-toggle="${o.key}" data-date="${k}" ${done?'checked':''}>
        <span class="box">${checkSVG}</span>
        <span class="it-b"><span class="it-h"><time>${toHM(o.ini)} às ${toHM(o.fim)}</time><b>${esc(o.t.nome)}</b></span>
        ${o.t.obs ? `<p>${esc(o.t.obs)}</p>` : ''}${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}</span>
      </label></li>`;
    }).join('');
    return `<article class="pcard pc${i}">
      <header><span class="avatar">${esc(p.nome.slice(0,1).toUpperCase())}</span>
        <span class="who"><b>${esc(p.nome)}</b><span>${esc(tc.nome)}, ${tc.ini} às ${tc.fim}. Almoço ${tc.almIni} às ${tc.almFim}</span></span>
        ${ring(nDone, mine.length, i)}</header>
      ${mine.length ? `<ol class="list">${items}</ol>` : `<p class="empty">Nenhuma tarefa para ${esc(p.nome)} neste dia.</p>`}
    </article>`;
  }).join('');

  const dem = S.tarefas.filter(t => t.ativo && t.freq.tipo === 'demanda');
  const demHTML = dem.length ? `<section class="sec"><h2>Sob demanda</h2><div class="panel">${dem.map(t => {
    const ult = (t.historico||[]).at(-1);
    return `<div class="dem"><div class="t"><b>${esc(t.nome)}</b><p class="small muted">${esc(t.obs||'')}${ult ? `. Última execução: ${fmtBR(parseKey(ult))}` : '. Ainda sem registro'}</p></div>
      <button class="btn" data-act="registrar" data-id="${t.id}">${ic('check')}Registrar execução</button></div>`;
  }).join('')}</div></section>` : '';

  return head + timeline(d, 'exec') + `<div class="cols">${cards}</div>` + demHTML;
}

function vSemana(){

  const fim = addDays(ini, 6), hoje = dkey(today());

        <button class="icon-btn" data-act="sem-next" aria-label="Próxima semana">${ic('right')}</button>

        ${dias.map(d => { const k = dkey(d); if (!ds.has(k)) return `<td class="na ${k===hoje?'today':''}"><span class="sr">Não se aplica</span></td>`;
          const done = !!(S.feitos[k]||{})[o.key];

      <label class="switch" title="${t.ativo?'Ativa':'Pausada'}" onclick="event.stopPropagation()"><input type="checkbox" data-ativa="${t.id}" ${t.ativo?'checked':''} aria-label="${t.ativo?'Pausar':'Ativar'} ${esc(t.nome)}"><span></span></label>
    </div>`).join('')}</div>`).join('');

  return `<div class="ph"><div class="t">
      <div class="kicker">Distribuição das tarefas</div>
      <h1>Quem faz o quê, e quando</h1>
      <p class="lead">As tarefas acompanham o turno: quando a escala alternar, quem assume o ${esc(S.turnos.T1.nome)} leva as tarefas do ${esc(S.turnos.T1.nome)}. Para prender uma tarefa a uma pessoa, abra a tarefa e escolha o nome.</p>
    </div>
    <div class="row"><button class="btn primary" data-act="nova-tarefa">${ic('plus')}Nova tarefa</button></div></div>
    <div class="row distnav" style="margin-bottom:14px">
      <button class="icon-btn" data-act="dist-sem" data-n="-7" aria-label="Semana anterior">${ic('left')}</button>
      <div class="daychips">${dias.map(x => `<button class="chip" data-act="dist-dia" data-date="${dkey(x)}" aria-pressed="${dkey(x)===dkey(d)}" ${lojaAbre(x)?'':'disabled'}>${DIAS_C[x.getDay()]} ${x.getDate()}</button>`).join('')}</div>
      <button class="icon-btn" data-act="dist-sem" data-n="7" aria-label="Próxima semana">${ic('right')}</button>

   ========================================================= */
function ligarArrastar(){
  const tl = $('.tl[data-mode="edit"]'); if (!tl) return;
  const lanes = $$('.lane-track', tl);
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = b - a;
  $$('.blk[data-drag]', tl).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const track = el.parentElement, rect = track.getBoundingClientRect();
      const ppm = rect.width / tot;
      const st = { x:e.clientX, y:e.clientY, moved:false, dm:0, tgt:track };
      const ini = Number(el.dataset.ini);
      const t = S.tarefas.find(x => x.id === el.dataset.t);
      let tip = null;
      el.setPointerCapture(e.pointerId);
      const move = ev => {
        const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
        if (!st.moved && Math.hypot(dx, dy) < 5) return;
        if (!st.moved){ st.moved = true; el.classList.add('dragging'); tip = document.createElement('div'); tip.className = 'dragtip'; document.body.appendChild(tip); }
        let dm = Math.round(dx / ppm / 5) * 5;
        dm = Math.max(a - ini, Math.min(b - ini - t.dur, dm));
        st.dm = dm;
        const tgt = lanes.find(l => { const r = l.getBoundingClientRect(); return ev.clientY >= r.top - 8 && ev.clientY <= r.bottom + 8; }) || track;
        st.tgt = tgt;
        lanes.forEach(l => l.classList.toggle('drop', l === tgt && l !== track));
        const ty = tgt === track ? 0 : tgt.getBoundingClientRect().top - rect.top + 6 - parseFloat(el.style.top);
        el.style.transform = `translate(${dm*ppm}px, ${ty}px)`;
        const nome = pessoa(tgt.dataset.pessoa).nome;
        tip.textContent = `${toHM(ini+dm)} às ${toHM(ini+dm+t.dur)}, ${nome}`;
        tip.style.left = ev.clientX + 'px'; tip.style.top = ev.clientY + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        lanes.forEach(l => l.classList.remove('drop'));
        tip && tip.remove();
        if (!st.moved){ abrirTarefa(el.dataset.t); return; }
        moverSlot(el.dataset.t, el.dataset.s, st.dm, st.tgt.dataset.pessoa, el.dataset.p);
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, k === 'ArrowLeft' ? -5 : 5, el.dataset.p, el.dataset.p, true); }
      else if (k === 'ArrowUp' || k === 'ArrowDown'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, 0, outra(el.dataset.p), el.dataset.p, true); }
      else if (k === 'Enter' || k === ' '){ e.preventDefault(); abrirTarefa(el.dataset.t); }
    });
  });
}
function moverSlot(tid, sid, dm, paraPessoa, dePessoa, teclado){
  const t = S.tarefas.find(x => x.id === tid), s = t.slots.find(x => x.id === sid);
  if (!dm && paraPessoa === dePessoa){ render(false); return; }
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha);
  mudar(() => {
    s.hora = toHM(Math.max(a, Math.min(b - t.dur, toMin(s.hora) + dm)));
    if (paraPessoa !== dePessoa){
      if (s.pessoa) s.pessoa = paraPessoa;
      else s.posto = turnoDe(paraPessoa, ui.dist);
    }
  }, teclado && paraPessoa === dePessoa ? null :
     `${t.nome} ${paraPessoa !== dePessoa ? `passou para ${pessoa(paraPessoa).nome}` : 'mudou de horário'}, às ${toHM(Math.max(a, Math.min(b - t.dur, toMin(s.hora) + dm)))}`);
  if (teclado){ const nb = $(`.blk[data-s="${sid}"]`); nb && nb.focus(); }
}

  const ordSel = v => `<label class="f"><span>Qual semana do mês</span><select name="ordem">${[1,2,3,4,5].map(o => `<option value="${o}" ${v===o?'selected':''}>${o===5?'Última':o+'ª'}</option>`).join('')}</select></label>`;
  switch (f.tipo){
    case 'semanal': return `<div class="f"><span>Em quais dias</span><div class="checks">${[1,2,3,4,5,6,0].map(w => `<label><input type="checkbox" name="dias" value="${w}" ${(f.dias||[]).includes(w)?'checked':''}><span>${DIAS_C[w]}</span></label>`).join('')}</div></div>`;
    case 'quinzenal': return `<div class="f2">${diaSel('dia', f.dia ?? 3)}<label class="f"><span>Começa</span><select name="paridade"><option value="0" ${!f.paridade?'selected':''}>Na semana do início do rodízio</option><option value="1" ${f.paridade===1?'selected':''}>Na semana seguinte</option></select></label></div>`;
    case 'mensal': return `<div class="f2">${ordSel(f.ordem ?? 1)}${diaSel('dia', f.dia ?? 1)}</div>`;
    case 'trimestral': return `<div class="f3">${ordSel(f.ordem ?? 1)}${diaSel('dia', f.dia ?? 1)}<label class="f"><span>A partir de</span><select name="mesInicial">${MESES.map((m,i) => `<option value="${i}" ${(f.mesInicial??0)===i?'selected':''}>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></label></div>`;
    case 'demanda': return `<p class="legend-sm">Aparece em Hoje, na seção Sob demanda, com botão para registrar quando foi feita.</p>`;
    default: return '';
  }
}
function lerSlots(){
  return $$('#slots .slot-ed').map(r => ({ id:r.dataset.sid, hora:$('[data-k=hora]', r).value || '09:00', posto:$('[data-k=posto]', r).value, pessoa:$('[data-k=pessoa]', r).value || null }));
}
function lerFreq(fm){
  const tipo = fm.tipo.value, f = { tipo };
  if (tipo === 'semanal') f.dias = $$('input[name=dias]:checked', fm).map(i => Number(i.value));
  if (tipo === 'quinzenal'){ f.dia = Number(fm.dia.value); f.paridade = Number(fm.paridade.value); }
  if (tipo === 'mensal' || tipo === 'trimestral'){ f.ordem = Number(fm.ordem.value); f.dia = Number(fm.dia.value); }
  if (tipo === 'trimestral') f.mesInicial = Number(fm.mesInicial.value);
  return f;
}
function salvarTarefa(){
  const fm = $('#ft'), nome = fm.nome.value.trim();
  if (!nome){ fm.nome.focus(); fm.nome.setCustomValidity('Dê um nome para a tarefa'); fm.nome.reportValidity(); return; }
  const freq = lerFreq(fm);
  if (freq.tipo === 'semanal' && !freq.dias.length){ toast('Escolha pelo menos um dia da semana.'); return; }
  const slots = lerSlots();
  if (!slots.length){ toast('Adicione pelo menos um horário.'); return; }
  const novo = { ...rascunho, nome, ambiente:fm.ambiente.value.trim() || 'Outros', obs:fm.obs.value.trim(), dur:Math.max(5, Number(fm.dur.value)||15), freq, slots, altura:fm.altura.checked, ativo:fm.ativo.checked };
  const eraNova = novo._nova; delete novo._nova;
  fecharGaveta();
  mudar(() => {
    const i = S.tarefas.findIndex(x => x.id === novo.id);
    if (i >= 0) S.tarefas[i] = novo; else S.tarefas.push(novo);
  }, eraNova ? `Tarefa criada: ${nome}` : `Tarefa salva: ${nome}`);
}
function abrirAcao(id){
  const a = id ? S.acoes.find(x => x.id === id) : { id:uid(), oque:'', porque:'', quem:'', prazo:dkey(addDays(today(),7)), status:'afazer' };
  rascunho = { ...a, _nova:!id };
  abrirGaveta(id ? 'Editar ação' : 'Nova ação', `<form id="fa" onsubmit="return false">
    <label class="f"><span>O que fazer</span><input type="text" name="oque" value="${esc(a.oque)}" required></label>
    <label class="f"><span>Por quê</span><textarea name="porque" rows="2">${esc(a.porque)}</textarea></label>
    <div class="f2"><label class="f"><span>Responsável</span><input type="text" name="quem" value="${esc(a.quem)}"></label>
    <label class="f"><span>Prazo</span><input type="date" name="prazo" value="${a.prazo||''}"></label></div>
    <label class="f"><span>Status</span><select name="status">${[['afazer','A fazer'],['andamento','Em andamento'],['feito','Concluída']].map(([v,l]) => `<option value="${v}" ${a.status===v?'selected':''}>${l}</option>`).join('')}</select></label>
  </form>`, `${id ? `<button class="btn danger" data-act="excluir-acao">${ic('trash')}Excluir</button>` : ''}<span class="spacer"></span>
    <button class="btn" data-act="fechar">Cancelar</button><button class="btn primary" data-act="salvar-acao">Salvar ação</button>`);
}

/* =========================================================
   Impressão
   ========================================================= */
function printHead(titulo, meta, sub){
  return `<div class="pp-h"><div class="logo-box">${logoHTML()}</div><h1>${esc(titulo)}</h1><div class="meta"><b>${esc(meta)}</b>${esc(sub||'')}</div></div><div class="pp-stripe"></div>`;
}
function imprimirSemana(){
  const ini = ui.semana, dias = [0,1,2,3,4,5,6].map(i => addDays(ini,i)).filter(lojaAbre);
  const fim = addDays(ini, 6);
  const html = S.equipe.map(p => {
    const rows = new Map();
    dias.forEach(d => ocorrencias(d).filter(o => o.pessoa === p.id).forEach(o => { if (!rows.has(o.key)) rows.set(o.key, {o, ds:new Set()}); rows.get(o.key).ds.add(dkey(d)); }));
    const lista = [...rows.values()].sort((x,y) => x.o.ini - y.o.ini);
    const turnos = [...new Set(dias.map(d => { const tc = S.turnos[turnoDe(p.id,d)]; return `${tc.nome} (${tc.ini} às ${tc.fim})`; }))].join(' e ');
    return `<section class="pp">${printHead('Checklist semanal de limpeza', p.nome, `Semana de ${fmtBR(ini)} a ${fmtBR(fim)}. ${turnos}`)}
      <table><thead><tr><th>Horário</th><th style="text-align:left">Tarefa</th>${dias.map(d => `<th>${DIAS_C[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}</th>`).join('')}</tr></thead>
      <tbody>${lista.map(({o,ds}) => `<tr><td class="hr">${toHM(o.ini)}</td><td class="tk">${esc(o.t.nome)}${o.t.altura?'<span class="alt">ALTURA</span>':''}${o.t.obs?`<small>${esc(o.t.obs)}</small>`:''}</td>
        ${dias.map(d => ds.has(dkey(d)) ? '<td><span class="sq"></span></td>' : '<td class="na"></td>').join('')}</tr>`).join('')}
      <tr><td class="hr">Visto</td><td class="tk">Rubrica de quem conferiu</td>${dias.map(() => '<td style="height:26px"></td>').join('')}</tr></tbody></table>
      <div class="sig"><div>Assinatura: ${esc(p.nome)}</div><div>Conferido por</div><div>Observações</div></div></section>`;
  }).join('');
  imprimir(html);
}
function imprimirDia(){
  const d = ui.dia, occ = ocorrencias(d);
  const cols = S.equipe.map(p => { const tc = S.turnos[turnoDe(p.id,d)];
    return `<div><h2>${esc(p.nome)}: ${esc(tc.nome)}, ${tc.ini} às ${tc.fim}</h2><table><thead><tr><th>Feito</th><th>Horário</th><th style="text-align:left">Tarefa</th></tr></thead><tbody>
      ${occ.filter(o => o.pessoa === p.id).map(o => `<tr><td><span class="sq"></span></td><td class="hr">${toHM(o.ini)} às ${toHM(o.fim)}</td><td class="tk">${esc(o.t.nome)}${o.t.altura?'<span class="alt">ALTURA</span>':''}${o.t.obs?`<small>${esc(o.t.obs)}</small>`:''}</td></tr>`).join('')}
    </tbody></table></div>`; }).join('');
  imprimir(`<section class="pp">${printHead('Checklist de limpeza do dia', fmtLong(d), `Picos: ${S.loja.picos.join(', ')}`)}<div class="two">${cols}</div>
    <div class="sig"><div>Assinatura</div><div>Assinatura</div><div>Conferido por</div></div></section>`);
}
function imprimir(html){
  $('#print-root').innerHTML = html;
  setTimeout(() => window.print(), 60);
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'dia-prev': ui.dia = addDays(ui.dia, -1); render(false); break;
    case 'dia-next': ui.dia = addDays(ui.dia, 1); render(false); break;
    case 'dia-hoje': ui.dia = today(); render(false); break;
    case 'sem-prev': ui.semana = addDays(ui.semana, -7); render(false); break;
    case 'sem-next': ui.semana = addDays(ui.semana, 7); render(false); break;
    case 'sem-hoje': ui.semana = mondayOf(today()); render(false); break;
    case 'dist-dia': ui.dist = parseKey(el.dataset.date); render(false); break;
    case 'dist-sem': ui.dist = proxAberto(mondayOf(addDays(ui.dist, Number(el.dataset.n)))); render(false); break;
    case 'print-dia': imprimirDia(); break;
    case 'print-semana': imprimirSemana(); break;
    case 'nova-tarefa': abrirTarefa(null); break;
    case 'edit-tarefa': abrirTarefa(id); break;
    case 'fechar': fecharGaveta(); break;
    case 'slot-add': {
      const s = { id:uid(), hora:'09:00', posto:'T1', pessoa:null };
      $('#slots').insertAdjacentHTML('beforeend', slotRow(s)); $('#slots .slot-ed:last-child input').focus(); break;
    }
    case 'slot-del': el.closest('.slot-ed').remove(); break;
    case 'salvar-tarefa': salvarTarefa(); break;
    case 'excluir-tarefa': { const nome = rascunho.nome; const tid = rascunho.id; fecharGaveta(); mudar(() => { S.tarefas = S.tarefas.filter(t => t.id !== tid); }, `Tarefa excluída: ${nome}`); break; }
    case 'registrar': { const t = S.tarefas.find(x => x.id === id); mudar(() => { t.historico = [...(t.historico||[]), dkey(ui.dia)]; }, `${t.nome}: execução registrada em ${fmtBR(ui.dia)}`); break; }
    case 'trocar': { const p = el.dataset.p; mudar(() => { if (S.rodizio.trocas[p]) delete S.rodizio.trocas[p]; else S.rodizio.trocas[p] = true; }, 'Escala atualizada'); break; }
    case 'filtro': ui.filtro = ui.filtro === el.dataset.f ? 'todos' : el.dataset.f; render(false); break;
    case 'status': { const a = S.acoes.find(x => x.id === id); const nx = {afazer:'andamento', andamento:'feito', feito:'afazer'}[a.status]; mudar(() => { a.status = nx; }, null, false); break; }
    case 'concluir': { const a = S.acoes.find(x => x.id === id); mudar(() => { a.status = a.status === 'feito' ? 'afazer' : 'feito'; }, a.status === 'feito' ? null : `Ação concluída: ${a.oque}`); break; }
    case 'nova-acao': abrirAcao(null); break;
    case 'edit-acao': abrirAcao(id); break;
    case 'salvar-acao': {
      const fm = $('#fa'), oque = fm.oque.value.trim();
      if (!oque){ fm.oque.setCustomValidity('Descreva a ação'); fm.oque.reportValidity(); return; }
      const nova = { id:rascunho.id, oque, porque:fm.porque.value.trim(), quem:fm.quem.value.trim(), prazo:fm.prazo.value, status:fm.status.value };
      const eraNova = rascunho._nova; fecharGaveta();
      mudar(() => { const i = S.acoes.findIndex(x => x.id === nova.id); if (i >= 0) S.acoes[i] = nova; else S.acoes.push(nova); }, eraNova ? 'Ação criada' : 'Ação salva');
      break;
    }
    case 'excluir-acao': { const aid = rascunho.id; fecharGaveta(); mudar(() => { S.acoes = S.acoes.filter(a => a.id !== aid); }, 'Ação excluída'); break; }
    case 'undo': { const s = $('#toast')._snap; if (s){ S = JSON.parse(s); salvar(); render(false); toast('Alteração desfeita'); } break; }
    case 'exportar': {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `escala-limpeza-bartofil-${dkey(today())}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup exportado'); break;
    }
    case 'importar': $('#file-in').click(); break;
    case 'restaurar': {
      if (!confirm('Restaurar o padrão apaga as mudanças e os registros de execução deste navegador. Continuar?')) return;
      const keepLogo = S.logo; mudar(() => { S = estadoPadrao(); S.logo = keepLogo; }, 'Padrão da loja restaurado'); break;
    }
    case 'logo-up': $('#logo-in').click(); break;
    case 'logo-reset': mudar(() => { S.logo = null; }, 'Logo padrão em uso'); break;
  }
});
$('#scrim').addEventListener('click', fecharGaveta);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#drawer').classList.contains('open')) fecharGaveta();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.toggle){
    const k = el.dataset.date, key = el.dataset.toggle;
    S.feitos[k] = S.feitos[k] || {};
    if (el.checked) S.feitos[k][key] = Date.now(); else delete S.feitos[k][key];
    salvar(); render(false);
    const back = $(`[data-toggle="${CSS.escape(key)}"][data-date="${k}"]`); back && back.focus({preventScroll:true});
    return;
  }
  if (el.dataset.ativa){ const t = S.tarefas.find(x => x.id === el.dataset.ativa); mudar(() => { t.ativo = el.checked; }, `${t.nome} ${el.checked ? 'ativada' : 'pausada'}`); return; }
  if (el.dataset.dia){
    const w = Number(el.dataset.dia);
    mudar(() => { S.loja.dias = el.checked ? [...new Set([...S.loja.dias, w])] : S.loja.dias.filter(x => x !== w); }, null, false);
    ui.dist = proxAberto(ui.dist); return;
  }
  if (el.dataset.set){
    const path = el.dataset.set.split('.');
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (path.join('.') === 'loja.picos') val = val.split(/[,;\s]+/).map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => x.padStart(5,'0'));
    if (el.type === 'time' && !val) return;
    if (el.type === 'text' && typeof val === 'string' && !val.trim() && path.at(-1) === 'nome') return;
    mudar(() => { let o = S; path.slice(0,-1).forEach(k => o = o[k]); o[path.at(-1)] = val; }, null, false);
    return;
  }
  if (el.matches('[data-freq]')){ rascunho.freq = { tipo: el.value, ...(el.value==='semanal'?{dias:[1]}:{}), ...(el.value==='quinzenal'?{dia:3,paridade:0}:{}), ...(['mensal','trimestral'].includes(el.value)?{ordem:1,dia:1}:{}), ...(el.value==='trimestral'?{mesInicial:today().getMonth()}:{}) }; $('#freq-ex').innerHTML = freqExtra(); }
});
$('#file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.tarefas) || !Array.isArray(d.equipe)) throw 0; mudar(() => { S = d; }, 'Backup importado'); } catch(_){ toast('Esse arquivo não é um backup da escala. Use o arquivo .json exportado aqui.'); } };
  r.readAsText(f); e.target.value = '';
});
$('#logo-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 700*1024){ toast('Logo muito pesada. Use um arquivo de até 700 KB.'); return; }
  const r = new FileReader();
  r.onload = () => mudar(() => { S.logo = r.result; }, 'Logo atualizada');
  r.readAsDataURL(f); e.target.value = '';
});

render();
</script>
</body>
</html>
