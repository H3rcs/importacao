<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B4EA2">
<title>Escala de Limpeza – Loja Bartofil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0B4EA2; --blue-deep:#06356F; --blue-tint:#E4EDF9; --blue-line:#B9CDEB;
  --green:#169C46; --green-deep:#0C6A2F; --green-tint:#E1F3E7;
  --yellow:#FFC72C; --yellow-deep:#8A6200; --yellow-tint:#FFF4D2;
  --ink:#14243D; --muted:#5A6A80; --soft:#8796AA; --line:#D6DEE9; --line-2:#E6ECF3;
  --bg:#EEF2F7; --surface:#FFFFFF;
  --warn:#C25A0E; --warn-tint:#FDEEE1;
  --r-lg:16px; --r-md:10px; --r-sm:6px;
  --font:"Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --tabbar:0px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- topo ---------- */
.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:30}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:10px 24px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;color:#fff;text-decoration:none;flex:none;background:none;border:0;padding:0}
.brand img,.brand svg.logo{height:38px;width:auto;display:block;border-radius:4px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;border-left:1px solid rgba(255,255,255,.28);padding-left:14px;text-align:left}
.brand-t strong{font-stretch:112%;font-weight:750;font-size:16px;letter-spacing:-.005em}
.brand-t span{font-size:12.5px;opacity:.78}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{color:#fff;background:none;border:0;padding:8px 13px;border-radius:999px;font-weight:550;font-size:14.5px;opacity:.86;transition:background .15s,opacity .15s;white-space:nowrap}
.tabs button:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs button[aria-current="page"]{background:#fff;color:var(--blue);opacity:1}
.savest{font-size:12px;opacity:.8;white-space:nowrap;min-width:64px;text-align:right}
.stripe{display:grid;grid-template-rows:5px 5px}
.stripe i:first-child{background:var(--green)} .stripe i:last-child{background:var(--yellow)}
.tabbar{display:none}

main{max-width:1320px;margin:0 auto;padding:28px 24px calc(64px + var(--tabbar))}
main:focus{outline:none}
.boot{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-size:16px;gap:14px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- tipografia ---------- */
h1,h2,h3{margin:0;font-stretch:112%;letter-spacing:-.012em;line-height:1.12}
h1{font-size:clamp(28px,3.4vw,40px);font-weight:780}
h2{font-size:22px;font-weight:720}
h3{font-size:17px;font-weight:680}
p{margin:0}
.lead{color:var(--muted);font-size:16px;max-width:72ch;margin-top:8px}
.muted{color:var(--muted)}
.small{font-size:13px}

/* ---------- botões ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--blue-line);background:#FAFCFF}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:rgba(11,78,162,.07)}
.btn.danger{color:var(--warn);border-color:#F1C7A6}
.btn[disabled]{opacity:.55;cursor:progress}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn:hover{border-color:var(--blue-line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}

/* ---------- cabeçalho de página ---------- */
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph .t{flex:1;min-width:260px}
.datenav{display:flex;align-items:center;gap:10px}
.kicker{font-size:14px;color:var(--blue);font-weight:650;margin-bottom:6px}

/* ---------- linha do tempo ---------- */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.tl-scroll{overflow-x:auto;scrollbar-width:thin}
.tl-in{min-width:1000px;padding:6px 18px 14px 0}
.tl-ruler{position:relative;height:34px;margin-left:168px}
.tick{position:absolute;bottom:6px;transform:translateX(-50%);font-size:12px;color:var(--soft);font-weight:550}
.tick::after{content:"";position:absolute;left:50%;top:100%;height:6px;width:1px;background:var(--line)}
.rpk{position:absolute;bottom:0;height:4px;background:var(--blue);border-radius:2px;opacity:.85}
.lane{display:flex;align-items:stretch;border-top:1px solid var(--line-2)}
.lane:first-of-type{border-top:0}
.lane-lbl{width:168px;flex:none;padding:12px 14px 12px 18px;position:sticky;left:0;z-index:6;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px}
.lane-lbl::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--pc)}
.lane-lbl b{font-size:15.5px;font-weight:700;font-stretch:108%}
.lane-lbl span{font-size:12.5px;color:var(--muted);line-height:1.3}
.lane-track{position:relative;flex:1;margin:8px 0;border-radius:var(--r-md);background:#fff;transition:background .15s, box-shadow .15s}
.lane-track.drop{background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue-line)}
.lane-track .off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#F1F4F8 0 6px,#E9EEF4 6px 7px)}
.lane-track .off.l{border-radius:var(--r-md) 0 0 var(--r-md)} .lane-track .off.r{border-radius:0 var(--r-md) var(--r-md) 0}
.lane-track .lunch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,#FBF6E6 0 6px,#F5ECCC 6px 7px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.lane-track .lunch em{font-style:normal;font-size:10.5px;color:var(--yellow-deep);font-weight:600}
.lane-track .peak{position:absolute;top:0;bottom:0;background:rgba(11,78,162,.055);border-left:1px dashed rgba(11,78,162,.22)}
.nowline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--blue-deep);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-1px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--blue-deep);transform:translate(-50%,-50%)}
.blk{position:absolute;height:28px;border:0;border-radius:7px;padding:0 8px;background:var(--pc);color:var(--pc-ink);font-size:12.5px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;z-index:2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:filter .12s, opacity .2s}
.blk span{overflow:hidden;text-overflow:ellipsis}
.blk:hover{filter:brightness(1.06)}
.blk.hv{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.16) 7px 9px)}
.blk.is-done{opacity:.38}
.blk.is-done span{text-decoration:line-through}
.blk.is-warn{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--warn)}
.blk.tiny span{display:none}
.blk.tiny svg{display:none}
.tl[data-mode="edit"] .blk{cursor:grab;touch-action:none}
.blk.dragging{cursor:grabbing;z-index:10;box-shadow:0 10px 24px rgba(20,36,61,.28),0 0 0 2px #fff;transition:none;filter:none}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:#fff;font-size:12.5px;font-weight:650;padding:5px 9px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
.tl-legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px 12px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.sw.pk{background:rgba(11,78,162,.12);border-left:1px dashed rgba(11,78,162,.4)}
.sw.lu{background:repeating-linear-gradient(135deg,#FBF6E6 0 3px,#F0E3B5 3px 4px)}
.sw.of{background:repeating-linear-gradient(135deg,#F1F4F8 0 3px,#DDE4EC 3px 4px)}
.sw.wn{background:#fff;box-shadow:0 0 0 2px var(--warn)}
.sw.hv{background:#7C8BA0 repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.35) 3px 4px)}

/* pessoas */
.pc0{--pc:var(--green);--pc-ink:#fff;--pc-tint:var(--green-tint);--pc-deep:var(--green-deep);--pc-bar:var(--green)}
.pc1{--pc:var(--yellow);--pc-ink:#3B2A00;--pc-tint:var(--yellow-tint);--pc-deep:var(--yellow-deep);--pc-bar:#E0A800}

/* ---------- Hoje ---------- */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pcard>header{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-2);background:linear-gradient(var(--pc-tint),var(--pc-tint)) left/6px 100% no-repeat}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pc);color:var(--pc-ink);display:grid;place-items:center;font-weight:750;font-size:17px;font-stretch:110%;flex:none}
.pcard header .who{flex:1;min-width:0}
.pcard header .who b{display:block;font-size:18px;font-stretch:110%;font-weight:720}
.pcard header .who span{font-size:13px;color:var(--muted);display:block}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5}
.ring .bg{stroke:var(--line-2)} .ring .fg{stroke:var(--pc-bar);stroke-linecap:round;transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:700}
.list{list-style:none;margin:0;padding:6px 0}
.it{display:flex;gap:14px;padding:11px 18px;cursor:pointer;position:relative;align-items:flex-start;transition:background .12s}
.it:hover{background:#F7F9FC}
.it input{position:absolute;opacity:0;pointer-events:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid #B7C3D3;flex:none;margin-top:1px;display:grid;place-items:center;background:#fff;transition:background .15s,border-color .15s}
.box svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s ease .05s}
.it input:checked+.box,.cell input:checked+.box{background:var(--pc-bar);border-color:var(--pc-bar)}
.it input:checked+.box svg,.cell input:checked+.box svg{stroke-dashoffset:0}
.it input:focus-visible+.box,.cell input:focus-visible+.box{outline:3px solid var(--blue);outline-offset:2px}
.it-b{flex:1;min-width:0}
.it-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.it-h time{font-weight:650;font-size:13.5px;color:var(--muted);min-width:92px}
.it-h b{font-weight:620;font-size:15px}
.it p{font-size:13px;color:var(--muted);margin-top:1px}
.it.done .it-h b{text-decoration:line-through;text-decoration-color:rgba(20,36,61,.35);color:var(--muted)}
.it.now{background:var(--blue-tint)}
.it.now::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--blue);border-radius:0 3px 3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:620;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--muted);line-height:1.5;border:0}
button.tag{cursor:pointer}
button.tag:hover{background:var(--blue-tint);color:var(--blue)}
.tag.b{background:var(--blue-tint);color:var(--blue)}
.tag.w{background:var(--warn-tint);color:var(--warn)}
.tag.g{background:var(--green-tint);color:var(--green-deep)}
.tag.y{background:var(--yellow-tint);color:var(--yellow-deep)}
.tag.h{background:#E9EDF3;color:var(--ink)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px}
.panel+.panel{margin-top:16px}
.sec{margin-top:30px}
.sec>h2{margin-bottom:12px}
.sec>.lead{margin:-6px 0 14px}
.dem{display:flex;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line-2)}
.dem:first-child{border-top:0;padding-top:0}
.dem .t{flex:1}
.closed{background:var(--surface);border:1px dashed var(--blue-line);border-radius:var(--r-lg);padding:40px 24px;text-align:center}
.closed h2{margin-bottom:8px}

/* ---------- Semana ---------- */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:20px}
.wk>header{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.wk-scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;min-width:720px}
.grid th,.grid td{padding:9px 10px;border-bottom:1px solid var(--line-2);text-align:center;font-size:13.5px}
.grid thead th{font-weight:650;color:var(--muted);font-size:12.5px;background:#FAFBFD}
.grid thead th b{display:block;color:var(--ink);font-size:14px}
.grid thead th.today,.grid thead th.today b{color:var(--blue)}
.grid th.task{text-align:left;font-weight:500;width:42%}
.grid th.task b{font-weight:620;font-size:14px}
.grid th.task span{color:var(--muted);font-size:12.5px;margin-right:8px;font-weight:600}
.grid td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,#F1F4F8 6px 7px)}
.grid td.today{background:rgba(11,78,162,.04)}
.cell{display:inline-grid;place-items:center;cursor:pointer;position:relative}
.cell input{position:absolute;opacity:0;pointer-events:none}
.cell .box{width:22px;height:22px}
.pct{font-size:11.5px;font-weight:650;color:var(--soft);display:block;margin-top:2px}

/* ---------- Distribuição / equilíbrio ---------- */
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip:disabled{opacity:.4;cursor:not-allowed}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--blue-tint);color:var(--blue-deep);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:0 0 16px}
.eq-top{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.scale .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;margin-top:6px}
.scale .side b{display:block;font-size:34px;font-stretch:118%;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.scale .side span{font-size:13.5px;color:var(--muted);font-weight:600}
.scale .side.r{text-align:right}
.scale .mid{font-size:13px;color:var(--muted);text-align:center;padding-bottom:6px}
.scale .mid b{display:block;font-size:20px;color:var(--ink);font-stretch:110%}
.beam{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 6px;background:var(--line-2);position:relative}
.beam i{display:block;height:100%}
.beam::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.verdict{font-size:14px;margin-top:10px}
.verdict.ok{color:var(--green-deep)} .verdict.bad{color:var(--warn)}
table.days{width:100%;border-collapse:collapse}
.days th,.days td{padding:8px 6px;font-size:13.5px;border-top:1px solid var(--line-2);text-align:left}
.days thead th{border-top:0;color:var(--muted);font-size:12.5px;font-weight:650}
.days td.n{text-align:right;white-space:nowrap}
.minibar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line-2);min-width:90px}
.minibar i{display:block;height:100%}
.mix{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;align-items:center}
.mix .lbl{font-size:13.5px;font-weight:600}
.mix .lbl span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mixbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line-2);font-size:11.5px;font-weight:700}
.mixbar i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap;overflow:hidden}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:flex-start;font-size:14px}
.att li:first-child{border-top:0}
.att .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);margin-top:7px;flex:none}
.att button{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.amb{margin-top:18px}
.amb h3{margin:0 0 8px;color:var(--muted);font-size:14px;font-weight:650;font-stretch:100%}
.trow{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(160px,1fr) 2fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.trow:hover{border-color:var(--blue-line)}
.trow.off{opacity:.55}
.trow .n b{display:block;font-weight:650}
.trow .n span{font-size:12.5px;color:var(--muted)}
.trow .f{font-size:13.5px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:620;padding:3px 9px 3px 4px;border-radius:999px;background:var(--line-2)}
.slot i{width:18px;height:18px;border-radius:50%;background:var(--pc);color:var(--pc-ink);font-style:normal;font-size:10.5px;display:grid;place-items:center;font-weight:750}
.peso{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.peso i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.peso i.on{background:var(--ink)}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#C9D3E0;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Escala ---------- */
.now-shift{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
.shiftcard{border-radius:var(--r-lg);padding:20px;background:var(--pc);color:var(--pc-ink)}
.shiftcard small{font-size:13.5px;opacity:.85;font-weight:600}
.shiftcard b{display:block;font-size:30px;font-stretch:118%;font-weight:800;margin:4px 0 2px;letter-spacing:-.02em}
.shiftcard span{font-size:15px;font-weight:550}
.weeks{width:100%;border-collapse:collapse}
.weeks td{padding:10px 8px;border-top:1px solid var(--line-2);font-size:14px;vertical-align:middle}
.weeks tr:first-child td{border-top:0}
.weeks tr.cur td{background:var(--blue-tint)}

.toast{position:fixed;left:50%;bottom:calc(24px + var(--tabbar));transform:translate(-50%,140%);background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px 12px 18px;display:flex;gap:16px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(10,22,40,.3);max-width:calc(100% - 32px);font-size:14px;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}

.toast button{background:transparent;border:0;color:var(--yellow);font-weight:700;padding:4px 6px}

const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const KEY = 'bartofil-escala-limpeza:v2';
let S = null;
const chamar = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
function valido(d){ return d && d.versao === 2 && Array.isArray(d.tarefas) && Array.isArray(d.equipe) && Array.isArray(d.pops); }
function carregarLocal(){
  try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (valido(d)) return d; } } catch(e){}
  return estadoPadrao();
}
let saveT = null, salvando = false, pendente = false;
function status(txt){ const el = $('#savest'); if (el) el.textContent = txt; }
function salvar(){
  const lim = dkey(addDays(today(), -180));
  for (const k of Object.keys(S.feitos)) if (k < lim) delete S.feitos[k];
  if (!GAS){
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('Não foi possível salvar neste navegador. Exporte um backup em Escala.'); }
    return;
  }
  pendente = true; status('Salvando…');
  clearTimeout(saveT); saveT = setTimeout(enviar, 700);
}
async function enviar(){
  if (salvando){ saveT = setTimeout(enviar, 500); return; }
  salvando = true; pendente = false;
  try {
    const r = await chamar('salvarDados', JSON.stringify(S), S.rev);
    if (r && r.conflito){
      S = JSON.parse(r.json); S.rev = r.rev; render(false);
      toast('A escala foi alterada em outro computador. Carreguei a versão mais nova: refaça a última mudança.');
    } else if (r) { S.rev = r.rev; }

  } catch(e){ status('Sem conexão'); toast('Não consegui salvar na planilha. Confira a internet: vou tentar de novo.'); saveT = setTimeout(enviar, 5000); }
  salvando = false;
}
async function iniciar(){
  if (GAS){
    try {
      const r = await chamar('obterDados');
      const d = r && r.json ? JSON.parse(r.json) : null;
      if (valido(d)){ S = d; S.rev = r.rev; }
      else { S = estadoPadrao(); S.rev = r ? r.rev : 0; salvar(); }
      status('Salvo');
    } catch(e){
      $('#app').innerHTML = `<div class="closed"><h2>Não consegui abrir a planilha de dados</h2><p class="muted">${esc(e && e.message || e)}</p><p class="muted" style="margin-top:8px">No editor do Apps Script, rode a função instalar uma vez e autorize.</p></div>`;
      return;

    }, 120000);
  } else {

  }
  ui.dist = proxAberto(today());

}

/* =========================================================
   Regras: recorrência, rodízio, ocorrências, conflitos
   ========================================================= */
const lojaAbre = d => S.loja.dias.includes(d.getDay());
function semanasEntre(a, b){ return Math.round((mondayOf(b) - mondayOf(a)) / (7*864e5)); }
function bateOrdem(date, ordem){
  if (ordem >= 5) return addDays(date, 7).getMonth() !== date.getMonth();
  return Math.ceil(date.getDate()/7) === ordem;
}
function ocorre(t, date){
  if (!t.ativo || !lojaAbre(date)) return false;
  const f = t.freq, wd = date.getDay();
  switch (f.tipo){
    case 'diaria': return true;
    case 'semanal': return (f.dias||[]).includes(wd);
    case 'quinzenal': return wd === f.dia && mod(semanasEntre(parseKey(S.rodizio.inicio), date), 2) === (f.paridade||0);
    case 'mensal': return wd === f.dia && bateOrdem(date, f.ordem);
    case 'trimestral': return wd === f.dia && bateOrdem(date, f.ordem) && mod(date.getMonth() - (f.mesInicial||0), 3) === 0;
    default: return false;
  }
}
function freqTxt(t){
  const f = t.freq, n = t.slots.length;
  switch (f.tipo){
    case 'diaria': return n > 1 ? `${n}x ao dia` : 'Todos os dias';
    case 'semanal': { const ds = (f.dias||[]).slice().sort((a,b)=>mod(a-1,7)-mod(b-1,7)).map(d => DIAS_C[d]); return `${(f.dias||[]).length}x por semana: ${lista(ds) || 'nenhum dia'}`; }
    case 'quinzenal': return `A cada 15 dias, ${DIAS[f.dia]}`;
    case 'mensal': return `1x por mês, ${ORD[f.ordem]} ${DIAS[f.dia]}`;
    case 'trimestral': return `A cada 3 meses, ${ORD[f.ordem]} ${DIAS[f.dia]} (${[0,1,2,3].map(i => MESES_C[mod((f.mesInicial||0)+i*3,12)]).join(', ')})`;
    default: return 'Conforme necessidade';
  }
}
const freqTag = t => ({semanal:'Semanal', quinzenal:'Quinzenal', mensal:'Mensal', trimestral:'Trimestral', demanda:'Sob demanda'})[t.freq.tipo];
const nomeDia = (t, date) => { const c = t.porDia && t.porDia[date.getDay()]; return c ? `${t.nome}: ${c}` : t.nome; };
const peso = t => Number(t.esforco || 2);

function periodo(date){
  const r = S.rodizio, ini = parseKey(r.inicio);
  if (r.ciclo === 'mes') return (date.getFullYear()-ini.getFullYear())*12 + date.getMonth() - ini.getMonth();
  return Math.floor(semanasEntre(ini, date) / (r.ciclo === 'quinzena' ? 2 : 1));
}
function donoT1(date){
  const p = periodo(date);
  let troca = mod(p, 2) === 1;
  if (S.rodizio.trocas[p]) troca = !troca;
  const a = S.rodizio.primeiroT1, b = S.equipe.find(e => e.id !== a).id;
  return troca ? b : a;
}
const outra = id => S.equipe.find(e => e.id !== id).id;
const dono = (posto, date) => posto === 'T1' ? donoT1(date) : outra(donoT1(date));
const turnoDe = (pid, date) => donoT1(date) === pid ? 'T1' : 'T2';
const pessoa = id => S.equipe.find(e => e.id === id);
const pIdx = id => S.equipe.findIndex(e => e.id === id);
const executor = (slot, date) => slot.pessoa && pessoa(slot.pessoa) ? slot.pessoa : dono(slot.posto, date);

function ocorrencias(date){
  const out = [];
  for (const t of S.tarefas){
    if (!ocorre(t, date)) continue;
    for (const s of t.slots){
      const ini = toMin(s.hora);
      out.push({ t, s, ini, fim: ini + Number(t.dur||0), pessoa: executor(s, date), key: t.id + ':' + s.id, nome: nomeDia(t, date) });
    }
  }
  return out.sort((a,b) => a.ini - b.ini || a.fim - b.fim);
}
function conflitos(date, occ){
  const m = {}; const add = (k, msg) => (m[k] = m[k] || []).push(msg);
  S.equipe.forEach(p => {
    const tc = S.turnos[turnoDe(p.id, date)];
    const ti = toMin(tc.ini), tf = toMin(tc.fim), li = toMin(tc.almIni), lf = toMin(tc.almFim);
    const mine = occ.filter(o => o.pessoa === p.id);
    mine.forEach((o, i) => {
      if (o.ini < ti || o.fim > tf) add(o.key, `Fora do horário de ${p.nome} (${tc.ini} às ${tc.fim})`);
      if (o.ini < lf && o.fim > li) add(o.key, `Cai no almoço de ${p.nome}`);
      if (o.t.altura && !p.altura.ok) add(o.key, `${p.nome} ainda não tem o curso de trabalho em altura`);
      for (let j = i+1; j < mine.length; j++){
        const q = mine[j];
        if (q.ini < o.fim){ add(o.key, `Sobrepõe ${q.nome} (${toHM(q.ini)})`); add(q.key, `Sobrepõe ${o.nome} (${toHM(o.ini)})`); }
      }
    });
  });
  return m;
}
const proxAberto = d => { let x = d; for (let i=0;i<14;i++){ if (lojaAbre(x)) return x; x = addDays(x,1);} return d; };
const popDe = cod => S.pops.find(p => p.codigo === cod);

/* ---------- carga e equilíbrio ---------- */
const pontos = o => o.t.dur * peso(o.t) / 10;
function cargaDia(date, pid){
  const occ = ocorrencias(date).filter(o => o.pessoa === pid);
  const r = { min:0, pts:0, pesado:0, n:occ.length, amb:{} };
  occ.forEach(o => { r.min += o.t.dur; r.pts += pontos(o); if (peso(o.t) === 3) r.pesado += o.t.dur; r.amb[o.t.ambiente] = (r.amb[o.t.ambiente]||0) + o.t.dur; });
  return r;
}
function cargaPeriodo(datas, pid){
  const r = { min:0, pts:0, pesado:0, n:0, amb:{} };
  datas.forEach(d => { const c = cargaDia(d, pid); r.min += c.min; r.pts += c.pts; r.pesado += c.pesado; r.n += c.n; for (const k in c.amb) r.amb[k] = (r.amb[k]||0) + c.amb[k]; });
  return r;
}
const difPct = (a, b) => (a + b) ? Math.abs(a - b) / ((a + b) / 2) * 100 : 0;

/* Equilibrar: troca tarefas de turno (sem mudar horário) até a carga ponderada
   dos dois turnos ficar o mais parecida possível em cada dia das próximas 4 semanas,
   sem criar choque de horário, sem cair no almoço e sem sair do turno. */
function equilibrar(){
  const ini = mondayOf(ui.dist), dias = [];
  for (let i = 0; i < 28; i++){ const d = addDays(ini, i); if (lojaAbre(d)) dias.push(d); }
  const base = dias.map(d => ocorrencias(d).map(o => ({ o, fixo: o.s.pessoa ? turnoDe(o.s.pessoa, d) : null, p: pontos(o) })));
  const movs = []; S.tarefas.forEach(t => t.ativo && t.slots.forEach(s => { if (!s.pessoa) movs.push(s); }));
  const asg = new Map(movs.map(s => [s.id, s.posto]));
  const lim = p => { const tc = S.turnos[p]; return [toMin(tc.ini), toMin(tc.fim), toMin(tc.almIni), toMin(tc.almFim)]; };
  const L = { T1: lim('T1'), T2: lim('T2') };
  const score = () => {
    let viol = 0, bal = 0;
    for (const occ of base){
      const by = { T1:[], T2:[] }, pts = { T1:0, T2:0 };
      for (const x of occ){ const p = x.fixo || asg.get(x.o.s.id); by[p].push(x.o); pts[p] += x.p; }
      for (const p of ['T1','T2']){
        const [ti, tf, li, lf] = L[p]; let end = -1;
        for (const o of by[p]){ if (o.ini < ti || o.fim > tf) viol++; if (o.ini < lf && o.fim > li) viol++; if (o.ini < end) viol++; end = Math.max(end, o.fim); }
      }
      bal += (pts.T1 - pts.T2) ** 2;
    }
    return viol * 1e9 + bal;
  };
  const antes = score();
  let cur = antes;
  for (let it = 0; it < 80; it++){
    let best = null, bestSc = cur;
    for (const s of movs){ const a = asg.get(s.id); asg.set(s.id, a === 'T1' ? 'T2' : 'T1'); const v = score(); if (v < bestSc - 1e-6){ bestSc = v; best = [s]; } asg.set(s.id, a); }
    if (!best){
      for (let i = 0; i < movs.length; i++) for (let j = i+1; j < movs.length; j++){
        const a = movs[i], b = movs[j], pa = asg.get(a.id), pb = asg.get(b.id); if (pa === pb) continue;
        asg.set(a.id, pb); asg.set(b.id, pa); const v = score(); if (v < bestSc - 1e-6){ bestSc = v; best = [a, b]; } asg.set(a.id, pa); asg.set(b.id, pb);
      }
    }
    if (!best) break;
    best.forEach(s => asg.set(s.id, asg.get(s.id) === 'T1' ? 'T2' : 'T1'));
    cur = bestSc;
  }
  const mudou = movs.filter(s => asg.get(s.id) !== s.posto);
  return { mudou, asg, melhora: cur < antes };
}

const ui = { mix:'semana', rota:'hoje', dia: today(), semana: mondayOf(today()), dist: today(), filtro:'todos', pop:null };
const ROWH = 34;
const ROTAS = [ ['hoje','Hoje','today'], ['semana','Semana','week'], ['distribuicao','Distribuição','scale'], ['escala','Escala','swap'], ['pops','POPs','doc'], ['plano','Plano de ação','flag'] ];
(() => { const h = location.hash.slice(1); if (ROTAS.some(r => r[0] === h)) ui.rota = h; })();

/* =========================================================
   Linha do tempo
   ========================================================= */
function timeline(date, mode){
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = Math.max(60, b - a);
  const pct = m => ((Math.min(Math.max(m,a),b) - a) / tot * 100).toFixed(3) + '%';
  const wpct = m => (m / tot * 100).toFixed(3) + '%';
  const occ = ocorrencias(date), conf = conflitos(date, occ);
  const feitos = S.feitos[dkey(date)] || {};
  const isHoje = dkey(date) === dkey(today()), agora = nowMin();
  let ruler = '';
  for (let h = Math.ceil(a/60); h*60 <= b; h++) ruler += `<span class="tick" style="left:${pct(h*60)}">${h}h</span>`;
  ruler += S.loja.picos.map(p => `<span class="rpk" style="left:${pct(toMin(p))};width:${wpct(60)}" title="Pico das ${p}"></span>`).join('');
  const peaks = S.loja.picos.map(p => `<i class="peak" style="left:${pct(toMin(p))};width:${wpct(60)}"></i>`).join('');
  const nowLine = (isHoje && agora >= a && agora <= b) ? `<i class="nowline" style="left:${pct(agora)}"></i>` : '';
  const lanes = S.equipe.map((p, i) => {
    const tc = S.turnos[turnoDe(p.id, date)];
    const mine = occ.filter(o => o.pessoa === p.id);
    const ends = [];
    mine.forEach(o => { let r = ends.findIndex(e => e <= o.ini); if (r < 0){ r = ends.length; ends.push(0); } ends[r] = o.fim; o.row = r; });
    const rows = Math.max(1, ends.length);
    const blocks = mine.map(o => {
      const done = !!feitos[o.key], w = conf[o.key];
      const tip = `${toHM(o.ini)} às ${toHM(o.fim)}: ${o.nome} (${PESO[peso(o.t)].toLowerCase()})${w ? '. Atenção: ' + w.join('; ') : ''}`;
      return `<button type="button" class="blk pc${i}${done?' is-done':''}${w?' is-warn':''}${peso(o.t)===3?' hv':''}" style="left:${pct(o.ini)};width:${wpct(o.t.dur)};top:${6 + o.row*ROWH}px"
        data-key="${o.key}" data-date="${dkey(date)}" data-t="${o.t.id}" data-s="${o.s.id}" data-ini="${o.ini}" data-p="${p.id}" ${mode==='edit'?'data-drag':'data-blk'}
        title="${esc(tip)}" aria-label="${esc(tip)}${mode==='edit'?'. Use as setas para mover.':''}">${o.t.altura?ic('ladder','i'):''}<span>${esc(o.nome)}</span></button>`;
    }).join('');
    return `<div class="lane">
      <div class="lane-lbl pc${i}"><b>${esc(p.nome)}</b><span>${esc(tc.nome)}<span class="hr"><br>${tc.ini} às ${tc.fim}</span></span></div>
      <div class="lane-track" data-pessoa="${p.id}" style="height:${12 + rows*ROWH}px">
        <i class="off l" style="left:0;width:${wpct(Math.max(0,toMin(tc.ini)-a))}"></i>
        <i class="off r" style="left:${pct(toMin(tc.fim))};right:0"></i>
        <i class="lunch" style="left:${pct(toMin(tc.almIni))};width:${wpct(toMin(tc.almFim)-toMin(tc.almIni))}" title="Almoço"><em>almoço</em></i>
        ${peaks}${nowLine}${blocks}
      </div></div>`;
  }).join('');
  return `<div class="tl" data-mode="${mode}">
    <div class="tl-scroll"><div class="tl-in"><div class="tl-ruler" aria-hidden="true">${ruler}</div>${lanes}</div></div>
    <div class="tl-legend">
      <span><i class="sw pk"></i>Horário de pico</span><span><i class="sw lu"></i>Almoço</span><span><i class="sw of"></i>Fora do turno</span>
      <span><i class="sw hv"></i>Tarefa pesada</span><span><i class="sw wn"></i>Precisa de atenção</span>
      <span>${mode==='exec' ? 'Toque num bloco para marcar como feito' : 'Arraste para mudar horário ou pessoa'}</span>
    </div></div>`;
}

}

function vHoje(){
  const d = ui.dia, k = dkey(d), isHoje = k === dkey(today());
  const t1 = pessoa(donoT1(d)), t2 = pessoa(outra(t1.id));

    </div>

      ${lojaAbre(d) ? `<button class="btn" data-act="print-dia">${ic('print')}Imprimir checklist do dia</button>` : ''}</div></div>`;
  if (!lojaAbre(d)) return head + `<div class="closed"><h2>Sem rotina de limpeza neste dia</h2><p class="muted">A loja não tem expediente cadastrado para ${DIAS[d.getDay()]}. Os dias de funcionamento ficam em Escala.</p><p style="margin-top:16px"><button class="btn primary" data-act="dia" data-n="1">Ir para o próximo dia</button></p></div>`;

  const occ = ocorrencias(d), conf = conflitos(d, occ), feitos = S.feitos[k] || {}, agora = nowMin();
  const cards = S.equipe.map((p, i) => {

    const nDone = mine.filter(o => feitos[o.key]).length;
    const items = mine.map(o => {
      const done = !!feitos[o.key];
      const st = isHoje && !done ? (agora >= o.ini && agora < o.fim ? 'now' : (agora >= o.fim ? 'late' : '')) : '';
      const tags = [];
      if (st === 'now') tags.push('<span class="tag b">Agora</span>');
      if (st === 'late') tags.push('<span class="tag w">Atrasada</span>');
      if (freqTag(o.t)) tags.push(`<span class="tag y">${freqTag(o.t)}</span>`);
      if (peso(o.t) === 3) tags.push('<span class="tag h">Pesada</span>');
      if (o.t.pop && popDe(o.t.pop)) tags.push(`<button type="button" class="tag" data-act="ver-pop" data-cod="${esc(o.t.pop)}">${esc(o.t.pop)}</button>`);
      if (o.s.pessoa) tags.push(`<span class="tag">Fixa com ${esc(p.nome)}</span>`);
      (conf[o.key]||[]).forEach(w => tags.push(`<span class="tag w">${esc(w)}</span>`));
      return `<li><label class="it ${done?'done':''} ${st==='now'?'now':''}">
        <input type="checkbox" data-toggle="${o.key}" data-date="${k}" ${done?'checked':''}><span class="box">${checkSVG}</span>
        <span class="it-b"><span class="it-h"><time>${toHM(o.ini)} às ${toHM(o.fim)}</time><b>${esc(o.nome)}</b></span>
        ${o.t.obs ? `<p>${esc(o.t.obs)}</p>` : ''}${tags.length ? `<span class="tags">${tags.join('')}</span>` : ''}</span></label></li>`;
    }).join('');
    return `<article class="pcard pc${i}">
      <header><span class="avatar">${esc(p.nome.slice(0,1).toUpperCase())}</span>
        <span class="who"><b>${esc(p.nome)}</b><span>${esc(tc.nome)}, ${tc.ini} às ${tc.fim}. Almoço ${tc.almIni} às ${tc.almFim}</span>
        <span>${durTxt(c.min)} de tarefas, ${durTxt(c.pesado)} pesadas, ${Math.round(c.pts)} pontos de carga</span></span>
        ${ring(nDone, mine.length, i)}</header>
      ${mine.length ? `<ol class="list">${items}</ol>` : `<p class="empty">Nenhuma tarefa para ${esc(p.nome)} neste dia.</p>`}</article>`;
  }).join('');
  const dem = S.tarefas.filter(t => t.ativo && t.freq.tipo === 'demanda');
  const demHTML = dem.length ? `<section class="sec"><h2>Sob demanda</h2><div class="panel">${dem.map(t => {
    const ult = (t.historico||[]).at(-1);
    return `<div class="dem"><div class="t"><b>${esc(t.nome)}</b><p class="small muted">${esc(t.obs||'')}${ult ? `. Última execução: ${fmtBR(parseKey(ult))}` : '. Ainda sem registro'}</p></div>
      <button class="btn" data-act="registrar" data-id="${t.id}">${ic('check')}Registrar execução</button></div>`; }).join('')}</div></section>` : '';
  return head + timeline(d, 'exec') + `<div class="cols">${cards}</div>` + demHTML;
}

function montarSemana(ini){
  const dias = [0,1,2,3,4,5,6].map(i => addDays(ini, i)).filter(lojaAbre);
  const porDia = Object.fromEntries(dias.map(d => [dkey(d), ocorrencias(d)]));
  const pessoas = S.equipe.map(p => {
    const rows = new Map();
    dias.forEach(d => porDia[dkey(d)].filter(o => o.pessoa === p.id).forEach(o => {
      const rk = o.key + '|' + o.nome;
      if (!rows.has(rk)) rows.set(rk, { o, nome:o.nome, ds:new Set() });
      rows.get(rk).ds.add(dkey(d));
    }));
    const linhas = [...rows.values()].sort((x,y) => x.o.ini - y.o.ini || x.nome.localeCompare(y.nome));
    const turnos = [...new Set(dias.map(d => { const tc = S.turnos[turnoDe(p.id,d)]; return `${tc.nome} (${tc.ini} às ${tc.fim})`; }))];
    return { p, linhas, turnos };
  });
  return { ini, fim:addDays(ini,6), dias, porDia, pessoas };
}

function painelEquilibrio(){
  const sem = mondayOf(ui.dist);
  const dias = [0,1,2,3,4,5,6].map(i => addDays(sem, i)).filter(lojaAbre);
  if (!dias.length) return '';
  const cs = S.equipe.map(p => cargaPeriodo(dias, p.id));
  const [A, B] = cs, tot = A.pts + B.pts || 1, dif = difPct(A.pts, B.pts);
  const ok = dif <= 8;
  // ciclo completo do rodízio
  const len = S.rodizio.ciclo === 'mes' ? 8 : (S.rodizio.ciclo === 'quinzena' ? 4 : 2);
  const ciclo = []; for (let w = 0; w < len*7; w++){ const d = addDays(sem, w); if (lojaAbre(d)) ciclo.push(d); }
  const cc = S.equipe.map(p => cargaPeriodo(ciclo, p.id));
  const difC = difPct(cc[0].pts, cc[1].pts);
  const linhasDia = dias.map(d => {
    const a = cargaDia(d, S.equipe[0].id), b = cargaDia(d, S.equipe[1].id), t = a.pts + b.pts || 1;
    return `<tr><td>${DIAS_C[d.getDay()]} ${d.getDate()}</td><td class="n">${Math.round(a.pts)}</td>
      <td><div class="minibar"><i class="pc0" style="width:${a.pts/t*100}%;background:var(--pc-bar)"></i><i class="pc1" style="width:${b.pts/t*100}%;background:var(--pc-bar)"></i></div></td>
      <td class="n">${Math.round(b.pts)}</td><td class="n muted">${Math.round(difPct(a.pts,b.pts))}%</td></tr>`;
  }).join('');
  const ambs = [...new Set(S.tarefas.map(t => t.ambiente))];
  const [MA, MB] = ui.mix === 'ciclo' ? cc : cs;
  const mix = ambs.map(am => {
    const a = MA.amb[am]||0, b = MB.amb[am]||0, t = a + b; if (!t) return '';
    return `<div class="lbl">${esc(am)}<span>${durTxt(t)} ${ui.mix === 'ciclo' ? 'no ciclo' : 'na semana'}</span></div>
      <div class="mixbar"><i class="pc0" style="width:${a/t*100}%;background:var(--pc-bar);color:#fff">${a/t > .18 ? durTxt(a) : ''}</i><i class="pc1" style="width:${b/t*100}%;background:var(--pc-bar);color:#3B2A00">${b/t > .18 ? durTxt(b) : ''}</i></div>`;
  }).join('');
  return `<section class="sec" id="equilibrio"><h2>Equilíbrio do trabalho</h2>
    <p class="lead">Carga = minutos de tarefa multiplicados pelo esforço (leve 1, médio 2, pesado 3). Uma hora de lavagem pesa três vezes uma hora de reposição de café.</p>
    <div class="eq-top">
      <div class="scale">
        <span class="small muted">Semana de ${fmtDM(dias[0])} a ${fmtDM(dias.at(-1))}</span>
        <div class="vs">
          <div class="side pc0"><b>${Math.round(A.pts)}</b><span>${esc(S.equipe[0].nome)}: ${durTxt(A.min)}, ${durTxt(A.pesado)} pesadas</span></div>
          <div class="mid">diferença<b>${Math.round(dif)}%</b></div>
          <div class="side r pc1"><b>${Math.round(B.pts)}</b><span>${esc(S.equipe[1].nome)}: ${durTxt(B.min)}, ${durTxt(B.pesado)} pesadas</span></div>
        </div>
        <div class="beam"><i class="pc0" style="width:${A.pts/tot*100}%;background:var(--pc-bar)"></i><i class="pc1" style="width:${B.pts/tot*100}%;background:var(--pc-bar)"></i></div>
        <p class="verdict ${ok?'ok':'bad'}">${ok ? 'Trabalho equivalente nesta semana.' : 'Um dos dois está carregando mais nesta semana.'} No ciclo completo do rodízio (${len} semanas) a diferença é de ${Math.round(difC)}%.</p>
        <div class="row" style="margin-top:14px"><button class="btn primary" data-act="equilibrar">${ic('scale')}Equilibrar automaticamente</button><span class="small muted">Troca tarefas de turno sem mudar horários</span></div>
      </div>
      <div class="panel"><h3 style="margin-bottom:8px">Dia a dia</h3><table class="days"><thead><tr><th>Dia</th><th style="text-align:right">${esc(S.equipe[0].nome)}</th><th></th><th style="text-align:right">${esc(S.equipe[1].nome)}</th><th style="text-align:right">Dif.</th></tr></thead><tbody>${linhasDia}</tbody></table></div>
    </div>
    <div class="panel" style="margin-top:16px"><div class="row" style="margin-bottom:4px"><h3 style="flex:1">Quem faz o quê</h3>
      <div class="daychips"><button class="chip" data-act="mix" data-v="semana" aria-pressed="${ui.mix !== 'ciclo'}">Nesta semana</button><button class="chip" data-act="mix" data-v="ciclo" aria-pressed="${ui.mix === 'ciclo'}">No ciclo do rodízio</button></div></div>
      <p class="small muted" style="margin-bottom:14px">${ui.mix === 'ciclo' ? `Somando as ${len} semanas do ciclo, cada um passa por todos os ambientes na mesma medida.` : 'Minutos de cada ambiente para cada pessoa. Na semana seguinte os lados se invertem.'}</p><div class="mix">${mix}</div></div>
  </section>`;
}

/* =========================================================
   Arrastar na linha do tempo
   ========================================================= */
function ligarArrastar(){
  const tl = $('.tl[data-mode="edit"]'); if (!tl) return;
  const lanes = $$('.lane-track', tl);
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = b - a;
  $$('.blk[data-drag]', tl).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const track = el.parentElement, rect = track.getBoundingClientRect(), ppm = rect.width / tot;
      const st = { x:e.clientX, y:e.clientY, moved:false, dm:0, tgt:track };
      const ini = Number(el.dataset.ini), t = S.tarefas.find(x => x.id === el.dataset.t);
      let tip = null;
      el.setPointerCapture(e.pointerId);
      const move = ev => {
        const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
        if (!st.moved && Math.hypot(dx, dy) < 5) return;
        if (!st.moved){ st.moved = true; el.classList.add('dragging'); tip = document.createElement('div'); tip.className = 'dragtip'; document.body.appendChild(tip); }
        let dm = Math.round(dx / ppm / 5) * 5;
        dm = Math.max(a - ini, Math.min(b - ini - t.dur, dm)); st.dm = dm;
        const tgt = lanes.find(l => { const r = l.getBoundingClientRect(); return ev.clientY >= r.top - 8 && ev.clientY <= r.bottom + 8; }) || track;
        st.tgt = tgt;
        lanes.forEach(l => l.classList.toggle('drop', l === tgt && l !== track));
        const ty = tgt === track ? 0 : tgt.getBoundingClientRect().top - rect.top + 6 - parseFloat(el.style.top);
        el.style.transform = `translate(${dm*ppm}px, ${ty}px)`;
        tip.textContent = `${toHM(ini+dm)} às ${toHM(ini+dm+t.dur)}, ${pessoa(tgt.dataset.pessoa).nome}`;
        tip.style.left = ev.clientX + 'px'; tip.style.top = ev.clientY + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        lanes.forEach(l => l.classList.remove('drop')); tip && tip.remove();
        if (!st.moved){ abrirTarefa(el.dataset.t); return; }
        moverSlot(el.dataset.t, el.dataset.s, st.dm, st.tgt.dataset.pessoa, el.dataset.p);
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, k === 'ArrowLeft' ? -5 : 5, el.dataset.p, el.dataset.p, true); }
      else if (k === 'ArrowUp' || k === 'ArrowDown'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, 0, outra(el.dataset.p), el.dataset.p, true); }
      else if (k === 'Enter' || k === ' '){ e.preventDefault(); abrirTarefa(el.dataset.t); }
    });
  });
}
function moverSlot(tid, sid, dm, paraPessoa, dePessoa, teclado){
  const t = S.tarefas.find(x => x.id === tid), s = t.slots.find(x => x.id === sid);
  if (!dm && paraPessoa === dePessoa){ render(false); return; }
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha);
  const nova = toHM(Math.max(a, Math.min(b - t.dur, toMin(s.hora) + dm)));
  mudar(() => {
    s.hora = nova;
    if (paraPessoa !== dePessoa){ if (s.pessoa) s.pessoa = paraPessoa; else s.posto = turnoDe(paraPessoa, ui.dist); }
  }, teclado && paraPessoa === dePessoa ? null : `${t.nome} ${paraPessoa !== dePessoa ? `passou para ${pessoa(paraPessoa).nome}` : 'mudou de horário'}, às ${nova}`);
  if (teclado){ const nb = $(`.blk[data-s="${sid}"]`); nb && nb.focus(); }
}

  const fm = $('#ft'), nome = fm.nome.value.trim();

  const freq = lerFreq(fm);
  if (freq.tipo === 'semanal' && !freq.dias.length){ toast('Escolha pelo menos um dia da semana.'); return; }
  const slots = $$('#slots .slot-ed').map(r => ({ id:r.dataset.sid, hora:$('[data-k=hora]', r).value || '09:00', posto:$('[data-k=posto]', r).value, pessoa:$('[data-k=pessoa]', r).value || null }));
  if (!slots.length){ toast('Adicione pelo menos um horário.'); return; }
  const porDia = {}; [0,1,2,3,4,5,6].forEach(w => { const el = fm['pd'+w]; if (el && el.value.trim()) porDia[w] = el.value.trim(); });
  const novo = { ...rascunho, nome, ambiente:fm.ambiente.value.trim() || 'Outros', obs:fm.obs.value.trim(), dur:Math.max(5, Number(fm.dur.value)||15), esforco:Number(fm.esforco.value), pop:fm.pop.value, freq, slots, porDia, altura:fm.altura.checked, ativo:fm.ativo.checked };
  const eraNova = novo._nova; delete novo._nova;
  fecharGaveta();
  mudar(() => { const i = S.tarefas.findIndex(x => x.id === novo.id); if (i >= 0) S.tarefas[i] = novo; else S.tarefas.push(novo); }, eraNova ? `Tarefa criada: ${nome}` : `Tarefa salva: ${nome}`);
}

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const el = e.target.closest('[data-act], .blk[data-blk]'); if (!el) return;
  if (el.matches('.blk[data-blk]')){
    const k = el.dataset.date, key = el.dataset.key; S.feitos[k] = S.feitos[k] || {};
    if (S.feitos[k][key]) delete S.feitos[k][key]; else S.feitos[k][key] = Date.now();
    salvar(); render(false); return;
  }
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'ir': ir(el.dataset.r); break;
    case 'dia': { const n = Number(el.dataset.n); ui.dia = n === 0 ? today() : addDays(ui.dia, n); render(false); break; }
    case 'sem': { const n = Number(el.dataset.n); ui.semana = n === 0 ? mondayOf(today()) : addDays(ui.semana, n); render(false); break; }
    case 'dist-dia': ui.dist = parseKey(el.dataset.date); render(false); break;
    case 'dist-sem': ui.dist = proxAberto(mondayOf(addDays(ui.dist, Number(el.dataset.n)))); render(false); break;
    case 'print-dia': imprimirDia(); break;
    case 'print-semana': imprimirSemana(); break;
    case 'print-pops': imprimirPops(S.pops); break;
    case 'print-pop': imprimirPops([S.pops.find(p => p.id === id)]); break;
    case 'exportar-semana': rodarExport(el, 'exportarSemana', payloadSemana(), 'Escalas exportadas', 'Escalas exportadas para a planilha e para PDF'); break;
    case 'exportar-pops': rodarExport(el, 'exportarPops', S.pops.map(p => ({ codigo:p.codigo, titulo:p.titulo, html:popPdfHTML(p) })), 'POPs em PDF', 'POPs gerados em PDF no Drive'); break;
    case 'ver-pop': e.preventDefault(); ui.pop = el.dataset.cod; if (ui.rota !== 'pops') ir('pops'); else render(false); break;
    case 'novo-pop': abrirPop(null); break;
    case 'edit-pop': abrirPop(id); break;
    case 'salvar-pop': salvarPop(); break;
    case 'excluir-pop': { const pid = rascunho.id, cod = rascunho.codigo; if (!confirm(`Excluir o ${cod}? As tarefas ligadas a ele ficam sem POP.`)) return; fecharGaveta();
      mudar(() => { S.pops = S.pops.filter(p => p.id !== pid); S.tarefas.forEach(t => { if (t.pop === cod) t.pop = ''; }); ui.pop = null; }, `POP excluído: ${cod}`); break; }
    case 'sec-add': $('#secs').insertAdjacentHTML('beforeend', secEd(sec('Nova seção','lista',[]))); $('#secs .sec-ed:last-child input').focus(); break;
    case 'sec-del': el.closest('.sec-ed').remove(); break;
    case 'equilibrar': {
      const sem = mondayOf(ui.dist), dias = [0,1,2,3,4,5,6].map(i => addDays(sem,i)).filter(lojaAbre);
      const antes = difPct(...S.equipe.map(p => cargaPeriodo(dias, p.id).pts));
      const r = equilibrar();
      if (!r.mudou.length){ toast('A distribuição já está no melhor equilíbrio possível sem mudar horários.'); break; }
      const snap = JSON.stringify(S);
      r.mudou.forEach(s => { s.posto = r.asg.get(s.id); }); salvar(); render(false);
      const depois = difPct(...S.equipe.map(p => cargaPeriodo(dias, p.id).pts));
      toast(`${r.mudou.length} ${r.mudou.length===1?'tarefa trocou':'tarefas trocaram'} de turno. Diferença da semana: de ${Math.round(antes)}% para ${Math.round(depois)}%.`, snap);
      break;
    }
    case 'nova-tarefa': abrirTarefa(null); break;
    case 'edit-tarefa': abrirTarefa(id); break;
    case 'fechar': fecharGaveta(); break;
    case 'slot-add': $('#slots').insertAdjacentHTML('beforeend', slotRow({ id:uid(), hora:'09:00', posto:'T1', pessoa:null })); $('#slots .slot-ed:last-child input').focus(); break;
    case 'slot-del': el.closest('.slot-ed').remove(); break;
    case 'salvar-tarefa': salvarTarefa(); break;
    case 'excluir-tarefa': { const nome = rascunho.nome, tid = rascunho.id; fecharGaveta(); mudar(() => { S.tarefas = S.tarefas.filter(t => t.id !== tid); }, `Tarefa excluída: ${nome}`); break; }
    case 'registrar': { const t = S.tarefas.find(x => x.id === id); mudar(() => { t.historico = [...(t.historico||[]), dkey(ui.dia)]; }, `${t.nome}: execução registrada em ${fmtBR(ui.dia)}`); break; }
    case 'trocar': { const p = el.dataset.p; mudar(() => { if (S.rodizio.trocas[p]) delete S.rodizio.trocas[p]; else S.rodizio.trocas[p] = true; }, 'Escala atualizada'); break; }
    case 'mix': ui.mix = el.dataset.v; render(false); break;
    case 'filtro': ui.filtro = ui.filtro === el.dataset.f ? 'todos' : el.dataset.f; render(false); break;
    case 'status': { const a = S.acoes.find(x => x.id === id); const nx = {afazer:'andamento', andamento:'feito', feito:'afazer'}[a.status]; mudar(() => { a.status = nx; }, null, false); break; }
    case 'concluir': { const a = S.acoes.find(x => x.id === id); const fecha = a.status !== 'feito'; mudar(() => { a.status = fecha ? 'feito' : 'afazer'; }, fecha ? `Ação concluída: ${a.oque}` : null); break; }
    case 'nova-acao': abrirAcao(null); break;
    case 'edit-acao': abrirAcao(id); break;
    case 'salvar-acao': {
      const fm = $('#fa'), oque = fm.oque.value.trim();
      if (!oque){ fm.oque.setCustomValidity('Descreva a ação'); fm.oque.reportValidity(); fm.oque.setCustomValidity(''); return; }
      const nova = { id:rascunho.id, oque, porque:fm.porque.value.trim(), quem:fm.quem.value.trim(), prazo:fm.prazo.value, status:fm.status.value };
      const eraNova = rascunho._nova; fecharGaveta();
      mudar(() => { const i = S.acoes.findIndex(x => x.id === nova.id); if (i >= 0) S.acoes[i] = nova; else S.acoes.push(nova); }, eraNova ? 'Ação criada' : 'Ação salva');
      break;
    }
    case 'excluir-acao': { const aid = rascunho.id; fecharGaveta(); mudar(() => { S.acoes = S.acoes.filter(a => a.id !== aid); }, 'Ação excluída'); break; }
    case 'undo': { const s = $('#toast')._snap; if (s){ const rev = S.rev; S = JSON.parse(s); S.rev = rev; salvar(); render(false); toast('Alteração desfeita'); } break; }
    case 'exportar': {
      if (GAS){ rodarExport(el, 'salvarBackup', JSON.stringify(S), 'Backup salvo', 'Backup salvo no Drive'); break; }
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `escala-limpeza-bartofil-${dkey(today())}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup exportado'); break;
    }
    case 'importar': $('#file-in').click(); break;
    case 'restaurar': {
      if (!confirm('Restaurar o padrão apaga as mudanças, os POPs editados e os registros de execução. Continuar?')) return;
      const keepLogo = S.logo, rev = S.rev; mudar(() => { S = estadoPadrao(); S.logo = keepLogo; S.rev = rev; }, 'Padrão da loja restaurado'); break;
    }
    case 'logo-up': $('#logo-in').click(); break;
    case 'logo-reset': mudar(() => { S.logo = null; }, 'Logo padrão em uso'); break;
  }
});
$('#scrim').addEventListener('click', fecharGaveta);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#drawer').classList.contains('open')) fecharGaveta();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.toggle){
    const k = el.dataset.date, key = el.dataset.toggle;
    S.feitos[k] = S.feitos[k] || {};
    if (el.checked) S.feitos[k][key] = Date.now(); else delete S.feitos[k][key];
    salvar(); render(false);
    const back = $(`[data-toggle="${CSS.escape(key)}"][data-date="${k}"]`); back && back.focus({preventScroll:true});
    return;
  }
  if (el.dataset.ativa){ const t = S.tarefas.find(x => x.id === el.dataset.ativa); mudar(() => { t.ativo = el.checked; }, `${t.nome} ${el.checked ? 'ativada' : 'pausada'}`); return; }
  if (el.dataset.dia){
    const w = Number(el.dataset.dia);
    mudar(() => { S.loja.dias = el.checked ? [...new Set([...S.loja.dias, w])] : S.loja.dias.filter(x => x !== w); ui.dist = proxAberto(ui.dist); }, null, false);
    return;
  }
  if (el.dataset.set){
    const path = el.dataset.set.split('.');
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (path.join('.') === 'loja.picos') val = val.split(/[,;\s]+/).map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => x.padStart(5,'0'));
    if ((el.type === 'time' || el.type === 'date') && !val) return;
    if (el.type === 'text' && typeof val === 'string' && !val.trim() && path.at(-1) === 'nome') return;
    mudar(() => { let o = S; path.slice(0,-1).forEach(k => o = o[k]); o[path.at(-1)] = val; }, null, false);
    return;
  }
  if (el.matches('[data-freq]')){
    const v = el.value;
    rascunho.freq = { tipo:v, ...(v==='semanal'?{dias:[1]}:{}), ...(v==='quinzenal'?{dia:3,paridade:0}:{}), ...(['mensal','trimestral'].includes(v)?{ordem:1,dia:1}:{}), ...(v==='trimestral'?{mesInicial:today().getMonth()}:{}) };
    $('#freq-ex').innerHTML = freqExtra();
  }
});
$('#file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!valido(d)) throw 0; const rev = S.rev; mudar(() => { S = d; S.rev = rev; }, 'Backup importado'); } catch(_){ toast('Esse arquivo não é um backup desta versão da escala. Use o .json exportado aqui.'); } };
  r.readAsText(f); e.target.value = '';
});
$('#logo-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 500*1024){ toast('Logo muito pesada. Use um arquivo de até 500 KB.'); return; }
  const r = new FileReader();
  r.onload = () => mudar(() => { S.logo = r.result; }, 'Logo atualizada');
  r.readAsDataURL(f); e.target.value = '';
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROTAS.some(r => r[0] === h) && h !== ui.rota){ ui.rota = h; render(); } });

iniciar();
</script>
