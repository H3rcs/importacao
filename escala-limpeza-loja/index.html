<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Escala de Limpeza – Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<script>
  (function(){ try { var t = localStorage.getItem('escala-limpeza:tema'); if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro'; document.documentElement.dataset.tema = t; } catch(e){ document.documentElement.dataset.tema = 'claro'; } })();
</script>
<style>
:root{
  --blue:#0B4EA2; --blue-deep:#06356F; --link:#0B4EA2; --blue-tint:#E4EDF9; --blue-line:#B9CDEB;
  --green:#169C46; --green-deep:#0C6A2F; --green-tint:#E1F3E7;
  --yellow:#FFC72C; --yellow-deep:#8A6200; --yellow-tint:#FFF4D2;
  --red:#D92D20; --red-deep:#A51C12; --red-tint:#FDE7E5;
  --ink:#14243D; --muted:#5A6A80; --soft:#8796AA; --line:#D6DEE9; --line-2:#E6ECF3;
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#FAFBFD; --hover:#F5F8FC; --field:#FFFFFF;
  --hatch-a:#F1F4F8; --hatch-b:#E6ECF3; --lunch-a:#FBF6E6; --lunch-b:#F3E7C2;
  --warn:#C25A0E; --warn-tint:#FDEEE1;
  --shadow:0 1px 0 rgba(20,36,61,.04);
  --r-lg:16px; --r-md:10px;
  --font:"Archivo","Helvetica Neue",Arial,system-ui,sans-serif;
  --tabbar:0px;
  color-scheme:light;
}
[data-tema="escuro"]{
  --link:#86B4FF; --blue-tint:#15294B; --blue-line:#2E4D80;
  --green-tint:#0F2E1D; --yellow-tint:#2E2610; --yellow-deep:#F2C94C; --green-deep:#5DD38A;
  --red:#F2564A; --red-deep:#FF8A80; --red-tint:#3A1715;
  --ink:#E6EDF7; --muted:#A2B2C7; --soft:#7A8CA5; --line:#27364E; --line-2:#1E2B40;
  --bg:#0A111E; --surface:#111B2C; --surface-2:#152137; --hover:#17253C; --field:#0D1727;
  --hatch-a:#141F33; --hatch-b:#1B2840; --lunch-a:#231F12; --lunch-b:#302915;
  --warn:#FF9F5A; --warn-tint:#3A2414;
  --shadow:none;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* topo */
.top{background:var(--blue);color:#fff;position:sticky;top:0;z-index:30}
[data-tema="escuro"] .top{background:#0A2D63}
.top-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;padding:10px 24px;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;color:#fff;flex:none;background:none;border:0;padding:0}
.brand img,.brand svg.logo{height:38px;width:auto;display:block;border-radius:4px}
.brand-t{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.brand .sep{border-left:1px solid rgba(255,255,255,.28);padding-left:14px}
.brand-t strong{font-stretch:112%;font-weight:750;font-size:16px}
.brand-t span{font-size:12.5px;opacity:.78}
.tabs{display:flex;gap:2px;margin-left:auto}
.tabs button{color:#fff;background:none;border:0;padding:8px 13px;border-radius:999px;font-weight:550;font-size:14.5px;opacity:.86;white-space:nowrap}
.tabs button:hover{opacity:1;background:rgba(255,255,255,.1)}
.tabs button[aria-current="page"]{background:#fff;color:var(--blue);opacity:1}
.savest{font-size:12px;white-space:nowrap;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center}
.savest i{width:8px;height:8px;border-radius:50%;background:#8FE3A9}
.savest.busy i{background:var(--yellow)} .savest.err{background:#B42318} .savest.err i{background:#fff}
.savest.local i{background:#C9D3E0}
.temabtn{width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;flex:none}
.temabtn:hover{background:rgba(255,255,255,.22)}
.stripe{display:grid;grid-template-rows:5px 5px}
.stripe i:first-child{background:var(--green)} .stripe i:last-child{background:var(--yellow)}
.tabbar{display:none}
main{max-width:1320px;margin:0 auto;padding:28px 24px calc(64px + var(--tabbar))}
main:focus{outline:none}
.boot{display:grid;place-items:center;min-height:50vh;color:var(--muted);font-size:16px;gap:14px}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--blue);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* tipografia */
h1,h2,h3{margin:0;font-stretch:112%;letter-spacing:-.012em;line-height:1.12}
h1{font-size:clamp(28px,3.4vw,40px);font-weight:780}
h2{font-size:22px;font-weight:720}
h3{font-size:17px;font-weight:680}
p{margin:0}
.lead{color:var(--muted);font-size:16px;max-width:74ch;margin-top:8px}
.muted{color:var(--muted)} .small{font-size:13px}

/* botões */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:600;font-size:14px;line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--blue-line);background:var(--hover)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-deep)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--blue-tint)}
.btn.danger{color:var(--red);border-color:var(--red-tint)}
.btn[disabled]{opacity:.55;cursor:progress}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--surface);flex:none;color:var(--ink)}
.icon-btn:hover{border-color:var(--blue-line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:620;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.ph .t{flex:1;min-width:260px}
.datenav{display:flex;align-items:center;gap:10px}
.kicker{font-size:14px;color:var(--link);font-weight:650;margin-bottom:6px}

/* linha do tempo */
.tl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tl-scroll{overflow-x:auto;scrollbar-width:thin}
.tl-in{min-width:1000px;padding:6px 18px 14px 0}
.tl-ruler{position:relative;height:34px;margin-left:168px}
.tick{position:absolute;bottom:6px;transform:translateX(-50%);font-size:12px;color:var(--soft);font-weight:550}
.tick::after{content:"";position:absolute;left:50%;top:100%;height:6px;width:1px;background:var(--line)}
.rpk{position:absolute;bottom:0;height:4px;background:var(--blue);border-radius:2px;opacity:.85}
.lane{display:flex;align-items:stretch;border-top:1px solid var(--line-2)}
.lane:first-of-type{border-top:0}
.lane-lbl{width:168px;flex:none;padding:12px 14px 12px 18px;position:sticky;left:0;z-index:6;background:var(--surface);display:flex;flex-direction:column;justify-content:center;gap:2px}
.lane-lbl::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 4px 4px 0;background:var(--pc)}
.lane-lbl b{font-size:15.5px;font-weight:700;font-stretch:108%}
.lane-lbl span{font-size:12.5px;color:var(--muted);line-height:1.3}
.lane-track{position:relative;flex:1;margin:8px 0;border-radius:var(--r-md);background:var(--surface);transition:background .15s, box-shadow .15s}
.lane-track.drop{background:var(--blue-tint);box-shadow:inset 0 0 0 2px var(--blue-line)}
.lane-track .off{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--hatch-a) 0 6px,var(--hatch-b) 6px 7px)}
.lane-track .off.l{border-radius:var(--r-md) 0 0 var(--r-md)} .lane-track .off.r{border-radius:0 var(--r-md) var(--r-md) 0}
.lane-track .folga{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:650;color:var(--muted);border-radius:var(--r-md);background:repeating-linear-gradient(135deg,var(--hatch-a) 0 6px,var(--hatch-b) 6px 7px)}
.lane-track .lunch{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--lunch-a) 0 6px,var(--lunch-b) 6px 7px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px}
.lane-track .lunch em{font-style:normal;font-size:10.5px;color:var(--yellow-deep);font-weight:600}
.lane-track .peak{position:absolute;top:0;bottom:0;background:rgba(11,78,162,.06);border-left:1px dashed rgba(11,78,162,.28)}
[data-tema="escuro"] .lane-track .peak{background:rgba(134,180,255,.07);border-left-color:rgba(134,180,255,.3)}
.nowline{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);z-index:4;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-1px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);transform:translate(-50%,-50%)}
.blk{position:absolute;height:28px;border:0;border-radius:7px;padding:0 8px;background:var(--pc);color:var(--pc-ink);font-size:12.5px;font-weight:600;text-align:left;overflow:hidden;white-space:nowrap;display:flex;align-items:center;gap:5px;z-index:2;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);transition:filter .12s}
.blk span{overflow:hidden;text-overflow:ellipsis}
.blk:hover{filter:brightness(1.07)}
.blk.hv{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 7px,rgba(255,255,255,.18) 7px 9px)}
.blk.alt{box-shadow:inset 0 -3px 0 rgba(0,0,0,.22)}
.blk.is-warn{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--red)}
.blk.tiny span,.blk.tiny svg{display:none}
.tl[data-mode="edit"] .blk{cursor:grab;touch-action:none}
.blk.dragging{cursor:grabbing;z-index:10;box-shadow:0 10px 24px rgba(0,0,0,.3),0 0 0 2px var(--surface);transition:none;filter:none}
.dragtip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;font-weight:650;padding:5px 9px;border-radius:6px;transform:translate(-50%,-140%);white-space:nowrap}
.tl-legend{display:flex;gap:18px;flex-wrap:wrap;padding:10px 18px 12px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.tl-legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.sw.pk{background:rgba(11,78,162,.14);border-left:1px dashed rgba(11,78,162,.45)}
.sw.lu{background:repeating-linear-gradient(135deg,var(--lunch-a) 0 3px,var(--lunch-b) 3px 4px)}
.sw.of{background:repeating-linear-gradient(135deg,var(--hatch-a) 0 3px,var(--line) 3px 4px)}
.sw.wn{background:var(--surface);box-shadow:0 0 0 2px var(--red)}
.sw.hv{background:#7C8BA0 repeating-linear-gradient(135deg,rgba(255,255,255,0) 0 3px,rgba(255,255,255,.35) 3px 4px)}
.sw.al{background:#7C8BA0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35)}

.pc0{--pc:var(--green);--pc-ink:#fff;--pc-tint:var(--green-tint);--pc-bar:var(--green)}
.pc1{--pc:var(--yellow);--pc-ink:#3B2A00;--pc-tint:var(--yellow-tint);--pc-bar:#E0A800}

/* Hoje */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.pcard>header{display:flex;align-items:center;gap:14px;padding:16px 18px;border-bottom:1px solid var(--line-2);background:linear-gradient(var(--pc),var(--pc)) left/6px 100% no-repeat}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pc);color:var(--pc-ink);display:grid;place-items:center;font-weight:750;font-size:17px;font-stretch:110%;flex:none}
.pcard header .who{flex:1;min-width:0}
.pcard header .who b{display:block;font-size:18px;font-stretch:110%;font-weight:720}
.pcard header .who span{font-size:13px;color:var(--muted);display:block}
.carga{text-align:right;flex:none}
.carga b{display:block;font-size:22px;font-stretch:115%;font-weight:780;line-height:1.1}
.carga span{font-size:11.5px;color:var(--muted);font-weight:600}
.list{list-style:none;margin:0;padding:6px 0}
.it{display:flex;gap:14px;padding:10px 18px;position:relative;align-items:flex-start}
.it .dot{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;margin-top:5px;box-shadow:0 0 0 3px var(--pc-tint)}
.it.pass .dot{background:var(--line);box-shadow:none}
.it.pass .it-h b{color:var(--muted)}
.it-b{flex:1;min-width:0}
.it-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.it-h time{font-weight:650;font-size:13.5px;color:var(--muted);min-width:92px}
.it-h b{font-weight:620;font-size:15px}
.it p{font-size:13px;color:var(--muted);margin-top:1px}
.it.now{background:var(--blue-tint)}
.it.now::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;background:var(--link);border-radius:0 3px 3px 0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11.5px;font-weight:620;padding:2px 8px;border-radius:999px;background:var(--line-2);color:var(--muted);line-height:1.5;border:0}
button.tag{cursor:pointer} button.tag:hover{background:var(--blue-tint);color:var(--link)}
.tag.b{background:var(--blue-tint);color:var(--link)}
.tag.r{background:var(--red-tint);color:var(--red)}
.tag.g{background:var(--green-tint);color:var(--green-deep)}
.tag.y{background:var(--yellow-tint);color:var(--yellow-deep)}
.tag.h{background:var(--line);color:var(--ink)}
.empty{padding:28px 18px;color:var(--muted);text-align:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--shadow)}
.panel+.panel{margin-top:16px}
.sec{margin-top:30px}
.sec>h2{margin-bottom:12px}
.sec>.lead{margin:-6px 0 14px}
.closed{background:var(--surface);border:1px dashed var(--blue-line);border-radius:var(--r-lg);padding:40px 24px;text-align:center}
.closed h2{margin-bottom:8px}

/* grades semana/mês */
.wk{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-top:20px;box-shadow:var(--shadow)}
.wk>header{display:flex;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.wk-scroll{overflow-x:auto}
table.grid{width:100%;border-collapse:collapse;min-width:720px}
.grid th,.grid td{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:center;font-size:13.5px}
.grid thead th{font-weight:650;color:var(--muted);font-size:12px;background:var(--surface-2);position:sticky;top:0}
.grid thead th b{display:block;color:var(--ink);font-size:13.5px}
.grid thead th.today,.grid thead th.today b{color:var(--link)}
.grid th.task{text-align:left;font-weight:500;min-width:260px;position:sticky;left:0;background:var(--surface);z-index:1}
.grid thead th.task{background:var(--surface-2);z-index:2}
.grid th.task b{font-weight:620;font-size:14px}
.grid th.task span{color:var(--muted);font-size:12.5px;margin-right:8px;font-weight:600}
.grid td.na{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch-a) 6px 7px)}
.grid td.today{background:var(--blue-tint)}
.grid.mes th,.grid.mes td{padding:6px 3px;font-size:12px}
.mark{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc-bar)}
.mark.a{background:transparent;box-shadow:inset 0 0 0 3px var(--pc-bar)}

/* distribuição / equilíbrio */
.daychips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:600;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--blue-tint);color:var(--link);border-radius:var(--r-md);padding:12px 14px;font-size:14px;margin:0 0 16px}
.eq-top{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.scale{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.scale .vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:14px;margin-top:6px}
.scale .side b{display:block;font-size:34px;font-stretch:118%;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.scale .side span{font-size:13px;color:var(--muted);font-weight:600}
.scale .side.r{text-align:right}
.scale .mid{font-size:13px;color:var(--muted);text-align:center;padding-bottom:6px}
.scale .mid b{display:block;font-size:20px;color:var(--ink);font-stretch:110%}
.beam{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0 6px;background:var(--line-2);position:relative}
.beam i{display:block;height:100%}
.beam::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.verdict{font-size:14px;margin-top:10px}
.verdict.ok{color:var(--green-deep)} .verdict.bad{color:var(--red)}
table.days{width:100%;border-collapse:collapse}
.days th,.days td{padding:8px 6px;font-size:13.5px;border-top:1px solid var(--line-2);text-align:left}
.days thead th{border-top:0;color:var(--muted);font-size:12.5px;font-weight:650}
.days td.n{text-align:right;white-space:nowrap}
.minibar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--line-2);min-width:90px}
.minibar i{display:block;height:100%}
.mix{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:6px 16px;align-items:center}
.mix .lbl{font-size:13.5px;font-weight:600}
.mix .lbl span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.mixbar{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--line-2);font-size:11.5px;font-weight:700}
.mixbar i{display:flex;align-items:center;justify-content:center;font-style:normal;white-space:nowrap;overflow:hidden}
.att{list-style:none;margin:0;padding:0}
.att li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line-2);align-items:flex-start;font-size:14px}
.att li:first-child{border-top:0}
.att .dot{width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:7px;flex:none}
.att button{border:0;background:none;padding:0;color:var(--link);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.amb{margin-top:18px}
.amb h3{margin:0 0 8px;color:var(--muted);font-size:14px;font-weight:650;font-stretch:100%}
.trow{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(160px,1fr) 2fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.trow:hover{border-color:var(--blue-line)}
.trow.off{opacity:.55}
.trow .n b{display:block;font-weight:650}
.trow .n span{font-size:12.5px;color:var(--muted)}
.trow .f{font-size:13.5px;color:var(--muted)}
.slots{display:flex;gap:6px;flex-wrap:wrap}
.slot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:620;padding:3px 9px 3px 4px;border-radius:999px;background:var(--line-2)}
.slot i{width:18px;height:18px;border-radius:50%;background:var(--pc);color:var(--pc-ink);font-style:normal;font-size:10.5px;display:grid;place-items:center;font-weight:750}
.slot i.alt{background:linear-gradient(90deg,var(--green) 50%,var(--yellow) 50%);color:#fff;text-shadow:0 0 2px rgba(0,0,0,.5)}
.peso{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.peso i{width:5px;height:12px;border-radius:2px;background:var(--line)}
.peso i.on{background:var(--ink)}
.switch{position:relative;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:999px;background:#9AA8BB;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.2,.8,.2,1);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}

/* Escala */
.people{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.shiftcard{border-radius:var(--r-lg);padding:20px;background:var(--pc);color:var(--pc-ink)}
.shiftcard small{font-size:13.5px;opacity:.85;font-weight:600}
.shiftcard b{display:block;font-size:30px;font-stretch:118%;font-weight:800;margin:2px 0;letter-spacing:-.02em}
.shiftcard span{font-size:14.5px;font-weight:550;display:block}
.alts{width:100%;border-collapse:collapse}
.alts td{padding:12px 8px;border-top:1px solid var(--line-2);font-size:14px;vertical-align:top}
.alts tr:first-child td{border-top:0}
.alts tr.cur td{background:var(--blue-tint)}
.alts tr.flash td{animation:flash 1.2s ease}
@keyframes flash{0%{background:var(--yellow-tint)}100%{background:transparent}}
.alts td.w{white-space:nowrap;width:120px}
.alts .who-chip{display:inline-flex;align-items:center;gap:7px;font-weight:700;margin-bottom:3px}
.alts .who-chip i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.alts .tk{font-size:12.5px;color:var(--muted);line-height:1.45}
.swapped{display:inline-block;font-size:11.5px;color:var(--red);font-weight:700;background:var(--red-tint);border-radius:999px;padding:1px 8px;margin-top:4px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.settings .panel+.panel{margin-top:0}
.settings h3{margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f>span{font-size:13px;font-weight:620;color:var(--muted)}
.f input[type=text],.f input[type=time],.f input[type=date],.f input[type=number],.f select,.f textarea{border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:var(--field);width:100%;min-width:0}
.f textarea{resize:vertical;min-height:70px;line-height:1.45}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px rgba(11,78,162,.18)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.checks label{position:relative}
.checks input{position:absolute;opacity:0}
.checks span{display:inline-block;padding:6px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600;cursor:pointer;background:var(--field)}
.checks input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.checks input:focus-visible+span{outline:3px solid var(--yellow);outline-offset:2px}
.inline-check{display:flex;align-items:center;gap:9px;font-size:14px;cursor:pointer}
.inline-check input{width:18px;height:18px;accent-color:var(--green)}
.logo-prev{background:var(--blue);border-radius:10px;padding:14px;display:flex;justify-content:center;margin-bottom:12px;min-height:74px;align-items:center;color:#fff}
.logo-prev img,.logo-prev svg{height:46px;width:auto}

/* POPs */
.pops{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.poplist{position:sticky;top:96px;display:flex;flex-direction:column;gap:6px}
.popitem{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:10px 12px;color:var(--ink)}
.popitem:hover{border-color:var(--blue-line)}
.popitem[aria-current="true"]{border-color:var(--link);box-shadow:inset 3px 0 0 var(--link)}
.popitem code{font-family:inherit;font-weight:750;font-size:12px;color:var(--link);background:var(--blue-tint);padding:2px 6px;border-radius:4px;white-space:nowrap;margin-top:1px}
.popitem span{font-size:14px;font-weight:600;line-height:1.3}
.popsel{display:none}
.popdoc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.pd-h{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:18px 22px;background:var(--blue);color:#fff}
.pd-h .lg img,.pd-h .lg svg{height:40px;width:auto;display:block}
.pd-h .lg b{font-size:20px;font-stretch:115%}
.pd-h h2{font-size:24px;line-height:1.15}
.pd-h .cod{text-align:right;font-size:13px;opacity:.9;line-height:1.4}
.pd-h .cod b{display:block;font-size:17px;font-stretch:110%}
.pd-stripe{display:grid;grid-template-columns:70% 30%;height:6px}
.pd-stripe i:first-child{background:var(--green)} .pd-stripe i:last-child{background:var(--yellow)}
.pd-body{padding:20px 22px 24px}
.pd-meta{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px;margin-bottom:18px}
.pd-meta div b{display:block;font-size:12.5px;color:var(--muted);font-weight:650}
.pd-quando{width:100%;border-collapse:collapse;margin:4px 0 18px;font-size:13.5px}
.pd-quando th,.pd-quando td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.pd-quando th{background:var(--surface-2);font-weight:650;font-size:12.5px}
.pd-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px}
.pd-sec{break-inside:avoid;margin-bottom:14px}
.pd-sec.wide{grid-column:1/-1}
.pd-sec h3{font-size:15px;margin-bottom:6px;padding-bottom:5px;border-bottom:2px solid var(--line-2)}
.pd-sec.warn h3{border-bottom-color:var(--yellow)}
.pd-sec.tip h3{border-bottom-color:var(--green)}
.pd-sec ol,.pd-sec ul{margin:0;padding-left:22px}
.pd-sec li{margin:3px 0;font-size:14px;line-height:1.45}
.pd-sec ol li::marker{font-weight:750;color:var(--link)}
.pd-sec.warn{background:var(--yellow-tint);border-radius:10px;padding:10px 14px}
.pd-sec.tip{background:var(--green-tint);border-radius:10px;padding:10px 14px}
.pd-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:26px;font-size:12.5px;color:var(--muted)}
.pd-sign div{border-top:1px solid var(--ink);padding-top:5px}
.sec-ed{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;background:var(--surface-2)}

/* Plano de ação */
.pl-top{display:grid;grid-template-columns:1.2fr 2fr;gap:16px;margin-bottom:16px}
.donut{display:flex;gap:20px;align-items:center}
.donut svg{width:120px;height:120px;transform:rotate(-90deg);flex:none}
.donut circle{fill:none;stroke-width:14}
.donut .big{font-size:40px;font-weight:800;font-stretch:118%;line-height:1}
.legend{display:grid;gap:6px;font-size:13.5px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.stat:hover{border-color:var(--blue-line)}
.stat[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}
.stat b{font-size:28px;font-stretch:115%;font-weight:780;line-height:1.1;color:var(--c)}
.stat span{font-size:13px;color:var(--muted);font-weight:600}
.road{position:relative;height:74px;margin-top:6px}
.road .axis{position:absolute;left:0;right:0;top:36px;height:4px;border-radius:2px;background:var(--line-2)}
.road .today{position:absolute;top:22px;bottom:16px;width:2px;background:var(--ink)}
.road .today::after{content:"hoje";position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--ink)}
.road .pin{position:absolute;top:30px;width:16px;height:16px;border-radius:50%;transform:translateX(-50%);border:3px solid var(--surface);background:var(--c);cursor:pointer;padding:0}
.road .pin:hover{transform:translateX(-50%) scale(1.25)}
.road .lab{position:absolute;bottom:0;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.acts{list-style:none;margin:0;padding:0}
.act{display:grid;grid-template-columns:auto 1fr 170px 190px 140px;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:8px;border-left:5px solid var(--c)}
.act .t{cursor:pointer;min-width:0}
.act .t b{display:block;font-weight:650;font-size:15px}
.act .t p{font-size:13.5px;color:var(--muted)}
.act .m{font-size:13.5px}
.act .m>span{display:block;color:var(--muted);font-size:12.5px}
.act.done .t b{text-decoration:line-through;color:var(--muted)}
.due{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;color:var(--c)}
.due::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.tbar{height:6px;border-radius:999px;background:var(--line-2);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;background:var(--c);border-radius:999px}
.st{border:0;border-radius:999px;padding:6px 12px;font-weight:650;font-size:13px;display:inline-flex;align-items:center;gap:7px;justify-self:start}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.afazer{background:var(--line-2);color:var(--muted)}
.st.andamento{background:var(--yellow-tint);color:var(--yellow-deep)}
.st.feito{background:var(--green-tint);color:var(--green-deep)}
.act .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--soft);background:var(--field);display:grid;place-items:center;padding:0}
.act.done .ck{background:var(--green);border-color:var(--green)}
.act .ck svg{width:15px;height:15px;stroke:#fff;stroke-width:3;fill:none}

/* gaveta */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--surface);z-index:41;transform:translateX(102%);display:flex;flex-direction:column;box-shadow:-20px 0 50px rgba(0,0,0,.25);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.drawer.open{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.drawer>header{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--line-2)}
.drawer>header h2{flex:1;font-size:20px}
.drawer .body{flex:1;overflow:auto;padding:20px}
.drawer>footer{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);flex-wrap:wrap}
.slot-ed{display:grid;grid-template-columns:96px 1.3fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.slot-ed input,.slot-ed select{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:var(--field);min-width:0;width:100%}
.legend-sm{font-size:12.5px;color:var(--muted);margin:-4px 0 12px}
.pordia{display:grid;grid-template-columns:52px 1fr;gap:6px 10px;align-items:center}
.pordia span{font-size:13px;font-weight:620;color:var(--muted)}
.pordia input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;background:var(--field)}
.links{list-style:none;padding:0;margin:0}
.links li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line-2)}
.links li:first-child{border-top:0}
.links a{font-weight:600}
.errbox{background:var(--red-tint);color:var(--red);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px;word-break:break-word}
.steps{margin:0;padding-left:20px} .steps li{margin:6px 0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + var(--tabbar));transform:translate(-50%,140%);background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 14px 12px 18px;display:flex;gap:16px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);font-size:14px;visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
.toast.show{transform:translate(-50%,0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
.toast button{background:transparent;border:0;color:var(--yellow);font-weight:700;padding:4px 6px}
[data-tema="escuro"] .toast button{color:var(--blue)}
#print-root{display:none}

@media (max-width:1180px){ .tabs button{padding:8px 9px;font-size:14px} .brand-t{display:none} }
@media (max-width:980px){
  .act{grid-template-columns:auto 1fr}
  .act .m,.act .st{grid-column:2}
  .trow{grid-template-columns:1fr auto}
  .trow .f,.trow .slots{grid-column:1}
  .eq-top,.pl-top{grid-template-columns:1fr}
  .pops{grid-template-columns:1fr}
  .poplist{display:none}
  .popsel{display:block;margin-bottom:12px}
}
@media (max-width:760px){
  :root{--tabbar:64px}
  .tabs{display:none}
  .top-in{padding:10px 16px;min-height:56px;gap:10px}
  .brand img,.brand svg.logo{height:32px}
  .savest span{display:none}
  .brand-t{display:flex}
  .brand-t span{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);height:calc(64px + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);background:none;border:0;padding:0}
  .tabbar button[aria-current="page"]{color:var(--link)}
  .tabbar svg.i{width:22px;height:22px}
  main{padding:20px 14px calc(40px + var(--tabbar))}
  .cols,.people,.pd-grid,.pd-meta{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .lane-lbl{width:104px;padding:8px 10px 8px 14px}
  .lane-lbl span .hr{display:none}
  .tl-ruler{margin-left:104px}
  .tl-in{min-width:880px}
  .drawer{top:auto;height:92vh;width:100%;border-radius:18px 18px 0 0;transform:translateY(102%)}
  .f3{grid-template-columns:1fr 1fr}
  .slot-ed{grid-template-columns:88px 1fr 40px}
  .slot-ed .sd{grid-column:1/3}
  .distnav{flex-wrap:nowrap}
  .daychips{flex-wrap:nowrap;overflow-x:auto;flex:1;scrollbar-width:none}
  .chip{flex:none}
  .scale .side b{font-size:26px}
  .mix{grid-template-columns:1fr}
  .pd-h{grid-template-columns:1fr;gap:10px}
  .pd-h .cod{text-align:left}
  .grid th.task{min-width:180px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

@media print{
  :root{--ink:#14243D;--muted:#5A6A80;--line:#C9D3E0;--line-2:#E6ECF3;--surface:#fff;--surface-2:#F4F6FA;--bg:#fff;--link:#0B4EA2;--blue-tint:#E4EDF9;--green-tint:#E1F3E7;--yellow-tint:#FFF4D2;--yellow-deep:#8A6200;color-scheme:light}
  body{background:#fff;color:#000}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block;color:#000;font-size:11pt}
  .pp{page-break-after:always;break-after:page}
  .pp:last-child{page-break-after:auto;break-after:auto}
  .pp-h{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0B4EA2;padding-bottom:8px;margin-bottom:4px}
  .pp-h .logo-box{background:#0B4EA2;color:#fff;padding:6px 10px;border-radius:4px;font-weight:800;font-size:14pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp-h .logo-box img,.pp-h .logo-box svg{height:28px;width:auto;display:block}
  .pp-h h1{font-size:16pt;flex:1}
  .pp-h .meta{text-align:right;font-size:9.5pt}
  .pp-h .meta b{font-size:13pt;display:block}
  .pp-stripe{height:4px;background:linear-gradient(90deg,#169C46 0 70%,#FFC72C 70%);margin-bottom:8px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp table{width:100%;border-collapse:collapse}
  .pp th,.pp td{border:1px solid #9AA6B5;padding:2.5px 4px;font-size:9pt;line-height:1.25;text-align:center}
  .pp th{background:#EEF2F7;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp td.tk{text-align:left}
  .pp td.tk small{color:#555;font-size:7.5pt;margin-left:6px}
  .pp td.hr{white-space:nowrap;font-weight:700}
  .pp .sq{display:inline-block;width:11px;height:11px;vertical-align:middle;border:1.5px solid #333;border-radius:2px}
  .pp td.na{background:repeating-linear-gradient(135deg,#fff 0 4px,#ddd 4px 5px);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp.mes th,.pp.mes td{font-size:7pt;padding:2px 2px}
  .pp.mes td.tk{font-size:7.5pt}
  .pp.mes .sq{width:8px;height:8px;border-width:1px}
  .pp .sig{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;margin-top:18px;font-size:9.5pt}
  .pp .sig div{border-top:1px solid #333;padding-top:4px}
  .pp .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .pp h2{font-size:12pt;margin:4px 0 6px}
  .pp .alt{font-size:7pt;font-weight:700;border:1px solid #333;border-radius:3px;padding:0 3px;margin-left:4px}
  .pp-pop .popdoc{border:0;border-radius:0}
  .pp-pop .pd-h,.pp-pop .pd-stripe i,.pp-pop .pd-sec.warn,.pp-pop .pd-sec.tip,.pp-pop .pd-quando th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pp-pop .pd-h{border-radius:6px 6px 0 0;padding:12px 16px}
  .pp-pop .pd-h h2{font-size:16pt}
  .pp-pop .pd-body{padding:12px 4px 0}
  .pp-pop .pd-meta{grid-template-columns:1fr 1fr;margin-bottom:8px;font-size:9.5pt;gap:6px 20px}
  .pp-pop .pd-grid{display:block}
  .pp-pop .pd-grid .pd-sec:not(.wide){display:inline-block;width:48.5%;vertical-align:top;margin-right:2.5%}
  .pp-pop .pd-grid .pd-sec:not(.wide)+.pd-sec:not(.wide){margin-right:0}
  .pp-pop .pd-sec{margin-bottom:6px}
  .pp-pop .pd-sec li{font-size:9pt;margin:0;line-height:1.28}
  .pp-pop .pd-sec h3{font-size:11pt;margin-bottom:3px;padding-bottom:3px}
  .pp-pop .pd-sec.warn,.pp-pop .pd-sec.tip{padding:6px 10px}
  .pp-pop .pd-quando{margin:2px 0 8px}
  .pp-pop .pd-quando th,.pp-pop .pd-quando td{text-align:left;font-size:8.5pt;padding:2px 5px;line-height:1.25}
  .pp-pop .pd-sign{margin-top:12px}
}
</style>
</head>
<body>
<a class="sr" href="#app">Ir para o conteúdo</a>
<header class="top">
  <div class="top-in">
    <button class="brand" data-act="ir" data-r="hoje" aria-label="Ir para Hoje"><span id="logo-slot"></span><span class="brand-t" id="brand-t"><strong>Escala de limpeza</strong><span>Rotina da loja</span></span></button>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
    <button class="savest local" id="savest" data-act="ver-salvamento" title="Situação do salvamento"><i></i><span>Carregando</span></button>
    <button class="temabtn" id="temabtn" data-act="tema" aria-label="Alternar tema claro e escuro"></button>
  </div>

/* =========================================================
   Dados: Google Apps Script (planilha) + cópia no navegador
   ========================================================= */
const GAS = typeof google !== 'undefined' && google.script && google.script.run;
const KEY = 'escala-limpeza:v3';
let S = null;
const salv = { estado:'local', erro:'', tentativas:0 };
const chamar = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
function valido(d){ return d && d.versao === 3 && Array.isArray(d.tarefas) && Array.isArray(d.equipe) && Array.isArray(d.pops); }
function lerLocal(){ try { const raw = localStorage.getItem(KEY); if (raw){ const d = JSON.parse(raw); if (valido(d)) return d; } } catch(e){} return null; }
function gravarLocal(){ try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch(e){ return false; } }
function dadosEmbutidos(){
  try { const t = ($('#dados-iniciais').textContent || '').trim(); if (!t || t.charAt(0) !== '{') return null; return JSON.parse(t); } catch(e){ return null; }
}
const msgErro = e => String(e && (e.message || e.toString()) || e || 'erro desconhecido');
function dicaErro(m){
  if (/403|NetworkError|Failed to fetch|autoriza|authoriz|permiss/i.test(m)) return 'Isso costuma acontecer quando há mais de uma conta Google aberta no navegador ou quando a autorização não foi concluída. Abra o app numa janela anônima só com a conta dona da planilha. Se continuar, rode a função instalar pelo editor do Apps Script e autorize até o fim.';
  if (/instalar|PLANILHA|Spreadsheet|openById/i.test(m)) return 'Rode a função instalar uma vez pelo editor do Apps Script (Extensões > Apps Script, seletor de função: instalar, botão Executar).';
  return 'Use Ver diagnóstico para testar a ligação com a planilha.';
}
function status(){
  const el = $('#savest'); if (!el) return;
  const t = { ok:'Salvo na planilha', busy:'Salvando…', err:'Não salvou na planilha', local:GAS ? 'Só neste navegador' : 'Salvo neste navegador' }[salv.estado];
  el.className = 'savest ' + (salv.estado === 'ok' ? '' : salv.estado);
  el.innerHTML = `<i></i><span>${t}</span>`;
  el.title = salv.erro ? `${t}: ${salv.erro}` : t;
}
let saveT = null, salvando = false, pendente = false;
function salvar(){
  gravarLocal();
  if (!GAS){ salv.estado = 'local'; status(); return; }
  pendente = true; salv.estado = 'busy'; status();
  clearTimeout(saveT); saveT = setTimeout(enviar, 600);
}
async function enviar(){
  if (salvando){ saveT = setTimeout(enviar, 400); return; }
  salvando = true; pendente = false;
  try {
    const r = await chamar('salvarDados', JSON.stringify(S), S.rev);
    if (r && r.conflito){
      const d = JSON.parse(r.json); if (valido(d)){ S = d; S.rev = r.rev; gravarLocal(); render(false); }
      toast('A escala foi alterada em outro computador. Carreguei a versão mais nova: confira e refaça a última mudança.');
    } else if (r && r.ok){ S.rev = r.rev; gravarLocal(); }
    else throw new Error('O servidor não confirmou o salvamento.');
    salv.estado = pendente ? 'busy' : 'ok'; salv.erro = ''; salv.tentativas = 0;
  } catch(e){
    salv.estado = 'err'; salv.erro = msgErro(e); salv.tentativas++;
    if (salv.tentativas === 1) toast('Não salvou na planilha: ' + salv.erro + '. A cópia deste navegador está guardada.');
    if (salv.tentativas < 6) saveT = setTimeout(enviar, 4000 * salv.tentativas);
  }
  salvando = false; status();
}
async function iniciar(){
  if (GAS){
    let d = dadosEmbutidos();
    if (!d){ try { d = await chamar('obterDados'); d.ok = true; } catch(e){ d = { ok:false, erro:msgErro(e) }; } }
    const local = lerLocal();
    if (d.ok){
      const srv = d.json ? (() => { try { return JSON.parse(d.json); } catch(e){ return null; } })() : null;
      if (valido(srv)){ S = srv; S.rev = d.rev; gravarLocal(); salv.estado = 'ok'; }
      else if (local){ S = local; S.rev = d.rev; salvar(); }
      else { S = estadoPadrao(); S.rev = d.rev; salvar(); }
    } else {
      salv.estado = 'err'; salv.erro = d.erro;
      S = local || estadoPadrao();
      setTimeout(() => abrirDiagnostico(), 300);
    }
    setInterval(async () => {
      if (pendente || salvando || salv.estado === 'err' || $('#drawer').classList.contains('open')) return;
      try { const rv = await chamar('versaoDados'); if (rv !== S.rev){ const r = await chamar('obterDados'); const x = JSON.parse(r.json); if (valido(x)){ S = x; S.rev = r.rev; gravarLocal(); render(false); } } } catch(e){}
    }, 120000);
  } else {
    S = lerLocal() || estadoPadrao();
    salv.estado = 'local';
  }
  ui.dist = proxAberto(today());
  status();
  render();
}

/* =========================================================
   Regras
   ========================================================= */
const lojaAbre = d => S.loja.dias.includes(d.getDay());
const pessoa = id => S.equipe.find(e => e.id === id);
const pIdx = id => S.equipe.findIndex(e => e.id === id);
const outra = id => (S.equipe.find(e => e.id !== id) || S.equipe[0]).id;
function semanasEntre(a, b){ return Math.round((mondayOf(b) - mondayOf(a)) / (7*864e5)); }
function bateOrdem(date, ordem){ if (ordem >= 5) return addDays(date, 7).getMonth() !== date.getMonth(); return Math.ceil(date.getDate()/7) === ordem; }
function ocorre(t, date){
  if (!t.ativo || !lojaAbre(date)) return false;
  const f = t.freq, wd = date.getDay();
  switch (f.tipo){
    case 'diaria': return true;
    case 'semanal': return (f.dias||[]).includes(wd);
    case 'quinzenal': return wd === f.dia && mod(semanasEntre(parseKey(S.rodizio.inicio), date), 2) === (f.paridade||0);
    case 'mensal': return wd === f.dia && bateOrdem(date, f.ordem);
    case 'trimestral': return wd === f.dia && bateOrdem(date, f.ordem) && mod(date.getMonth() - (f.mesInicial||0), 3) === 0;
    default: return false;
  }
}
function freqTxt(t){
  const f = t.freq, n = t.slots.length;
  switch (f.tipo){
    case 'diaria': return n > 1 ? `${n} horários por dia` : 'Todos os dias de loja aberta';
    case 'semanal': return `${diasTxt(f.dias||[])}${n > 1 ? `, ${n}x ao dia` : ''}`;
    case 'quinzenal': return `A cada 15 dias, ${DIAS[f.dia]}`;
    case 'mensal': return `1x por mês, ${ordDia(f.ordem, f.dia)}`;
    case 'trimestral': return `A cada 3 meses, ${ordDia(f.ordem, f.dia)} (${[0,1,2,3].map(i => MESES_C[mod((f.mesInicial||0)+i*3,12)]).join(', ')})`;
    default: return 'Quando precisar';
  }
}
const freqTag = t => ({quinzenal:'Quinzenal', mensal:'Mensal', trimestral:'Trimestral', demanda:'Quando precisar'})[t.freq.tipo] || (t.freq.tipo === 'semanal' && (t.freq.dias||[]).length < 5 ? 'Semanal' : '');
const nomeDia = (t, date) => { const c = t.porDia && t.porDia[date.getDay()]; return c ? `${t.nome}: ${c}` : t.nome; };
const peso = t => Number(t.esforco || 2);
function periodo(date){
  const r = S.rodizio, ini = parseKey(r.inicio);
  if (r.ciclo === 'mes') return (date.getFullYear()-ini.getFullYear())*12 + date.getMonth() - ini.getMonth();
  return Math.floor(semanasEntre(ini, date) / (r.ciclo === 'quinzena' ? 2 : 1));
}
function invertido(date){ const p = periodo(date); let t = mod(p, 2) === 1; if (S.rodizio.trocas[p]) t = !t; return t; }
function executor(s, date){
  if (s.quem === ALT){ const c = pessoa(s.comeca) ? s.comeca : S.equipe[0].id; return invertido(date) ? outra(c) : c; }
  return pessoa(s.quem) ? s.quem : S.equipe[0].id;
}
function horario(pid, date){
  const p = pessoa(pid); if (!p || !p.dias.includes(date.getDay())) return null;
  if (date.getDay() === 6 && p.sab) return { ini:p.sab.ini, fim:p.sab.fim, almIni:null, almFim:null };
  return { ini:p.ini, fim:p.fim, almIni:p.almIni, almFim:p.almFim };
}
const horasDia = (pid, date) => { const h = horario(pid, date); if (!h) return 0; return (toMin(h.fim) - toMin(h.ini) - (h.almIni ? toMin(h.almFim) - toMin(h.almIni) : 0)) / 60; };
const horarioTxt = (pid, date) => { const h = horario(pid, date); return h ? `${h.ini} às ${h.fim}` : 'folga'; };
function ocorrencias(date){
  const out = [];
  for (const t of S.tarefas){
    if (!ocorre(t, date)) continue;
    for (const s of t.slots){
      if (s.dias && !s.dias.includes(date.getDay())) continue;
      const ini = toMin(s.hora);
      out.push({ t, s, ini, fim: ini + Number(t.dur||0), pessoa: executor(s, date), key: t.id + ':' + s.id, nome: nomeDia(t, date) });
    }
  }
  return out.sort((a,b) => a.ini - b.ini || a.fim - b.fim);
}
function conflitos(date, occ){
  const m = {}; const add = (k, msg) => (m[k] = m[k] || []).push(msg);
  S.equipe.forEach(p => {
    const h = horario(p.id, date);
    const mine = occ.filter(o => o.pessoa === p.id);
    mine.forEach((o, i) => {
      if (!h){ add(o.key, `${p.nome} não trabalha ${date.getDay()===6?'no sábado':'neste dia'}`); return; }
      if (o.ini < toMin(h.ini) || o.fim > toMin(h.fim)) add(o.key, `Fora do horário de ${p.nome} (${h.ini} às ${h.fim})`);
      if (h.almIni && o.ini < toMin(h.almFim) && o.fim > toMin(h.almIni)) add(o.key, `Cai no almoço de ${p.nome}`);
      if (o.t.altura && !p.altura.ok) add(o.key, `${p.nome} não tem curso de trabalho em altura`);
      for (let j = i+1; j < mine.length; j++){ const q = mine[j]; if (q.ini < o.fim){ add(o.key, `Sobrepõe ${q.nome} (${toHM(q.ini)})`); add(q.key, `Sobrepõe ${o.nome} (${toHM(o.ini)})`); } }
    });
  });

}

const pontos = o => o.t.dur * peso(o.t) / 10;
function cargaDia(date, pid){
  const r = { min:0, pts:0, pesado:0, n:0, amb:{}, h:horasDia(pid, date) };
  ocorrencias(date).filter(o => o.pessoa === pid).forEach(o => { r.n++; r.min += o.t.dur; r.pts += pontos(o); if (peso(o.t) === 3) r.pesado += o.t.dur; r.amb[o.t.ambiente] = (r.amb[o.t.ambiente]||0) + o.t.dur; });
  return r;
}
function cargaPeriodo(datas, pid){
  const r = { min:0, pts:0, pesado:0, n:0, amb:{}, h:0 };
  datas.forEach(d => { const c = cargaDia(d, pid); r.min += c.min; r.pts += c.pts; r.pesado += c.pesado; r.n += c.n; r.h += c.h; for (const k in c.amb) r.amb[k] = (r.amb[k]||0) + c.amb[k]; });
  r.ph = r.h ? r.pts / r.h : 0;
  return r;
}
const difPct = (a, b) => (a + b) ? Math.abs(a - b) / ((a + b) / 2) * 100 : 0;

/* Equilibrar: só mexe em horários sem trava. Fixos podem trocar de pessoa; alternados trocam
   quem começa. Nunca cria choque, nunca cai no almoço ou fora do horário. Objetivo: carga por
   hora trabalhada parecida em cada dia das próximas 4 semanas. */
function equilibrar(){
  const ini = mondayOf(ui.dist), dias = [];
  for (let i = 0; i < 28; i++){ const d = addDays(ini, i); if (lojaAbre(d)) dias.push(d); }
  const ids = S.equipe.map(p => p.id);
  const movs = []; S.tarefas.forEach(t => t.ativo && t.slots.forEach(s => { if (!s.trava) movs.push(s); }));
  const est = new Map(movs.map(s => [s.id, s.quem === ALT ? 'alt:' + s.comeca : s.quem]));
  const base = dias.map(d => ({ d, inv: invertido(d), H: Object.fromEntries(ids.map(id => [id, horario(id, d)])), hrs: Object.fromEntries(ids.map(id => [id, horasDia(id, d)])),
    occ: ocorrencias(d).map(o => ({ o, p: pontos(o), mov: est.has(o.s.id) })) }));
  const quem = (x, b) => {
    if (!x.mov) return x.o.pessoa;
    const e = est.get(x.o.s.id);
    if (e.startsWith('alt:')){ const c = e.slice(4); return b.inv ? outra(c) : c; }
    return e;
  };
  const score = () => {
    let viol = 0, bal = 0;
    for (const b of base){
      const by = {}, pts = {}; ids.forEach(id => { by[id] = []; pts[id] = 0; });
      for (const x of b.occ){ const p = quem(x, b); by[p].push(x.o); pts[p] += x.p; }
      for (const id of ids){
        const h = b.H[id];
        if (!h){ viol += by[id].length; continue; }
        const ti = toMin(h.ini), tf = toMin(h.fim), li = h.almIni ? toMin(h.almIni) : -1, lf = h.almIni ? toMin(h.almFim) : -1; let end = -1;
        for (const o of by[id]){ if (o.ini < ti || o.fim > tf) viol++; if (li >= 0 && o.ini < lf && o.fim > li) viol++; if (o.ini < end) viol++; if (o.t.altura && !pessoa(id).altura.ok) viol++; end = Math.max(end, o.fim); }
      }
      const r = ids.map(id => b.hrs[id] ? pts[id] / b.hrs[id] : 0);
      if (b.hrs[ids[0]] && b.hrs[ids[1]]) bal += (r[0] - r[1]) ** 2;
    }
    return viol * 1e9 + bal;
  };
  const alt = s => { const e = est.get(s.id); return e.startsWith('alt:') ? 'alt:' + outra(e.slice(4)) : outra(e); };
  const antes = score(); let cur = antes;
  for (let it = 0; it < 80; it++){
    let best = null, bestSc = cur;
    for (const s of movs){ const e = est.get(s.id); est.set(s.id, alt(s)); const v = score(); if (v < bestSc - 1e-6){ bestSc = v; best = s; } est.set(s.id, e); }
    if (!best) break;
    est.set(best.id, alt(best)); cur = bestSc;
  }
  const mudou = movs.filter(s => est.get(s.id) !== (s.quem === ALT ? 'alt:' + s.comeca : s.quem));
  return { mudou, est };
}

function timeline(date, mode){
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = Math.max(60, b - a);
  const pct = m => ((Math.min(Math.max(m,a),b) - a) / tot * 100).toFixed(3) + '%';
  const wpct = m => (m / tot * 100).toFixed(3) + '%';
  const occ = ocorrencias(date), conf = conflitos(date, occ);
  const isHoje = dkey(date) === dkey(today()), agora = nowMin();
  let ruler = '';
  for (let h = Math.ceil(a/60); h*60 <= b; h++) ruler += `<span class="tick" style="left:${pct(h*60)}">${h}h</span>`;
  ruler += S.loja.picos.map(p => `<span class="rpk" style="left:${pct(toMin(p))};width:${wpct(60)}" title="Pico das ${p}"></span>`).join('');
  const peaks = S.loja.picos.map(p => `<i class="peak" style="left:${pct(toMin(p))};width:${wpct(60)}"></i>`).join('');
  const nowLine = (isHoje && agora >= a && agora <= b) ? `<i class="nowline" style="left:${pct(agora)}"></i>` : '';
  const lanes = S.equipe.map((p, i) => {
    const h = horario(p.id, date);
    const mine = occ.filter(o => o.pessoa === p.id);
    const ends = [];
    mine.forEach(o => { let r = ends.findIndex(e => e <= o.ini); if (r < 0){ r = ends.length; ends.push(0); } ends[r] = o.fim; o.row = r; });
    const rows = Math.max(1, ends.length);
    const blocks = mine.map(o => {
      const w = conf[o.key], al = o.s.quem === ALT;
      const tip = `${toHM(o.ini)} às ${toHM(o.fim)}: ${o.nome} (${PESO[peso(o.t)].toLowerCase()}${al ? ', alterna' : ''})${w ? '. Atenção: ' + w.join('; ') : ''}`;
      return `<button type="button" class="blk pc${i}${w?' is-warn':''}${peso(o.t)===3?' hv':''}${al?' alt':''}" style="left:${pct(o.ini)};width:${wpct(o.t.dur)};top:${6 + o.row*ROWH}px"
        data-t="${o.t.id}" data-s="${o.s.id}" data-ini="${o.ini}" data-p="${p.id}" ${mode==='edit'?'data-drag':`data-act="ver-tarefa" data-id="${o.t.id}"`}
        title="${esc(tip)}" aria-label="${esc(tip)}${mode==='edit'?'. Use as setas para mover.':''}">${o.t.altura?ic('ladder','i'):''}<span>${esc(o.nome)}</span></button>`;
    }).join('');
    const fundo = h ? `<i class="off l" style="left:0;width:${wpct(Math.max(0,toMin(h.ini)-a))}"></i>
        <i class="off r" style="left:${pct(toMin(h.fim))};right:0"></i>
        ${h.almIni ? `<i class="lunch" style="left:${pct(toMin(h.almIni))};width:${wpct(toMin(h.almFim)-toMin(h.almIni))}" title="Almoço"><em>almoço</em></i>` : ''}` : `<span class="folga">Folga</span>`;
    return `<div class="lane">
      <div class="lane-lbl pc${i}"><b>${esc(p.nome)}</b><span>${h ? `<span class="hr">${h.ini} às ${h.fim}</span>` : 'Folga'}</span></div>
      <div class="lane-track" data-pessoa="${p.id}" style="height:${12 + rows*ROWH}px">${fundo}${peaks}${nowLine}${blocks}</div></div>`;
  }).join('');
  return `<div class="tl" data-mode="${mode}">
    <div class="tl-scroll"><div class="tl-in"><div class="tl-ruler" aria-hidden="true">${ruler}</div>${lanes}</div></div>
    <div class="tl-legend">
      <span><i class="sw pk"></i>Horário de pico</span><span><i class="sw lu"></i>Almoço</span><span><i class="sw of"></i>Fora do horário</span>
      <span><i class="sw hv"></i>Tarefa pesada</span><span><i class="sw al"></i>Alterna a cada semana</span><span><i class="sw wn"></i>Precisa de atenção</span>
      <span>${mode==='exec' ? 'Toque num bloco para ver a tarefa' : 'Arraste para mudar horário ou pessoa'}</span>
    </div></div>`;
}

function montarPeriodo(dias){
  const porDia = Object.fromEntries(dias.map(d => [dkey(d), ocorrencias(d)]));
  const pessoas = S.equipe.map(p => {
    const rows = new Map();
    dias.forEach(d => porDia[dkey(d)].filter(o => o.pessoa === p.id).forEach(o => {
      const rk = o.key + '|' + o.nome;
      if (!rows.has(rk)) rows.set(rk, { o, nome:o.nome, ds:new Set() });
      rows.get(rk).ds.add(dkey(d));
    }));
    const linhas = [...rows.values()].sort((x,y) => x.o.ini - y.o.ini || x.nome.localeCompare(y.nome));
    const hs = [...new Set(dias.map(d => horarioTxt(p.id, d)).filter(x => x !== 'folga'))];
    return { p, linhas, horario: hs.join(' / ') || 'folga' };
  });
  return { dias, porDia, pessoas };
}

function slotChip(s, d){
  const pid = executor(s, d), i = pIdx(pid), al = s.quem === ALT;
  const dz = s.dias ? ` (${diasTxt(s.dias)})` : '';
  return `<span class="slot pc${i}"><i class="${al?'alt':''}">${al ? '⇄' : esc(pessoa(pid).nome[0])}</i>${s.hora} ${al ? 'alterna' : esc(pessoa(s.quem)?.nome || '')}${dz}${s.trava ? ' 🔒' : ''}</span>`;
}
function vDist(){

    oc.forEach(o => (cf[o.key]||[]).forEach(msg => { const kk = o.t.id + '|' + msg; if (!vistos.has(kk)) vistos.set(kk, { o, msg, x }); }));
  }
  const att = [...vistos.values()].slice(0, 12);

  const catalogo = ambs.map(a => `<div class="amb"><h3>${esc(a)}</h3>${S.tarefas.filter(t => (t.ambiente||'Outros') === a).map(t => `
    <div class="trow ${t.ativo?'':'off'}" data-act="edit-tarefa" data-id="${t.id}" role="button" tabindex="0" aria-label="Editar ${esc(t.nome)}">
      <div class="n"><b>${t.altura ? ic('ladder') + ' ' : ''}${esc(t.nome)}${pesoHTML(peso(t))}</b><span>${esc(t.obs||'')}${t.pop ? ` (${esc(t.pop)})` : ''}</span></div>
      <div class="f">${esc(freqTxt(t))}, ${durTxt(t.dur)}</div>

    </div>`).join('')}</div>`).join('');
  return `<div class="ph"><div class="t"><div class="kicker">Distribuição das tarefas</div><h1>Quem faz o quê, e quando</h1>
      <p class="lead">Banheiros seguem o gênero, café e altura têm dono certo. As demais tarefas do horário em que os dois estão na loja alternam: numa semana com um, na outra com o outro.</p></div>

    <div class="row distnav" style="margin-bottom:14px">
      <button class="icon-btn" data-act="dist-sem" data-n="-7" aria-label="Semana anterior">${ic('left')}</button>
      <div class="daychips">${dias.map(x => `<button class="chip" data-act="dist-dia" data-date="${dkey(x)}" aria-pressed="${dkey(x)===dkey(d)}" ${lojaAbre(x)?'':'disabled'}>${DIAS_C[x.getDay()]} ${x.getDate()}</button>`).join('')}</div>
      <button class="icon-btn" data-act="dist-sem" data-n="7" aria-label="Próxima semana">${ic('right')}</button>
    </div>
    <p class="hint">${ic('info')}<span>Arraste um bloco para os lados para mudar o horário, ou para a outra linha para passar a tarefa para a outra pessoa. Num bloco que alterna, arrastar troca quem começa. Toque num bloco para editar. No teclado: setas movem, Enter edita.</span></p>
    ${lojaAbre(d) ? timeline(d, 'edit') : `<div class="closed"><h2>Loja sem expediente neste dia</h2></div>`}
    ${painelEquilibrio()}
    <section class="sec"><h2>Pontos de atenção nas próximas 6 semanas</h2><div class="panel">
      ${att.length ? `<ul class="att">${att.map(({o,msg,x}) => `<li><span class="dot"></span><span style="flex:1"><b>${esc(o.nome)}</b>, ${toHM(o.ini)}: ${esc(msg)}. <span class="muted">Primeira vez em ${DIAS[x.getDay()]}, ${fmtShort(x)}.</span></span><button data-act="edit-tarefa" data-id="${o.t.id}">Ajustar</button></li>`).join('')}</ul>`
        : `<p class="muted">Nenhum choque de horário, almoço, folga ou treinamento.</p>`}</div></section>
    <section class="sec"><h2>Todas as tarefas</h2><p class="muted small">⇄ alterna a cada semana. 🔒 regra fixa (gênero do banheiro, café ou altura). As barrinhas mostram o esforço.</p>${catalogo}</section>`;

        <div class="row"><button class="btn" data-act="backup">${ic('down')}${GAS ? 'Salvar backup no Drive' : 'Exportar backup'}</button><button class="btn" data-act="importar">${ic('up')}Importar backup</button></div>
        <div class="row" style="margin-top:10px">${GAS ? `<button class="btn" data-act="ver-salvamento">${ic('info')}Ver diagnóstico</button>` : ''}<button class="btn danger" data-act="restaurar">${ic('undo')}Restaurar o padrão</button></div></div>
    </div></section>`;
}

}

/* Plano de ação */
function prazoInfo(a){
  if (a.status === 'feito') return { c:'var(--green)', txt:'Concluída', ord:9 };
  if (!a.prazo) return { c:'var(--soft)', txt:'Sem prazo', ord:8 };
  const dd = Math.round((parseKey(a.prazo) - today()) / 864e5);
  if (dd < 0) return { c:'var(--red)', txt:`Vencida há ${-dd} ${-dd===1?'dia':'dias'}`, ord:0, dd };
  if (dd === 0) return { c:'var(--red)', txt:'Vence hoje', ord:1, dd };
  if (dd <= 3) return { c:'#E08A00', txt:`Vence em ${dd} ${dd===1?'dia':'dias'}`, ord:2, dd };
  return { c:'var(--link)', txt:`Faltam ${dd} dias`, ord:3, dd };
}
function vPlano(){
  const hoje = today(), cont = { afazer:0, andamento:0, feito:0, vencida:0 };
  S.acoes.forEach(a => { cont[a.status]++; if (a.status !== 'feito' && a.prazo && parseKey(a.prazo) < hoje) cont.vencida++; });
  const total = S.acoes.length || 1, pctF = Math.round(cont.feito / total * 100);
  const r = 48, C = 2*Math.PI*r;
  const segs = [['feito','var(--green)'],['andamento','#E0A800'],['afazer','var(--line)']];
  let off = 0;
  const donut = segs.map(([k, c]) => { const len = cont[k] / total * C; const el = `<circle cx="60" cy="60" r="${r}" stroke="${c}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return el; }).join('');
  const abertas = S.acoes.filter(a => a.status !== 'feito' && a.prazo);
  const span = 45, x0 = addDays(hoje, -7);
  const pos = d => Math.max(0, Math.min(100, (parseKey(d) - x0) / 864e5 / (span + 7) * 100));
  const road = `<div class="road"><div class="axis"></div><div class="today" style="left:${pos(dkey(hoje))}%"></div>
    ${abertas.map(a => { const pi = prazoInfo(a); return `<button class="pin" style="left:${pos(a.prazo)}%;--c:${pi.c}" data-act="edit-acao" data-id="${a.id}" title="${esc(a.oque)}: ${pi.txt}" aria-label="${esc(a.oque)}: ${pi.txt}"></button>`; }).join('')}
    ${[0,15,30,45].map(n => `<span class="lab" style="left:${pos(dkey(addDays(hoje,n)))}%">${n===0?'':fmtDM(addDays(hoje,n))}</span>`).join('')}</div>`;
  const ord = { andamento:0, afazer:1, feito:2 };
  const filtra = a => ui.filtro === 'todos' || (ui.filtro === 'vencida' ? (a.status !== 'feito' && a.prazo && parseKey(a.prazo) < hoje) : a.status === ui.filtro);
  const lst = S.acoes.filter(filtra).sort((a,b) => prazoInfo(a).ord - prazoInfo(b).ord || ord[a.status] - ord[b.status] || (a.prazo||'9').localeCompare(b.prazo||'9'));
  const stTxt = { afazer:'A fazer', andamento:'Em andamento', feito:'Concluída' };
  const stat = (k, n, l, c) => `<button class="stat" style="--c:${c}" data-act="filtro" data-f="${k}" aria-pressed="${ui.filtro===k}"><b>${n}</b><span>${l}</span></button>`;
  return `<div class="ph"><div class="t"><div class="kicker">Plano de ação</div><h1>O que precisa acontecer para a rotina rodar</h1>
      <p class="lead">Confirmações, equipamentos e treinamento que sustentam a escala. Toque no status para avançar e na ação para editar.</p></div>
      <div class="row"><button class="btn primary" data-act="nova-acao">${ic('plus')}Nova ação</button></div></div>
    <div class="pl-top">
      <div class="panel donut"><svg viewBox="0 0 120 120" aria-hidden="true">${donut}</svg>
        <div><div class="big">${pctF}%</div><p class="muted small" style="margin-bottom:8px">das ações concluídas</p>
        <div class="legend"><span><i style="background:var(--green)"></i>${cont.feito} concluídas</span><span><i style="background:#E0A800"></i>${cont.andamento} em andamento</span><span><i style="background:var(--line)"></i>${cont.afazer} a fazer</span></div></div></div>
      <div class="panel"><h3>Próximos prazos</h3><p class="small muted">Cada ponto é uma ação aberta. Vermelho venceu ou vence hoje, laranja vence em até 3 dias.</p>${road}</div>
    </div>
    <div class="stats" style="margin-bottom:18px">${stat('afazer', cont.afazer, 'A fazer', 'var(--soft)')}${stat('andamento', cont.andamento, 'Em andamento', '#E0A800')}${stat('feito', cont.feito, 'Concluídas', 'var(--green)')}${stat('vencida', cont.vencida, 'Vencidas', 'var(--red)')}</div>

/* arrastar */
function ligarArrastar(){
  const tl = $('.tl[data-mode="edit"]'); if (!tl) return;
  const lanes = $$('.lane-track', tl);
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha), tot = b - a;
  $$('.blk[data-drag]', tl).forEach(el => {
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      e.preventDefault();
      const track = el.parentElement, rect = track.getBoundingClientRect(), ppm = rect.width / tot;
      const st = { x:e.clientX, y:e.clientY, moved:false, dm:0, tgt:track };
      const ini = Number(el.dataset.ini), t = S.tarefas.find(x => x.id === el.dataset.t);
      let tip = null;
      el.setPointerCapture(e.pointerId);
      const move = ev => {
        const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
        if (!st.moved && Math.hypot(dx, dy) < 5) return;
        if (!st.moved){ st.moved = true; el.classList.add('dragging'); tip = document.createElement('div'); tip.className = 'dragtip'; document.body.appendChild(tip); }
        let dm = Math.round(dx / ppm / 5) * 5;
        dm = Math.max(a - ini, Math.min(b - ini - t.dur, dm)); st.dm = dm;
        const tgt = lanes.find(l => { const r = l.getBoundingClientRect(); return ev.clientY >= r.top - 8 && ev.clientY <= r.bottom + 8; }) || track;
        st.tgt = tgt;
        lanes.forEach(l => l.classList.toggle('drop', l === tgt && l !== track));
        const ty = tgt === track ? 0 : tgt.getBoundingClientRect().top - rect.top + 6 - parseFloat(el.style.top);
        el.style.transform = `translate(${dm*ppm}px, ${ty}px)`;
        tip.textContent = `${toHM(ini+dm)} às ${toHM(ini+dm+t.dur)}, ${pessoa(tgt.dataset.pessoa).nome}`;
        tip.style.left = ev.clientX + 'px'; tip.style.top = ev.clientY + 'px';
      };
      const up = () => {
        el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up);
        lanes.forEach(l => l.classList.remove('drop')); tip && tip.remove();
        if (!st.moved){ abrirTarefa(el.dataset.t); return; }
        moverSlot(el.dataset.t, el.dataset.s, st.dm, st.tgt.dataset.pessoa, el.dataset.p);
      };
      el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    el.addEventListener('keydown', e => {
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, k === 'ArrowLeft' ? -5 : 5, el.dataset.p, el.dataset.p, true); }
      else if (k === 'ArrowUp' || k === 'ArrowDown'){ e.preventDefault(); moverSlot(el.dataset.t, el.dataset.s, 0, outra(el.dataset.p), el.dataset.p, true); }
      else if (k === 'Enter' || k === ' '){ e.preventDefault(); abrirTarefa(el.dataset.t); }
    });
  });
}
function moverSlot(tid, sid, dm, para, de, teclado){
  const t = S.tarefas.find(x => x.id === tid), s = t.slots.find(x => x.id === sid);
  if (!dm && para === de){ render(false); return; }
  const a = toMin(S.loja.abre), b = toMin(S.loja.fecha);
  const nova = toHM(Math.max(a, Math.min(b - t.dur, toMin(s.hora) + dm)));
  if (para !== de && s.trava && !confirm(`${t.nome} tem regra fixa (${t.altura ? 'trabalho em altura' : 'banheiro por gênero ou café'}). Passar para ${pessoa(para).nome} mesmo assim?`)){ render(false); return; }
  mudar(() => {
    s.hora = nova;
    if (para !== de){ if (s.quem === ALT) s.comeca = outra(s.comeca); else s.quem = para; }
  }, teclado && para === de ? null : `${t.nome} ${para !== de ? (s.quem === ALT ? `agora começa com quem não fazia (nesta semana: ${pessoa(para).nome})` : `passou para ${pessoa(para).nome}`) : 'mudou de horário'}, às ${nova}`);
  if (teclado){ const nb = $(`.blk[data-s="${sid}"]`); nb && nb.focus(); }
}

function salvarPop(){
  const fm = $('#fp'), titulo = fm.titulo.value.trim(), codigo = fm.codigo.value.trim();
  if (!titulo || !codigo){ toast('Preencha o código e o título do POP.'); return; }
  if (S.pops.some(p => p.codigo === codigo && p.id !== rascunho.id)){ toast('Já existe um POP com esse código.'); return; }
  const secoes = $$('#secs .sec-ed').map(el => ({ id:el.dataset.sec, titulo:$('[data-k=titulo]', el).value.trim() || 'Seção', tipo:$('[data-k=tipo]', el).value, itens:$('[data-k=itens]', el).value.split('\n').map(x => x.trim()).filter(Boolean) }));
  const antigo = rascunho._nova ? null : S.pops.find(p => p.id === rascunho.id).codigo;
  const novo = { id:rascunho.id, codigo, titulo, objetivo:fm.objetivo.value.trim(), onde:fm.onde.value.trim(), revisao:fm.revisao.value.trim() || '01', secoes };
  fecharGaveta();
  mudar(() => {
    const i = S.pops.findIndex(p => p.id === novo.id); if (i >= 0) S.pops[i] = novo; else S.pops.push(novo);
    if (antigo && antigo !== codigo) S.tarefas.forEach(t => { if (t.pop === antigo) t.pop = codigo; });
    ui.pop = codigo;
  }, `POP salvo: ${codigo}`);
}

/* diagnóstico do salvamento */
async function abrirDiagnostico(){
  if (!GAS){
    abrirGaveta('Salvamento', `<p>Esta cópia roda direto no navegador, sem o Google. Os dados ficam salvos só neste navegador.</p><p class="muted" style="margin-top:10px">Para salvar na planilha, instale a versão do Apps Script (veja o LEIA-ME).</p>`, `<span class="spacer"></span><button class="btn primary" data-act="fechar">Fechar</button>`);
    return;
  }
  const corpo = r => `${salv.erro ? `<div class="errbox"><b>Último erro:</b> ${esc(salv.erro)}</div><p style="margin-bottom:14px">${esc(dicaErro(salv.erro))}</p>` : ''}
    ${r ? `<ul class="links">${r.map(([k, v, ok]) => `<li>${ok === false ? '<span class="tag r">falhou</span>' : ok ? '<span class="tag g">ok</span>' : ''}<span style="flex:1"><b>${esc(k)}</b><br><span class="small muted">${esc(v)}</span></span></li>`).join('')}</ul>` : '<div class="boot" style="min-height:120px"><div class="spin"></div>Testando a ligação com a planilha…</div>'}`;
  const rodape = `<button class="btn" data-act="tentar-salvar">${ic('refresh')}Salvar agora</button><span class="spacer"></span><button class="btn primary" data-act="fechar">Fechar</button>`;
  abrirGaveta('Diagnóstico do salvamento', corpo(null), rodape);

      linhas: linhas.map(({o, nome, ds}) => ({ hora:toHM(o.ini), fim:toHM(o.fim), tarefa:nome, obs:o.t.obs||'', pop:o.t.pop||'', altura:!!o.t.altura, alterna:o.s.quem === ALT, marcas:dias.map(d => ds.has(dkey(d))) })) })),
    rodizio: rod,
    carga: dias.map(d => [`${DIAS_C[d.getDay()]} ${fmtDM(d)}`, ...S.equipe.map(p => Math.round(cargaDia(d, p.id).pts))])
  };
}
