/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener('click', e => {
  if (e.target.closest('[data-stop]')) return;
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act){
    case 'ir': ir(el.dataset.r); break;
    case 'tema': { const t = document.documentElement.dataset.tema === 'escuro' ? 'claro' : 'escuro'; document.documentElement.dataset.tema = t; try { localStorage.setItem('escala-limpeza:tema', t); } catch(_){} render(false); break; }
    case 'ver-salvamento': abrirDiagnostico(); break;
    case 'tentar-salvar': salv.tentativas = 0; salvar(); setTimeout(() => abrirDiagnostico(), 2500); break;
    case 'dia': { const n = Number(el.dataset.n); ui.dia = n === 0 ? today() : addDays(ui.dia, n); render(false); break; }
    case 'periodo': ui.periodo = el.dataset.v; render(false); break;
    case 'per': { const n = Number(el.dataset.n);
      if (ui.periodo === 'mes') ui.mes = n === 0 ? new Date(today().getFullYear(), today().getMonth(), 1) : new Date(ui.mes.getFullYear(), ui.mes.getMonth() + n, 1);
      else ui.semana = n === 0 ? mondayOf(today()) : addDays(ui.semana, 7*n);
      render(false); break; }
    case 'dist-dia': ui.dist = parseKey(el.dataset.date); render(false); break;
    case 'dist-sem': ui.dist = proxAberto(mondayOf(addDays(ui.dist, Number(el.dataset.n)))); render(false); break;
    case 'print-dia': imprimirDia(); break;
    case 'print-periodo': imprimirPeriodo(); break;
    case 'print-pops': imprimirPops(S.pops); break;
    case 'print-pop': imprimirPops([S.pops.find(p => p.id === id)]); break;
    case 'exportar': rodarExport(el, 'exportarEscala', payloadPeriodo(), 'Escalas exportadas', 'Escalas exportadas para a planilha e para PDF'); break;
    case 'exportar-pops': rodarExport(el, 'exportarPops', { marca:S.marca.nome || '', lista:S.pops.map(p => ({ codigo:p.codigo, titulo:p.titulo, html:popPdfHTML(p) })) }, 'POPs em PDF', 'POPs gerados em PDF no Drive'); break;
    case 'ver-tarefa': verTarefa(id); break;
    case 'ver-pop': e.preventDefault(); ui.pop = el.dataset.cod; if ($('#drawer').classList.contains('open')) fecharGaveta(); if (ui.rota !== 'pops') ir('pops'); else render(false); break;
    case 'novo-pop': abrirPop(null); break;
    case 'edit-pop': abrirPop(id); break;
    case 'salvar-pop': salvarPop(); break;
    case 'excluir-pop': { const pid = rascunho.id, cod = rascunho.codigo; if (!confirm(`Excluir o ${cod}? As tarefas ligadas a ele ficam sem POP.`)) return; fecharGaveta();
      mudar(() => { S.pops = S.pops.filter(p => p.id !== pid); S.tarefas.forEach(t => { if (t.pop === cod) t.pop = ''; }); ui.pop = null; }, `POP excluído: ${cod}`); break; }
    case 'sec-add': $('#secs').insertAdjacentHTML('beforeend', secEd(sec('Nova seção','lista',[]))); $('#secs .sec-ed:last-child input').focus(); break;
    case 'sec-del': el.closest('.sec-ed').remove(); break;
    case 'mix': ui.mix = el.dataset.v; render(false); break;
    case 'equilibrar': {
      const sem = mondayOf(ui.dist), dias = []; for (let w = 0; w < 28; w++){ const d = addDays(sem, w); if (lojaAbre(d)) dias.push(d); }
      const med = () => { const c = S.equipe.map(p => cargaPeriodo(dias, p.id)); return difPct(c[0].ph, c[1].ph); };
      const antes = med(), r = equilibrar();
      if (!r.mudou.length){ toast('A distribuição já está no melhor equilíbrio possível sem mudar horários.'); break; }
      const snap = JSON.stringify(S);
      r.mudou.forEach(s => { const e = r.est.get(s.id); if (e.startsWith('alt:')){ s.quem = ALT; s.comeca = e.slice(4); } else s.quem = e; });
      salvar(); render(false);
      toast(`${r.mudou.length} ${r.mudou.length===1?'horário mudou':'horários mudaram'} de pessoa. Diferença por hora nas próximas 4 semanas: de ${Math.round(antes)}% para ${Math.round(med())}%.`, snap);
      break;
    }
    case 'nova-tarefa': abrirTarefa(null); break;
    case 'edit-tarefa': abrirTarefa(id); break;
    case 'fechar': fecharGaveta(); break;
    case 'slot-add': $('#slots').insertAdjacentHTML('beforeend', slotRow({ id:uid(), hora:'09:30', quem:ALT, comeca:S.equipe[0].id, trava:false, dias:null })); $('#slots .slot-ed:last-child input').focus(); break;
    case 'slot-del': el.closest('.slot-ed').remove(); break;
    case 'salvar-tarefa': salvarTarefa(); break;
    case 'excluir-tarefa': { const nome = rascunho.nome, tid = rascunho.id; fecharGaveta(); mudar(() => { S.tarefas = S.tarefas.filter(t => t.id !== tid); }, `Tarefa excluída: ${nome}`); break; }
    case 'trocar': {
      const p = el.dataset.p, inv = !S.rodizio.trocas[p];
      ui.flash = p;
      mudar(() => { if (S.rodizio.trocas[p]) delete S.rodizio.trocas[p]; else S.rodizio.trocas[p] = true; }, inv ? 'Semana invertida: quem fazia as tarefas que alternam agora faz as do outro' : 'Inversão desfeita');
      break;
    }
    case 'filtro': ui.filtro = ui.filtro === el.dataset.f ? 'todos' : el.dataset.f; render(false); break;
    case 'status': { const a = S.acoes.find(x => x.id === id); const nx = {afazer:'andamento', andamento:'feito', feito:'afazer'}[a.status]; mudar(() => { a.status = nx; }, null, false); break; }
    case 'concluir': { const a = S.acoes.find(x => x.id === id); const fecha = a.status !== 'feito'; mudar(() => { a.status = fecha ? 'feito' : 'afazer'; }, fecha ? `Ação concluída: ${a.oque}` : null); break; }
    case 'nova-acao': abrirAcao(null); break;
    case 'edit-acao': abrirAcao(id); break;
    case 'salvar-acao': {
      const fm = $('#fa'), oque = fm.oque.value.trim();
      if (!oque){ fm.oque.setCustomValidity('Descreva a ação'); fm.oque.reportValidity(); fm.oque.setCustomValidity(''); return; }
      const nova = { id:rascunho.id, oque, porque:fm.porque.value.trim(), quem:fm.quem.value.trim(), prazo:fm.prazo.value, criado:rascunho.criado || dkey(today()), status:fm.status.value };
      const eraNova = rascunho._nova; fecharGaveta();
      mudar(() => { const i = S.acoes.findIndex(x => x.id === nova.id); if (i >= 0) S.acoes[i] = nova; else S.acoes.push(nova); }, eraNova ? 'Ação criada' : 'Ação salva');
      break;
    }
    case 'excluir-acao': { const aid = rascunho.id; fecharGaveta(); mudar(() => { S.acoes = S.acoes.filter(a => a.id !== aid); }, 'Ação excluída'); break; }
    case 'undo': { const s = $('#toast')._snap; if (s){ const rev = S.rev; S = JSON.parse(s); S.rev = rev; salvar(); render(false); toast('Alteração desfeita'); } break; }
    case 'backup': {
      if (GAS){ rodarExport(el, 'salvarBackup', JSON.stringify(S), 'Backup salvo', 'Backup salvo no Drive'); break; }
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `escala-limpeza-${dkey(today())}.json`; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Backup exportado'); break;
    }
    case 'importar': $('#file-in').click(); break;
    case 'restaurar': {
      if (!confirm('Restaurar o padrão apaga as mudanças de tarefas, POPs e plano de ação. Nome e logo continuam. Continuar?')) return;
      const marca = S.marca, rev = S.rev; mudar(() => { S = estadoPadrao(); S.marca = marca; S.rev = rev; }, 'Padrão restaurado'); break;
    }
    case 'logo-up': $('#logo-in').click(); break;
    case 'logo-reset': mudar(() => { S.marca.logo = null; }, 'Logo removida'); break;
  }
});
$('#scrim').addEventListener('click', fecharGaveta);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#drawer').classList.contains('open')) fecharGaveta();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role=button][data-act]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.matches('[data-popsel]')){ ui.pop = el.value; render(false); return; }
  if (el.dataset.ativa){ const t = S.tarefas.find(x => x.id === el.dataset.ativa); mudar(() => { t.ativo = el.checked; }, `${t.nome} ${el.checked ? 'ativada' : 'pausada'}`); return; }
  if (el.dataset.dia){ const w = Number(el.dataset.dia); mudar(() => { S.loja.dias = el.checked ? [...new Set([...S.loja.dias, w])] : S.loja.dias.filter(x => x !== w); ui.dist = proxAberto(ui.dist); }, null, false); return; }
  if (el.dataset.pdia){
    const [i, w] = el.dataset.pdia.split(':').map(Number), p = S.equipe[i];
    mudar(() => { p.dias = el.checked ? [...new Set([...p.dias, w])] : p.dias.filter(x => x !== w); if (w === 6 && el.checked && !p.sab) p.sab = { ini:p.ini, fim:toHM(Math.min(toMin(p.fim), toMin(p.ini) + 240)) }; }, null, false); return;
  }
  if (el.dataset.set){
    const path = el.dataset.set.split('.');
    let val = el.type === 'checkbox' ? el.checked : el.value;
    if (path.join('.') === 'loja.picos') val = val.split(/[,;\s]+/).map(x => x.trim()).filter(x => /^\d{1,2}:\d{2}$/.test(x)).map(x => x.padStart(5,'0'));
    if ((el.type === 'time' || el.type === 'date') && !val) return;
    if (el.type === 'text' && typeof val === 'string' && !val.trim() && !el.hasAttribute('data-vazio')) return;
    if (typeof val === 'string') val = val.trim();
    mudar(() => { let o = S; path.slice(0,-1).forEach(k => { if (o[k] == null) o[k] = {}; o = o[k]; }); o[path.at(-1)] = val; }, null, false);
    return;
  }
  if (el.matches('[data-freq]')){
    const v = el.value;
    rascunho.freq = { tipo:v, ...(v==='semanal'?{dias:[1,2,3,4,5]}:{}), ...(v==='quinzenal'?{dia:5,paridade:0}:{}), ...(['mensal','trimestral'].includes(v)?{ordem:1,dia:6}:{}), ...(v==='trimestral'?{mesInicial:today().getMonth()}:{}) };
    $('#freq-ex').innerHTML = freqExtra();
  }
});
$('#file-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!valido(d)) throw 0; const rev = S.rev; mudar(() => { S = d; S.rev = rev; }, 'Backup importado'); } catch(_){ toast('Esse arquivo não é um backup desta versão da escala.'); } };
  r.readAsText(f); e.target.value = '';
});
$('#logo-in').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 400*1024){ toast('Logo muito pesada. Use um arquivo de até 400 KB.'); return; }
  const r = new FileReader();
  r.onload = () => mudar(() => { S.marca.logo = r.result; }, 'Logo atualizada');
  r.readAsDataURL(f); e.target.value = '';
});
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ROTAS.some(r => r[0] === h) && h !== ui.rota){ ui.rota = h; render(); } });

iniciar();
</script>
