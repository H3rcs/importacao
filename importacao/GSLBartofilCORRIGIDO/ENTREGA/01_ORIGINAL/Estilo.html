<style>
/* =========================================================
   GSL BARTOFIL — identidade visual
   Marca: Azul #111785, com tarja Verde #01973A e Amarela #FFEE03.
   NAO existe vermelho na marca. O vermelho aqui e apenas sinal de
   alerta (atraso, reprovacao, erro) - nunca identidade visual.

   Dois temas, cada um com seu ceu:
     claro  -> aurora, laveis de marca sobre papel
     escuro -> via lactea tingida com as quatro cores da marca
   ========================================================= */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap');

:root {
  /* Marca — iguais nos dois temas. NAO existe vermelho na marca. */
  --azul: #111785;
  --verde: #01973A;
  --amarelo: #FFEE03;
  --alerta: #D71920;        /* sinal, nao marca */
  --vermelho: var(--alerta); /* compatibilidade */

  /* Tema claro — paleta da referencia (aurora pastel) */
  --azul-vivo: #4F46E5;
  --azul-tenue: #E7EAFE;
  --verde-tenue: #D9F5E6;
  --amarelo-tenue: #FFF8D6;
  --vermelho-tenue: #FCE9EA;

  --tinta: #0F172A;
  --tinta-media: #475569;
  --tinta-fraca: #64748B;
  --linha: rgba(99, 102, 241, .15);
  --linha-forte: rgba(99, 102, 241, .3);

  --fundo: #F0F4FF;
  --vidro: rgba(255, 255, 255, .82);
  --vidro-alto: rgba(255, 255, 255, .95);
  --vidro-borda: rgba(255, 255, 255, .9);
  --sombra: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px rgba(79, 70, 229, .09);
  --sombra-alta: 0 24px 64px rgba(79, 70, 229, .24);
  --brilho-aresta: rgba(99, 102, 241, .3);

  --lateral: linear-gradient(168deg, #111785 0%, #0C1064 100%);
  --lateral-tinta: rgba(255, 255, 255, .78);
  --lateral-linha: rgba(255, 255, 255, .15);
  --lateral-realce: rgba(255, 255, 255, .13);

  /* Neon — a assinatura da referencia. No claro, versoes saturadas
     porem escuras, senao some no papel branco. */
  --neon-ciano: #0891B2;
  --neon-roxo:  #7C3AED;
  --neon-verde: #059669;
  --neon-rosa:  #DB2777;
  --neon-ambar: #D97706;
  --neon-borda: rgba(99, 102, 241, .5);
  --neon-brilho: rgba(99, 102, 241, .3);

  --campo: #FFFFFF;
  --desfoque: blur(18px);
  --raio: 12px;
  --raio-grande: 18px;
  --elastico: cubic-bezier(.34, 1.56, .64, 1);
}

[data-tema="escuro"] {
  --azul-vivo: #7C8BFF;
  --azul-tenue: rgba(124, 139, 255, .16);
  --verde-tenue: rgba(1, 151, 58, .2);
  --amarelo-tenue: rgba(255, 238, 3, .14);
  --vermelho-tenue: rgba(215, 25, 32, .2);

  --tinta: #F8FAFC;
  --tinta-media: #94A3B8;
  --tinta-fraca: #64748B;
  --linha: rgba(255, 255, 255, .08);
  --linha-forte: rgba(255, 255, 255, .2);

  --fundo: #020617;
  --vidro: rgba(15, 23, 42, .8);
  --vidro-alto: rgba(15, 23, 42, .95);
  --vidro-borda: rgba(255, 255, 255, .08);
  --sombra: 0 1px 2px rgba(0, 0, 0, .3), 0 14px 40px rgba(0, 0, 0, .35);
  --sombra-alta: 0 30px 70px rgba(0, 0, 0, .6);
  --brilho-aresta: rgba(255, 255, 255, .3);

  --lateral: rgba(15, 23, 42, .82);
  --lateral-tinta: rgba(248, 250, 252, .82);
  --lateral-linha: rgba(255, 255, 255, .08);
  --lateral-realce: rgba(124, 139, 255, .22);

  --campo: rgba(2, 6, 23, .72);

  --neon-ciano: #00F3FF;
  --neon-roxo:  #BC13FE;
  --neon-verde: #0AFF68;
  --neon-rosa:  #FF2D95;
  --neon-ambar: #FFB800;
  --neon-borda: rgba(0, 243, 255, .5);
  --neon-brilho: rgba(0, 243, 255, .4);
}

* { box-sizing: border-box; }

html { background: var(--fundo); transition: background .5s ease; }

body {
  margin: 0;
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 14px;
  color: var(--tinta);
  background: transparent;
  -webkit-font-smoothing: antialiased;
  transition: color .3s ease;
}

h1, h2, h3 { font-family: 'Archivo', sans-serif; margin: 0; letter-spacing: -.015em; }
h1 { font-size: 25px; font-weight: 700; }
h2 { font-size: 17px; font-weight: 600; }
.oculto { display: none !important; }

/* =========================================================
   O CEU — camadas de fundo, atras de tudo.

   REGRA DE DESEMPENHO desta secao (o que travava o app antes):
   1. Nada aqui anima cor, sombra, filtro ou background-position.
      So `transform` e `opacity` — as duas unicas propriedades que o
      navegador resolve na GPU sem repintar a tela.
   2. `mix-blend-mode` foi removido. Blend mode impede o navegador de
      promover a camada para a GPU: cada quadro remisturava a tela toda.
   3. O `blur()` grande fica em camada propria e fixa (`will-change`),
      entao ele e calculado UMA vez e depois so deslizado.
   4. `contain` isola o ceu: mexer no fundo nunca reprocessa o conteudo.
   ========================================================= */
.ceu {
  position: fixed; inset: 0; z-index: -10;
  overflow: hidden; pointer-events: none;
  contain: strict;
}

/* ---------------------------------------------------------
   CLARO — aurora pastel, ondas e cristais
   --------------------------------------------------------- */
.aurora {
  position: absolute; inset: -40%;
  background: linear-gradient(135deg,
    #DBEAFE 0%, #E0E7FF 20%, #FCE7F3 40%, #E0E7FF 60%, #D1FAE5 80%, #DBEAFE 100%);
  /* A referencia animava background-position (repinta a tela inteira a
     cada quadro). Aqui a mesma leitura vem de deslizar a camada. */
  animation: aurora-deslizar 22s ease-in-out infinite alternate;
  will-change: transform;
  opacity: 1;
  transition: opacity .6s ease;
}
@keyframes aurora-deslizar {
  from { transform: translate3d(-6%, -4%, 0) scale(1.05); }
  to   { transform: translate3d(6%, 4%, 0) scale(1.12); }
}

.aurora-onda {
  position: absolute; left: -50%; width: 200%; height: 400px;
  will-change: transform; opacity: 1;
  transition: opacity .6s ease;
}
.aurora-onda.topo-ceu {
  top: -100px; border-radius: 0 0 50% 50%;
  background: linear-gradient(180deg, rgba(99, 102, 241, .22) 0%, rgba(139, 92, 246, .1) 50%, transparent 100%);
  animation: onda-flutuar 14s ease-in-out infinite;
}
.aurora-onda.base-ceu {
  bottom: -100px; left: -30%; border-radius: 50% 50% 0 0;
  background: linear-gradient(0deg, rgba(236, 72, 153, .16) 0%, rgba(244, 114, 182, .08) 50%, transparent 100%);
  animation: onda-flutuar 18s ease-in-out infinite reverse;
}
@keyframes onda-flutuar {
  0%, 100% { transform: translate3d(0, 0, 0) scaleY(1); }
  50%      { transform: translate3d(8%, 0, 0) scaleY(1.1); }
}

.cristal {
  position: absolute;
  background: linear-gradient(135deg, rgba(255,255,255,.9) 0%, rgba(99,102,241,.2) 50%, rgba(255,255,255,.7) 100%);
  border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
  box-shadow: inset 0 0 30px rgba(255,255,255,.5), 0 10px 40px rgba(99,102,241,.15);
  opacity: .7; will-change: transform;
  animation: cristal-flutuar 14s ease-in-out infinite;
  transition: opacity .6s ease;
}
.cristal.c1 { width: 250px; height: 250px; top: 10%; left: 8%; }
.cristal.c2 {
  width: 180px; height: 180px; bottom: 14%; right: 12%; animation-delay: -4s;
  border-radius: 70% 30% 50% 50% / 50% 50% 50% 50%;
}
.cristal.c3 {
  width: 120px; height: 120px; top: 58%; left: 68%; animation-delay: -8s;
  border-radius: 50% 50% 30% 70% / 40% 60% 40% 60%;
}
@keyframes cristal-flutuar {
  0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg) scale(1); }
  33%      { transform: translate3d(0, -25px, 0) rotate(3deg) scale(1.03); }
  66%      { transform: translate3d(0, 15px, 0) rotate(-2deg) scale(.98); }
}

/* ---------------------------------------------------------
   ESCURO — espaco, duas camadas de estrelas, nebulosas e poeira
   --------------------------------------------------------- */
.espaco {
  position: absolute; inset: 0; opacity: 0;
  background:
    radial-gradient(ellipse at 15% 15%, rgba(88, 28, 135, .4) 0%, transparent 50%),
    radial-gradient(ellipse at 85% 20%, rgba(15, 23, 42, .8) 0%, transparent 40%),
    radial-gradient(ellipse at 50% 50%, rgba(6, 78, 112, .3) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 80%, rgba(124, 58, 237, .35) 0%, transparent 50%),
    radial-gradient(ellipse at 20% 80%, rgba(14, 116, 144, .3) 0%, transparent 45%),
    linear-gradient(180deg, #020617 0%, #0A0F1E 40%, #0F0A1E 70%, #020617 100%);
  transition: opacity .6s ease;
}

/* Estrelas em azulejo de gradiente: mesma leitura da referencia sem
   criar centenas de elementos no DOM piscando box-shadow. */
.estrelas {
  position: absolute; inset: -50%; opacity: 0;
  background-image:
    radial-gradient(1.6px 1.6px at 24px 32px, rgba(255,255,255,.95), transparent),
    radial-gradient(1.2px 1.2px at 92px 44px, rgba(255,255,255,.7), transparent),
    radial-gradient(1.8px 1.8px at 158px 118px, rgba(255,255,255,.9), transparent),
    radial-gradient(1px 1px at 46px 168px, rgba(255,255,255,.6), transparent),
    radial-gradient(1.4px 1.4px at 190px 76px, rgba(188,19,254,.7), transparent),
    radial-gradient(1.2px 1.2px at 128px 190px, rgba(0,243,255,.75), transparent);
  background-size: 220px 220px;
  animation: estrelas-derivar 150s linear infinite;
  will-change: transform;
  transition: opacity .6s ease;
}
@keyframes estrelas-derivar {
  from { transform: translate3d(0, 0, 0); }
  to   { transform: translate3d(110px, -220px, 0); }
}

/* Camada 2: estrelas grandes que pulsam. A referencia animava box-shadow
   em centenas de <div> (repinta cada estrela, cada quadro). Aqui e UMA
   camada mudando so a opacidade — o compositor resolve sozinho. */
.estrelas-brilho {
  position: absolute; inset: -50%; opacity: 0;
  background-image:
    radial-gradient(2.4px 2.4px at 60px 90px, #fff, transparent),
    radial-gradient(2.6px 2.6px at 210px 40px, rgba(188,19,254,.95), transparent),
    radial-gradient(2.2px 2.2px at 130px 250px, rgba(0,243,255,.9), transparent),
    radial-gradient(2.8px 2.8px at 300px 180px, #fff, transparent),
    radial-gradient(2.2px 2.2px at 20px 300px, rgba(255,45,149,.85), transparent);
  background-size: 340px 340px;
  filter: drop-shadow(0 0 6px rgba(255,255,255,.75));
  animation: estrelas-derivar 210s linear infinite, estrelas-pulsar 4.5s ease-in-out infinite;
  will-change: transform, opacity;
  transition: opacity .6s ease;
}
@keyframes estrelas-pulsar { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
[data-tema="escuro"] .estrelas-brilho { opacity: 1; }

/* Poeira que sobe — as particulas da referencia. 12 elementos, so transform. */
.particula {
  position: absolute; bottom: -20px; width: 3px; height: 3px; border-radius: 50%;
  background: rgba(255,255,255,.85); box-shadow: 0 0 8px rgba(255,255,255,.6);
  opacity: 0; animation: particula-subir linear infinite; will-change: transform;
}
@keyframes particula-subir {
  0%   { transform: translate3d(0, 0, 0) scale(0); opacity: 0; }
  10%  { opacity: 1; }
  90%  { opacity: 1; }
  100% { transform: translate3d(0, -102vh, 0) scale(1); opacity: 0; }
}
[data-tema="escuro"] .particula { opacity: 1; }
.particula.p1  { left:  6%; animation-duration: 15s; animation-delay:  0s; }
.particula.p2  { left: 15%; animation-duration: 19s; animation-delay: -3s; background: rgba(188,19,254,.9); }
.particula.p3  { left: 24%; animation-duration: 13s; animation-delay: -7s; }
.particula.p4  { left: 33%; animation-duration: 21s; animation-delay: -1s; background: rgba(0,243,255,.9); }
.particula.p5  { left: 42%; animation-duration: 17s; animation-delay: -9s; }
.particula.p6  { left: 51%; animation-duration: 14s; animation-delay: -5s; background: rgba(188,19,254,.9); }
.particula.p7  { left: 60%; animation-duration: 20s; animation-delay: -12s; }
.particula.p8  { left: 69%; animation-duration: 16s; animation-delay: -2s; background: rgba(0,243,255,.9); }
.particula.p9  { left: 78%; animation-duration: 18s; animation-delay: -8s; }
.particula.p10 { left: 87%; animation-duration: 22s; animation-delay: -4s; background: rgba(255,45,149,.85); }
.particula.p11 { left: 94%; animation-duration: 15s; animation-delay: -11s; }
.particula.p12 { left: 70%; animation-duration: 24s; animation-delay: -15s; background: rgba(188,19,254,.9); }

/* Bolhas do tema claro — mesma mecanica, cor de aurora. */
.bolha {
  position: absolute; bottom: -60px; border-radius: 50%;
  background: linear-gradient(135deg, rgba(255,255,255,.9), rgba(99,102,241,.18));
  box-shadow: inset 0 0 14px rgba(255,255,255,.7), 0 6px 20px rgba(99,102,241,.12);
  opacity: .65; animation: particula-subir linear infinite; will-change: transform;
}
[data-tema="escuro"] .bolha { opacity: 0; }
.bolha.b1 { left: 10%; width: 26px; height: 26px; animation-duration: 26s; animation-delay:  0s; }
.bolha.b2 { left: 28%; width: 16px; height: 16px; animation-duration: 32s; animation-delay: -8s; }
.bolha.b3 { left: 46%; width: 34px; height: 34px; animation-duration: 29s; animation-delay: -16s; }
.bolha.b4 { left: 64%; width: 20px; height: 20px; animation-duration: 35s; animation-delay: -5s; }
.bolha.b5 { left: 82%; width: 28px; height: 28px; animation-duration: 24s; animation-delay: -20s; }
.bolha.b6 { left: 92%; width: 14px; height: 14px; animation-duration: 30s; animation-delay: -12s; }

.nebulosa {
  position: absolute; border-radius: 50%;
  filter: blur(80px); opacity: 0;
  animation: nebulosa-flutuar 20s ease-in-out infinite;
  will-change: transform;          /* blur calculado uma vez, depois so desliza */
  backface-visibility: hidden;
  transition: opacity .8s ease;
}
.nebulosa.azul {
  width: 700px; height: 700px; top: -22%; left: -14%;
  background: radial-gradient(circle, rgba(139, 92, 246, .95) 0%, rgba(88, 28, 135, .5) 50%, transparent 70%);
}
.nebulosa.verde {
  width: 500px; height: 500px; bottom: -15%; right: -15%;
  background: radial-gradient(circle, rgba(236, 72, 153, .7) 0%, rgba(139, 92, 246, .4) 50%, transparent 70%);
  animation-delay: -7s;
}
.nebulosa.amarela {
  width: 400px; height: 400px; top: 50%; right: 20%;
  background: radial-gradient(circle, rgba(6, 182, 212, .6) 0%, rgba(59, 130, 246, .3) 50%, transparent 70%);
  animation-delay: -14s;
}
@keyframes nebulosa-flutuar {
  0%, 100% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
  25%      { transform: translate3d(50px, -30px, 0) scale(1.1) rotate(5deg); }
  50%      { transform: translate3d(-30px, 50px, 0) scale(.95) rotate(-3deg); }
  75%      { transform: translate3d(40px, 30px, 0) scale(1.05) rotate(3deg); }
}

/* Troca de tema: so `opacity` muda — nenhuma camada e recriada. */
[data-tema="escuro"] .aurora      { opacity: 0; }
[data-tema="escuro"] .aurora-onda { opacity: 0; }
[data-tema="escuro"] .cristal     { opacity: 0; }
[data-tema="escuro"] .espaco      { opacity: 1; }
[data-tema="escuro"] .estrelas    { opacity: 1; }
[data-tema="escuro"] .nebulosa    { opacity: .62; }

/* Maquina fraca / usuario com pressa: `<html class="sem-animacao">`
   congela o ceu inteiro sem tirar o visual. */
.sem-animacao .ceu * { animation: none !important; }

/* =========================================================
   TELAS DE ESPERA
   ========================================================= */
.tela-espera {
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px; padding: 28px; text-align: center;
}
.tela-espera p { color: var(--tinta-media); max-width: 480px; line-height: 1.7; margin: 0; }
.marca-espera {
  width: 62px; height: 62px; border-radius: 17px;
  background: linear-gradient(150deg, var(--azul) 0%, var(--azul-vivo) 100%);
  color: #fff; font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 19px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 34px rgba(17, 23, 133, .38);
  animation: pulsar 2.6s ease-in-out infinite;
}
.marca-espera.falha { background: linear-gradient(150deg, var(--vermelho) 0%, #9A1218 100%); animation: none; }
@keyframes pulsar {
  0%, 100% { transform: scale(1); box-shadow: 0 12px 34px rgba(17, 23, 133, .38); }
  50%      { transform: scale(1.05); box-shadow: 0 16px 44px rgba(17, 23, 133, .5); }
}

/* =========================================================
   ESTRUTURA
   ========================================================= */
#aplicacao { display: flex; min-height: 100vh; }

.lateral {
  width: 244px; flex-shrink: 0; padding: 22px 15px;
  display: flex; flex-direction: column;
  background: var(--lateral);
  border-right: 1px solid var(--lateral-linha);
  backdrop-filter: var(--desfoque); -webkit-backdrop-filter: var(--desfoque);
  transition: background .5s ease;
  /* Barra FIXA na altura da tela. Sem isso ela esticava junto com o
     calendario que rola, e o rodape (nome do usuario) ia parar la
     embaixo, longe da vista. Agora ela fica colada no topo e o menu
     rola dentro dela se precisar. */
  position: sticky; top: 0; align-self: flex-start;
  height: 100vh; overflow-y: auto;
}

.marca { padding: 0 8px 22px; }
.marca-linha { display: flex; align-items: center; gap: 10px; }
.marca-sigla { font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 23px; color: #fff; letter-spacing: .01em; }
.marca-nome { font-size: 13px; color: rgba(255, 255, 255, .6); }
/* Assinatura: as quatro cores da marca como um espectro */
.marca-espectro {
  display: flex; height: 3px; border-radius: 2px; overflow: hidden; margin-top: 11px;
  box-shadow: 0 0 18px rgba(255, 255, 255, .18);
}
.marca-espectro span { flex: 1; }
.marca-espectro span:nth-child(1) { background: var(--verde); }
.marca-espectro span:nth-child(2) { background: var(--amarelo); }

.menu { display: flex; flex-direction: column; gap: 3px; flex: 1; }
.item-menu {
  display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 9px;
  color: var(--lateral-tinta); background: none; border: 0; cursor: pointer;
  font-family: inherit; font-size: 14px; text-align: left; width: 100%;
  transition: background .2s ease, color .2s ease, transform .2s ease;
}
.item-menu:hover { background: rgba(255, 255, 255, .09); color: #fff; transform: translateX(2px); }
.item-menu.ativo { background: var(--lateral-realce); color: #fff; font-weight: 500; }
.tag-cor { width: 4px; height: 19px; border-radius: 2px; flex-shrink: 0; transition: box-shadow .25s ease; }
.item-menu.ativo .tag-cor { box-shadow: 0 0 12px currentColor; }
.tag-cor.azul { background: var(--azul-vivo); color: var(--azul-vivo); }
.tag-cor.verde { background: var(--verde); color: var(--verde); }
.tag-cor.amarelo { background: var(--amarelo); color: var(--amarelo); }
.tag-cor.branco { background: #FFFFFF; color: #FFFFFF; }
.tag-cor.vermelho { background: var(--alerta); color: var(--alerta); }

.rodape-lateral { border-top: 1px solid var(--lateral-linha); padding-top: 15px; }
.usuario-nome { font-size: 13px; font-weight: 500; color: #fff; }
.usuario-papel { font-size: 12px; color: rgba(255, 255, 255, .55); margin-bottom: 10px; }
.acoes-lateral { display: flex; gap: 8px; align-items: center; }
.botao-texto {
  background: none; border: 0; color: rgba(255, 255, 255, .72); font-family: inherit;
  font-size: 12px; cursor: pointer; padding: 0; text-align: left;
}
.botao-texto:hover { color: #fff; }
.tema-alternar {
  background: linear-gradient(135deg, var(--neon-roxo), var(--neon-ciano));
  border: 0; color: #fff; width: 42px; height: 42px; border-radius: 12px; cursor: pointer;
  flex-shrink: 0; font-size: 19px; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 8px 22px -8px var(--neon-roxo), inset 0 -2px 8px rgba(0,0,0,.25), inset 0 2px 8px rgba(255,255,255,.3);
  transition: transform .35s var(--elastico), box-shadow .3s ease;
}
.tema-alternar:hover {
  transform: rotate(-12deg) scale(1.12);
  box-shadow: 0 12px 30px -8px var(--neon-roxo), 0 0 28px -6px var(--neon-ciano),
              inset 0 -2px 8px rgba(0,0,0,.25), inset 0 2px 8px rgba(255,255,255,.3);
}
/* Cabecalho fixo.
   Antes ele pintava uma faixa OPACA na cor --fundo por cima do ceu: como
   a aurora muda de cor e o --fundo nao, aparecia um retangulo claro
   recortado no meio do fundo. Agora nao pinta cor nenhuma — desfoca o
   que passa por baixo e some com mascara, sem aresta. E um elemento so,
   entao o custo do backdrop-filter aqui e irrelevante. */
.topo {
  position: sticky; top: 0; z-index: 20; padding: 12px 0 14px;
  background: transparent;
  backdrop-filter: blur(14px) saturate(1.25);
  -webkit-backdrop-filter: blur(14px) saturate(1.25);
}
/* Degrade de esvaecimento do proprio cabecalho.
   O problema anterior: um ::after pintava uma faixa em cor SOLIDA (--fundo)
   por baixo do cabecalho. Como o desfoque ja e transparente e o ceu muda de
   cor, aquela faixa aparecia como um retangulo que "quase" some, mas nao
   some. Agora o esvaecimento vive na propria mascara do .topo — nada e
   pintado por cima do fundo, entao nao ha retangulo nenhum. */
.topo {
  -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 82%, transparent 100%);
          mask-image: linear-gradient(180deg, #000 0%, #000 82%, transparent 100%);
}

.conteudo { flex: 1; padding: 28px 32px 64px; min-width: 0; }
.pagina { animation: cartao-entrar .35s cubic-bezier(.2, .8, .3, 1); }
.topo { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
.subtitulo { margin: 6px 0 0; color: var(--tinta-media); font-size: 13px; line-height: 1.4; overflow: visible; }
.topo h1 { line-height: 1.15; }
.acoes-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.faixa-aviso {
  background: linear-gradient(100deg, var(--amarelo) 0%, #FFD803 100%); color: #2E2A00;
  padding: 10px 16px; border-radius: var(--raio); margin-bottom: 18px; font-size: 13px;
  display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 22px rgba(255, 238, 3, .3);
}
.faixa-aviso .botao-texto { color: #2E2A00; text-decoration: underline; }

/* =========================================================
   VIDRO — cartoes e paineis
   ========================================================= */
.cartao {
  position: relative;
  background: var(--vidro);
  /* SEM backdrop-filter: cada cartao com desfoque de fundo obriga o
     navegador a reamostrar o ceu animado por baixo, a cada quadro, para
     cada cartao da tela. Era a causa principal da lentidao. O --vidro
     ja e translucido: a leitura de vidro continua. */
  border: 1px solid var(--vidro-borda);
  border-radius: var(--raio-grande);
  padding: 17px 19px;
  box-shadow: var(--sombra);
  --fita: linear-gradient(90deg, var(--neon-ciano), var(--neon-roxo));
  transition: transform .4s var(--elastico), box-shadow .4s ease, border-color .4s ease;
  animation: cartao-entrar .6s var(--elastico) backwards;
}
/* Fita neon no topo — a assinatura visual da referencia. */
.cartao::before {
  content: ''; position: absolute; inset: 0 0 auto; height: 3px;
  border-radius: var(--raio-grande) var(--raio-grande) 0 0;
  background: var(--fita); opacity: .85; pointer-events: none;
}
/* Varredura de luz ao passar o mouse. Roda so no hover, num cartao por
   vez — nao e animacao infinita, entao nao custa quadro nenhum parado. */
.cartao::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(100deg, transparent 42%, rgba(255,255,255,.14) 50%, transparent 58%);
  background-size: 300% 100%; background-position: 100% 0;
  transition: background-position .75s ease;
}
.cartao:hover::after { background-position: 0 0; }
.cartao:hover {
  transform: translateY(-3px);
  border-color: var(--neon-borda);
  box-shadow: var(--sombra), 0 0 30px -8px var(--neon-brilho);
}
@keyframes cartao-entrar { from { opacity: 0; transform: translateY(18px) scale(.98); } }
.grade > .cartao:nth-child(2) { animation-delay: .06s; }
.grade > .cartao:nth-child(3) { animation-delay: .12s; }
.grade > .cartao:nth-child(4) { animation-delay: .18s; }
.grade > .cartao:nth-child(5) { animation-delay: .24s; }
.grade > .cartao:nth-child(6) { animation-delay: .3s; }
.cartao-titulo {
  font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; color: var(--tinta-media); margin-bottom: 15px;
}

.grade { display: grid; gap: 14px; }
.grade-kpi { grid-template-columns: repeat(auto-fit, minmax(162px, 1fr)); }
.grade-dupla { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

/* ---------------------------------------------------------
   KPI

   O desenho anterior empilhava tres sinais de cor no mesmo
   cartao: borda esquerda colorida, lavagem de gradiente no
   fundo e fita neon no topo — cada um com uma cor diferente,
   nenhum alinhado com o outro. Por isso ficava desarmonico.

   Agora e um sinal so: a cor do cartao, declarada em --cor,
   manda na fita, no numero e no brilho. Mesma familia visual
   dos holocards do menu.
   --------------------------------------------------------- */
.kpi {
  --cor: var(--neon-ciano);
  --par: var(--neon-roxo);
  --fita: linear-gradient(135deg, var(--cor), var(--par));
  position: relative; overflow: hidden; padding: 20px 20px 18px;
  display: flex; flex-direction: column; gap: 2px;
}
.kpi.verde    { --cor: var(--neon-verde); --par: var(--neon-ciano); }
.kpi.amarelo  { --cor: var(--neon-ambar); --par: var(--neon-rosa); }
.kpi.vermelho { --cor: var(--alerta);     --par: var(--neon-rosa); }
.kpi.azul     { --cor: var(--neon-ciano); --par: var(--neon-roxo); }

/* Halo de canto: a unica cor de fundo, na propria cor do cartao. */
.kpi::after {
  background:
    radial-gradient(120px 120px at 100% 0%, color-mix(in srgb, var(--cor) 16%, transparent), transparent 70%),
    linear-gradient(100deg, transparent 42%, rgba(255,255,255,.14) 50%, transparent 58%);
  background-size: auto, 300% 100%;
  background-position: 0 0, 100% 0;
  background-repeat: no-repeat;
}
.kpi:hover::after { background-position: 0 0, 0 0; }
.kpi:hover {
  transform: translateY(-6px);
  border-color: var(--cor);
  box-shadow: var(--sombra-alta), 0 0 40px -12px var(--cor);
}

.kpi-valor {
  font-family: 'Archivo', sans-serif; font-size: 40px; font-weight: 800;
  line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.03em;
  color: var(--cor);
}
[data-tema="escuro"] .kpi-valor { text-shadow: 0 0 26px color-mix(in srgb, var(--cor) 55%, transparent); }
.kpi-rotulo {
  font-size: 10.5px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .14em; color: var(--tinta-fraca); margin-top: 8px;
}

/* =========================================================
   HOLOCARDS — o menu de modulos

   Cada modulo e um cartao grande com icone em relevo, fita
   neon no topo, varredura de luz e elevacao elastica. A cor
   inteira do cartao sai de --cor / --par, como nos KPIs.
   ========================================================= */
.tela-modulos {
  min-height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 34px 0 50px;
}
.modulos-titulo {
  font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 700;
  letter-spacing: .22em; text-transform: uppercase; color: var(--tinta-fraca);
  margin-bottom: 26px; text-align: center;
}
.grade-modulos {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 22px; width: 100%; max-width: 1100px;
}

.holocard {
  --cor: var(--neon-ciano);
  --par: var(--neon-roxo);
  position: relative; overflow: hidden; text-align: left;
  display: flex; flex-direction: column; min-height: 248px;
  padding: 26px; border-radius: 22px; cursor: pointer;
  background: var(--vidro); border: 1px solid var(--vidro-borda);
  box-shadow: var(--sombra); color: inherit; font-family: inherit;
  transition: transform .4s var(--elastico), box-shadow .4s ease, border-color .4s ease;
  animation: holo-entrar .7s var(--elastico) backwards;
}
.holocard.azul  { --cor: #3B82F6; --par: var(--neon-ciano); }
.holocard.verde { --cor: #10B981; --par: #34D399; }
.holocard.ambar { --cor: #F59E0B; --par: #FBBF24; }
.holocard.roxo  { --cor: #8B5CF6; --par: #D946EF; }

.grade-modulos > .holocard:nth-child(2) { animation-delay: .07s; }
.grade-modulos > .holocard:nth-child(3) { animation-delay: .14s; }
.grade-modulos > .holocard:nth-child(4) { animation-delay: .21s; }
@keyframes holo-entrar { from { opacity: 0; transform: translateY(26px) scale(.96); } }

/* fita neon */
.holocard::before {
  content: ''; position: absolute; inset: 0 0 auto; height: 3px;
  background: linear-gradient(135deg, var(--cor), var(--par)); opacity: .9;
}
/* halo de canto + varredura de luz */
.holocard::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background:
    radial-gradient(180px 180px at 100% 0%, color-mix(in srgb, var(--cor) 14%, transparent), transparent 70%),
    linear-gradient(100deg, transparent 42%, rgba(255,255,255,.14) 50%, transparent 58%);
  background-size: auto, 300% 100%;
  background-position: 0 0, 100% 0;
  background-repeat: no-repeat;
  transition: background-position .75s ease;
}
.holocard:hover::after { background-position: 0 0, 0 0; }
.holocard:hover {
  transform: translateY(-10px) scale(1.02);
  border-color: var(--cor);
  box-shadow: var(--sombra-alta), 0 0 60px -20px var(--cor);
}

.holo-icone {
  width: 64px; height: 64px; border-radius: 17px; margin-bottom: 20px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--cor), var(--par));
  color: #fff; font-size: 27px; line-height: 1; position: relative;
  box-shadow: 0 10px 30px -10px var(--cor),
              inset 0 -3px 10px rgba(0, 0, 0, .2),
              inset 0 3px 10px rgba(255, 255, 255, .25);
  transition: transform .4s var(--elastico), box-shadow .4s ease;
}
/* lustro diagonal: e o que da o relevo de vidro no icone */
.holo-icone::before {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(135deg, rgba(255,255,255,.32) 0%, transparent 50%);
}
.holocard:hover .holo-icone {
  transform: scale(1.1) rotate(-5deg);
  box-shadow: 0 15px 40px -10px var(--cor),
              inset 0 -3px 10px rgba(0, 0, 0, .2),
              inset 0 3px 10px rgba(255, 255, 255, .25);
}

.holo-titulo {
  font-family: 'Archivo', sans-serif; font-size: 21px; font-weight: 700;
  color: var(--tinta); margin-bottom: 8px; transition: color .2s ease;
}
.holocard:hover .holo-titulo { color: var(--cor); }
.holo-frase { font-size: 13px; line-height: 1.65; color: var(--tinta-media); flex: 1; }

.holo-rodape {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--linha);
}
.holo-acao {
  font-size: 10px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .15em; color: var(--cor);
}
.holo-seta {
  width: 34px; height: 34px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--linha); color: var(--tinta-fraca); font-size: 15px;
  transition: background .3s ease, color .3s ease, transform .3s var(--elastico);
}
.holocard:hover .holo-seta { background: var(--cor); color: #fff; transform: translateX(5px); }

/* Marca d'agua do icone no canto — o "floating icon" da referencia. */
.holo-marca {
  position: absolute; right: 14px; bottom: 10px; font-size: 78px;
  opacity: .04; pointer-events: none; line-height: 1;
}

/* Voltar ao menu de modulos */
.voltar-modulos {
  display: flex; align-items: center; gap: 8px; width: 100%;
  /* Antes era transparente e passava batido. Agora tem fundo neon suave,
     borda e uma seta que desliza no hover — chama o olho sem gritar. */
  background: linear-gradient(135deg, color-mix(in srgb, var(--neon-roxo) 22%, transparent), color-mix(in srgb, var(--neon-ciano) 18%, transparent));
  border: 1px solid var(--lateral-realce); color: #fff; cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 10px 12px; border-radius: 10px; margin-bottom: 10px;
  transition: background .25s ease, transform .25s var(--elastico), box-shadow .25s ease;
}
.voltar-modulos::before {
  content: '\25C0'; font-size: 10px;
  transition: transform .25s var(--elastico);
}
.voltar-modulos:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 18px -6px var(--neon-roxo);
  background: linear-gradient(135deg, color-mix(in srgb, var(--neon-roxo) 34%, transparent), color-mix(in srgb, var(--neon-ciano) 28%, transparent));
}
.voltar-modulos:hover::before { transform: translateX(-3px); }

/* Marcos da semana: aura de atencao, na cor da marca */
.marco {
  border-left: 3px solid var(--amarelo);
  box-shadow: var(--sombra), inset 0 0 60px var(--amarelo-tenue);
}

/* =========================================================
   CONTROLES
   ========================================================= */
.botao {
  background: linear-gradient(140deg, var(--azul) 0%, var(--azul-vivo) 100%); color: #fff;
  border: 0; padding: 9px 17px; border-radius: 9px; font-family: inherit;
  font-size: 13px; font-weight: 500; cursor: pointer;
  box-shadow: 0 4px 14px rgba(17, 23, 133, .28);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
.botao { transition: transform .3s var(--elastico), box-shadow .3s ease, filter .3s ease; }
.botao:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 22px rgba(17, 23, 133, .36), 0 0 24px -4px var(--neon-brilho);
  filter: brightness(1.08);
}
.botao:disabled { opacity: .55; cursor: default; transform: none; }
.botao.secundario {
  background: var(--vidro-alto); color: var(--tinta); border: 1px solid var(--linha);
  box-shadow: none;
}
.botao.secundario:hover { border-color: var(--azul-vivo); color: var(--azul-vivo); filter: none; }
.botao.perigo { background: linear-gradient(140deg, var(--vermelho) 0%, #9A1218 100%); box-shadow: 0 4px 14px rgba(215, 25, 32, .3); }

select, input, textarea {
  font-family: inherit; font-size: 13px; padding: 9px 11px; color: var(--tinta);
  border: 1px solid var(--linha); border-radius: 9px; background: var(--campo);
  transition: border-color .2s ease, box-shadow .2s ease;
}
select:focus, input:focus, textarea:focus {
  outline: none; border-color: var(--azul-vivo); box-shadow: 0 0 0 3px var(--azul-tenue);
}
input[type="file"] { border: 0; background: none; padding: 0; font-size: 12px; color: var(--tinta-media); }

.icone-botao {
  background: none; border: 1px solid var(--linha); border-radius: 8px; cursor: pointer;
  padding: 5px 10px; font-family: inherit; font-size: 12px; color: var(--tinta-media);
  transition: border-color .18s ease, color .18s ease, background .18s ease;
}
.icone-botao:hover { border-color: var(--azul-vivo); color: var(--azul-vivo); background: var(--azul-tenue); }
.icone-botao.perigo:hover { border-color: var(--vermelho); color: var(--vermelho); background: var(--vermelho-tenue); }
.acoes-linha { display: flex; gap: 6px; align-items: center; }

/* =========================================================
   BARRAS, TABELAS, ETIQUETAS
   ========================================================= */
.barra-linha { display: grid; grid-template-columns: 82px 1fr 54px; align-items: center; gap: 11px; margin-bottom: 10px; }
.barra-rotulo { font-size: 13px; color: var(--tinta-media); }
.barra-trilho { background: var(--azul-tenue); border-radius: 5px; height: 10px; overflow: hidden; }
.barra-preenchida {
  height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--azul) 0%, var(--azul-vivo) 100%);
  box-shadow: 0 0 14px rgba(42, 49, 184, .45); animation: barra-crescer .7s cubic-bezier(.2, .8, .3, 1);
}
.barra-preenchida.vermelho {
  background: linear-gradient(90deg, #9A1218 0%, var(--vermelho) 100%);
  box-shadow: 0 0 14px rgba(215, 25, 32, .45);
}
@keyframes barra-crescer { from { width: 0 !important; } }
.barra-valor { font-size: 13px; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--tinta-fraca); font-weight: 600; padding: 0 10px 9px 0; border-bottom: 1px solid var(--linha);
}
td { padding: 11px 10px 11px 0; border-bottom: 1px solid var(--linha); vertical-align: top; }
tbody tr { transition: background .18s ease; }
tbody tr:hover { background: var(--azul-tenue); }
tr:last-child td { border-bottom: 0; }
.numero { font-variant-numeric: tabular-nums; text-align: right; }

.etiqueta { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.etiqueta.aprovada, .etiqueta.concluido { background: var(--verde-tenue); color: var(--verde); }
.etiqueta.aguardando { background: var(--amarelo-tenue); color: #8A7A00; }
.etiqueta.pendente, .etiqueta.iniciar { background: var(--linha); color: var(--tinta-media); }
.etiqueta.atrasada, .etiqueta.atrasado { background: var(--vermelho-tenue); color: var(--alerta); }
.etiqueta.reprovada { background: var(--vermelho-tenue); color: var(--alerta); border: 1px solid var(--alerta); }
.etiqueta.cancelada { background: var(--linha); color: var(--tinta-fraca); text-decoration: line-through; }
[data-tema="escuro"] .etiqueta.aprovada { color: #4ADE80; }
[data-tema="escuro"] .etiqueta.aguardando { color: var(--amarelo); }

/* --- Grade do mes --- */
.grade-mes {
  display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px;
  /* perspectiva ativa o leve 3D das celulas no hover */
  perspective: 1200px;
}
.dia-cabecalho {
  font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: .1em;
  color: var(--tinta-media); text-align: center; padding: 4px 0 10px;
}
.dia {
  position: relative; min-height: 92px; border: 1.5px solid var(--linha-forte);
  border-radius: 12px; padding: 8px; overflow: hidden;
  display: flex; flex-direction: column; gap: 3px;
  background: var(--vidro-alto); box-shadow: var(--sombra);
  transform-style: preserve-3d;
  transition: transform .3s var(--elastico), box-shadow .3s ease, border-color .3s ease;
}
/* Aro neon que so acende no hover — fica invisivel enquanto nao passa o mouse. */
.dia::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 1.5px transparent; transition: box-shadow .3s ease;
}
.dia:hover {
  transform: translateY(-4px) rotateX(4deg) scale(1.03); z-index: 2;
  border-color: var(--neon-roxo);
  box-shadow: var(--sombra-alta), 0 0 32px -10px var(--neon-roxo);
}
.dia:hover::after { box-shadow: inset 0 0 18px -2px color-mix(in srgb, var(--neon-ciano) 40%, transparent); }
.dia.fora { opacity: .35; background: transparent; border-style: dashed; box-shadow: none; }
.dia.fora:hover { transform: none; }

/* Cores do calendario da planilha. Ordem no CSS: prazo, atraso, reuniao,
   hoje — a ultima que casa vence, e "hoje" tem que vencer todas. */
.dia.com-prazo  { border-color: rgba(59, 130, 246, .7);  box-shadow: var(--sombra), inset 0 0 26px rgba(59, 130, 246, .14); }
.dia.com-atraso { border-color: var(--alerta);           box-shadow: var(--sombra), inset 0 0 26px rgba(215, 25, 32, .16); }
.dia.reuniao    { border-color: var(--verde);            box-shadow: var(--sombra), inset 0 0 26px rgba(1, 151, 58, .18); }
.dia.hoje       { border-color: var(--amarelo); box-shadow: var(--sombra), inset 0 0 30px var(--amarelo-tenue); }
/* Fita fina no topo da celula marcada, para ler a cor mesmo sem sombra. */
.dia.com-prazo::before, .dia.com-atraso::before, .dia.reuniao::before, .dia.hoje::before {
  content: ''; position: absolute; inset: 0 0 auto; height: 3px;
}
.dia.com-prazo::before  { background: rgba(59, 130, 246, .8); }
.dia.com-atraso::before { background: var(--alerta); }
.dia.reuniao::before    { background: var(--verde); }
.dia.hoje::before       { background: var(--amarelo); }

.legenda-mes {
  display: flex; flex-wrap: wrap; gap: 14px; margin-top: 12px;
  font-size: 11px; color: var(--tinta-fraca);
}
.legenda-mes span { display: inline-flex; align-items: center; gap: 5px; }
.amostra { width: 11px; height: 11px; border-radius: 3px; border: 1.5px solid; display: inline-block; }
.amostra.hoje    { border-color: var(--amarelo); background: var(--amarelo-tenue); }
.amostra.prazo   { border-color: rgba(59, 130, 246, .8); background: rgba(59, 130, 246, .16); }
.amostra.atraso  { border-color: var(--alerta); background: rgba(215, 25, 32, .16); }
.amostra.reuniao { border-color: var(--verde); background: rgba(1, 151, 58, .18); }

/* Tira de meses — os cartoes que trocam a competencia. */
.tira-meses {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 12px; margin-bottom: 6px;
}
.chip-mes {
  flex: 0 0 auto; font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 700;
  letter-spacing: .06em; color: var(--tinta-media); cursor: pointer;
  background: var(--vidro-alto); border: 1.5px solid var(--linha-forte);
  border-radius: 11px; padding: 9px 16px;
  transition: transform .25s var(--elastico), box-shadow .25s ease, border-color .25s ease, color .25s ease;
}
.chip-mes:hover {
  transform: translateY(-3px); color: var(--tinta);
  border-color: var(--neon-roxo); box-shadow: 0 8px 22px -10px var(--neon-roxo);
}
.chip-mes.ativo {
  color: #fff; border-color: transparent;
  background: linear-gradient(135deg, var(--neon-roxo), var(--neon-ciano));
  box-shadow: 0 8px 24px -8px var(--neon-roxo);
}

/* Faixa de andamento — a linha logo abaixo do titulo da aba do mes. */
.faixa-andamento {
  border-radius: 10px; padding: 9px 14px; margin-bottom: 14px;
  font-size: 12.5px; color: var(--tinta);
  border-left: 4px solid var(--verde); background: var(--verde-tenue);
}
.faixa-andamento strong { font-family: 'Archivo', sans-serif; letter-spacing: .04em; }
.faixa-andamento.andamento { border-left-color: var(--azul-vivo); background: var(--azul-tenue); }
.faixa-andamento.atraso    { border-left-color: var(--alerta);    background: var(--vermelho-tenue); }

/* Tabela GESTAO DE ATIVIDADES: muitas colunas, entao aperta e rola. */
.tabela-gestao th, .tabela-gestao td { white-space: nowrap; font-size: 12px; }
.tabela-gestao td.motivo {
  white-space: normal; min-width: 180px; max-width: 280px;
  font-size: 11.5px; color: var(--tinta-media);
}

/* Selo do estado das rotinas automaticas. */
.selo-rotina {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 999px;
  border: 1.5px solid; letter-spacing: .02em;
}
.selo-rotina i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.selo-verde    { color: var(--verde);  border-color: color-mix(in srgb, var(--verde) 45%, transparent);  background: var(--verde-tenue); }
.selo-verde i    { background: var(--verde);  box-shadow: 0 0 8px var(--verde); }
.selo-ambar    { color: #B45309;       border-color: color-mix(in srgb, var(--amarelo) 55%, transparent); background: var(--amarelo-tenue); }
.selo-ambar i    { background: #F59E0B; box-shadow: 0 0 8px #F59E0B; }
.selo-vermelho { color: var(--alerta); border-color: color-mix(in srgb, var(--alerta) 45%, transparent); background: var(--vermelho-tenue); }
.selo-vermelho i { background: var(--alerta); box-shadow: 0 0 8px var(--alerta); }
.selo-cinza    { color: var(--tinta-fraca); border-color: var(--linha-forte); background: transparent; }
.selo-cinza i    { background: var(--tinta-fraca); }
[data-tema="escuro"] .selo-ambar { color: #FBBF24; }

/* Titulo de cartao com botao a direita (ex.: Nova atividade). */
.linha-titulo { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* "Abrir" na primeira coluna: botao neon compacto, impossivel de nao ver. */
.botao-abrir {
  font-family: inherit; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; cursor: pointer;
  background: linear-gradient(135deg, var(--neon-roxo), var(--neon-ciano));
  box-shadow: 0 3px 10px -3px var(--neon-roxo);
  transition: transform .2s var(--elastico), box-shadow .2s ease, filter .2s ease;
}
.botao-abrir:hover { transform: translateY(-1px) scale(1.05); box-shadow: 0 6px 16px -4px var(--neon-ciano); filter: brightness(1.06); }
/* A coluna do Abrir NAO e mais fixa (sticky): fixar sobre o cartao
   translucido criava aquele bloco de cor que nao batia com a linha.
   Como o Abrir e a 1a coluna, ele ja aparece sem precisar rolar. */
.tabela-gestao td:first-child, .tabela-gestao th:first-child { padding-left: 2px; }

/* Veredito de uma atividade ja decidida (no lugar dos botoes). */
.veredito {
  border-radius: 10px; padding: 10px 14px; font-weight: 700;
  border-left: 4px solid var(--tinta-fraca); background: var(--vidro-alto);
}
.veredito.aprovada { border-left-color: var(--verde); background: var(--verde-tenue); color: var(--verde); }
.veredito.reprovada, .veredito.atrasada { border-left-color: var(--alerta); background: var(--vermelho-tenue); color: var(--alerta); }
.veredito.cancelada { border-left-color: var(--tinta-fraca); background: var(--linha); }
.veredito-motivo { font-weight: 400; font-size: 12px; color: var(--tinta-media); margin-top: 6px; }

/* Caixa da entrega recebida — grande, verde, impossivel de nao ver ao abrir. */
.anexo-entregue {
  display: flex; align-items: center; gap: 14px; text-decoration: none;
  margin-top: 8px; padding: 14px 16px; border-radius: 12px;
  background: var(--verde-tenue); border: 1.5px solid color-mix(in srgb, var(--verde) 45%, transparent);
  transition: transform .25s var(--elastico), box-shadow .25s ease;
}
.anexo-entregue:hover { transform: translateY(-2px); box-shadow: 0 10px 26px -10px var(--verde); }
.anexo-icone { font-size: 26px; }
.anexo-texto { display: flex; flex-direction: column; flex: 1; }
.anexo-titulo { font-family: 'Archivo', sans-serif; font-weight: 700; color: var(--verde); font-size: 15px; }
.anexo-sub { font-size: 12px; color: var(--tinta-media); margin-top: 2px; }
.anexo-seta { font-size: 20px; color: var(--verde); }

/* Bloco de arquivo (canceladas). */
.bloco-arquivo { border-top: 3px solid var(--tinta-fraca); opacity: .95; }

/* Lista de arquivos escolhidos na entrega. */
.lista-envio { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
.item-envio {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  font-size: 12px; padding: 6px 11px; border-radius: 8px;
  background: var(--vidro-alto); border: 1px solid var(--linha);
}
.item-envio span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item-mb { color: var(--tinta-fraca); flex-shrink: 0; }

/* Bloco verde dos treinamentos, como a faixa da aba do mes. */
.bloco-treinamento { border-top: 3px solid var(--verde); }
.bloco-treinamento .cartao-titulo { color: var(--verde); }
.dia-numero { font-family: 'Archivo', sans-serif; font-size: 12px; font-weight: 600; color: var(--tinta-media); }
.dia.hoje .dia-numero { color: var(--tinta); }

.pilula {
  font-family: inherit; font-size: 10px; font-weight: 700; letter-spacing: .02em;
  border: 0; border-radius: 6px; padding: 3px 8px 3px 20px; cursor: pointer; text-align: left;
  color: #fff; position: relative;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  box-shadow: 0 1px 4px -1px rgba(0,0,0,.25);
  transition: transform .18s var(--elastico), box-shadow .18s ease, filter .18s ease, opacity .2s ease;
}
.pilula:hover { transform: translateY(-1px) scale(1.03); filter: brightness(1.08); box-shadow: 0 4px 12px -3px rgba(0,0,0,.35); }

/*
 * CADA STATUS TEM SUA COR SOLIDA — nao mais pastel que sumia.
 * E um marcador na esquerda (bolinha ou simbolo) que le batendo o olho:
 *   pendente   cinza-azulado  o
 *   atrasada   vermelho       !
 *   aguardando ambar          ...
 *   aprovada   verde          check
 *   reprovada  vermelho-escuro X
 * O marcador vem em ::before; o check verde de "entregue" (tem-anexo)
 * sobrepoe o de status, porque entrega e a informacao mais forte.
 */
.pilula::before {
  content: ''; position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  width: 11px; height: 11px; border-radius: 50%;
  background: rgba(255,255,255,.85);
  font-size: 8px; font-weight: 900; line-height: 11px; text-align: center; color: inherit;
}

.pilula.pendente   { background: #64748B; }
.pilula.pendente::before   { content: ''; }
.pilula.atrasada   { background: #DC2626; }
.pilula.atrasada::before   { content: '!'; color: #DC2626; }
.pilula.aguardando { background: #D97706; }
.pilula.aguardando::before { content: '\2026'; color: #D97706; font-size: 9px; letter-spacing: -1px; }
.pilula.aprovada   { background: #059669; }
.pilula.aprovada::before   { content: '\2713'; color: #059669; }
.pilula.reprovada  { background: #991B1B; }
.pilula.reprovada::before  { content: '\2715'; color: #991B1B; }
.pilula.cancelada  { background: #94A3B8; text-decoration: line-through; }
.pilula.cancelada::before  { content: '\2715'; color: #94A3B8; }

/* Entregue — o verde-esmeralda com check branco vence tudo. */
.pilula.tem-anexo {
  background: linear-gradient(135deg, #10B981, #059669) !important;
  box-shadow: 0 0 0 2px color-mix(in srgb, #10B981 65%, transparent), 0 3px 10px -2px #059669 !important;
  font-weight: 800;
}
.pilula.tem-anexo::before {
  content: '\2713' !important; background: #fff !important; color: #059669 !important;
  width: 13px; height: 13px; line-height: 13px; left: 4px; font-size: 9px;
  box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.pilula.tem-anexo:hover { filter: brightness(1.05); }

/* FILTRO por KPI: quando um KPI esta ativo, as pilulas que nao batem
   com ele ficam apagadas, e as que batem ganham um anel. */
.filtrando .pilula:not(.destacada) { opacity: .18; filter: grayscale(.6); }
.filtrando .pilula.destacada { box-shadow: 0 0 0 2px #fff, 0 0 14px -2px currentColor; transform: scale(1.04); }
.filtrando .dia:not(.tem-destaque) { opacity: .5; }

/* O dia inteiro ganha um check verde no canto quando tem QUALQUER entrega. */
.dia.tem-entrega::after {
  content: '\2713'; position: absolute; top: 6px; right: 6px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #059669; color: #fff;
  font-size: 11px; font-weight: 900; line-height: 18px; text-align: center;
  box-shadow: 0 2px 6px -1px #059669; z-index: 3;
}

/* Caixa de login. */
.login-caixa { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; margin: 8px auto 0; }
.login-caixa input {
  width: 100%; padding: 13px 15px; font-size: 15px; border-radius: 11px;
  border: 1.5px solid var(--linha-forte); background: var(--campo); color: var(--tinta);
  transition: border-color .2s ease, box-shadow .2s ease;
}
.login-caixa input:focus { outline: 0; border-color: var(--neon-roxo); box-shadow: 0 0 0 3px color-mix(in srgb, var(--neon-roxo) 20%, transparent); }
.login-caixa .botao { width: 100%; justify-content: center; padding: 13px; font-size: 15px; }
.login-erro { color: var(--alerta); font-size: 13px; font-weight: 600; }

/* Linha da tabela com faixa de status na esquerda — "olhou e viu". */
.linha-status td:first-child { position: relative; }
.linha-status td:first-child::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.linha-status.pendente   td:first-child::before { background: #64748B; }
.linha-status.atrasada   td:first-child::before { background: #DC2626; }
.linha-status.aguardando td:first-child::before { background: #D97706; }
.linha-status.aprovada   td:first-child::before { background: #059669; }
.linha-status.reprovada  td:first-child::before { background: #991B1B; }
.linha-status.cancelada  td:first-child::before { background: #94A3B8; }
/* leve tom de fundo por status, para reforcar sem poluir */
.linha-status.atrasada   { background: color-mix(in srgb, #DC2626 6%, transparent); }
.linha-status.aguardando { background: color-mix(in srgb, #D97706 6%, transparent); }
.linha-status.aprovada   { background: color-mix(in srgb, #059669 6%, transparent); }

/* Cartoes das apresentacoes — com a capa real do slide. */
.cartoes-apresentacao {
  display: grid; gap: 14px;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}
.card-apres {
  padding: 0; border: 1.5px solid var(--linha-forte); border-radius: 14px;
  background: var(--vidro-alto); overflow: hidden; cursor: pointer;
  font-family: inherit; text-align: left; color: var(--tinta);
  transition: transform .28s var(--elastico), box-shadow .28s ease, border-color .28s ease;
}
.card-apres:hover {
  transform: translateY(-4px); border-color: var(--neon-roxo);
  box-shadow: 0 14px 32px -12px var(--neon-roxo);
}
.card-capa {
  position: relative; aspect-ratio: 16 / 9; overflow: hidden;
  background: var(--linha); display: flex; align-items: center; justify-content: center;
}
.card-capa img { width: 100%; height: 100%; object-fit: cover; display: block; }
.capa-vazia {
  width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--neon-roxo), var(--neon-ciano));
}
.capa-vazia span {
  font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 40px;
  color: rgba(255,255,255,.9);
}
.card-selo {
  position: absolute; top: 8px; left: 8px;
  width: 30px; height: 30px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Archivo', sans-serif; font-weight: 800; font-size: 14px; color: #fff;
  background: rgba(17,23,133,.85); backdrop-filter: blur(4px);
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
}
.turno-A .card-selo { background: rgba(37,99,235,.9); }
.turno-B .card-selo { background: rgba(124,58,237,.9); }
.turno-C .card-selo { background: rgba(5,150,105,.9); }
.card-pe { padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; }
.card-pe strong {
  font-size: 13px; line-height: 1.3;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.card-pe small { font-size: 11px; color: var(--tinta-fraca); }
.card-apres.sem-link { opacity: .55; border-style: dashed; }
.card-apres.sem-link .capa-vazia { background: var(--tinta-fraca); }

/* KPI clicavel (filtro). */
.kpi-clicavel { cursor: pointer; }
.kpi-clicavel:hover { transform: translateY(-4px); }
.kpi-clicavel.kpi-ativo {
  box-shadow: var(--sombra-alta), 0 0 0 2.5px var(--cor), 0 0 30px -6px var(--cor);
  transform: translateY(-4px);
}
.kpi-clicavel.kpi-ativo::before { opacity: 1; height: 5px; }

/* Linha da tabela apagada pelo filtro. */
.tabela-gestao tbody tr.apagada { opacity: .22; filter: grayscale(.5); transition: opacity .2s ease; }

/* Selos da coluna Entrega na tabela de gestao. */
.selo-entrega {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 700; color: var(--verde);
  background: var(--verde-tenue); border: 1px solid color-mix(in srgb, var(--verde) 40%, transparent);
  padding: 3px 9px; border-radius: 999px; white-space: nowrap;
}
.pendente-entrega {
  font-size: 11px; font-weight: 600; color: var(--tinta-fraca);
  border: 1px dashed var(--linha-forte); padding: 3px 9px; border-radius: 999px;
}

/* --- Insights --- */
.insight { border-left: 3px solid var(--tinta-fraca); padding: 10px 14px; margin-bottom: 10px; border-radius: 0 9px 9px 0; }
.insight.alto { border-left-color: var(--alerta); background: var(--vermelho-tenue); }
.insight.medio { border-left-color: var(--amarelo); background: var(--amarelo-tenue); }
.insight.bom { border-left-color: var(--verde); background: var(--verde-tenue); }
.insight-texto { font-weight: 500; line-height: 1.55; }
.insight-rec { font-size: 12.5px; color: var(--tinta-media); margin-top: 5px; line-height: 1.6; }


/* --- Abas internas (submenus do RH) --- */
.abas { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--linha); }

/* Aba Periodo: atalhos rapidos + formulario de datas. */
.periodo-atalhos { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 14px; }
.periodo-form { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.periodo-form .campo { margin: 0; flex: 1; min-width: 140px; }
.periodo-form .botao { flex-shrink: 0; height: 44px; }
.datas-aus { font-size: 11px; color: var(--tinta-media); max-width: 320px; line-height: 1.6; }
.aba {
  background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer;
  font-family: 'Archivo', sans-serif; font-size: 13px; font-weight: 600; padding: 9px 15px;
  color: var(--tinta-media); transition: color .18s ease, border-color .18s ease;
}
.aba:hover { color: var(--tinta); }
.aba.ativa { color: var(--azul-vivo); border-bottom-color: var(--azul-vivo); }
[data-tema="escuro"] .aba.ativa { color: var(--amarelo); border-bottom-color: var(--amarelo); }

/* --- Serie temporal (ausencia dia a dia) --- */
.serie { display: flex; align-items: flex-end; gap: 3px; height: 150px; padding-top: 8px; }
.serie-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end;
             align-items: center; height: 100%; gap: 4px; min-width: 0; }
/* A barra padrao vinha em --alerta (vermelho). Vermelho e sinal de
   problema, nao cor de grafico — e nem existe na marca. Padrao agora e
   o neon ciano/roxo; as variantes ficam para status. */
.serie-barra {
  width: 100%; border-radius: 4px 4px 0 0;
  background: linear-gradient(180deg, var(--neon-ciano) 0%, var(--neon-roxo) 100%);
  box-shadow: 0 0 14px -4px var(--neon-brilho);
  transition: filter .15s ease;
}
.serie-barra.verde    { background: linear-gradient(180deg, var(--neon-verde) 0%, var(--neon-ciano) 100%); }
.serie-barra.amarela  { background: linear-gradient(180deg, var(--neon-ambar) 0%, var(--neon-rosa) 100%); }
.serie-barra.vermelha { background: linear-gradient(180deg, var(--alerta) 0%, rgba(215, 25, 32, .35) 100%); }
.serie-col:hover .serie-barra { filter: brightness(1.25); }
.serie-rotulo { font-size: 9px; color: var(--tinta-fraca); font-variant-numeric: tabular-nums; }

.mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11.5px; letter-spacing: -.01em; }


.linha-atividade {
  display: flex; align-items: center; gap: 15px; padding: 12px 0;
  border-bottom: 1px solid var(--linha); transition: background .18s ease;
}
.linha-atividade:last-child { border-bottom: 0; }
.linha-atividade:hover { background: var(--azul-tenue); }
.data-atividade { width: 78px; flex-shrink: 0; }
.data-dia { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
.data-semana { font-size: 11px; color: var(--tinta-fraca); text-transform: uppercase; letter-spacing: .05em; }
.texto-atividade { flex: 1; min-width: 0; }
.nome-atividade { font-weight: 500; }
.meta-atividade { font-size: 12px; color: var(--tinta-media); margin-top: 3px; }

.vazio { color: var(--tinta-fraca); font-size: 13px; padding: 24px 0; text-align: center; }
.erro-caixa {
  background: var(--vermelho-tenue); border: 1px solid rgba(215, 25, 32, .3); color: var(--vermelho);
  padding: 14px 17px; border-radius: var(--raio); font-size: 13px; line-height: 1.65;
}

/* =========================================================
   JANELA
   ========================================================= */
.fundo-janela {
  position: fixed; inset: 0; z-index: 50; padding: 18px;
  background: rgba(4, 5, 26, .6); backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  animation: surgir .22s ease;
}
@keyframes surgir { from { opacity: 0; } }
.janela {
  background: var(--vidro-alto); backdrop-filter: blur(26px); -webkit-backdrop-filter: blur(26px);
  border: 1px solid var(--vidro-borda); border-radius: 20px; width: 100%; max-width: 570px;
  max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--sombra-alta);
  animation: subir .28s cubic-bezier(.2, .8, .3, 1);
}
@keyframes subir { from { transform: translateY(18px) scale(.97); opacity: 0; } }
.janela-topo { display: flex; align-items: center; justify-content: space-between; padding: 19px 23px; border-bottom: 1px solid var(--linha); }
.janela-corpo { padding: 21px 23px; overflow-y: auto; }
.janela-rodape { padding: 15px 23px; border-top: 1px solid var(--linha); display: flex; justify-content: flex-end; gap: 8px; }
.fechar { background: none; border: 0; font-size: 27px; line-height: 1; color: var(--tinta-fraca); cursor: pointer; padding: 0 4px; }
.fechar:hover { color: var(--tinta); }

.campo { margin-bottom: 16px; }
.campo label { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta-media); margin-bottom: 7px; }
.campo input, .campo select, .campo textarea { width: 100%; }
.campo textarea { resize: vertical; min-height: 70px; }
.campo-duplo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.marcador { font-size: 13px; display: flex; gap: 9px; align-items: center; color: var(--tinta); }
.marcador input { width: auto; }
.dica { font-size: 12px; color: var(--tinta-fraca); margin: 6px 0 0; line-height: 1.6; }

.anexo { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--linha); font-size: 13px; }
.anexo:last-of-type { border-bottom: 0; }
.anexo-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.anexo-tamanho { color: var(--tinta-fraca); font-size: 12px; font-variant-numeric: tabular-nums; }
.selo-anexo {
  display: inline-flex; align-items: center; gap: 4px; font-size: 11px;
  color: var(--azul-vivo); background: var(--azul-tenue); padding: 2px 8px; border-radius: 20px;
}
.area-envio { border: 1px dashed var(--linha-forte); border-radius: var(--raio); padding: 16px; text-align: center; }

.recado {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 60;
  background: linear-gradient(140deg, var(--azul) 0%, var(--azul-vivo) 100%); color: #fff;
  padding: 12px 22px; border-radius: 24px; font-size: 13px;
