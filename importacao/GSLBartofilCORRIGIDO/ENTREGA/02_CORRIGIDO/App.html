/* ================= CONFIGURAÇÃO =================
   Era um depósito: equipe, rotinas, setores, dezessete parâmetros
   soltos, arquivos do RH, DE-PARA, links de apresentacao e botões de
   sistema, tudo empilhado numa tela so. Agora sao quatro abas, cada uma
   com um assunto — e as PESSOAS saíram daqui para uma tela propria.
   =============================================== */
let ABA_CFG = 'rh';   // rh | calendario | apresentacao | sistema

function seloRotinas(r) {
  if (!r) return '';
  const mapa = {
    ligado:      ['selo-verde', 'Ligadas'],
    parcial:     ['selo-amarelo', 'Parciais'],
    desligado:   ['selo-vermelho', 'Desligadas'],
    desconhecido:['selo-cinza', 'Nao consegui verificar']
  };
  const s = mapa[r.estado] || mapa.desconhecido;
  return `<span class="selo ${s[0]}"><i></i>${s[1]} — ${r.ligados} de ${r.total}</span>`;
}

function pintarConfig(r) {
  const d = r.dados;
  el('subtitulo-pagina').textContent = 'Fontes do RH, calendário e sistema';
  el('acoes-topo').innerHTML = '';

  const abas = [['rh', 'Fontes do RH'], ['calendario', 'Calendário'],
                ['apresentacao', 'Apresentação'], ['sistema', 'Sistema']];
  el('pagina').innerHTML = `
    <div class="abas">
      ${abas.map(([id, nome]) => `<button class="aba ${ABA_CFG === id ? 'ativa' : ''}"
        onclick="trocarAbaCfg('${id}')">${nome}</button>`).join('')}
    </div>
    <div id="conteudo-cfg"></div>`;
  pintarAbaCfg(d);
}

function trocarAbaCfg(aba) {
  ABA_CFG = aba;
  const botoes = document.querySelectorAll('.abas .aba');
  const ordem = ['rh', 'calendario', 'apresentacao', 'sistema'];
  botoes.forEach((b) => b.classList.remove('ativa'));
  const i = ordem.indexOf(aba); if (botoes[i]) botoes[i].classList.add('ativa');
  pintarAbaCfg(DADOS);
}

function pintarAbaCfg(d) {
  const alvo = el('conteudo-cfg');
  if (!alvo) return;
  try {
    if (ABA_CFG === 'rh')           alvo.innerHTML = cfgRH(d);
    else if (ABA_CFG === 'calendario')   alvo.innerHTML = cfgCalendario(d);
    else if (ABA_CFG === 'apresentacao') alvo.innerHTML = cfgApresentacao(d);
    else alvo.innerHTML = cfgSistema(d);
  } catch (e) {
    alvo.innerHTML = `<div class="erro-caixa">${esc(e.message || e)}</div>`;
  }
}

const campoParam = (p) => `
  <div class="campo"><label>${esc(p.descricao || p.chave)}</label>
    <input id="par-${p.id}" value="${esc(p.valor)}"
           onchange="agir('salvarParametro',{id:'${p.id}',valor:this.value},'Parâmetro salvo')">
    <p class="dica mono" style="margin-top:4px">${esc(p.chave)}</p></div>`;

const valorPar = (d, chave) =>
  ((d.parametrosTodos || d.parametros || []).find((p) => p.chave === chave) || {}).valor;

function descreverQuando(t) {
  const dias = { 1: 'segunda', 2: 'terça', 3: 'quarta', 4: 'quinta', 5: 'sexta' };
  if (t.frequencia === 'SEMANAL') return 'toda ' + (dias[Number(t.dia)] || t.dia);
  if (t.frequencia === 'MENSAL') return t.dia === 'PRIMEIRA_SEGUNDA' ? '1ª segunda do mês'
    : t.dia === 'ULTIMA_SEXTA' ? 'última sexta do mês' : 'dia ' + t.dia;
  return t.quantidade + ' vaga(s) sem data';
}

function formArquivoRH(id) {
  const a = id ? DADOS.arquivosRH.find((x) => x.id === id) : null;
  const agora = new Date();
  const sugestao = agora.getFullYear() + '-' + String(agora.getMonth() + 1).padStart(2, '0');
  abrirJanela(a ? ('Competencia ' + a.competencia) : 'Cadastrar competencia do RH', `
    <div class="campo-duplo">
      <div class="campo"><label>Competencia (aaaa-mm)</label>
        <input id="rh-comp" value="${esc(a ? a.competencia : sugestao)}" placeholder="2026-08"></div>
      <div class="campo"><label>Situação</label>
        <select id="rh-situacao">
          <option ${a && a.situacao === 'Aberta' ? 'selected' : ''}>Aberta</option>
          <option ${a && a.situacao !== 'Aberta' ? 'selected' : ''}>Fechada</option>
        </select></div>
    </div>
    <div class="campo"><label>Link da planilha do RH</label>
      <input id="rh-link" value="${esc(a ? a.link : '')}" placeholder="https://docs.google.com/spreadsheets/..."></div>
    <div class="campo"><label>Aba da folha</label>
      <input id="rh-aba" value="${esc(a ? a.aba : 'FOLHA DE PONTO')}"></div>

       automaticamente uma vez por dia. <b>Fechada</b> = mês encerrado, não é mais relido.</p>`, `
    ${a ? `<button class="botao perigo" onclick="agir('excluirArquivoRH',{id:'${id}'},'Competência removida')">Remover</button>` : ''}

function formRotina(id) {
  // Sem id = rotina nova.
  const t = (id ? DADOS.rotinas.find((x) => x.id === id) : null) ||
            { id: '', tipo: '', atividade: '', frequencia: 'SEMANAL', dia: '',
              quantidade: '', porTurno: false, exigeSetor: false, ativo: true };
  abrirJanela(id ? 'Editar rotina' : 'Nova rotina', `
    <div class="campo-duplo">
      <div class="campo"><label>Sigla (entra no ID)</label><input id="ro-tipo" value="${esc(t.tipo)}" maxlength="3"></div>
      <div class="campo"><label>Frequência</label>
        <select id="ro-freq">${['SEMANAL', 'MENSAL', 'AVULSA'].map((f) =>
          `<option ${t.frequencia === f ? 'selected' : ''}>${f}</option>`).join('')}</select></div>
    </div>
    <div class="campo"><label>Atividade</label><input id="ro-atividade" value="${esc(t.atividade)}"></div>
    <div class="campo"><label>Quando</label><input id="ro-dia" value="${esc(t.dia)}">
      <p class="dica">Semanal: 1 a 5 (segunda a sexta). Mensal: PRIMEIRA_SEGUNDA, ULTIMA_SEXTA ou o numero do dia.</p></div>
    <div class="campo"><label>Vagas (so para avulsa)</label><input id="ro-qtd" value="${esc(t.quantidade)}"></div>
    <label class="marcador"><input type="checkbox" id="ro-turno" ${t.porTurno ? 'checked' : ''}> Uma por turno</label>
    <label class="marcador" style="margin-top:8px"><input type="checkbox" id="ro-setor" ${t.exigeSetor ? 'checked' : ''}> Exige setor</label>

    <button class="botao secundario" onclick="fecharJanela()">Cancelar</button>
    <button class="botao" onclick="agir('salvarRotina',{id:'${t.id}',tipo:val('ro-tipo'),atividade:val('ro-atividade'),frequencia:val('ro-freq'),dia:val('ro-dia'),quantidade:val('ro-qtd'),porTurno:marcado('ro-turno'),exigeSetor:marcado('ro-setor'),ativo:marcado('ro-ativo')},'Rotina salva')">Salvar</button>`);
}

/* ================= PESSOAS E ACESSOS =================
   Uma tela so. Antes eram duas — o cartão “Equipe” da Configuracao (com
   o botão “Nova pessoa”) e a tela “Acessos” (com “Novo usuario”) — para
   as MESMAS pessoas, em dois cadastros que nao conversavam. Dava para
   ter o Gerente cadastrado como COORDENADOR e ninguem percebia.
   ==================================================== */
let ABA_PESSOAS = 'pessoas';   // pessoas | niveis

function pintarAcessos(r) { pintarPessoas(r); }

function pintarPessoas(r) {
  const d = r.dados;
  const nPed = (d.pedidos || []).length;
  el('subtitulo-pagina').textContent = nPed
    ? `${nPed} pedido(s) aguardando você`
    : 'Quem entra no sistema e o que cada nível enxerga';
  el('acoes-topo').innerHTML =
    `<button class="botao" onclick="formUsuario()">Cadastrar pessoa</button>`;

  const abas = [['pessoas', 'Pessoas' + (nPed ? ' (' + nPed + ')' : '')],
                ['niveis', 'Níveis de acesso']];
  el('pagina').innerHTML = `
    <div class="abas">
      ${abas.map(([id, nome], i) => `<button class="aba ${ABA_PESSOAS === id ? 'ativa' : ''}"
        onclick="trocarAbaPessoas('${id}')">${nome}</button>`).join('')}
    </div>
    <div id="conteudo-pessoas"></div>`;
  pintarAbaPessoas(d);
}

function trocarAbaPessoas(aba) {
  ABA_PESSOAS = aba;
  const botoes = document.querySelectorAll('.abas .aba');
  botoes.forEach((b) => b.classList.remove('ativa'));
  const i = ['pessoas', 'niveis'].indexOf(aba); if (botoes[i]) botoes[i].classList.add('ativa');
  pintarAbaPessoas(DADOS);
}

function pintarAbaPessoas(d) {
  const alvo = el('conteudo-pessoas');
  if (!alvo) return;
  alvo.innerHTML = ABA_PESSOAS === 'niveis' ? blocoNiveis(d) : blocoPessoas(d);
}

/* --- Pedidos primeiro: são o que exige decisão --- */
function blocoPessoas(d) {

    if (p.situacao === 'PENDENTE') return '<span class="etiqueta aguardando">aguardando</span>';
    if (p.situacao === 'RECUSADO') return '<span class="etiqueta reprovada">recusado</span>';
    if (!p.ativo) return '<span class="etiqueta cancelada">desativado</span>';
    return '<span class="etiqueta aprovada">ativo</span>';
  };

  return `
    ${(d.pedidos || []).length ? `
    <div class="cartao" style="margin-bottom:14px;border-left:4px solid var(--alerta)">
      <div class="cartao-titulo">${d.pedidos.length} pedido(s) de acesso aguardando</div>
      <p class="dica" style="margin:-4px 0 12px">A pessoa informou o e-mail na tela de entrada e
         pediu liberação. Enquanto você não decide, ela vê uma tela de espera.</p>
      ${d.pedidos.map((p) => `
        <div class="cartao" style="margin-bottom:10px">
          <div class="linha-titulo">
            <div>
              <strong>${esc(p.nome || p.email)}</strong>
              <div class="meta-atividade">${esc(p.email)}${p.papel ? ' · ' + esc(p.papel) : ''}${p.turno ? ' · turno ' + esc(p.turno) : ''}</div>
              ${p.observacao ? `<div class="meta-atividade">“${esc(p.observacao)}”</div>` : ''}
              ${p.pedidoEm ? `<div class="meta-atividade">pedido em ${esc(p.pedidoEm)}</div>` : ''}
            </div>
          </div>
          <div class="periodo-form" style="margin-top:10px;align-items:flex-end">
            <div class="campo"><label>Nível de acesso</label>
              <select id="ap-perfil-${p.id}">
                ${(d.niveis || []).map((n) => `<option ${n === 'COORDENADOR' ? 'selected' : ''}>${esc(n)}</option>`).join('')}
              </select></div>
            <div class="campo"><label>Turno</label>
              <select id="ap-turno-${p.id}">
                <option value="">—</option>
                ${(d.turnos || []).map((t) => `<option ${p.turno === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}

        <tbody>${(d.pessoas || []).map((p) => `<tr
            data-busca="${esc((p.nome + ' ' + p.email + ' ' + p.turno + ' ' + p.perfil).toLowerCase())}">
          <td><strong>${esc(p.nome || '—')}</strong></td>

/*
 * APRESENTACAO — modo reuniao.
 *
 * Mesmo conteudo do briefing que a planilha manda por e-mail na vespera:

function pintarApresentacao(r) {

let filtroAtivo = null;

// KPI clicavel: ao tocar, ilumina as atividades daquele status no calendario
// e na tabela; tocar de novo desliga. E o filtro pedido.
const kpiFiltro = (valor, rotulo, cor, chave) => `<div class="cartao kpi ${cor} kpi-clicavel"
  data-filtro="${chave}" onclick="alternarFiltro('${chave}')">
  <div class="kpi-valor">${esc(valor)}</div><div class="kpi-rotulo">${esc(rotulo)}</div></div>`;

function alternarFiltro(chave) {
  filtroAtivo = (filtroAtivo === chave || chave === 'todas') ? null : chave;
  aplicarFiltro();
}

function aplicarFiltro() {
  const pagina = el('pagina');
  document.querySelectorAll('.kpi-clicavel').forEach((k) =>
    k.classList.toggle('kpi-ativo', k.dataset.filtro === filtroAtivo));

  if (!filtroAtivo) {
    pagina.classList.remove('filtrando');
    document.querySelectorAll('.pilula.destacada').forEach((p) => p.classList.remove('destacada'));
    document.querySelectorAll('.dia.tem-destaque').forEach((d) => d.classList.remove('tem-destaque'));
    document.querySelectorAll('.tabela-gestao tr.apagada').forEach((r) => r.classList.remove('apagada'));
    return;
  }
  pagina.classList.add('filtrando');

  // calendario: destaca pilulas com a classe do status
  document.querySelectorAll('.grade-mes .pilula').forEach((p) => {
    const bate = p.classList.contains(filtroAtivo);
    p.classList.toggle('destacada', bate);
    if (bate) { const dia = p.closest('.dia'); if (dia) dia.classList.add('tem-destaque'); }
  });

  // tabela: apaga as linhas que nao batem
  document.querySelectorAll('.tabela-gestao tbody tr').forEach((r) => {
    const et = r.querySelector('.etiqueta');
    const bate = et && et.classList.contains(filtroAtivo);
    r.classList.toggle('apagada', !bate);
  });
}

const kpi = (valor, rotulo, cor) => `<div class="cartao kpi ${cor}">
  <div class="kpi-valor">${esc(valor)}</div><div class="kpi-rotulo">${esc(rotulo)}</div></div>`;

function barra(rotulo, texto, maximo, numero, cor) {
  const n = (numero === undefined) ? Number(texto) : Number(numero);
  const larg = maximo ? Math.max(1, Math.round(n / maximo * 100)) : 0;
  return `<div class="barra-linha">
    <div class="barra-rotulo">${esc(rotulo)}</div>
    <div class="barra-trilho"><div class="barra-preenchida ${cor || ''}" style="width:${larg}%"></div></div>
    <div class="barra-valor">${esc(texto)}</div></div>`;
}

function classeStatus(s) {
  if (s === 'Aprovada') return 'aprovada';
  if (s === 'Aguard. valid.') return 'aguardando';
  if (s === 'Atrasada') return 'atrasada';
  if (s === 'Reprovada') return 'reprovada';
  if (s === 'Cancelada') return 'cancelada';
  return 'pendente';
}
const etiqueta = (s) => `<span class="etiqueta ${classeStatus(s)}">${esc(s)}</span>`;
</script>
