<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Virada 5x2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: coluna única de celular, um passo por tela, barra fixa embaixo com Voltar e Continuar. */
  --tinta:#10243E; --suave:#56637A; --papel:#F3F5FA; --cartao:#FFFFFF; --linha:#D6DCE7;
  --laranja:#E8590C; --verde:#0B7A53; --azul:#1C4FA1; --amarelo:#FFD43B; --alerta:#C4281C;
  --campo:#FFFFFF; --borda:#8A95A8; --topo:#10243E; --forte:#10243E; --forte-txt:#FFFFFF; --ok-bg:#D7F0E5; --fraco:#7A8AA3;
  --g1:#1C4FA1; --g2:#0B7A53; --g3:#7A3E9D; --g4:#B45309; --g5:#0E7490; --g6:#9D174D; --g7:#4D7C0F;
  --display:'Archivo','Arial Narrow',Arial,sans-serif; --corpo:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --tinta:#E9EEF7; --suave:#A7B4CA; --papel:#0B1524; --cartao:#152238; --linha:#2B3C58;
  --laranja:#FF7A2E; --verde:#3FCB98; --azul:#78A6F5; --amarelo:#FFD43B; --alerta:#FF7466;
  --campo:#0F1B2E; --borda:#5F7191; --topo:#060D19; --forte:#E9EEF7; --forte-txt:#10243E; --ok-bg:#12382C; --fraco:#5F7191;
  --g1:#78A6F5; --g2:#3FCB98; --g3:#C39BE8; --g4:#F2A65A; --g5:#56C7DE; --g6:#F08BB4; --g7:#A5D36A;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --tinta:#E9EEF7; --suave:#A7B4CA; --papel:#0B1524; --cartao:#152238; --linha:#2B3C58;
  --laranja:#FF7A2E; --verde:#3FCB98; --azul:#78A6F5; --amarelo:#FFD43B; --alerta:#FF7466;
  --campo:#0F1B2E; --borda:#5F7191; --topo:#060D19; --forte:#E9EEF7; --forte-txt:#10243E; --ok-bg:#12382C; --fraco:#5F7191;
  --g1:#78A6F5; --g2:#3FCB98; --g3:#C39BE8; --g4:#F2A65A; --g5:#56C7DE; --g6:#F08BB4; --g7:#A5D36A;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:var(--corpo);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amarelo);outline-offset:2px;box-shadow:0 0 0 5px var(--tinta)}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.num{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#app{max-width:560px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px;min-height:100%}
header.topo{background:var(--topo);color:#fff;margin:0 -16px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:10px}
.marca{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.marca b{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.marca b span{color:var(--laranja)}
.marca small{font-size:12.5px;color:#B9C6DA;font-weight:600}
.prog{display:flex;gap:5px}
.prog i{flex:1;height:5px;border-radius:9px;background:#3A506E}
.prog i.on{background:var(--laranja)}
h2{font-size:27px;font-weight:800}
h2 small{display:block;font-family:var(--corpo);font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--laranja);margin-bottom:6px}
.sub{color:var(--suave);font-size:15px}
.cartao{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.cartao h3{font-size:18px;font-weight:800}
.rot{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--suave)}
input[type=text],input[type=number],select{width:100%;border:1.5px solid var(--borda);border-radius:10px;padding:11px 12px;background:var(--campo);font-size:16px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--borda);background:var(--campo);border-radius:99px;padding:9px 14px;font-weight:600;font-size:15px;line-height:1.1}
.chip[aria-pressed=true]{background:var(--forte);border-color:var(--forte);color:var(--forte-txt)}
.dias{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dia{border:1.5px solid var(--borda);background:var(--campo);border-radius:10px;padding:10px 0;font-weight:700;font-size:14px;text-align:center}
.dia[aria-pressed=true]{background:var(--forte);border-color:var(--forte);color:var(--forte-txt)}
.mov{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center}
.mov b{font-family:var(--display);font-size:17px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--borda);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--campo);padding:9px 4px;font-weight:600;font-size:14px;border-right:1px solid var(--linha)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--forte);color:var(--forte-txt)}
.seg.m button[data-v="1"][aria-pressed=true]{background:var(--fraco);color:#fff}
.seg.m button[data-v="3"][aria-pressed=true]{background:var(--laranja);color:#fff}
.fnl{display:flex;flex-direction:column;gap:10px}
.fnr{border:1px solid var(--linha);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--campo)}
.fnr .l1{display:flex;gap:8px;align-items:center}
.fnr .l2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{display:flex;flex-direction:column;gap:3px}
.st span{font-size:12px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.05em}
.stp{display:flex;align-items:center;gap:6px}
.stp b{font-family:var(--display);font-weight:800;font-size:26px;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.rb{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--borda);background:var(--campo);font-weight:800;font-size:20px;line-height:1;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.rb:disabled{opacity:.3}
.rb.x{width:36px;height:36px;border-color:var(--linha);color:var(--suave);font-size:18px}
.bt{border:0;background:var(--laranja);color:#fff;font-weight:800;border-radius:12px;padding:14px 18px;font-size:16px;text-align:center;text-decoration:none;display:inline-block}
.bt.sec{background:var(--campo);color:var(--tinta);border:1.5px solid var(--borda)}
.bt.esc{background:var(--forte);color:var(--forte-txt)}
.bt:disabled{opacity:.4}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--cartao);border-top:1px solid var(--linha);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:5}
.barra .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:10px}
.barra.um .in{grid-template-columns:1fr}
.erro{color:var(--alerta);font-weight:700;font-size:14px}
.erro:empty{display:none}
/* início */
.heroi{background:var(--laranja);color:#fff;border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:6px}
.heroi .num{font-size:64px;line-height:.95}
.heroi p{font-weight:600}
.lista{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.lista li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.lista li b.n{font-family:var(--display);font-weight:800;font-size:18px;width:34px;height:34px;border-radius:50%;background:var(--forte);color:var(--forte-txt);display:flex;align-items:center;justify-content:center}
/* resultado */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--cartao);border:1px solid var(--linha);border-top:6px solid var(--tinta);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em}
.tile .d{font-size:13px;color:var(--suave)}
.tile.o{border-top-color:var(--laranja)} .tile.o .v{color:var(--laranja)}
.tile.v2{border-top-color:var(--verde)} .tile.v2 .v{color:var(--verde)}
.tile.a{border-top-color:var(--amarelo)}
.tile.r{border-top-color:var(--alerta)} .tile.r .v{color:var(--alerta)}
.tile.larga{grid-column:1/-1}
.abas{position:sticky;top:0;z-index:4;background:var(--papel);margin:0 -16px;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;border-bottom:1px solid var(--linha)}
.abas button{flex:none;border:1px solid var(--linha);background:var(--campo);border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px}
section{display:flex;flex-direction:column;gap:12px;scroll-margin-top:56px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:3px}
.col .b{width:100%;border-radius:6px 6px 0 0;background:var(--azul);min-height:3px}
.col.fraco .b{background:var(--fraco)} .col.forte .b{background:var(--laranja)}
.col.fech .b{background:repeating-linear-gradient(135deg,var(--campo) 0 5px,var(--linha) 5px 7px);border:1px dashed var(--borda);height:36px}
.col .q{font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.col .d{font-size:12px;font-weight:700;color:var(--suave);text-transform:uppercase}
.col .p{font-size:11px;color:var(--suave)}
.barras{height:110px;display:flex;align-items:flex-end;width:100%}
.fn{background:var(--cartao);border:1px solid var(--linha);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.fn.al{border-color:var(--alerta);box-shadow:inset 5px 0 0 var(--alerta)}
.fh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.fh b{font-size:17px;font-weight:800;font-family:var(--display)}
.fh span{font-size:13px;color:var(--suave);font-weight:600;white-space:nowrap}
.raia{border-radius:9px;padding:6px 9px;background:var(--papel);display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center}
.raia .t{font-size:12.5px;font-weight:700}
.raia .t small{display:block;font-weight:500;color:var(--suave);font-size:12px}
.raia .c{font-family:var(--display);font-weight:800;font-size:22px}
.pws{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:2px}
.pw{width:12px;height:16px;flex:none}
.pw.vg{fill:var(--amarelo);stroke:var(--tinta);stroke-width:1.2}
.pil{align-self:flex-start;border-radius:99px;padding:4px 11px;font-weight:700;font-size:13px}
.pil.ok{background:var(--ok-bg);color:var(--verde)} .pil.vg{background:var(--amarelo);color:#10243E} .pil.ru{background:var(--alerta);color:#fff}
.comp{display:flex;flex-direction:column;gap:8px}
.cb{display:grid;grid-template-columns:1fr;gap:3px}
.cb .l{display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:8px}
.cb .t{height:16px;border-radius:5px;background:var(--papel);overflow:hidden}
.cb .t i{display:block;height:100%;border-radius:5px;background:var(--azul)}
.cb.he .t i{background:var(--laranja)} .cb.re .t i{background:var(--verde)}
.lei{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.lei li{border-left:5px solid var(--azul);background:var(--cartao);border-radius:0 10px 10px 0;padding:9px 12px;font-size:15px}
.lei li.at{border-left-color:var(--laranja)} .lei li.ru{border-left-color:var(--alerta)}
.lei li b{display:block}
.plano{display:flex;flex-direction:column;gap:0;border:1px solid var(--linha);border-radius:14px;background:var(--cartao);overflow:hidden}
.plano label{display:grid;grid-template-columns:26px 62px 1fr;gap:8px;align-items:start;padding:11px 12px;border-bottom:1px solid var(--linha);font-size:15px}
.plano label:last-child{border-bottom:0}
.plano input{width:22px;height:22px;accent-color:var(--verde);margin:0}
.plano .dt{font-family:var(--display);font-weight:800;color:var(--laranja)}
.plano input:checked~span{color:var(--suave);text-decoration:line-through}
.aviso{font-size:13.5px;color:var(--suave);border-left:4px solid var(--amarelo);padding-left:10px}
.fontes{font-size:12.5px;color:var(--suave);display:flex;flex-direction:column;gap:4px;overflow-wrap:anywhere}
.fontes a{color:var(--azul)}
textarea{width:100%;min-height:150px;border:1.5px solid var(--borda);border-radius:10px;padding:10px;font:inherit;font-size:14px}
.acoes{display:flex;flex-direction:column;gap:8px}
@media (min-width:480px){.tiles{grid-template-columns:repeat(3,1fr)}}

/* comparador de caminhos */
.tema{border:1px solid #5C6F8A;background:transparent;color:#fff;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:700}
.marca .dir{display:flex;gap:10px;align-items:center}
.ests{display:flex;flex-direction:column;gap:10px}
.est{text-align:left;border:1.5px solid var(--linha);background:var(--cartao);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;width:100%}
.est[aria-pressed=true]{border-color:var(--laranja);box-shadow:inset 0 0 0 1.5px var(--laranja)}
.est.fora{opacity:.72}
.est .en{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-family:var(--display);font-weight:800;font-size:18px;line-height:1.15}
.selo{flex:none;font-family:var(--corpo);font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 9px;background:var(--verde);color:#fff;white-space:nowrap}
.selo.e{background:var(--laranja)}
.est .ed{font-size:14px;color:var(--suave)}
.eg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.eg span{background:var(--papel);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;font-size:11.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.03em}
.eg b{font-family:var(--display);font-weight:800;font-size:17px;color:var(--tinta);text-transform:none;letter-spacing:-.01em}
.er{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--linha);padding-top:8px;font-weight:700}
.er b{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap}
.er b.neg{color:var(--alerta)} .er b.pos{color:var(--verde)}
.est .av{font-size:13px;color:var(--suave);border-left:4px solid var(--amarelo);padding-left:8px}
.sl{display:flex;flex-direction:column;gap:2px}
.sl .l{display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:8px}
.sl input[type=range]{width:100%;accent-color:var(--laranja);height:30px}
.credito{font-size:12.5px;color:var(--suave);text-align:center}

/* ===== visual: a virada do dia (amanhecer no claro, noite com estrelas no escuro) ===== */
:root{--display:'Bricolage Grotesque','Arial Narrow',Arial,sans-serif;--corpo:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ceu:linear-gradient(180deg,#FFE3C4 0,#FFF1E2 180px,#F3F5FA 520px);--brilho1:rgba(232,89,12,.16);--brilho2:rgba(28,79,161,.12);
  --sombra:0 1px 0 rgba(255,255,255,.9) inset,0 10px 28px -12px rgba(16,36,62,.28);--vidro:rgba(255,255,255,.86);--heroi:linear-gradient(155deg,#10243E 0,#27306B 46%,#B8431A 82%,#F08A3C 100%);--neon:0 0 0 rgba(0,0,0,0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ceu:linear-gradient(180deg,#070B1A 0,#0B1524 420px);--brilho1:rgba(255,122,46,.20);--brilho2:rgba(120,166,245,.20);--sombra:0 1px 0 rgba(255,255,255,.06) inset,0 14px 34px -14px rgba(0,0,0,.8);--vidro:rgba(13,22,40,.82);--heroi:linear-gradient(155deg,#0A1022 0,#1B1F52 46%,#7A2E12 84%,#E8590C 100%);--neon:0 0 22px -4px}}
:root[data-theme="dark"]{--ceu:linear-gradient(180deg,#070B1A 0,#0B1524 420px);--brilho1:rgba(255,122,46,.20);--brilho2:rgba(120,166,245,.20);--sombra:0 1px 0 rgba(255,255,255,.06) inset,0 14px 34px -14px rgba(0,0,0,.8);--vidro:rgba(13,22,40,.82);--heroi:linear-gradient(155deg,#0A1022 0,#1B1F52 46%,#7A2E12 84%,#E8590C 100%);--neon:0 0 22px -4px}
body{background:var(--papel);background-image:radial-gradient(520px 300px at 88% 120px,var(--brilho1),transparent 70%),radial-gradient(460px 320px at 0 420px,var(--brilho2),transparent 70%),var(--ceu);background-attachment:fixed;background-repeat:no-repeat}
#ceu{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#app,.barra{position:relative;z-index:1}
.barra{position:fixed;background:var(--vidro);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
h2{font-size:29px;font-weight:800;letter-spacing:-.025em;font-stretch:88%}
h2 small{font-family:var(--corpo);letter-spacing:.14em}
.tit{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.ic{width:48px;height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(145deg,var(--laranja),#F2A03C);color:#fff;box-shadow:0 8px 18px -8px var(--laranja),var(--neon) var(--laranja)}
.ic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.az{background:linear-gradient(145deg,#1C4FA1,#4D86E0);box-shadow:0 8px 18px -8px #1C4FA1,var(--neon) #4D86E0}
.ic.vd{background:linear-gradient(145deg,#0B7A53,#35C08E);box-shadow:0 8px 18px -8px #0B7A53,var(--neon) #35C08E}
.ic.rx{background:linear-gradient(145deg,#5B2E91,#9A6AD6);box-shadow:0 8px 18px -8px #5B2E91,var(--neon) #9A6AD6}
.ic.p{width:38px;height:38px;border-radius:12px}.ic.p svg{width:21px;height:21px}
header.topo{background:linear-gradient(180deg,var(--topo),rgba(16,36,62,.0));background-color:transparent;padding-bottom:6px;color:var(--tinta)}
header.topo{background:var(--vidro);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--linha);position:sticky;top:0;z-index:6}
.marca b{color:var(--tinta);display:inline-flex;align-items:center;gap:8px;font-stretch:88%;font-size:23px}
.marca b svg{width:30px;height:30px;flex:none}
.marca small{color:var(--suave)}
.tema{border-color:var(--borda);color:var(--tinta)}
.etapas{display:grid;grid-template-columns:repeat(5,1fr);margin:0;padding:0;list-style:none;position:relative}
.etapas li{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.04em;position:relative}
.etapas li::before{content:'';position:absolute;top:11px;right:50%;width:100%;height:3px;background:var(--linha);z-index:0}
.etapas li:first-child::before{display:none}
.etapas li.feito::before,.etapas li.aqui::before{background:var(--laranja)}
.etapas i{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;background:var(--cartao);border:2.5px solid var(--linha);display:flex;align-items:center;justify-content:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:12.5px;color:var(--suave)}
.etapas li.feito i{background:var(--laranja);border-color:var(--laranja);color:#fff}
.etapas li.aqui i{border-color:var(--laranja);color:var(--laranja);box-shadow:0 0 0 4px var(--brilho1)}
.etapas li.aqui{color:var(--tinta)}
.cartao,.fn,.fnr,.tile,.est,.plano,.eq{box-shadow:var(--sombra)}
.cartao,.fn,.est{border-radius:18px}

  var P=[[et(.1),'Conferir com os líderes o mínimo de cada função e o movimento por dia.'],
    [et(.25),S.acordo==='sim'?'Ler a convenção coletiva com o contador e ver o que muda.':'Procurar o sindicato e o contador para saber se há acordo sobre jornada.'],
    [et(.4),B.d12?'Negociar a 12x36 com o sindicato e definir as duas equipes pelos nomes.':'Montar os grupos com os nomes das pessoas e ouvir preferências de folga.']];
  if(x.id==='fecha')P.push([et(.5),'Avisar os clientes de que a empresa passa a fechar '+em(x.dia)+'.']);
  if(x.id==='hora')P.push([et(.5),'Definir a hora que sai e avisar os clientes do novo horário.']);
  if(S.preco&&E.fat)P.push([et(.5),'Reajustar a tabela de preços em '+S.preco+'%.']);
  P.push([et(.6),B.H&&S.contratar!=='nao'?'Abrir '+(B.H>1?'as '+B.H+' vagas':'a vaga')+' e começar o treinamento de quem cobre outra função.':'Treinar quem vai cobrir outra função nos dias de folga.']);
  P.push([et(.75),'Rodar a escala nova por uma semana como teste e anotar onde apertou.']);
  P.push([n>0?'16/12':et(1),'Virar a escala para todos e publicar o quadro de folgas do mês.']);
  P.push([dm(new Date(Math.max(PRAZO.getTime(),t0.getTime())+30*864e5)),'Medir 30 dias: horas extras, faltas, rotatividade e vendas ou produção por hora.']);
  P.push(['dez/27','Preparar a redução para 40 horas semanais.']);
  h+='<section id="s-plano">'+sec('plano','vd','Plano até a virada')+'<div class="plano">'+P.map(function(p,i){return '<label><input type="checkbox" data-feito="'+x.id+i+'"'+(S.feito[x.id+i]?' checked':'')+'><span class="dt">'+p[0]+'</span><span>'+p[1]+'</span></label>';}).join('')+'</div></section>';

  /* enviar */
  var tx=resumoTxt(E);
  h+='<section id="s-enviar">'+sec('enviar','az','Guardar ou enviar')+'<div class="acoes"><a class="bt" href="https://wa.me/'+WHATS+'?text='+encodeURIComponent(tx)+'" target="_blank" rel="noopener">Enviar o plano pelo WhatsApp</a><button class="bt sec" data-copiar="1">Copiar o resumo</button><p class="erro" id="msg-copia" role="status"></p><textarea id="tx-resumo" readonly aria-label="Resumo do plano" style="display:none">'+esc(tx)+'</textarea></div>'+
  '<p class="aviso">A conta usa os seus números e os seus palpites de preço e de vendas. É um ponto de partida: valide a parte legal com advogado trabalhista e contador antes de publicar a escala.</p>'+
  '<div class="fontes"><b>Como a conta é feita</b><span>Pessoas a mais: o maior valor entre as vagas para manter o mínimo por função e as horas que faltam depois da redução da jornada. Custo: pessoas a mais vezes o salário médio, sem encargos. Vendas perdidas ao fechar um dia: a parte do faturamento daquele dia, pelo peso do movimento, menos o que volta em outro dia. Ao cortar 1 hora: metade do faturamento de uma hora média. Preço: aumento sobre o faturamento, descontando os clientes perdidos.</span><b>Fontes</b><span>Emenda Constitucional 141/2026 e prazos: <a href="https://agenciabrasil.ebc.com.br/politica/noticia/2026-10/congresso-promulga-emenda-do-fim-da-6x1-escala-5x2-comeca-em-60-dias" target="_blank" rel="noopener">Agência Brasil, 16/10/2026</a>.</span><span>Limite de 42 horas, acordo coletivo e 12x36: <a href="https://conjur.com.br/2026-out-25/fim-da-escala-6x1-o-que-ja-vale-e-o-que-ainda-vai-parar-na-justica/" target="_blank" rel="noopener">ConJur, 25/10/2026</a> (artigo de opinião).</span><span>Salário médio de admissão: <a href="https://agenciagov.ebc.com.br/noticias/202611/brasil-gera-121-3-mil-empregos-formais-em-setembro-e-saldo-no-ano-chega-a-1-24-milhao-de-novos-postos-com-carteira-assinada" target="_blank" rel="noopener">Novo Caged, setembro de 2026</a>.</span><span>Fiscalização e pagamento em dobro: <a href="https://csb.org.br/noticias/fim-escala-6x1-saiba-fazer-empresa-descumprir-nova-jornada" target="_blank" rel="noopener">CSB</a> e <a href="https://vlvadvogados.com/empresa-nao-cumpre-fim-da-escala-6x1/" target="_blank" rel="noopener">VLV Advogados</a>.</span><span>Decreto e folgas dentro do mês: <a href="https://agenciabrasil.ebc.com.br/economia/noticia/2026-11/governo-preve-decreto-do-fim-da-escala-6x1-para-segunda-feira" target="_blank" rel="noopener">Agência Brasil, 04/11/2026</a>.</span></div><p class="credito">Projeto criado por participantes do Empretec · Feira de Santana · 2026</p></section>';
  return h;
}
var TELAS=[tInicio,tEmpresa,tFunc,tEquipe,tRegras,tRes];
function valida(){
  if(S.tela===1&&!S.setor)return 'Escolha o setor para continuar.';
  if(S.tela===2&&S.dias.filter(Boolean).length===0)return 'Marque pelo menos um dia em que a empresa abre.';
  if(S.tela===3&&!fnOk().length)return 'Informe pelo menos uma função com pessoas.';
  return '';
}
function desenha(sobe){
  var app=$('#app');app.classList.toggle('entra',!!sobe);
  app.innerHTML=topo()+TELAS[S.tela]()+(S.tela<5?'<p class="erro" role="alert">'+esc(erro)+'</p>':'');
  var tp=app.querySelector('header.topo');if(tp)document.documentElement.style.setProperty('--topoh',tp.offsetHeight+'px');
  var b=$('#barra');
  if(S.tela===0){b.className='barra um';b.innerHTML='<div class="in"><button class="bt" data-nav="1">Começar</button></div>';}
  else if(S.tela<5){b.className='barra';b.innerHTML='<div class="in"><button class="bt sec" data-nav="-1">Voltar</button><button class="bt" data-nav="1">'+(S.tela===4?'Ver minha estratégia':'Continuar')+'</button></div>';}
  else{b.className='barra';b.innerHTML='<div class="in"><button class="bt sec" data-nav="-1">Editar respostas</button><button class="bt esc" data-novo="1">Novo plano</button></div>';}
  if(sobe)window.scrollTo(0,0);
}

/* ---------- ações ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  if(d.tema){var esc0=temaEscuro()?'light':'dark';document.documentElement.setAttribute('data-theme',esc0);try{localStorage.setItem(CT,esc0);}catch(e1){}desenha();return;}
  if(d.nav){var p=+d.nav;if(p>0){erro=valida();if(erro){desenha();return;}}erro='';S.tela=Math.max(0,Math.min(5,S.tela+p));guarda();desenha(true);return;}
  if(d.vai){S.tela=+d.vai;guarda();desenha(true);return;}
  if(d.novo){if(!d.ok){b.dataset.ok='1';b.textContent='Confirmar: apagar tudo';return;}S=padrao();guarda();desenha(true);return;}
  if(d.ir){var s=document.getElementById(d.ir);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return;}
  if(d.copiar){var tx=$('#tx-resumo'),m=$('#msg-copia'),cai=function(){tx.style.display='';tx.select();m.textContent='Selecione o texto abaixo e copie.';};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(tx.value).then(function(){m.textContent='Resumo copiado.';},cai);else cai();return;}
  if(d.estr){S.estr=d.estr;guarda();var y=window.scrollY;desenha();window.scrollTo(0,y);return;}
  if(d.setor){var mud=S.setor!==d.setor;S.setor=d.setor;if(mud||!S.fn.length){S.fn=SET[d.setor][1].map(function(f){return {n:f[0],q:f[1],m:f[2]};});S.mov=SET[d.setor][2].slice();S.hd=SET[d.setor][3];}}
  else if(d.set){var v=d.v;if(d.set==='h0'||d.set==='mg')v=+v;if(d.set==='publico')v=v==='true';S[d.set]=v;}
  else if(d.dia){S.dias[+d.dia]=S.dias[+d.dia]?0:1;}
  else if(d.mov){S.mov[+d.mov]=+d.v;}
  else if(d.nst){S[d.nst]=Math.max(4,Math.min(24,(S[d.nst]||9)+(+d.d)));}
  else if(d.fs){var f=S.fn[+d.i];if(!f)return;f[d.fs]=Math.max(0,(f[d.fs]||0)+(+d.d));if(f.m>f.q&&d.fs==='q')f.m=f.q;}
  else if(d.fdel){S.fn.splice(+d.fdel,1);}
  else if(d.fadd){S.fn.push({n:'',q:1,m:1});}
  else return;
  erro='';guarda();desenha();
  if(d.fadd){var ins=document.querySelectorAll('[data-fn]');if(ins.length)ins[ins.length-1].focus();}
});
document.addEventListener('input',function(e){
  var i=e.target,d=i.dataset;
  if(d.txt)S[d.txt]=i.value;

});
document.addEventListener('change',function(e){if(e.target.dataset.sl){var y=window.scrollY;desenha();window.scrollTo(0,y);}});
try{var tm=localStorage.getItem(CT);if(tm==='dark'||tm==='light')document.documentElement.setAttribute('data-theme',tm);}catch(e){}
try{var o=JSON.parse(localStorage.getItem(CH)||'null');if(o&&o.v===1&&Array.isArray(o.fn)){var p0=padrao();for(var k in p0)if(o[k]===undefined)o[k]=p0[k];S=o;}}catch(e){}
desenha(true);
/* céu: estrelas à noite, poeira de luz ao amanhecer */
(function(){
  var cv=$('#ceu');if(!cv||!cv.getContext)return;var cx=cv.getContext('2d'),W=0,H=0,P=[],quieto=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mede(){var r=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=W*r;cv.height=H*r;cx.setTransform(r,0,0,r,0,0);}
  function sem(i){var x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x);}
  for(var i=0;i<70;i++)P.push({x:sem(i+1),y:sem(i+77),r:.6+sem(i+9)*1.6,v:.15+sem(i+31)*.5,f:sem(i+53)*6.28});
  function quadro(t){
    var esc=temaEscuro();cx.clearRect(0,0,W,H);
    P.forEach(function(p,i){
      var y=((p.y*H-(quieto?0:t*.004*p.v))%H+H)%H,x=p.x*W+Math.sin(t*.0004+p.f)*8,a=esc?(.35+.45*Math.abs(Math.sin(t*.001*p.v+p.f))):.04+.05*Math.abs(Math.sin(t*.0006+p.f));
      cx.beginPath();cx.arc(x,y,esc?p.r:p.r*4,0,6.283);cx.fillStyle=esc?'rgba(233,238,247,'+a+')':(i%3?'rgba(232,89,12,'+a+')':'rgba(28,79,161,'+a+')');cx.fill();});
    if(!quieto&&!document.hidden)requestAnimationFrame(quadro);
  }
  mede();window.addEventListener('resize',function(){mede();if(quieto)quadro(0);});
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&!quieto)requestAnimationFrame(quadro);});
  document.addEventListener('click',function(e){if(quieto&&e.target.closest('[data-tema]'))setTimeout(function(){quadro(0);},30);});
  requestAnimationFrame(quadro);
})();
})();
